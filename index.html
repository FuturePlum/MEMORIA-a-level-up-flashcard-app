function getPlanningSummary(){
  const today = todayStr();
  const matieresAvecDate = Object.entries(matieresConfig)
    .filter(([, cfg]) => cfg && cfg.dateControle && cfg.dateControle >= today)
    .sort((a, b) => a[1].dateControle.localeCompare(b[1].dateControle));
  if(matieresAvecDate.length === 0) return null;
  const [matiere, cfg] = matieresAvecDate[0];
  const idsRestants = new Set();
  for(const jour of planning){
    if(jour.date < today || jour.date > cfg.dateControle) continue;
    for(const item of (jour.items || [])){
      if(item.matiere !== matiere) continue;
      for(const id of (item.cardIds || [])) idsRestants.add(id);
    }
  }
  const joursAvant = Math.round((new Date(cfg.dateControle + "T00:00:00") - new Date(today + "T00:00:00")) / 86400000);
  return { matiere, dateControle: cfg.dateControle, joursAvant, cartesRestantes: idsRestants.size };
}

/* Vue "toutes matières confondues" de la charge de révision jour par jour.
   Contrairement à `planning` (recalcPlanning), qui ne couvre QUE les matières
   avec une date de contrôle fixée, cette fonction regarde TOUTES les cartes
   non maîtrisées de toutes les matières actives (archivées exclues), qu'elles
   aient un contrôle ou non. Objectif : visibilité pure, pas de simulation des
   paliers futurs (contrairement à getMasteryLoad) — on se base uniquement sur
   `prochaineRevision`, qui est déjà la vraie date posée par answer()/
   quizAnswer() (compression incluse le cas échéant). Ça donne la charge
   réelle des prochains jours, pas une projection optimiste à long terme.
   Retourne { jours: [{date, total, parMatiere:{matiere:count}}], maxTotal }
   sur `nbJours` jours à partir d'aujourd'hui (bornes incluses). */
function getChargeGlobaleParJour(nbJours){
  const today = todayStr();
  const actives = new Set(getMatieresActives());
  const parJour = {};
  for(const c of CARDS){
    const matiere = c.matiere || 'Sans matière';
    if(!actives.has(matiere)) continue;
    if((c.palier || 0) >= MASTERED_PALIER) continue;
    let jour = c.prochaineRevision || today;
    if(jour < today) jour = today; // cartes en retard : comptées aujourd'hui
    if(!parJour[jour]) parJour[jour] = {};
    parJour[jour][matiere] = (parJour[jour][matiere] || 0) + 1;
  }

  /* Rappels PRÉVUS : une carte n'a de date que pour sa prochaine révision. On estime la suite
     de façon PRUDENTE (pas « tout réussi », sinon les chiffres ne feraient que monter) : à chaque
     révision, PROJECTION_PROBA donne la part de cartes réussies (palier suivant), « difficiles »
     (même palier, demain) et ratées (retour au palier 0, demain), comme answer()/nextPalier().
     Calcul en espérance (masse de probabilité par jour/palier), puis arrondi par jour et matière. */
  const finHorizon = addDays(today, nbJours - 1);
  const projJour = {};
  const idx = d => Math.round((new Date(d + 'T00:00:00') - new Date(today + 'T00:00:00')) / 86400000);
  for(const c of CARDS){
    const matiere = c.matiere || 'Sans matière';
    if(!actives.has(matiere)) continue;
    const p0 = c.palier || 0;
    if(p0 >= MASTERED_PALIER) continue;
    const iv = getIntervalsForMatiere(matiere);
    const cfgM = matieresConfig[matiere];
    const limiteM = (cfgM && cfgM.dateControle && cfgM.dateControle >= today && cfgM.dateControle < finHorizon) ? cfgM.dateControle : finHorizon;  // rien de projeté après le contrôle de la matière
    const dMax = idx(limiteM);
    let d0 = c.prochaineRevision || today; if(d0 < today) d0 = today;
    const i0 = idx(d0);
    if(i0 > dMax) continue;
    const masse = Array.from({ length: dMax + 1 }, () => new Array(MASTERED_PALIER).fill(0));
    const apres = (d, p, m) => {   // ce qui arrive après une révision faite le jour d au palier p, avec la masse m
      const ok = PROJECTION_PROBA.vert * m, dur = PROJECTION_PROBA.orange * m, rate = PROJECTION_PROBA.rouge * m;
      if(p + 1 < MASTERED_PALIER){ const n = d + Math.max(1, iv[p + 1]); if(n <= dMax) masse[n][p + 1] += ok; }
      if(d + 1 <= dMax){ masse[d + 1][p] += dur; masse[d + 1][0] += rate; }
    };
    apres(i0, p0, 1);   // la révision réellement programmée n'est pas comptée ici (déjà dans « reel »)
    for(let d = i0 + 1; d <= dMax; d++){
      for(let p = 0; p < MASTERED_PALIER; p++){
        const m = masse[d][p]; if(m <= 0) continue;
        const date = addDays(today, d);
        if(!projJour[date]) projJour[date] = {};
        projJour[date][matiere] = (projJour[date][matiere] || 0) + m;
        apres(d, p, m);
      }
    }
  }
  for(const date in projJour) for(const m in projJour[date]){
    const n = Math.round(projJour[date][m]);
    if(n > 0) projJour[date][m] = n; else delete projJour[date][m];
  }

  const jours = [];
  let maxTotal = 0;
  for(let i = 0; i < nbJours; i++){
    const date = addDays(today, i);
    const reel = parJour[date] || {};
    const prev = projJour[date] || {};
    const parMatiere = Object.assign({}, reel);
    for(const m in prev) parMatiere[m] = (parMatiere[m] || 0) + prev[m];
    const nbReel = Object.values(reel).reduce((a, b) => a + b, 0);
    const proj = Object.values(prev).reduce((a, b) => a + b, 0);
    const total = nbReel + proj;
    if(total > maxTotal) maxTotal = total;
    jours.push({ date, total, parMatiere, proj, reel: nbReel });
  }
  return { jours, maxTotal };
}

/* Bloc « À venir » (Planning) : remplace l'ancienne bande « Charge de
   révision » ET le bloc « Calendrier ». Une rangée de jours (total de cartes
   dues, toutes matières actives confondues, jusqu'à la dernière date de
   contrôle, 7 à 14 cases), un drapeau sur les jours de contrôle, puis une
   barre de marge avant le contrôle (voir getMargeControle) et, pour le jour
   sélectionné, une ligne de détail : ↻ à revoir / ✦ nouvelles. Dans les cases,
   on n'affiche QUE le total (décision de design : pas de détail par case).
   Par défaut : le premier jour qui a des cartes. Retourne '' s'il n'y a rien. */
let aVenirJourSel = null;
function getDatesControleActives(){
  const today = todayStr();
  const map = {};
  for(const m of getMatieresActives()){
    const cfg = matieresConfig[m];
    if(cfg && cfg.dateControle && cfg.dateControle >= today){
      (map[cfg.dateControle] = map[cfg.dateControle] || []).push(m);
    }
  }
  return map;
}
function getCartesDuJour(date){
  const today = todayStr();
  const actives = new Set(getMatieresActives());
  return CARDS.filter(c => {
    if(!actives.has(c.matiere || 'Sans matière')) return false;
    if((c.palier || 0) >= MASTERED_PALIER) return false;
    let jour = c.prochaineRevision || today;
    if(jour < today) jour = today;
    return jour === date;
  });
}
/* Marge avant le contrôle, pour la barre du bloc « À venir ». Réutilise
   getMasteryLoad (projection OPTIMISTE : zéro erreur). Parmi les matières
   actives avec un contrôle futur, des cartes et pas déjà toutes maîtrisées,
   on garde la plus serrée (marge la plus petite ; à égalité, le pire statut).
   marge = date de contrôle − dateMaitrise (en jours ; négative = dépasse).
   Retourne null s'il n'y a aucune matière concernée. */
function getMargeControle(){
  const today = todayStr();
  const ecart = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
  const gravite = { trop_tard: 0, passe: 0, depasse: 1, juste: 2, large: 3 };
  let pire = null;
  for(const m of getMatieresActives()){
    const cfg = matieresConfig[m];
    if(!cfg || !cfg.dateControle || cfg.dateControle < today) continue;
    const load = getMasteryLoad(m);
    if(!load || load.toutMaitrise || !load.statutControle) continue;
    const cand = {
      matiere: m,
      niveau: load.statutControle.niveau,
      dateMaitrise: load.dateMaitrise,
      dateControle: cfg.dateControle,
      marge: ecart(load.dateMaitrise, cfg.dateControle)
    };
    if(!pire
       || cand.marge < pire.marge
       || (cand.marge === pire.marge && gravite[cand.niveau] < gravite[pire.niveau])) pire = cand;
  }
  return pire;
}
/* Estimation "temps avant maîtrise" sous forme de widget visuel : simule,
   carte par carte, la progression future en supposant que chaque révision
   est réussie (palier +1 à chaque fois, au rythme des INTERVALS) — c'est un
   plancher optimiste. Calcule une répartition détaillée utile pour juger de
   la charge de travail restante avant un contrôle :
   - répartition des cartes par paliers restants (0..MASTERED_PALIER)
   - nombre total de révisions à faire avant maîtrise complète
   - date de maîtrise complète projetée (optimiste)
   - statut par rapport à la date de contrôle (si définie) : large, juste, dépassé
   Retourne null si la matière n'a aucune carte. */
function getMasteryLoad(matiere){
  const today = todayStr();
  const cartes = CARDS.filter(c => (c.matiere || 'Sans matière') === matiere);
  if(cartes.length === 0) return null;

  const nonMaitrisees = cartes.filter(c => (c.palier || 0) < MASTERED_PALIER);
  const maitriseesCount = cartes.length - nonMaitrisees.length;

  // Répartition par nombre de paliers restants (0 = déjà maîtrisée)
  const repartition = new Array(MASTERED_PALIER + 1).fill(0);
  for(const c of cartes){
    const p = Math.min(c.palier || 0, MASTERED_PALIER);
    const restants = MASTERED_PALIER - p;
    repartition[restants]++;
  }

  if(nonMaitrisees.length === 0){
    return {
      matiere, total: cartes.length, maitrisees: maitriseesCount, nonMaitrisees: 0,
      repartition, totalRevisionsRestantes: 0, joursRestants: 0, dateMaitrise: today,
      chargeParSemaine: [], toutMaitrise: true
    };
  }

  /* Simulation JOUR PAR JOUR avec un plafond de révisions par jour
     (CHARGE_GLOBALE_MAX_PAR_JOUR). Avant, chaque carte était simulée seule :
     5 cartes ou 200 cartes au même palier donnaient la même date de maîtrise,
     alors qu'on ne peut pas réviser 200 cartes en un jour. Ici, quand trop de
     cartes sont dues le même jour, l'excédent glisse au lendemain, ce qui
     repousse pour de vrai le dernier jour. Les cartes les plus en retard
     passent en premier. Le plafond est appliqué par matière (chaque matière
     est calculée à part), c'est donc une estimation optimiste : les autres
     matières prennent aussi du temps le même jour. */
  const intervals = getIntervalsForMatiere(matiere);
  const plafondJour = CHARGE_GLOBALE_MAX_PAR_JOUR;
  const attente = nonMaitrisees.map(c => ({
    palier: c.palier || 0,
    jour: c.prochaineRevision && c.prochaineRevision > today ? c.prochaineRevision : today
  }));
  let dernierJour = today;
  let totalRevisionsRestantes = 0;
  let jourCourant = today;
  let restantes = attente.length;
  // Garde-fou : la boucle avance d'un jour à chaque tour, elle ne peut pas
  // tourner indéfiniment (5 ans de simulation au maximum).
  for(let garde = 0; restantes > 0 && garde < 1825; garde++){
    const dues = attente.filter(a => a.palier < MASTERED_PALIER && a.jour <= jourCourant);
    dues.sort((a, b) => a.jour < b.jour ? -1 : a.jour > b.jour ? 1 : 0);
    const faites = dues.slice(0, plafondJour);
    for(const a of faites){
      a.palier = Math.min(a.palier + 1, intervals.length - 1);
      totalRevisionsRestantes++;
      if(a.palier >= MASTERED_PALIER){
        restantes--;
        if(jourCourant > dernierJour) dernierJour = jourCourant;
      } else {
        a.jour = addDays(jourCourant, intervals[a.palier]);
      }
    }
    jourCourant = addDays(jourCourant, 1);
  }

  const joursRestants = Math.max(0, Math.round((new Date(dernierJour + "T00:00:00") - new Date(today + "T00:00:00")) / 86400000));
  const semaines = Math.max(1, Math.ceil((joursRestants + 1) / 7));
  const rythmeParSemaine = Math.round((totalRevisionsRestantes / semaines) * 10) / 10;

  let statutControle = null;
  const cfg = matieresConfig[matiere];
  if(cfg && cfg.dateControle){
    const joursAvantControle = Math.round((new Date(cfg.dateControle + "T00:00:00") - new Date(today + "T00:00:00")) / 86400000);
    if(joursAvantControle < 0){
      statutControle = 'passe';
    } else if(joursAvantControle <= 2){
      // En dessous de ce seuil, le plancher d'1 jour par palier (cf.
      // getIntervalsForMatiere) rend le calcul "valide" mais vide de sens :
      // l'espacement n'a plus le temps de jouer son rôle. Un statut dédié
      // évite de faire croire à un planning qui fonctionne normalement.
      statutControle = 'trop_tard';
    } else if(dernierJour <= cfg.dateControle){
      const margeJours = Math.round((new Date(cfg.dateControle + "T00:00:00") - new Date(dernierJour + "T00:00:00")) / 86400000);
      statutControle = margeJours >= 3 ? 'large' : 'juste';
    } else {
      statutControle = 'depasse';
    }
    statutControle = { niveau: statutControle, joursAvantControle, dateControle: cfg.dateControle };
  }

  // Un intervalle diffère de sa valeur classique dès que la compression a
  // été appliquée (cf. getIntervalsForMatiere) — sert à prévenir l'utilisateur
  // que le rythme affiché est resserré, pas le rythme "normal".
  const compresse = intervals.some((v, i) => v !== INTERVALS[i]);

  return {
    matiere, total: cartes.length, maitrisees: maitriseesCount, nonMaitrisees: nonMaitrisees.length,
    repartition, totalRevisionsRestantes, joursRestants, dateMaitrise: dernierJour,
    rythmeParSemaine, statutControle, compresse, toutMaitrise: false
  };
}

/* Calcule les stats de progression (maîtrisées / en cours / nouvelles / taux
   de réussite) pour un tableau de cartes donné, utilisé par getStatForMatiere
   ci-dessous (une matière à la fois, pour la carte dans Planning > Dates de
   contrôle). */
function statsFromCards(cards){
  const total = cards.length;
  const maitrisees = cards.filter(c => (c.palier||0) >= MASTERED_PALIER).length;
  const enCours = cards.filter(c => (c.palier||0) > 0 && (c.palier||0) < MASTERED_PALIER).length;
  const nouvelles = total - maitrisees - enCours;
  const paliersAcquis = cards.reduce((sum, c) => sum + Math.min(c.palier || 0, MASTERED_PALIER), 0);
  const paliersMax = total * MASTERED_PALIER;
  const tauxReussite = paliersMax > 0 ? Math.round((paliersAcquis / paliersMax) * 100) : 0;
  return { total, maitrisees, enCours, nouvelles, tauxReussite };
}

/* Une seule matière (pour la carte dans Planning > Dates de contrôle, qui
   reprend le même affichage — barre + % + répartition — qu'avait
   "Progression par matière" dans l'ancien onglet Historique, aujourd'hui
   retiré). Retourne null si la matière n'a aucune carte. */
function getStatForMatiere(m){
  const cards = CARDS.filter(c => (c.matiere || 'Sans matière') === m);
  if(cards.length === 0) return null;
  return statsFromCards(cards);
}

   Planning > Dates de contrôle) : ne restait que cette grille, qui n'avait

function closeStreakModal(){
  const root = document.getElementById('modal-root');
  const page = root && root.querySelector(':scope > .pp-page');
  if(!page || page.classList.contains('pp-pgout')){ if(root && !page) root.innerHTML = ''; return; }
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){ root.innerHTML = ''; return; }
  page.style.pointerEvents = 'none';

  setTimeout(() => { if(page.isConnected && page.classList.contains('pp-pgout')) root.innerHTML = ''; }, 300);
}
/* v93 — grand écran : cliquer dans la zone assombrie autour de la fenêtre Statistiques la ferme.
   #modal-root couvre l'écran (v90) : un clic dont la cible EST #modal-root tombe donc hors de la fenêtre.

let ppAppuiHorsFenetre = false;
document.addEventListener('pointerdown', e => { ppAppuiHorsFenetre = !!(e.target && e.target.id === 'modal-root'); }, true);
document.addEventListener('click', e => {

/* ================= v157 : bouton « Appareil photo » =================
   Téléphone / tablette : l'attribut `capture` de l'input ouvre l'appareil photo du système (comportement d'avant).
   Chromebook / ordinateur : `capture` est ignoré (on tombait sur l'explorateur de fichiers) -> on ouvre la caméra dans l'app.
   La photo prise est remise dans le même input (change), donc tout le reste du flux (réduction, banque d'images…) est inchangé.
   Pas de caméra, refus ou erreur : on retombe sur le sélecteur de fichiers. */
let ppCam = null;
function ppCameraSysteme(){
  const ua = navigator.userAgent || '';
  if(/CrOS/.test(ua)) return false;
  return /Android|iPhone|iPad|iPod/i.test(ua) || (/Mac/.test(navigator.platform || '') && navigator.maxTouchPoints > 1);
}
function ppCameraFermer(){
  if(!ppCam) return;
  const c = ppCam; ppCam = null;
  try{ c.stream.getTracks().forEach(t => t.stop()); }catch(e){}
  document.removeEventListener('keydown', c.clav, true);
  if(c.el.parentNode) c.el.parentNode.removeChild(c.el);
}
function ppCameraPrendre(){
  const c = ppCam; if(!c) return;
  const v = c.video;
  if(!v.videoWidth || !v.videoHeight) return;
  const ech = Math.min(1, 2000 / Math.max(v.videoWidth, v.videoHeight));
  const cv = document.createElement('canvas');
  cv.width = Math.round(v.videoWidth * ech); cv.height = Math.round(v.videoHeight * ech);
  cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
  const inp = c.inp;
  cv.toBlob(b => {
    cv.width = cv.height = 0;
    ppCameraFermer();
    if(!b || !inp) return;
    try{
      const dt = new DataTransfer();
      dt.items.add(new File([b], 'photo-' + Date.now() + '.jpg', { type: 'image/jpeg' }));
      inp.files = dt.files;
      inp.dispatchEvent(new Event('change', { bubbles: true }));
    }catch(e){ inp.click(); }
  }, 'image/jpeg', 0.92);
}
async function ppCameraOuvrir(inputId){
  const inp = document.getElementById(inputId); if(!inp) return;
  if(ppCameraSysteme() || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ inp.click(); return; }
  if(ppCam) return;
  let stream = null;
  try{ stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }); }
  catch(e){ ppToast('Caméra indisponible : choisis un fichier.'); inp.click(); return; }
  const el = document.createElement('div');
  el.id = 'pp-cam';
  el.style.cssText = 'position:fixed;inset:0;z-index:100000;background:#05050a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px';
  el.innerHTML = '<video autoplay playsinline muted style="max-width:100%;max-height:calc(100% - 96px);border-radius:18px;background:#000;box-shadow:0 0 0 2px #fff3"></video>'
    + '<div style="display:flex;gap:14px;align-items:center">'
    + '<button type="button" class="pp-ibt" data-c="x" style="width:auto;padding:0 20px;height:52px;font-weight:800;font-size:15px">Annuler</button>'
    + '<button type="button" data-c="ok" aria-label="Prendre la photo" style="height:64px;min-width:64px;padding:0 24px;border-radius:32px;border:3px solid #fff;background:#ff6b3d;color:#1a0d08;font-weight:800;font-size:16px;font-family:inherit;cursor:pointer">Prendre la photo</button></div>';
  document.body.appendChild(el);
  const video = el.querySelector('video'); video.srcObject = stream;
  const clav = (e) => {
    if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); ppCameraFermer(); }
    else if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); ppCameraPrendre(); }
  };
  document.addEventListener('keydown', clav, true);
  ppCam = { el, video, stream, inp, clav };
  el.querySelector('[data-c="x"]').onclick = ppCameraFermer;
  el.querySelector('[data-c="ok"]').onclick = ppCameraPrendre;
  try{ await video.play(); }catch(e){}
}

/* glisser vers le bas n'importe où sur une fenêtre du bas pour la fermer.
   v126 : le même geste sert à TOUTES les feuilles (#pp-sheet ET le calendrier #pp-psheet) et marche aussi à la souris (Chromebook). */
function ppSouris(el, scroller, pousser, lacher){
  el.addEventListener('mousedown', ev => {
    if(ev.button !== 0 || ev.target.closest('input,textarea,select') || (scroller && scroller.scrollTop > 0)) return;
    const y0 = ev.clientY; let mv = false;
    const bouge = m => {
      const d = m.clientY - y0;
      if(!mv){ if(d < 8) return; mv = true; document.body.style.userSelect = 'none'; }
      pousser(Math.max(0, d)); m.preventDefault();
    };
    const fin = () => {
      window.removeEventListener('mousemove', bouge, true); window.removeEventListener('mouseup', fin, true);
      document.body.style.userSelect = '';
      if(!mv) return;
      lacher();
      /* le relâchement ne doit pas compter comme un clic sur le bouton survolé (posé APRÈS lacher(), qui peut lui-même cliquer pour fermer) */
      const bloque = c => { c.stopPropagation(); c.preventDefault(); };
      window.addEventListener('click', bloque, { capture:true, once:true });
      setTimeout(() => window.removeEventListener('click', bloque, true), 60);
    };
    window.addEventListener('mousemove', bouge, true); window.addEventListener('mouseup', fin, true);
  });
}
function ppSwipeFeuille(e, v, fermer){
  let y0 = 0, dy = 0, on = false, mv = false;
  const pousser = d => {
    on = true; mv = true; dy = d; e.style.willChange = 'translate'; e.style.transition = 'none';
    /* `translate` (et non `transform`) : sur grand écran la fenêtre est centrée par un transform, l'écraser la décalait */
    e.style.translate = '0 ' + d + 'px';
    v.style.opacity = Math.max(0, 1 - d / 450);
  };
  const lacher = () => {
    if(!on || !mv){ on = false; e.style.willChange = ''; return; }
    on = false; mv = false;
    v.style.opacity = '';
    e.style.transition = 'translate .3s var(--ease-press), transform .35s var(--ease-press), opacity .2s';
    if(dy > 90){
      fermer();
      setTimeout(() => { e.style.translate = ''; e.style.transition = ''; e.style.willChange = ''; }, 420);
    } else {
      e.style.translate = '';
      setTimeout(() => { e.style.transition = ''; e.style.willChange = ''; }, 360);
    }
  };
  e.addEventListener('touchstart', t => {
    if(t.target.closest('input,textarea,select') || e.scrollTop > 0){ on = false; return; }
    y0 = t.touches[0].clientY; dy = 0; on = true; mv = false;
    e.style.willChange = 'translate';
  }, { passive:true });
  e.addEventListener('touchmove', t => {
    if(!on) return;
    if(e.scrollTop > 0 && !mv){ on = false; return; }
    const d = t.touches[0].clientY - y0;
    if(d <= 0){ if(mv) e.style.translate = ''; return; }
    pousser(d);
    t.preventDefault();
  }, { passive:false });
  e.addEventListener('touchend', lacher); e.addEventListener('touchcancel', lacher);
  ppSouris(e, e, pousser, lacher);
}
function ppSheetSwipe(){
  ppSwipeFeuille(document.getElementById('pp-sheet'), document.getElementById('pp-veil'), ppSheetClose);
  ppSwipeFeuille(document.getElementById('pp-psheet'), document.getElementById('pp-pveil'), ppPickClose);
}

/* v123 : récupère un partage par son code (GET /partage) puis passe par le même import que le fichier. */
let ppImportCodeEnCours = false;
async function ppImportParCode(code){
  if(ppImportCodeEnCours) return;
  if(!/^[A-HJKMNP-Z2-9]{6}$/.test(code)){ ppToast('Code invalide (6 caractères)'); return; }
  if(!SYNC_WORKER_URL || navigator.onLine === false){ ppToast('Pas de connexion'); return; }
  ppImportCodeEnCours = true;
  const btn = document.querySelector('#pp-sheet .pp-duo .pp-cta');
  if(btn){ btn.disabled = true; btn.textContent = 'Recherche…'; }
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), PARTAGE_LECTURE_MAX_MS);
  let data = null, msg = '';
  try{
    const res = await fetch(`${SYNC_WORKER_URL}/partage?code=${encodeURIComponent(code)}`, { signal: ctrl.signal });
    if(res.status === 404) msg = 'Code introuvable ou expiré';
    else if(res.status === 400) msg = 'Code invalide';
    else if(!res.ok) msg = 'Serveur indisponible, réessaie';
    else data = await res.json();
  }catch(e){ msg = 'Pas de connexion'; }
  clearTimeout(t); ppImportCodeEnCours = false;
  if(btn){ btn.disabled = false; btn.textContent = 'Importer'; }
  if(!data){ ppToast(msg || 'Impossible de récupérer les cartes'); return; }
  // fenêtre fermée pendant la recherche : on n'importe rien dans le dos de l'utilisateur
  const feuille = document.getElementById('pp-sheet');
  if(!document.getElementById('pp-ij-code') || !feuille || !feuille.classList.contains('on')) return;
  ppImporterDonnees(data);
}
function ppImporterDonnees(data){
  const m = ppMatiereSel();
  const liste = Array.isArray(data) ? data : (data && Array.isArray(data.cartes) ? data.cartes : null);
  if(!liste){ ppToast('Format non reconnu'); return; }
  const items = liste.filter(c => c && (c.question || ppImgValide(c.imageQuestion)) && (c.reponse || ppImgValide(c.imageReponse))).map(c => ({ id:null, matiere:String((data && data.format === 'flashcard-partage') ? m : (c.matiere || m)), question:String(c.question || '').trim(), reponse:String(c.reponse || '').trim(), palier:0, prochaineRevision:null, derniereRevision:null, inversible:c.inversible === true, ecrite:c.ecrite === true, ...ppImgPatch(c) }));
  if(!items.length){ ppToast('Aucune carte valide'); return; }
  ppImgPerdues = ppImgAjusterBudget(items);
  ppSheetClose();
  resolveImportMatieres(items, 0, {}, (renommages) => {
    // Ignore les cartes déjà présentes (même matière, même question, même réponse) :
    // réimporter le même code ne doit pas doubler les cartes.
    const cle = (mat, q, r) => (mat || 'Sans matière') + '\u0001' + String(q || '').trim() + '\u0001' + String(r || '').trim();
    const existantes = new Set(CARDS.map(c => cle(c.matiere, c.question, c.reponse)));
    const nouvelles = items.filter(it => {
      const k = cle(renommages[it.matiere] || it.matiere, it.question, it.reponse);
      if(existantes.has(k)) return false;
      existantes.add(k);
      return true;
    });
    if(!nouvelles.length){ ppToast('Ces cartes sont déjà dans ta matière'); return; }
    finaliserImport(nouvelles, renommages);
    if(dernierImportEchec) return;   // stockage plein : le message reste sur l'écran, rien n'a été ajouté
    ppApresImport(nouvelles.length);
  });
}

/* ---- sélecteur de date maison (prototype v27) ---- */
let ppPK = null;
const ppP2 = n => String(n).padStart(2, '0');
const ppMOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const ppTodayISO = () => { const d = new Date(); return d.getFullYear() + '-' + ppP2(d.getMonth() + 1) + '-' + ppP2(d.getDate()); };
function ppPickClose(){

}
function ppPdGrid(){
  const { y, m, sel, min } = ppPK, first = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate(), t = ppTodayISO();
  let g = '<i></i>'.repeat(first);
  for(let d = 1; d <= n; d++){
    const iso = y + '-' + ppP2(m + 1) + '-' + ppP2(d);
    g += `<button class="pp-pd ${iso === sel ? 'sel' : ''} ${iso === t ? 'td' : ''}" ${iso < min ? 'disabled' : ''} style="animation-delay:${(first + d) * 9}ms" onclick="ppPdSel('${iso}')">${d}</button>`;
  }
  return g;
}
function ppPickDate(v, cb){
  ppEnsureSheets();
  const t = ppTodayISO(), b = v || t;
  ppPK = { sel:v || '', y:+b.slice(0, 4), m:+b.slice(5, 7) - 1, min:t, cb };
  const e = document.getElementById('pp-psheet'); e.scrollTop = 0; e.style.translate = ''; e.style.transition = '';

function ppPdMv(d){
  const n = ppPK.y * 12 + ppPK.m + d, mn = +ppPK.min.slice(0, 4) * 12 + +ppPK.min.slice(5, 7) - 1;

/* ---------------- Lecture des documents joints (bouton "Doc") ----------------
   - Images et PDF : envoyés tels quels à Gemini (base64), comme avant.
   - .txt / .md : texte lu directement dans le navigateur.
   - .docx : Gemini ne lit pas le Word, donc on extrait le texte ici, sans
     aucune librairie externe (un .docx est un zip contenant du XML).
   Pour .txt/.md/.docx, le fichier est stocké avec un champ `texte` (et pas
   de dataBase64) ; genererCartesIA() l'envoie à Gemini comme du texte. */
function iaFileKind(file){
  const name = (file.name || '').toLowerCase();
  const type = file.type || '';
  if(type.startsWith('image/') || /\.(jpe?g|png|webp|gif|heic|heif)$/.test(name)) return 'image';
  if(type === 'application/pdf' || name.endsWith('.pdf')) return 'pdf';
  if(name.endsWith('.docx') || type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') return 'docx';
  if(name.endsWith('.txt') || name.endsWith('.md') || name.endsWith('.markdown') || type === 'text/plain' || type === 'text/markdown') return 'text';
  return 'unsupported';
}

function mimeImageDepuisNom(name){
  const n = (name || '').toLowerCase();
  if(n.endsWith('.png')) return 'image/png';
  if(n.endsWith('.webp')) return 'image/webp';
  if(n.endsWith('.gif')) return 'image/gif';
  if(n.endsWith('.heic')) return 'image/heic';
  if(n.endsWith('.heif')) return 'image/heif';
  return 'image/jpeg';
}

function lireEnBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || '').split(',')[1] || '');
    reader.onerror = () => reject(new Error('lecture'));
    reader.readAsDataURL(file);
  });
}

function decoderTexte(buffer){
  try{ return new TextDecoder('utf-8', { fatal: true }).decode(buffer); }
  catch(e){ return new TextDecoder('windows-1252').decode(buffer); }
}

const INFLATE_MAX = 20 * 1024 * 1024;     // v153 (constat 41) : taille maximale d'une entrée décompressée
const FICHIER_IA_MAX = 25 * 1024 * 1024;  // v153 (constat 41) : taille maximale d'un fichier choisi
async function inflateRaw(bytes){
  if(typeof DecompressionStream === 'undefined') throw new Error('nav-ancien');
  const flux = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  const lecteur = flux.getReader(), morceaux = [];
  let total = 0;
  for(;;){
    const { done, value } = await lecteur.read();
    if(done) break;
    total += value.length;
    if(total > INFLATE_MAX){ try{ await lecteur.cancel(); }catch(e){} throw new Error('zip-trop-gros'); }
    morceaux.push(value);
  }
  const out = new Uint8Array(total); let p = 0;
  for(const m of morceaux){ out.set(m, p); p += m.length; }
  return out;
}

/* Lit UNE entrée d'un zip (ici word/document.xml). Renvoie null si absente. */
async function lireEntreeZip(buffer, chemin){
  const dv = new DataView(buffer);
  const u8 = new Uint8Array(buffer);
  let eocd = -1;
  for(let i = buffer.byteLength - 22; i >= Math.max(0, buffer.byteLength - 22 - 65535); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('zip-invalide');
  const nb = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  for(let n = 0; n < nb; n++){
    if(p + 46 > buffer.byteLength || dv.getUint32(p, true) !== 0x02014b50) throw new Error('zip-invalide');
    const methode = dv.getUint16(p + 10, true);
    const tailleComp = dv.getUint32(p + 20, true);
    const lenNom = dv.getUint16(p + 28, true);
    const lenExtra = dv.getUint16(p + 30, true);
    const lenComm = dv.getUint16(p + 32, true);
    const offsetLocal = dv.getUint32(p + 42, true);
    const nom = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + lenNom));
    if(nom === chemin){
      if(dv.getUint32(offsetLocal, true) !== 0x04034b50) throw new Error('zip-invalide');
      const debut = offsetLocal + 30 + dv.getUint16(offsetLocal + 26, true) + dv.getUint16(offsetLocal + 28, true);
      const data = u8.subarray(debut, debut + tailleComp);
      if(methode === 0) return data;
      if(methode === 8) return await inflateRaw(data);
      throw new Error('zip-invalide');
    }
    p += 46 + lenNom + lenExtra + lenComm;
  }
  return null;
}

/* Transforme le XML de Word en texte brut, en gardant un peu de structure :
   titres -> "# Titre", listes -> "- item", tableaux -> "| a | b |". */
function docxXmlEnTexte(xml){
  const NS_W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('zip-invalide');
  const body = doc.getElementsByTagNameNS('*', 'body')[0];
  if(!body) return '';
  const enfants = (el, nom) => Array.from(el.childNodes).filter(n => n.nodeType === 1 && n.localName === nom);
  const val = el => el.getAttributeNS(NS_W, 'val') || el.getAttribute('w:val') || '';

  function texteParagraphe(p){
    let t = '';
    (function parcourir(n){
      for(const c of Array.from(n.childNodes)){
        if(c.nodeType !== 1) continue;
        const nom = c.localName;
        if(nom === 't') t += c.textContent;
        else if(nom === 'tab') t += '\t';
        else if(nom === 'br' || nom === 'cr') t += '\n';
        else if(nom === 'pPr' || nom === 'rPr' || nom === 'Fallback') continue;
        else parcourir(c);
      }
    })(p);
    return t;
  }

  const lignes = [];
  function bloc(conteneur){
    for(const c of Array.from(conteneur.childNodes)){
      if(c.nodeType !== 1) continue;
      if(c.localName === 'p'){
        const texte = texteParagraphe(c).trim();
        if(!texte){ lignes.push(''); continue; }
        let prefixe = '';
        const pPr = enfants(c, 'pPr')[0];
        if(pPr){
          const style = enfants(pPr, 'pStyle')[0];
          const m = style ? /^(?:heading|titre)\s*([1-6])$/i.exec(val(style)) : null;
          if(m) prefixe = '#'.repeat(Number(m[1])) + ' ';
          else if(enfants(pPr, 'numPr').length || (style && /^(list|liste|paragraphedeliste)/i.test(val(style)))) prefixe = '- ';
        }
        lignes.push(prefixe + texte);
      } else if(c.localName === 'tbl'){
        for(const tr of enfants(c, 'tr')){
          const cellules = enfants(tr, 'tc').map(tc => enfants(tc, 'p').map(texteParagraphe).join(' ').trim());
          lignes.push('| ' + cellules.join(' | ') + ' |');
        }
        lignes.push('');
      } else if(c.localName === 'sdt'){
        const contenu = enfants(c, 'sdtContent')[0];
        if(contenu) bloc(contenu);
      }
    }
  }
  bloc(body);
  return lignes.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

async function extraireTexteDocx(file){
  const buffer = await file.arrayBuffer();
  const data = await lireEntreeZip(buffer, 'word/document.xml');
  if(!data) throw new Error('zip-invalide');
  return docxXmlEnTexte(new TextDecoder('utf-8').decode(data));
}

/* ---------------- Poids des fichiers envoyés à Gemini ----------------
   Tout part en UNE requête (base64). Google plafonne ça à ~20 Mo : on garde une marge. */
const POIDS_MAX_ENVOI = 18 * 1024 * 1024; // en caractères base64 (≈ octets envoyés)
function poidsFichiers(liste){
  return (liste || []).reduce((n, f) => n + (f.dataBase64 ? f.dataBase64.length : 0) + (f.texte ? f.texte.length : 0), 0);
}
function poidsEnMo(n){ return (n / 1048576).toFixed(1).replace('.', ','); }
function msgTropLourd(n){
  return `Fichiers trop lourds : ${poidsEnMo(n)} Mo pour ${poidsEnMo(POIDS_MAX_ENVOI)} Mo maximum. Retire un fichier (les PDF sont les plus lourds) et fais-le en deux fois.`;
}
/* Pour un ajustement : si tout est trop lourd, on n'envoie PAS les fichiers (l'IA
   travaille alors seulement à partir des cartes / de la synthèse actuelles). */
function fichiersSousPlafond(liste){
  const l = liste || [];
  return poidsFichiers(l) > POIDS_MAX_ENVOI ? { liste: [], trop: true } : { liste: l, trop: false };
}
const MSG_FICHIERS_IGNORES = "Fichiers d'origine trop lourds : l'IA a travaillé seulement à partir de ce qui est déjà à l'écran.";

/* Réduit une photo avant envoi : côté le plus long ≤ 2000 px, JPEG qualité 0,82.
   Renvoie un Blob plus léger, ou null (petite image, GIF, format non lisible par le
   navigateur, ou résultat pas plus léger) : dans ce cas on garde l'original. */
async function compresserImage(file){
  try{
    if(file.size < 300 * 1024 || /gif$/i.test(file.type || '')) return null;
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const echelle = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width * echelle)), h = Math.max(1, Math.round(bmp.height * echelle));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    ctx.drawImage(bmp, 0, 0, w, h);
    if(bmp.close) bmp.close();
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.82));
    canvas.width = canvas.height = 0;
    return (blob && blob.size < file.size) ? blob : null;
  }catch(e){ return null; }
}

/* Lit une liste de fichiers -> { ajoutes: [...], problemes: [...] } (sans toucher à l'état). */
async function preparerFichiersIA(files){
  const ajoutes = [], problemes = [];
  for(const file of files){
    const kind = iaFileKind(file);
    const nom = file.name || 'fichier';
    if(file.size > FICHIER_IA_MAX){ problemes.push(`« ${nom} » : fichier trop gros (plus de 25 Mo).`); continue; }
    try{
      if(kind === 'image'){
        const blob = await compresserImage(file);
        if(blob) ajoutes.push({ name: nom.replace(/\.[^.]+$/, '') + '.jpg', mimeType: 'image/jpeg', dataBase64: await lireEnBase64(blob) });
        else ajoutes.push({ name: nom, mimeType: file.type || mimeImageDepuisNom(nom), dataBase64: await lireEnBase64(file) });
      } else if(kind === 'pdf'){
        ajoutes.push({ name: nom, mimeType: 'application/pdf', dataBase64: await lireEnBase64(file) });
      } else if(kind === 'text' || kind === 'docx'){
        const texte = kind === 'docx' ? await extraireTexteDocx(file) : decoderTexte(await file.arrayBuffer());
        if(!texte.trim()) problemes.push(`« ${nom} » : aucun texte trouvé dans ce document.`);
        else ajoutes.push({ name: nom, mimeType: 'text/plain', texte: texte.trim() });
      } else {
        problemes.push(`« ${nom} » : format non géré. Enregistre-le en .docx ou en PDF, puis réessaie.`);
      }
    }catch(err){
      if(err && err.message === 'zip-trop-gros') problemes.push(`« ${nom} » : document trop volumineux une fois ouvert (plus de 20 Mo de texte).`);
      else if(err && err.message === 'nav-ancien') problemes.push(`« ${nom} » : ton navigateur est trop ancien pour lire un .docx. Utilise un PDF à la place.`);
      else problemes.push(`« ${nom} » : impossible de lire ce fichier (abîmé ou protégé par mot de passe ?).`);
    }
  }
  return { ajoutes, problemes };
}

async function handleIaFilesInput(event){
  const input = event.target;
  const files = Array.from(input.files || []);
  if(files.length === 0) return;
  const r = await preparerFichiersIA(files);
  iaFiles.push(...r.ajoutes);
  input.value = '';
  iaFilesMsg = r.problemes.length ? r.problemes : null;
  const zone = document.getElementById('ia-files-preview');
  if(zone) zone.innerHTML = renderIaFilesPreview();
}

function removeIaFile(index){
  iaFiles.splice(index, 1);
  iaFilesMsg = null;
  document.getElementById('ia-files-preview').innerHTML = renderIaFilesPreview();
}

/* ---------------- Génération de cartes via l'API Gemini (appel direct navigateur) ----------------
   Flux : genererCartesIA() appelle Gemini et stocke le résultat dans
   iaCartesPreview (état intermédiaire, jamais ajouté aux CARDS directement).
   renderIaPreview() affiche ces cartes en édition inline + un champ pour
   redemander à l'IA d'ajuster (elle reçoit le cours original + les cartes
   actuelles + le message de l'utilisateur, pour un vrai aller-retour).
   Seul le bouton "Ajouter ces cartes" appelle finaliserImport(). */
let iaCartesPreview = null; // { matiere, dateControle, cartes: [{question, reponse}] } | null
let iaCoursOriginal = ''; // gardé pour les régénérations ultérieures
let iaFichiersOriginal = []; // copie des fichiers joints, gardée avec le cours (synthèse + ajustements)

const GEMINI_SYSTEM_PROMPT = `Génère des flashcards question/réponse à partir du cours fourni (texte, photos ou documents), pour qu'un élève révise en se testant.

Règles pour chaque carte :
- Une carte = une seule notion précise (jamais une question qui couvre plusieurs concepts).
- La question est claire et se comprend toute seule : jamais « selon le texte », « dans ce cours », « d'après le document », ni renvoi à un schéma ou à une autre carte.
- La réponse est unique, courte et directe (quelques mots ou 1 à 2 phrases). Pas de question à réponse oui/non, pas de réponse vague ou à plusieurs versions possibles.
- Une liste (« les 5 causes de… », « les étapes de… ») ne tient pas sur une seule carte : fais une carte par élément, avec une question qui vise un seul élément précis (jamais « cite une des causes »).
- Reste fidèle au cours : n'invente rien, n'ajoute aucune information absente du cours. Écris dans la langue du cours.
- Chaque carte doit rester sensée si on la lit à l'envers (on voit la réponse et on retrouve la question) : la réponse désigne clairement une seule chose.
- Si le cours est une fiche de synthèse condensée (style télégraphique, symboles comme → ⇒ = ≠ ↑ ↓, mots-clés en gras), interprète les symboles et écris des questions et des réponses en phrases claires et complètes, jamais avec les symboles : « → » = définition ou lien, « ⇒ » = conséquence, « = » = égale ou signifie, « ≠ » = différent de ou opposé à, « ↑ » = augmente, « ↓ » = diminue. Une ligne de fiche donne une ou plusieurs cartes ; chaque carte reste compréhensible sans la fiche. Tu peux mettre en mots ce que la fiche exprime en symboles, mais n'ajoute aucune information absente de la fiche.
- Photos de cours manuscrit : ignore ratures, marges, gribouillis et passages illisibles (ne devine pas un mot illisible).
- Couvre les notions importantes du cours (définitions, dates, causes et conséquences, formules, exemples clés) sans cartes triviales ni doublons. Pas de nombre imposé : autant de cartes que nécessaire.
- Maths, physique, chimie : écris chaque formule entre $ et $ en LaTeX simple (\\frac{a}{b}, x^2, x_1, \\sqrt{x}, \\sum, \\int, \\alpha, \\Delta, \\ce{H2O} pour une formule chimique), par exemple « $E = mc^2$ ». Le signe $ ne sert qu'aux formules (écris « 5 euros »). Dans le JSON, double chaque antislash : \\\\frac. Un mot clé peut être mis en **gras**, rarement.
- Si des consignes plus précises suivent (ajuster, modifier, ajouter des cartes), elles passent avant ces règles.

Réponds UNIQUEMENT avec un tableau JSON brut, rien d'autre autour (pas de texte, pas de balises markdown). Chaque carte doit avoir exactement ces champs :
[{ "question": "...", "reponse": "..." }]`;

/* Une seule génération / un seul ajustement à la fois : sinon un changement d'onglet
   (qui reconstruit le formulaire, bouton de nouveau actif) permettait un 2e clic,
   donc 2 requêtes Gemini (double quota) et un plantage à l'arrivée de la 2e réponse. */
let iaGenerationEnCours = false;
let iaAjustementEnCours = false;
let iaRefineBrouillon = ''; // message pour l'IA (aperçu) : gardé si l'envoi échoue, vidé quand l'aperçu se ferme ou que l'ajustement réussit

async function genererCartesIA(){
  if(iaGenerationEnCours) return;
  const key = getGeminiKey();
  const cours = (document.getElementById('ia-cours-textarea').value || '').trim();
  const matiere = (document.getElementById('ia-matiere-input').value || '').trim();
  const dateControle = document.getElementById('ia-date-input').value || null;
  sauverBrouillonIA(); // au cas où une erreur force renderAdd() : la saisie est reposée telle quelle

  if(!key){ importMsg = { type:'err', text:"Ajoute ta clé API Gemini dans Réglages d'abord." }; renderAdd(); return; }
  if(!cours && iaFiles.length === 0){ importMsg = { type:'err', text:'Colle un cours ou ajoute une photo ou un document avant de générer.' }; renderAdd(); return; }
  if(!matiere){ importMsg = { type:'err', text:'Précise la matière.' }; renderAdd(); return; }
  if(poidsFichiers(iaFiles) > POIDS_MAX_ENVOI){ importMsg = { type:'err', text: msgTropLourd(poidsFichiers(iaFiles)) }; renderAdd(); return; }

  iaGenerationEnCours = true;
  importMsg = null;
  renderAdd();

  const parts = [{ text: GEMINI_SYSTEM_PROMPT + (cours ? ('\n\nCours :\n' + cours) : '\n\nGénère les cartes à partir des documents/images joints.') }];
  const pfIa = ppPartsFichiers(iaFiles, 0);
  parts.push(...pfIa.parts);
  if(pfIa.total > 0) parts.push({ text: PROMPT_IMAGES });
  parts.push({ text: PROMPT_RECHERCHE_IMAGES });   // v155

  let cartes;
  try{
    cartes = await appelerGeminiPourCartes(parts, { garderImages: true, onRetry: () => { const b = document.getElementById('ia-generate-btn'); if(b) b.textContent = 'Nouvelle tentative...'; } });
  }finally{
    iaGenerationEnCours = false;
  }

  if(cartes === null) { renderAdd(); return; } // erreur déjà posée dans importMsg par appelerGeminiPourCartes

  iaImgBanque = [];
  await ppImgBanqueAjouter(iaFiles);   // photos réduites : l'IA en désigne par numéro, tu peux en choisir d'autres dans l'aperçu
  cartes = await ppImgResoudre(cartes, true);
  // v155 : recherche des images demandées (Wikimedia Commons), avant d'ouvrir l'aperçu
  let bilanImages = null;
  if(cartes.some(c => c.rechercheImage)){
    iaGenerationEnCours = true;
    const bt = document.getElementById('ia-generate-btn'); if(bt) bt.textContent = 'Recherche des images...';
    try{ bilanImages = await ppImgChercherPourCartes(cartes); }
    finally{ iaGenerationEnCours = false; }
  }
  iaCoursOriginal = cours;
  iaFichiersOriginal = iaFiles.map(f => ({ ...f })); // avant de vider iaFiles
  iaCartesPreview = { matiere, dateControle, cartes };
  const zoneCours = document.getElementById('ia-cours-textarea');
  // Le champ reste modifiable pendant la génération : ce qui a été tapé en plus du texte envoyé est gardé (reposé à l'annulation / à la validation de l'aperçu).
  const coursActuel = ((zoneCours ? zoneCours.value : iaBrouillon.cours) || '').trim();
  iaResteCours = coursActuel === cours ? '' : (coursActuel.startsWith(cours) ? coursActuel.slice(cours.length).replace(/^\s+/, '') : coursActuel);
  if(zoneCours) zoneCours.value = '';
  viderBrouillonIA();
  iaFiles = [];
  iaFilesMsg = null;
  renderAdd();
  if(bilanImages){
    if(bilanImages.trouvees > 0) ppToast('Images trouvées sur Wikimedia Commons : vérifie-les avant d\u2019enregistrer.');
    else ppToast('Aucune image trouvée pour les mots-clés de l\u2019IA.');
    if(bilanImages.perdues > 0) setTimeout(() => ppToast(MSG_IMG_PLEIN), 2600);
  }
}

/* --- Nouvelles tentatives automatiques sur les erreurs serveur passagères ---
   500/502/503/504 = problème côté serveur Google (souvent momentané, ex. 503
   « Service Unavailable » quand le modèle est surchargé). On réessaie au plus
   2 fois (attentes de 1,5 s puis 3 s). Jamais sur 400/401/403/404/429 : inutile
   (clé ou requête en cause) ou aggravant (quota). Un échec réseau (fetch qui
   rejette) n'est PAS réessayé ici : il remonte tel quel. */
const GEMINI_STATUTS_RETRY = [500, 502, 503, 504];
const GEMINI_DELAIS_RETRY_MS = [1500, 3000];

/* v112 : délai maximum par appel (réponse complète, corps compris). Sans lui, un serveur qui ne répond jamais
   laissait « génération en cours » à l'infini. Un dépassement n'est PAS réessayé : il lève une erreur
   `codeGemini === 'timeout'` (message : messageErreurReseau). */
const GEMINI_TIMEOUT_MS = 90000;

async function fetchGeminiTimeout(url, options){
  const ctrl = new AbortController();
  const minuteur = setTimeout(() => ctrl.abort(), GEMINI_TIMEOUT_MS);
  try{
    const r = await fetch(url, { ...options, signal: ctrl.signal });
    const corps = await r.text(); // lu ici pour que le délai couvre aussi la réception du corps
    return new Response(corps, { status: r.status, statusText: r.statusText, headers: r.headers });
  }catch(err){
    if(ctrl.signal.aborted){ const e = new Error('timeout'); e.codeGemini = 'timeout'; throw e; }
    throw err;
  }finally{
    clearTimeout(minuteur);
  }
}

async function fetchGeminiAvecRetry(url, options, onRetry){
  let response = await fetchGeminiTimeout(url, options);
  for(let i = 0; i < GEMINI_DELAIS_RETRY_MS.length && GEMINI_STATUTS_RETRY.includes(response.status); i++){
    if(typeof onRetry === 'function') onRetry(i + 1);
    await new Promise(resolve => setTimeout(resolve, GEMINI_DELAIS_RETRY_MS[i]));
    response = await fetchGeminiTimeout(url, options);
  }
  return response;
}

/* v112 : message quand l'appel n'a pas abouti du tout (pas de réponse du serveur). */
function messageErreurReseau(err, texteConserve){
  const suite = texteConserve ? ' Ton texte est conservé.' : '';
  if(err && err.codeGemini === 'timeout') return "L'IA met trop de temps à répondre. Réessaie dans un moment (ou avec un cours plus court)." + suite;
  if(typeof navigator !== 'undefined' && navigator.onLine === false) return 'Tu n\'as pas de connexion internet. Reconnecte-toi puis réessaie.' + suite;
  return "Impossible de joindre le serveur de l'IA. Vérifie ta connexion, ou réessaie dans un moment." + suite;
}

/* Message affiché pour une réponse d'erreur de l'API Gemini. `texteConserve`
   = true quand la saisie de l'utilisateur est bien conservée à l'écran. */
function messageErreurGemini(status, texteConserve){
  const suite = texteConserve ? ' Ton texte est conservé.' : '';
  if(status === 400) return 'Clé API invalide ou requête refusée. Vérifie ta clé dans Réglages.' + suite;
  if(status === 401 || status === 403) return 'Clé API refusée ou sans accès à ce modèle. Vérifie ta clé dans Réglages.' + suite;
  if(status === 404) return "Le modèle de l'IA est introuvable (il a peut-être été retiré par Google). L'app a besoin d'une mise à jour." + suite;
  if(status === 408) return "L'IA met trop de temps à répondre. Réessaie dans un moment." + suite;
  if(status === 413) return 'Le cours envoyé est trop volumineux. Retire un fichier ou raccourcis le texte.' + suite;
  if(status === 429) return "Quota gratuit dépassé pour l'instant, réessaie dans un moment." + suite;
  if(GEMINI_STATUTS_RETRY.includes(status)) return "Le service de l'IA est momentanément surchargé. Réessaie dans une minute." + suite;
  return `Erreur inattendue de l'IA (code ${status}). Réessaie dans un moment.` + suite;
}

/* Appelle Gemini avec les `parts` fournies et renvoie un tableau de cartes
   {question, reponse}, ou null en cas d'erreur (message déjà posé dans
   importMsg). Mutualisé entre la génération initiale et les régénérations
   demandées depuis l'aperçu. `options` (facultatif) : { onRetry: fn appelée avant
   chaque nouvelle tentative, texteConserve: false si la saisie n'est pas gardée à l'écran }. */
async function appelerGeminiPourCartes(parts, options){
  const opts = options || {};
  const key = getGeminiKey();
  if(!key){ importMsg = { type:'err', text:"Ajoute ta clé API Gemini dans Réglages d'abord." }; return null; }
  if(!/^[\x21-\x7e]+$/.test(key)){ importMsg = { type:'err', text:'La clé Gemini contient des caractères non valides : copie-la de nouveau depuis Google.' }; return null; }
  let response;
  try{
    response = await fetchGeminiAvecRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({
        contents: [{ parts }],
        generationConfig: { responseMimeType: 'application/json' }
      })
    }, opts.onRetry);
  }catch(err){
    importMsg = { type:'err', text: messageErreurReseau(err, opts.texteConserve !== false) };
    return null;
  }
  try{
    if(!response.ok){
      importMsg = { type:'err', text: messageErreurGemini(response.status, opts.texteConserve !== false) };
      return null;
    }

    let data;
    try{ data = await response.json(); }
    catch(e){ importMsg = { type:'err', text:"Réponse du serveur illisible, réessaie." }; return null; }
    // Gemini peut répondre sans "parts" (contenu bloqué : SAFETY…, ou coupé) : ce n'est PAS une
    // panne de connexion, et on ne doit surtout pas lire .parts sur undefined.
    const cand = data && data.candidates && data.candidates[0];
    const partiesReponse = cand && cand.content && Array.isArray(cand.content.parts) ? cand.content.parts : [];
    if(partiesReponse.length === 0){
      const motif = (data && data.promptFeedback && data.promptFeedback.blockReason) || (cand && cand.finishReason) || '';
      importMsg = { type:'err', text: (motif && motif !== 'STOP')
        ? "L'IA a bloqué ou refusé cette demande (contenu filtré). Modifie un peu le texte et réessaie."
        : "L'IA n'a rien renvoyé, réessaie." };
      return null;
    }
    const rawText = partiesReponse.map(p => p.text || '').join('');

    let cards;
    try{
      // v153 (constat 43) : on retire d'éventuelles balises ``` et on accepte un objet { cartes: [...] }
      const brutNet = rawText.trim().replace(/^```(?:json)?[ \t]*\r?\n?/i, '').replace(/\r?\n?```[ \t]*$/, '').trim();
      cards = JSON.parse(ppJsonAntislashs(brutNet));
      if(!Array.isArray(cards) && cards && Array.isArray(cards.cartes)) cards = cards.cartes;
    }catch(e){
      importMsg = { type:'err', text: (cand && cand.finishReason === 'MAX_TOKENS')
        ? (opts.garderNumero
            ? "La réponse de l'IA a été coupée : ce paquet est trop gros pour être modifié d'un coup. Modifie-le en plusieurs fois."
            : "Le cours est trop long : la réponse de l'IA a été coupée. Découpe-le en plusieurs parties et réessaie.")
        : "Réponse de l'IA illisible, réessaie." };
      return null;
    }
    if(!Array.isArray(cards) || cards.length === 0){
      importMsg = { type:'err', text:'Aucune carte générée, réessaie avec un texte plus fourni.' };
      return null;
    }

    const numeroDe = (v) => Number.isInteger(v) ? v : ((typeof v === 'string' && /^\d+$/.test(v.trim())) ? parseInt(v, 10) : null);
    const propres = cards
      .filter(c => c && c.question && c.reponse)
      .map(c => {
        const base = opts.garderNumero
          ? { n: numeroDe(c.n), question: ppRepareTexteIA(String(c.question).trim()), reponse: ppRepareTexteIA(String(c.reponse).trim()) }
          : { question: ppRepareTexteIA(String(c.question).trim()), reponse: ppRepareTexteIA(String(c.reponse).trim()) };
        if(opts.garderImages){
          base.nImgQ = numeroDe(c.imageQuestion); base.nImgR = numeroDe(c.imageReponse);
          base.zQ = c.zoneImageQuestion; base.zR = c.zoneImageReponse;   // v156 : zones de découpage (validées plus tard par ppZoneValide)
          // v155 : mot-clé de recherche d'image (texte court, sans balise) et côté voulu
          if(typeof c.rechercheImage === 'string' && c.rechercheImage.trim()){ base.rechercheImage = c.rechercheImage.replace(/[<>\n\r]/g, ' ').trim().slice(0, 120); base.rechercheCote = c.rechercheCote === 'reponse' ? 'reponse' : 'question'; }
        }
        return base;
      });

    if(propres.length === 0){
      importMsg = { type:'err', text:'Aucune carte valide dans la réponse, réessaie.' };
      return null;
    }
    return propres;
  }catch(err){
    importMsg = { type:'err', text:"Réponse inattendue de l'IA, réessaie." };
    return null;
  }
}

/* ---------------- Aperçu éditable des cartes générées ----------------
   Affiché à la place du formulaire de génération tant que iaCartesPreview
   n'est pas null. L'utilisateur peut éditer question/réponse inline,
   supprimer une carte, ou redemander à l'IA d'ajuster via un message
   libre (qui renvoie tout le contexte : cours + cartes actuelles).
   Rien n'est ajouté aux CARDS avant validation explicite. */
function modifierCartePreview(i, champ, valeur){
  if(!iaCartesPreview) return;
  iaCartesPreview.cartes[i][champ] = valeur;
  // Pas de re-render complet ici : on laisse le focus du textarea tranquille,
  // la valeur est déjà à jour dans l'état pour la prochaine action.
}

function toggleInversiblePreview(i){
  if(!iaCartesPreview || !iaCartesPreview.cartes[i]) return;
  iaCartesPreview.cartes[i].inversible = !iaCartesPreview.cartes[i].inversible;
  renderAdd();
}

/* "Tout inverser" : si toutes les cartes le sont déjà, on désactive tout ;
   sinon on active tout. Un seul geste, dans les deux sens. */
function toggleToutInverserPreview(){
  if(!iaCartesPreview) return;
  const elig = iaCartesPreview.cartes.filter(c => !c.ecrite);   // les cartes à écrire sont ignorées
  if(elig.length === 0) return;
  const toutesActives = elig.every(c => c.inversible);
  elig.forEach(c => { c.inversible = !toutesActives; });
  renderAdd();
}
/* « À écrire » dans l'aperçu : l'activer éteint ⇄ de la carte ; ⇄ reste touchable ensuite (cumul volontaire). */
function toggleEcritePreview(i){
  const c = iaCartesPreview && iaCartesPreview.cartes[i];
  if(!c) return;
  c.ecrite = !c.ecrite;
  if(c.ecrite) c.inversible = false;
  renderAdd();
}
function toggleToutEcritePreview(){
  if(!iaCartesPreview || iaCartesPreview.cartes.length === 0) return;
  const toutes = iaCartesPreview.cartes.every(c => c.ecrite);
  iaCartesPreview.cartes.forEach(c => { c.ecrite = !toutes; if(c.ecrite) c.inversible = false; });
  renderAdd();
}

function supprimerCartePreview(i){
  if(!iaCartesPreview) return;
  iaCartesPreview.cartes.splice(i, 1);
  renderAdd();
}

function ajouterCartePreviewVide(){
  if(!iaCartesPreview) return;
  iaCartesPreview.cartes.push({ question: '', reponse: '', inversible: false, ecrite: false });
  renderAdd();
}

function annulerIaPreview(){
  iaCartesPreview = null;
  iaCoursOriginal = '';
  iaFichiersOriginal = []; iaImgBanque = []; ppImgOuvert = null;
  iaFichiersSupp = []; iaFichiersSuppMsg = null; iaTexteSupp = ''; iaRefineBrouillon = '';
  importMsg = null;
  viderBrouillonIA();
  ppResteCoursReposer();
  renderAdd();
}

function validerIaPreview(){
  if(!iaCartesPreview) return;
  const { matiere, dateControle, cartes } = iaCartesPreview;
  const items = cartes
    .filter(c => c.question.trim() && c.reponse.trim())
    .map(c => ({ id: null, matiere, question: c.question.trim(), reponse: c.reponse.trim(), palier: 0, prochaineRevision: null, derniereRevision: null, inversible: c.inversible === true, ecrite: c.ecrite === true, imageQuestion: c.imageQuestion || null, imageReponse: c.imageReponse || null }));

  if(items.length === 0){
    importMsg = { type:'err', text:'Ajoute au moins une carte avec question et réponse avant de valider.' };
    renderAdd();
    return;
  }
  ppImgPerdues = ppImgAjusterBudget(items);

  resolveImportMatieres(items, 0, {}, (renommages) => {
    // La date de contrôle doit être enregistrée AVANT le placement des cartes :
    // finaliserImport lit matieresConfig[matiere].dateControle pour éviter la
    // zone tampon. Le nom final de la matière (renommages) est déjà connu ici.
    if(dateControle){
      const matiereFinale = renommages[matiere] || matiere;
      if(!matieresConfig[matiereFinale]) matieresConfig[matiereFinale] = {};
      matieresConfig[matiereFinale].dateControle = dateControle;
      saveLocalDateControle(matiereFinale, dateControle);
    }
    finaliserImport(items, renommages);
    if(dernierImportEchec) return;   // stockage plein : l'aperçu est gardé, rien n'a été ajouté
    if(dateControle){
      recalcPlanning();
      saveLocalPlanning();
    }
    iaCartesPreview = null;
    iaCoursOriginal = '';
    iaFichiersOriginal = []; iaImgBanque = []; ppImgOuvert = null;
    iaFichiersSupp = []; iaFichiersSuppMsg = null; iaTexteSupp = ''; iaRefineBrouillon = ''; ppMsgApercu = '';
    viderBrouillonIA();
    ppResteCoursReposer();
    ppApresImport(items.length);
  });
}

/* Comme le prototype : après « Ajouter ces cartes » ou « Importer », on arrive sur Parcourir
   avec un petit message. Le bilan détaillé de l'import (et l'avertissement de zone tampon,
   s'il y en a un) reste affiché dans le toast. */
function ppApresImport(n){
  const avert = (importMsg && importMsg.type === 'ok' && typeof MSG_AVERTISSEMENT_REPLI_ZONE === 'string' && importMsg.text.includes(MSG_AVERTISSEMENT_REPLI_ZONE)) ? MSG_AVERTISSEMENT_REPLI_ZONE : null;
  if(importMsg && importMsg.type === 'err'){ renderAdd(); return; }
  importMsg = null;
  switchTab('browse');
  const perdues = ppImgPerdues; ppImgPerdues = 0;
  showCreatedToast(avert, n + ' carte' + (n > 1 ? 's' : '') + ' ajoutée' + (n > 1 ? 's' : '') + (perdues ? ' · ' + perdues + ' image' + (perdues > 1 ? 's' : '') + ' non ajoutée' + (perdues > 1 ? 's' : '') + ' (mémoire pleine)' : ''));
}

/* Renvoie à Gemini : le cours original, les cartes actuelles de l'aperçu,
   et le message de l'utilisateur — pour qu'elle ajuste/complète en
   connaissance de cause plutôt que de repartir de zéro. */
async function raffinerCartesIA(msgForce){
  if(!iaCartesPreview || iaAjustementEnCours) return;
  const zoneMessage = document.getElementById('ia-refine-textarea');
  const message = (typeof msgForce === 'string' ? msgForce : ((zoneMessage && zoneMessage.value) || '')).trim();
  if(!message){ importMsg = { type:'err', text:'Écris un message pour l\'IA avant d\'envoyer.' }; renderAdd(); return; }

  iaRefineBrouillon = message;
  iaAjustementEnCours = true;
  const btnRaff = document.getElementById('ia-refine-btn');
  if(btnRaff){ btnRaff.disabled = true; btnRaff.textContent = 'Envoi en cours...'; }
  importMsg = null;

  const cartesActuelles = JSON.stringify(iaCartesPreview.cartes.map(c => ({ question: c.question, reponse: c.reponse })));
  const contexte = `${GEMINI_SYSTEM_PROMPT}

Cours original :
${iaCoursOriginal || '(non fourni, cartes basées sur des documents/images)'}

Cartes actuellement proposées (JSON) :
${cartesActuelles}

Demande de l'utilisateur : ${message}

Réponds avec le tableau JSON complet et final des cartes à afficher (reprends celles à garder, applique les changements demandés). Toujours uniquement le tableau JSON, rien d'autre.`;

  const partiesRaffinage = [{ text: contexte }];
  const fichiersRaff = fichiersSousPlafond(iaFichiersOriginal);
  const pfRaff = ppPartsFichiers(fichiersRaff.liste, 0);
  partiesRaffinage.push(...pfRaff.parts);
  if(pfRaff.total > 0) partiesRaffinage.push({ text: PROMPT_IMAGES });
  let cartes;
  try{
    cartes = await appelerGeminiPourCartes(partiesRaffinage, { garderImages: true, onRetry: () => { const b = document.getElementById('ia-refine-btn'); if(b) b.textContent = 'Nouvelle tentative...'; }, texteConserve: true });
  }finally{
    iaAjustementEnCours = false;
    const b = document.getElementById('ia-refine-btn');
    if(b){ b.disabled = false; b.textContent = 'Envoyer à l\'IA'; }
  }

  if(cartes === null){ renderAdd(); return; }
  if(!iaCartesPreview){ renderAdd(); return; } // aperçu fermé / cartes enregistrées pendant l'attente

  // Gemini ne renvoie que question/réponse : sans ça, tous les ⇄ déjà cochés
  // sur l'aperçu seraient perdus à chaque ajustement. On les recolle sur les
  // cartes dont la question est restée identique (l'IA peut réordonner ou
  // reformuler : une carte reformulée repart sans sens inversé, à recocher).
  // Images (v121) : une carte dont la question est restée identique garde ses images actuelles (y compris
  // celles que tu as changées ou retirées à la main) ; sinon on prend l'image proposée par l'IA, s'il y en a.
  const avantParQuestion = new Map();
  iaCartesPreview.cartes.forEach(c => { const k = c.question.trim(); if(!avantParQuestion.has(k)) avantParQuestion.set(k, c); });
  const cartesAvecSens = (await ppImgResoudre(cartes)).map(c => {
    const avant = avantParQuestion.get(c.question.trim());
    const out = { ...c, inversible: !!(avant && avant.inversible), ecrite: !!(avant && avant.ecrite) };
    const iq = (avant && avant.imageQuestion) || c.imageQuestion, ir = (avant && avant.imageReponse) || c.imageReponse;
    if(iq) out.imageQuestion = iq; else delete out.imageQuestion;
    if(ir) out.imageReponse = ir; else delete out.imageReponse;
    return out;
  });
  iaCartesPreview.cartes = cartesAvecSens;
  iaRefineBrouillon = '';
  const zoneRaff = document.getElementById('ia-refine-textarea');
  if(zoneRaff) zoneRaff.value = '';
  if(fichiersRaff.trop) importMsg = { type:'ok', text: MSG_FICHIERS_IGNORES };
  renderAdd();
}

/* ---------------- Modifier les cartes d'une matière avec l'IA (après génération) ----------------
   Contrairement à « Demander un ajustement à l'IA » (aperçu, AVANT d'ajouter), ceci agit sur
   les cartes DÉJÀ enregistrées d'une matière. Flux : consigne -> l'IA renvoie la liste complète
   et finale -> on compare avec l'existant -> l'utilisateur coche ce qu'il accepte -> appliquer.
   Une carte modifiée garde son id, donc sa progression (palier, dates de révision).
   Rien n'est touché avant « Appliquer ». Les cartes sont numérotées 1..N pour l'IA (pas d'id
   longs à recopier) ; une carte absente de la réponse = proposée à la suppression. */
let iaEdit = null; // { matiere, base:[{id,question,reponse}], consigne, etape:'consigne'|'revue', enCours, msg, propositions:[] }

function ouvrirEditionIA(matiere){
  const cartes = CARDS.filter(c => (c.matiere || 'Sans matière') === matiere);
  if(cartes.length === 0){ ppToast('Aucune carte dans cette matière'); return; }
  iaEdit = { matiere, base: cartes.map(c => ({ id: c.id, question: c.question, reponse: c.reponse })), consigne: '', etape: 'consigne', enCours: false, msg: null, propositions: [] };
  renderEditionIA();
}

function fermerEditionIA(){
  if(iaEdit && iaEdit.enCours) return; // ne pas perdre une réponse en route
  iaEdit = null;
  ppSheetClose();
}

function renderEditionIA(){
  const e = iaEdit;
  if(!e) return;
  const msgHtml = e.msg ? `<p class="pp-warn${e.msg.type === 'ok' ? ' ok' : ''}"${e.msg.type === 'ok' ? '' : ' style="--wc:var(--pink)"'}>${escapeHtml(e.msg.text)}</p>` : '';
  if(e.etape === 'consigne'){
    const dis = e.enCours ? ' disabled' : '';
    ppSheet(`<div class="pp-grab"></div><h2 style="font-size:22px;line-height:1.15">Modifier « ${escapeHtml(e.matiere)} » avec l'IA</h2><p class="pp-hint">${e.base.length} carte${e.base.length > 1 ? 's' : ''} dans cette matière. Tu vérifies chaque changement avant de l'appliquer.</p>${msgHtml}
    <textarea class="pp-tall" id="ia-edit-consigne" oninput="iaEdit.consigne = this.value" placeholder="Ex. raccourcis les réponses, supprime les doublons, ajoute 5 cartes sur… (tu peux aussi coller un texte)">${escapeHtml(e.consigne)}</textarea>
    <div class="pp-duo"><button class="pp-sec" onclick="fermerEditionIA()"${dis}>Annuler</button><button class="pp-cta${e.enCours ? ' busy' : ''}" id="ia-edit-envoyer" onclick="envoyerEditionIA()"${dis}>${e.enCours ? 'Envoi en cours...' : "Envoyer à l'IA"}</button></div>`);
    return;
  }
  const props = e.propositions;
  const nb = props.filter(x => x.accepte).length;
  const nbSuppr = props.filter(x => x.type === 'suppr').length;
  const beaucoupDeSuppr = nbSuppr >= 3 || (nbSuppr > 0 && nbSuppr >= Math.ceil(e.base.length / 2));
  const libelle = { modif: 'Modifiée', ajout: 'Nouvelle', suppr: 'Supprimée' };
  const couleur = { modif: 'var(--orange)', ajout: 'var(--green)', suppr: 'var(--pink)' };
  ppSheet(`<div class="pp-grab"></div><h2>Changements proposés</h2><p class="pp-hint">Décoche ce que tu ne veux pas appliquer.</p>${msgHtml}
  ${beaucoupDeSuppr ? `<p class="pp-warn" style="--wc:var(--pink)">L'IA propose de supprimer ${nbSuppr} carte${nbSuppr > 1 ? 's' : ''} sur ${e.base.length}. Elles sont décochées : coche seulement celles que tu veux vraiment supprimer (c'est définitif).</p>` : ''}
  ${props.length === 0 ? `<p class="pp-hint">L'IA n'a proposé aucun changement.</p>` : ''}
  ${props.map((x, i) => `<label class="pp-pv" style="display:flex;gap:11px;align-items:flex-start;cursor:pointer;opacity:${x.accepte ? 1 : .5}"><input type="checkbox" ${x.accepte ? 'checked' : ''} style="accent-color:var(--orange);width:20px;height:20px;margin-top:1px;flex:none" onchange="basculerPropositionIA(${i},this)"><span style="flex:1;min-width:0;font-size:14px;line-height:1.4"><span class="pp-tag2" style="color:${couleur[x.type]}">${libelle[x.type]}</span>
    ${x.type === 'ajout' ? '' : `<span style="display:block;color:var(--muted);text-decoration:line-through;margin-top:4px">${escapeHtml(x.avant.question)}<br>${escapeHtml(x.avant.reponse)}</span>`}
    ${x.type === 'suppr' ? '' : `<span style="display:block;margin-top:4px"><b>${escapeHtml(x.apres.question)}</b><br>${escapeHtml(x.apres.reponse)}</span>`}</span></label>`).join('')}
  <div class="pp-duo" style="margin-top:6px"><button class="pp-sec" onclick="retourConsigneEditionIA()">Retour</button><button class="pp-cta" id="ia-edit-appliquer" onclick="appliquerEditionIA()"${nb === 0 ? ' disabled' : ''}>Appliquer (${nb})</button></div>`);
}

/* Cocher / décocher une proposition : mise à jour sur place (pas de redessin de la feuille). */
function basculerPropositionIA(i, el){
  if(!iaEdit || !iaEdit.propositions[i]) return;
  const p = iaEdit.propositions[i];
  p.accepte = el ? el.checked : !p.accepte;
  if(el){ const l = el.closest('label'); if(l) l.style.opacity = p.accepte ? 1 : .5; }
  const nb = iaEdit.propositions.filter(x => x.accepte).length;
  const b = document.getElementById('ia-edit-appliquer');
  if(b){ b.textContent = 'Appliquer (' + nb + ')'; b.disabled = nb === 0; }
}

function retourConsigneEditionIA(){
  if(!iaEdit) return;
  iaEdit.etape = 'consigne'; iaEdit.msg = null;
  renderEditionIA();
}

async function envoyerEditionIA(){
  const e = iaEdit;
  if(!e || e.enCours) return;
  const zone = document.getElementById('ia-edit-consigne');
  if(zone) e.consigne = zone.value;
  const consigne = (e.consigne || '').trim();
  if(!getGeminiKey()){ e.msg = { type:'err', text:"Ajoute ta clé API Gemini dans Réglages d'abord." }; renderEditionIA(); return; }
  if(!consigne){ e.msg = { type:'err', text:"Écris ce que l'IA doit changer." }; renderEditionIA(); return; }

  e.enCours = true; e.msg = null;
  const btn = document.getElementById('ia-edit-envoyer');
  if(btn){ btn.disabled = true; btn.classList.add('busy'); btn.textContent = 'Envoi en cours...'; }
  const actuelles = JSON.stringify(e.base.map((c, i) => ({ n: i + 1, question: c.question, reponse: c.reponse })));
  const parts = [{ text: `${GEMINI_SYSTEM_PROMPT}

Tu modifies un paquet de flashcards EXISTANT (matière : ${e.matiere}). Cartes actuelles (JSON, chacune avec un numéro "n") :
${actuelles}

Demande de l'utilisateur : ${consigne}

Réponds avec le tableau JSON COMPLET et FINAL des cartes de la matière. Chaque élément : { "n": <numéro d'une carte actuelle> ou null pour une nouvelle carte, "question": "...", "reponse": "..." }.
Règles : garde le "n" des cartes conservées ou modifiées ; recopie à l'identique les cartes que la demande ne concerne pas ; n'inclus pas les cartes à supprimer ; ne change que ce que la demande implique. Uniquement le tableau JSON, rien d'autre.` }];

  importMsg = null;
  let cartes;
  try{
    cartes = await appelerGeminiPourCartes(parts, { garderNumero: true, texteConserve: false, onRetry: () => { const b = document.getElementById('ia-edit-envoyer'); if(b) b.textContent = 'Nouvelle tentative...'; } });
  }finally{
    e.enCours = false;
  }
  if(iaEdit !== e) return; // fenêtre fermée pendant l'attente
  if(cartes === null){
    e.msg = importMsg || { type:'err', text:"L'IA n'a pas répondu, réessaie." };
    importMsg = null;
    renderEditionIA();
    return;
  }

  // Comparaison réponse IA <-> cartes actuelles
  const vues = new Set();
  const props = [];
  for(const c of cartes){
    const idx = (c.n != null && c.n >= 1 && c.n <= e.base.length && !vues.has(c.n)) ? c.n - 1 : -1;
    if(idx === -1){
      props.push({ type:'ajout', id:null, apres:{ question:c.question, reponse:c.reponse }, accepte:true });
      continue;
    }
    vues.add(c.n);
    const avant = e.base[idx];
    if(avant.question.trim() !== c.question || avant.reponse.trim() !== c.reponse){
      props.push({ type:'modif', id:avant.id, avant:{ question:avant.question, reponse:avant.reponse }, apres:{ question:c.question, reponse:c.reponse }, accepte:true });
    }
  }
  e.base.forEach((c, i) => {
    if(!vues.has(i + 1)) props.push({ type:'suppr', id:c.id, avant:{ question:c.question, reponse:c.reponse }, accepte:false }); // v153 (constat 42) : une suppression est définitive, jamais cochée d'office
  });
  // Ordre d'affichage : modifiées, nouvelles, supprimées
  const ordre = { modif:0, ajout:1, suppr:2 };
  props.sort((a, b) => ordre[a.type] - ordre[b.type]);
  e.propositions = props;
  e.etape = 'revue';
  renderEditionIA();
}

function appliquerEditionIA(){
  const e = iaEdit;
  if(!e) return;
  const acceptees = e.propositions.filter(x => x.accepte);
  if(acceptees.length === 0) return;
  let nbModif = 0, nbSuppr = 0, nbAjout = 0, nbChangees = 0;

  for(const x of acceptees.filter(x => x.type === 'modif')){
    const c = CARDS.find(k => k.id === x.id);
    if(!c) continue; // supprimée entre-temps (ex. par la synchro)
    if((c.question || '').trim() !== (x.avant.question || '').trim() || (c.reponse || '').trim() !== (x.avant.reponse || '').trim()){ nbChangees++; continue; } // v153 : carte modifiée depuis l'ouverture : on ne l'écrase pas
    const derniereModification = new Date().toISOString();
    c.question = x.apres.question; c.reponse = x.apres.reponse; c.derniereModification = derniereModification;
    saveLocalOverlay(c.id, { question: c.question, reponse: c.reponse, derniereModification });
    nbModif++;
  }
  for(const x of acceptees.filter(x => x.type === 'suppr')){
    if(!CARDS.some(k => k.id === x.id)) continue;
    CARDS = CARDS.filter(k => k.id !== x.id);
    saveLocalDelete(x.id);
    saveTombstone(x.id);
    nbSuppr++;
  }
  const aAjouter = acceptees.filter(x => x.type === 'ajout').map(x => ({ id: null, matiere: e.matiere, question: x.apres.question, reponse: x.apres.reponse, palier: 0, prochaineRevision: null, derniereRevision: null, inversible: false }));

  iaEdit = null;
  ppSheetClose();
  if(aAjouter.length){
    finaliserImport(aAjouter, {}); // étale les nouvelles cartes comme un ajout normal (recalcule et redessine)
    importMsg = null;              // message d'import inutile ici (on n'est pas sur l'onglet Ajouter)
    nbAjout = dernierImportEchec ? 0 : aAjouter.length;
  } else {
    if(matiereFilter !== 'toutes' && !getMatieres().includes(matiereFilter)) matiereFilter = 'toutes';
    recalcPlanning();
    saveLocalPlanning();
    render();
  }
  if(activeTab === 'study') buildQueue();
  const morceaux = [];
  if(nbModif) morceaux.push(`${nbModif} modifiée${nbModif > 1 ? 's' : ''}`);
  if(nbAjout) morceaux.push(`${nbAjout} ajoutée${nbAjout > 1 ? 's' : ''}`);
  if(nbSuppr) morceaux.push(`${nbSuppr} supprimée${nbSuppr > 1 ? 's' : ''}`);
  if(nbChangees) morceaux.push(`${nbChangees} ignorée${nbChangees > 1 ? 's' : ''} (carte modifiée entre-temps)`);
  if(dernierImportEchec && aAjouter.length) morceaux.push('ajouts annulés : stockage plein');
  ppToast(morceaux.join(' · ') || 'Aucun changement');
  envoyerVersSync();
}
