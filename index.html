<script>
/*
  PLAN DU FICHIER (cherche ces titres pour t'y retrouver)
  1. Données : cartes de départ, matières, planning, sauvegarde locale (overlay), suppressions
  2. Matières : renommer / supprimer / fusionner, archivage, dates de contrôle
  3. Répétition espacée : paliers (INTERVALS), nextPalier, compression avant contrôle, plafonds par jour
  4. Révision : file du jour (buildQueue), rappels légers, écran d'accueil, geste de glissement, answer() / annuler
  5. Onglets : Parcourir, Planning, Historique, Quiz
  6. Ajout de cartes par IA : Gemini (clé, fichiers joints, génération, aperçu, ajustement, édition de paquet)
  7. Synthèses : prompt, modèles de consignes, écran, appels Gemini
  8. Réglages, export / import complet de la progression, fusion depuis la synchro
  9. Création manuelle de carte / matière, modales
  10. Rappel de révision (notifications), synchro entre appareils (Cloudflare Worker + KV), raccourcis clavier
*/
/*
  ZONE DE DONNÉES — c'est ici que Claude ajoute/modifie les cartes.
  Chaque carte : { id, matiere, question, reponse, palier, prochaineRevision, derniereRevision }
  id doit rester unique. Ne pas toucher au reste du fichier pour ajouter des cartes.
*/
const SEED_CARDS = [

];

/*
  CONFIG MATIÈRES — une entrée par matière, avec sa date de contrôle.
  Champs : { dateControle: "AAAA-MM-JJ" | null }
  Claude ajoute/actualise une entrée ici pour chaque matière qu'il traite,
  sans toucher aux autres matières déjà présentes.
  Structure fixe : ne jamais renommer les champs ni changer la forme de l'objet.
*/
const MATIERES_CONFIG = {

};

/*
  PLANNING — calendrier jour par jour, calculé par Claude à rebours depuis
  les dates de contrôle de MATIERES_CONFIG, en tenant compte de TOUTES les
  matières présentes (pas seulement celle qu'on vient d'ajouter).
  Forme fixe, à respecter strictement, ne jamais inventer d'autres champs :
  [
    { date: "AAAA-MM-JJ", items: [ { matiere: "Stats", cardIds: ["c12","c13"] } ] },
    ...
  ]
  - "date" : jour du planning, au format AAAA-MM-JJ
  - "items" : liste des blocs de révision ce jour-là, un item par matière traitée ce jour
  - "cardIds" : les id de cartes (du tableau SEED_CARDS) à réviser ce jour-là pour cette matière
  Reste vide tant qu'aucune date de contrôle n'a été fixée ou qu'aucun calcul n'a été fait.
  Claude réécrit ENTIÈREMENT ce tableau à chaque recalcul (nouvelle carte ajoutée,
  date de contrôle changée) — ce n'est pas un journal, juste l'état actuel du planning.
  Note : le planning est aussi recalculé côté client (recalcPlanning) à chaque
  interaction, donc cette constante sert surtout d'amorce / de sauvegarde.
*/
const PLANNING = [

];

let CARDS = SEED_CARDS.map(c => ({ ...c }));
let matieresConfig = JSON.parse(JSON.stringify(MATIERES_CONFIG));
let planning = JSON.parse(JSON.stringify(PLANNING));

/* ---------------- Lecture / écriture sûres du stockage local ----------------
   ppEcrire : écrit et dit si ça a marché. Stockage plein (~5 Mo) = un message clair (au plus un toutes les 6 s)
   au lieu d'un échec silencieux ; ppEcritureEchecs permet à un import de ne pas annoncer « ok » à tort.
   ppLireJSON : lit une clé en vérifiant le TYPE (tableau, objet…) ; sinon valeur par défaut, et si le texte
   était illisible il est copié dans « <clé>-illisible » (une seule fois) avant que la prochaine écriture l'écrase. */
let ppEcritureEchecs = 0, ppEcritureAvisTs = 0;
function ppEcrire(cle, texte){
  try{ localStorage.setItem(cle, texte); return true; }
  catch(e){
    ppEcritureEchecs++;
    const t = Date.now();
    if(t - ppEcritureAvisTs > 6000){
      ppEcritureAvisTs = t;
      try{
        ppToast('Stockage plein : changement non enregistré');
        clearTimeout(ppToastT);
        ppToastT = setTimeout(() => { const el = document.getElementById('pp-toast'); if(el) el.classList.remove('on'); }, 4500);
      }catch(_){}
    }
    return false;
  }
}
function ppEstObjet(v){ return !!v && typeof v === 'object' && !Array.isArray(v); }
function ppLireJSON(cle, defaut, ok){
  let brut = null;
  try{ brut = localStorage.getItem(cle); }catch(e){ return defaut; }
  if(brut === null) return defaut;
  try{
    const v = JSON.parse(brut);
    if(ok(v)) return v;
  }catch(e){}
  try{ if(localStorage.getItem(cle + '-illisible') === null) localStorage.setItem(cle + '-illisible', brut); }catch(e){}
  return defaut;
}

function applyLocalOverlay(){
  const overlay = ppLireJSON('cartes-overlay', {}, ppEstObjet);
  const deleted = ppLireJSON('cartes-deleted', [], Array.isArray);
  CARDS = CARDS.concat(loadImportedCards());
  CARDS = CARDS.filter(c => !deleted.includes(c.id));
  CARDS = CARDS.map(c => ppEstObjet(overlay[c.id]) ? { ...c, ...overlay[c.id] } : c);
  applyLocalDateControleOverlay();
  applyLocalEmptyMatieres();
  applyLocalArchiveOverlay();
  const planningLocal = loadLocalPlanning();
  if(planningLocal) planning = planningLocal;
}
function saveLocalOverlay(id, patch){
  const overlay = ppLireJSON('cartes-overlay', {}, ppEstObjet);
  overlay[id] = { ...(ppEstObjet(overlay[id]) ? overlay[id] : {}), ...patch };
  ppEcrire('cartes-overlay', JSON.stringify(overlay));
}
/* Plusieurs cartes d'un coup (une seule lecture / écriture) : patches = { id: patch, … } */
function saveLocalOverlayLot(patches){
  const ids = Object.keys(patches || {});
  if(!ids.length) return;
  const overlay = ppLireJSON('cartes-overlay', {}, ppEstObjet);
  for(const id of ids) overlay[id] = { ...(ppEstObjet(overlay[id]) ? overlay[id] : {}), ...patches[id] };
  ppEcrire('cartes-overlay', JSON.stringify(overlay));
}
function saveLocalDelete(id){ saveLocalDeleteLot([id]); }
function saveLocalDeleteLot(ids){
  const deleted = ppLireJSON('cartes-deleted', [], Array.isArray);
  const deja = new Set(deleted);
  let change = false;
  for(const id of ids){ if(!deja.has(id)){ deja.add(id); deleted.push(id); change = true; } }
  if(change) ppEcrire('cartes-deleted', JSON.stringify(deleted));
}
/* Retire des ids de « cartes-deleted » et des tombstones locaux (carte revenue par la synchro, plus récente ailleurs). */
function retirerSuppressionsLocales(ids){
  const set = new Set(ids);
  if(!set.size) return;
  const deleted = ppLireJSON('cartes-deleted', [], Array.isArray);
  const reste = deleted.filter(id => !set.has(id));
  if(reste.length !== deleted.length) ppEcrire('cartes-deleted', JSON.stringify(reste));
  const tombs = loadTombstones();
  const resteT = tombs.filter(t => !set.has(t.id));
  if(resteT.length !== tombs.length) saveTombstones(resteT);
}
/* ---------------- Tombstones (suppressions à propager via la synchro) ----------------
   Liste locale des cartes supprimées, avec horodatage, pour que la fusion
   de sync (fusionnerDepuisSync) sache reproduire une suppression sur l'autre
   appareil au lieu de laisser la carte revenir via l'ajout simple. Distinct
   de cartes-deleted ci-dessus (qui sert uniquement au filtrage local via
   applyLocalOverlay, sans horodatage ni notion de "plus récent que"). */
function loadTombstones(){
  return ppLireJSON('cartes-supprimees-tombstones', [], Array.isArray).filter(t => ppEstObjet(t) && t.id);
}
function saveTombstones(list){
  ppEcrire('cartes-supprimees-tombstones', JSON.stringify(list));
}
function saveTombstone(id){ saveTombstonesLot([id]); }
function saveTombstonesLot(ids){
  const tombstones = loadTombstones();
  const parId = new Map(tombstones.map(t => [t.id, t]));
  const supprimeLe = new Date().toISOString();
  for(const id of ids){
    const existant = parId.get(id);
    if(existant){ existant.supprimeLe = supprimeLe; }
    else{ const t = { id, supprimeLe }; tombstones.push(t); parId.set(id, t); }
  }
  saveTombstones(tombstones);
}
function applyLocalDateControleOverlay(){
  const overlay = ppLireJSON('cartes-datecontrole-overlay', {}, ppEstObjet);
  for(const m in overlay){
    if(!matieresConfig[m]) matieresConfig[m] = {};
    matieresConfig[m].dateControle = overlay[m];
  }
}
function saveLocalDateControle(matiere, dateControle, majIso){
  const overlay = ppLireJSON('cartes-datecontrole-overlay', {}, ppEstObjet);
  overlay[matiere] = dateControle;
  ppEcrire('cartes-datecontrole-overlay', JSON.stringify(overlay));
  // Date du dernier changement, par matière : sert à la synchro pour savoir
  // quel appareil a la version la plus récente (majIso = horodatage reçu de
  // l'autre appareil quand la date vient de la synchro, sinon « maintenant »).
  const maj = loadDatesControleMaj();
  maj[matiere] = majIso || new Date().toISOString();
  ppEcrire('cartes-datecontrole-maj', JSON.stringify(maj));
}
function loadDatesControleMaj(){
  return ppLireJSON('cartes-datecontrole-maj', {}, ppEstObjet);
}
/* Matières créées manuellement sans carte encore dedans — juste leur nom,
   pour qu'elles apparaissent dans getMatieres() et persistent au rechargement. */
function loadEmptyMatieres(){
  return ppLireJSON('cartes-matieres-vides', [], Array.isArray).filter(m => typeof m === 'string' && m);
}
function saveEmptyMatieres(list){
  ppEcrire('cartes-matieres-vides', JSON.stringify(list));
}
/* Pour la synchro des matières vides : date de création de chaque matière vide, et « pierres tombales » des
   matières supprimées (ou renommées), nom -> date. Une matière vide reçue n'est reprise que si elle a été créée
   APRÈS la suppression locale ; une suppression reçue retire notre matière vide si elle est plus ancienne. */
function loadMatieresVidesDates(){ return ppLireJSON('cartes-matieres-vides-dates', {}, ppEstObjet); }
function loadMatieresSupprimees(){ return ppLireJSON('cartes-matieres-supprimees', {}, ppEstObjet); }
function noterMatiereSupprimee(nom){
  const sup = loadMatieresSupprimees();
  sup[nom] = new Date().toISOString();
  ppEcrire('cartes-matieres-supprimees', JSON.stringify(sup));
  const dates = loadMatieresVidesDates();
  if(nom in dates){ delete dates[nom]; ppEcrire('cartes-matieres-vides-dates', JSON.stringify(dates)); }
}
function applyLocalEmptyMatieres(){
  const vides = loadEmptyMatieres();
  for(const m of vides){
    if(!matieresConfig[m]) matieresConfig[m] = {};
  }
}
function addEmptyMatiere(nom, creeLe){
  const vides = loadEmptyMatieres();
  if(!vides.includes(nom)) vides.push(nom);
  saveEmptyMatieres(vides);
  if(!matieresConfig[nom]) matieresConfig[nom] = {};
  const dates = loadMatieresVidesDates();
  dates[nom] = creeLe || new Date().toISOString();
  ppEcrire('cartes-matieres-vides-dates', JSON.stringify(dates));
  const sup = loadMatieresSupprimees();
  if(nom in sup){ delete sup[nom]; ppEcrire('cartes-matieres-supprimees', JSON.stringify(sup)); }
}
/* Une matière cesse d'être "vide" dès qu'elle a une carte : on la retire
   de la liste dédiée (elle continue d'exister via ses cartes). */
function clearEmptyMatiereIfHasCards(nom){
  if(CARDS.some(c => (c.matiere || 'Sans matière') === nom)){
    const vides = loadEmptyMatieres().filter(m => m !== nom);
    saveEmptyMatieres(vides);
  }
}

/* ---------------- Renommer / supprimer une matière entière ---------------- */
/* Renomme une matière partout : cartes (overlay local), config (dates de
   contrôle), matières vides, filtre actif, puis recalcule le planning. */
function renameMatiere(ancienNom, nouveauNom){
  nouveauNom = String(nouveauNom || '').trim();
  if(!nouveauNom || nouveauNom === ancienNom) return;

  // Cartes du fichier + importées : on met à jour en mémoire et on écrit
  // un overlay pour chaque carte du fichier source (les cartes importées
  // sont réécrites directement dans leur stockage local).
  // Renommer est une vraie action de l'utilisateur : chaque carte reçoit un nouvel horodatage, sinon la synchro
  // ne transmet jamais le nouveau nom (l'autre appareil renverrait l'ancien et la matière se scinderait).
  const iso = new Date().toISOString();
  const imported = loadImportedCards();
  let importedTouched = false;
  for(const c of imported){
    if((c.matiere || 'Sans matière') === ancienNom){ c.matiere = nouveauNom; c.derniereModification = iso; importedTouched = true; }
  }
  if(importedTouched) saveImportedCards(imported);

  const patches = {};
  for(const c of CARDS){
    if((c.matiere || 'Sans matière') === ancienNom){
      c.matiere = nouveauNom;
      c.derniereModification = iso;
      patches[c.id] = { matiere: nouveauNom, derniereModification: iso };
    }
  }
  saveLocalOverlayLot(patches);

  // Config (date de contrôle) : transfère l'entrée existante vers le nouveau nom.
  if(matieresConfig[ancienNom]){
    matieresConfig[nouveauNom] = { ...(matieresConfig[nouveauNom] || {}), ...matieresConfig[ancienNom] };
    delete matieresConfig[ancienNom];
    if(matieresConfig[nouveauNom].dateControle){
      saveLocalDateControle(nouveauNom, matieresConfig[nouveauNom].dateControle);
    }
    saveLocalDateControle(ancienNom, null);
    const overlay = ppLireJSON('cartes-datecontrole-overlay', {}, ppEstObjet);
    delete overlay[ancienNom];
    ppEcrire('cartes-datecontrole-overlay', JSON.stringify(overlay));
  }

  // Archivage : l'overlay local est indexé par nom, il doit suivre le renommage
  // (sinon au rechargement l'ancien nom revient en matière fantôme archivée
  // et la matière renommée redevient active).
  {
    const ov = loadLocalArchiveOverlay();
    if(ov[ancienNom]){
      delete ov[ancienNom];
      ov[nouveauNom] = true;
      ppEcrire('cartes-archive-overlay', JSON.stringify(ov));
    }
  }

  // Matière vide (sans carte) : renomme l'entrée si présente (l'ancien nom compte comme supprimé pour la synchro).
  const vides = loadEmptyMatieres();
  const idxVide = vides.indexOf(ancienNom);
  if(idxVide !== -1){
    vides[idxVide] = nouveauNom;
    saveEmptyMatieres([...new Set(vides)]);
    noterMatiereSupprimee(ancienNom);
    const dates = loadMatieresVidesDates();
    dates[nouveauNom] = new Date().toISOString();
    ppEcrire('cartes-matieres-vides-dates', JSON.stringify(dates));
    const sup = loadMatieresSupprimees();
    if(nouveauNom in sup){ delete sup[nouveauNom]; ppEcrire('cartes-matieres-supprimees', JSON.stringify(sup)); }
  }

  if(matiereFilter === ancienNom) matiereFilter = nouveauNom;
  recalcPlanning();
  saveLocalPlanning();
}

/* Supprime une matière et toutes ses cartes (fichier + importées), sa config
   et son entrée "vide" éventuelle. */
function deleteMatiereCompletement(nom){
  const idsASupprimer = CARDS.filter(c => (c.matiere || 'Sans matière') === nom).map(c => c.id);
  saveLocalDeleteLot(idsASupprimer);
  // Sans tombstone, l'autre appareil garderait les cartes et les renverrait : elles reviendraient ici.
  saveTombstonesLot(idsASupprimer);
  noterMatiereSupprimee(nom);
  CARDS = CARDS.filter(c => (c.matiere || 'Sans matière') !== nom);

  const imported = loadImportedCards().filter(c => (c.matiere || 'Sans matière') !== nom);
  saveImportedCards(imported);

  delete matieresConfig[nom];
  saveLocalDateControle(nom, null);
  const overlay = ppLireJSON('cartes-datecontrole-overlay', {}, ppEstObjet);
  delete overlay[nom];
  ppEcrire('cartes-datecontrole-overlay', JSON.stringify(overlay));

  const vides = loadEmptyMatieres().filter(m => m !== nom);
  saveEmptyMatieres(vides);

  // Archivage : sans ce nettoyage, la matière supprimée réapparaît (vide) au rechargement.
  saveLocalArchiveMatiere(nom, false);

  if(matiereFilter === nom) matiereFilter = 'toutes';
  recalcPlanning();
  saveLocalPlanning();
}

function openRenameMatiere(nom){
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeRenameMatiere()">
      <div class="modal-sheet">
        <div class="modal-title">Renommer la matière</div>
        <div class="modal-field">
          <label>Nouveau nom</label>
          <input type="text" id="rename-matiere-input" onkeydown="if(event.key==='Enter'){event.preventDefault(); saveRenameMatiere(this.dataset.ancien);}" data-ancien="${escapeHtml(nom)}" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="done" data-lpignore="true" data-1p-ignore data-form-type="other" value="${escapeHtml(nom)}">
        </div>
        <div class="modal-actions">
          <button class="modal-cancel" onclick="closeRenameMatiere()">Annuler</button>
          <button class="modal-save" onclick="saveRenameMatiere('${escapeJsAttr(nom)}')">Renommer</button>
        </div>
      </div>
    </div>
  `;
  setTimeout(() => {
    const el = document.getElementById('rename-matiere-input');
    if(el){ el.focus(); el.select(); }
  }, 50);
}
function closeRenameMatiere(){
  document.getElementById('modal-root').innerHTML = '';
}
function saveRenameMatiere(ancienNom){
  const nouveauNom = document.getElementById('rename-matiere-input').value.trim();
  if(!nouveauNom || nouveauNom === ancienNom){ closeRenameMatiere(); return; }
  const autresMatieres = getMatieres().filter(m => m !== ancienNom);
  if(autresMatieres.includes(nouveauNom)){
    const confirme = confirm(`« ${nouveauNom} » existe déjà. Fusionner « ${ancienNom} » dedans ?`);
    if(!confirme) return;
  }
  renameMatiere(ancienNom, nouveauNom);
  closeRenameMatiere();
  if(activeTab === 'study') buildQueue();
  render();
  if(activeTab === 'planning') renderPlanning();
}

function openDeleteMatiereConfirm(nom){
  const nb = CARDS.filter(c => (c.matiere || 'Sans matière') === nom).length;
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeDeleteMatiereConfirm()">
      <div class="modal-sheet">
        <div class="modal-title">Supprimer « ${escapeHtml(nom)} » ?</div>
        <div style="color:var(--muted); font-size:0.9rem; line-height:1.5; margin-bottom:4px;">
          ${nb > 0 ? `${nb} carte${nb>1?'s':''} ser${nb>1?'ont':'a'} définitivement supprimée${nb>1?'s':''}, ` : ''}ainsi que sa date de contrôle. Cette action est irréversible.
        </div>
        <div class="modal-actions">
          <button class="modal-cancel" onclick="closeDeleteMatiereConfirm()">Annuler</button>
          <button class="modal-save" style="background:var(--bad);" onclick="confirmDeleteMatiere('${escapeJsAttr(nom)}')">Supprimer tout</button>
        </div>
      </div>
    </div>
  `;
}
function closeDeleteMatiereConfirm(){
  document.getElementById('modal-root').innerHTML = '';
}
function confirmDeleteMatiere(nom){
  deleteMatiereCompletement(nom);
  closeDeleteMatiereConfirm();
  if(activeTab === 'study') buildQueue();
  render();
  if(activeTab === 'planning') renderPlanning();
}
function saveLocalPlanning(){
  ppEcrire('cartes-planning', JSON.stringify(planning));
}
function loadLocalPlanning(){
  return ppLireJSON('cartes-planning', null, Array.isArray);
}
function loadImportedCards(){
  // Valeur illisible ou de mauvais type : liste vide, et le texte d'origine est mis de côté (« cartes-imported-illisible »).
  return ppLireJSON('cartes-imported', [], Array.isArray).filter(c => ppEstObjet(c) && typeof c.id === 'string' && c.id);
}
/* Renvoie false si l'écriture a échoué (stockage plein : ppEcrire a déjà prévenu l'utilisateur). */
function saveImportedCards(cards){
  return ppEcrire('cartes-imported', JSON.stringify(cards));
}

/* ---------------- Images des cartes (v121) ----------------
   Une carte peut porter une image côté question (`imageQuestion`) et/ou côté réponse (`imageReponse`) : une URL
   `data:image/jpeg;base64,…` réduite (côté le plus long 720 px, visée ≤ ~90 000 caractères), stockée DANS la carte
   → elle suit toute seule l'export JSON, la synchro, la sauvegarde HTML et le partage. Absente = pas d'image.
   Limite : localStorage (~5 Mo pour tout le site) → plafond de 4,2 M de caractères au total (ppImgPlace). */
const IMG_COTE_MAX = 720;
const IMG_CARS_VISES = 90000;
const IMG_BUDGET_CARS = 4200000;
const MSG_IMG_PLEIN = "Plus de place pour les images sur cet appareil. Retire-en une ancienne d'abord.";
const PP_IMG_IC = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>';
let iaImgBanque = [];   // photos données à l'IA, réduites (index 0 = « Image 1 »), '' si illisible
let ppImgOuvert = null; // '<ctx>|<cote>' dont le panneau « une de tes photos » est ouvert
let ppImgPerdues = 0;   // images écartées faute de place au dernier ajout (affiché dans le toast)

function ppImgValide(v){ return typeof v === 'string' && v.length < 150000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(v); }
function ppImgPatch(src){ return { imageQuestion: ppImgValide(src && src.imageQuestion) ? src.imageQuestion : null, imageReponse: ppImgValide(src && src.imageReponse) ? src.imageReponse : null }; }
function ppEstPhoto(f){ return !!f && f.texte === undefined && /^image\//.test(f.mimeType || ''); }
function ppBlobDepuisBase64(b64, mime){
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: mime });
}
/* Réduit une image (File/Blob) en data URL JPEG légère. Lève une erreur si le navigateur ne sait pas la lire. */
async function ppImgReduire(blob){
  const bmp = await createImageBitmap(blob, { imageOrientation: 'from-image' });
  let cote = IMG_COTE_MAX, q = 0.72, url = '';
  try{
    for(let i = 0; i < 4; i++){
      const ech = Math.min(1, cote / Math.max(bmp.width, bmp.height));
      const w = Math.max(1, Math.round(bmp.width * ech)), h = Math.max(1, Math.round(bmp.height * ech));
      // v123 : réduction par paliers (÷2 à chaque fois) + lissage « high » : image plus nette à poids égal
      let src = bmp, sw = bmp.width, sh = bmp.height, tmp = null;
      while(sw / 2 >= w && sh / 2 >= h){
        const nw = Math.max(w, Math.round(sw / 2)), nh = Math.max(h, Math.round(sh / 2));
        const c2 = document.createElement('canvas'); c2.width = nw; c2.height = nh;
        const x2 = c2.getContext('2d'); x2.imageSmoothingEnabled = true; x2.imageSmoothingQuality = 'high'; x2.drawImage(src, 0, 0, nw, nh);
        if(tmp){ tmp.width = tmp.height = 0; }
        tmp = c2; src = c2; sw = nw; sh = nh;
      }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h);
      cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high'; cx.drawImage(src, 0, 0, w, h);
      if(tmp){ tmp.width = tmp.height = 0; }
      url = cv.toDataURL('image/jpeg', q); cv.width = cv.height = 0;
      if(url.length <= IMG_CARS_VISES) break;
      cote = Math.round(cote * 0.8); q = Math.max(0.5, q - 0.08);
    }
  }finally{ if(bmp.close) bmp.close(); }
  return url;
}
function ppStockageUtilise(){
  let n = 0;
  try{ for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); n += k.length + (localStorage.getItem(k) || '').length; } }catch(e){}
  return n;
}
function ppImgPlace(url, retire){ return ppStockageUtilise() + (url || '').length - (retire || 0) <= IMG_BUDGET_CARS; }
/* Avant un ajout en lot : écarte (en partant de la fin) les images qui ne tiendraient pas. Renvoie le nombre écarté. */
function ppImgAjusterBudget(items){
  let reste = IMG_BUDGET_CARS - ppStockageUtilise() - items.length * 3000, perdues = 0;
  items.forEach(it => ['imageQuestion', 'imageReponse'].forEach(ch => {
    if(!it[ch]) return;
    if(it[ch].length <= reste) reste -= it[ch].length; else { it[ch] = null; perdues++; }
  }));
  return perdues;
}
/* Écrit les images d'une carte existante (fiche) : dans la carte importée si elle existe (une seule copie), sinon en surcouche. */
function ppImgEnregistrer(id, iq, ir){
  const patch = { imageQuestion: iq || null, imageReponse: ir || null };
  const imp = loadImportedCards(), ci = imp.find(c => c.id === id);
  if(ci){ Object.assign(ci, patch); saveImportedCards(imp); ppOverlayRetirerImages(id); }
  else saveLocalOverlay(id, patch);
}
function ppOverlayRetirerImages(id){
  try{
    const ov = ppLireJSON('cartes-overlay', {}, ppEstObjet);
    if(ppEstObjet(ov[id]) && ('imageQuestion' in ov[id] || 'imageReponse' in ov[id])){
      delete ov[id].imageQuestion; delete ov[id].imageReponse;
      ppEcrire('cartes-overlay', JSON.stringify(ov));
    }
  }catch(e){}
}

/* --- Éditeur d'image d'une carte : 'man' (écrire une carte), 'fi' (modifier une fiche), 'pv:<i>' (aperçu IA, carte i) --- */
function ppImgCible(ctx){
  if(ctx === 'man') return ppMan;
  if(ctx === 'fi') return ppFi;
  if(String(ctx).indexOf('pv:') === 0) return iaCartesPreview ? (iaCartesPreview.cartes[parseInt(String(ctx).slice(3), 10)] || null) : null;
  return null;
}
function ppImgChamp(cote){ return cote === 'q' ? 'imageQuestion' : 'imageReponse'; }
function ppImgId(ctx){ return String(ctx).replace(/[^a-zA-Z0-9]/g, '-'); }
function ppImgSlotInner(ctx, cote){
  const cible = ppImgCible(ctx); if(!cible) return '';
  const img = cible[ppImgChamp(cote)] || '', nom = cote === 'q' ? 'de la question' : 'de la réponse';
  if(!img) return `<button type="button" class="pp-imgchip" aria-label="Image ${nom}" onclick="ppImgChoisir('${ctx}','${cote}')">${PP_IMG_IC}Image</button>`;
  return `<span class="pp-imgchip has"><img class="pp-imgth" src="${img}" alt="" onclick="ppImgChoisir('${ctx}','${cote}')"><span onclick="ppImgChoisir('${ctx}','${cote}')">Image</span><button type="button" class="pp-imgx" aria-label="Retirer l'image" onclick="ppImgRetirer('${ctx}','${cote}')">×</button></span>`;
}
function ppImgPanneauHtml(ctx, cote){
  const cible = ppImgCible(ctx), img = cible ? (cible[ppImgChamp(cote)] || '') : '';
  const vignettes = iaImgBanque.map((b, k) => b ? `<img src="${b}" alt="Photo ${k + 1}" class="${b === img ? 'on' : ''}" onclick="ppImgDeBanque('${ctx}','${cote}',${k})">` : '').join('');
  return `<p class="pp-imgcap">Une de tes photos :</p><div class="pp-imgbank">${vignettes}</div><div class="pp-imgacts"><button type="button" class="pp-imgbtn" onclick="ppImgFichier('${ctx}','${cote}')">Une autre image…</button><button type="button" class="pp-imgbtn" onclick="ppImgChoisir('${ctx}','${cote}')">Fermer</button></div>`;
}
function ppImgSlotWrap(ctx, cote){ return `<div class="pp-imgslot" id="pp-imgs-${ppImgId(ctx)}-${cote}">${ppImgSlotInner(ctx, cote)}</div>`; }
function ppImgPanelWrap(ctx, cote){
  const ouvert = ppImgOuvert === ctx + '|' + cote;
  return `<div class="pp-imgpanel" id="pp-imgp-${ppImgId(ctx)}-${cote}" style="${ouvert ? '' : 'display:none'}">${ouvert ? ppImgPanneauHtml(ctx, cote) : ''}</div>`;
}
/* Cadre d'un côté de carte : le champ texte ET le bouton « Image » dans le même cadre, panneau « Une de tes photos » dessous. Utilisé par 'man', 'fi' et 'pv:<i>'. */
function ppChampImg(ctx, cote, textareaHtml){
  return `<div class="pp-fieldbox">${textareaHtml}<div class="pp-fbar">${ppImgSlotWrap(ctx, cote)}</div></div>${ppImgPanelWrap(ctx, cote)}`;
}
function ppImgRafraichir(ctx, cote){
  const sl = document.getElementById('pp-imgs-' + ppImgId(ctx) + '-' + cote);
  if(sl) sl.innerHTML = ppImgSlotInner(ctx, cote);
  const pa = document.getElementById('pp-imgp-' + ppImgId(ctx) + '-' + cote);
  if(pa){ const ouvert = ppImgOuvert === ctx + '|' + cote; pa.innerHTML = ouvert ? ppImgPanneauHtml(ctx, cote) : ''; pa.style.display = ouvert ? '' : 'none'; }
}
/* Toucher une pastille : si l'IA a reçu des photos (aperçu), on propose d'abord ces photos ; sinon on ouvre directement le choix d'une image. */
function ppImgChoisir(ctx, cote){
  if(String(ctx).indexOf('pv:') === 0 && iaImgBanque.some(Boolean)){
    const cle = ctx + '|' + cote, ancien = ppImgOuvert;
    ppImgOuvert = (ancien === cle) ? null : cle;
    if(ancien && ancien !== cle){ const a = ancien.split('|'); ppImgRafraichir(a[0], a[1]); }
    ppImgRafraichir(ctx, cote);
    return;
  }
  ppImgFichier(ctx, cote);
}
function ppImgFichier(ctx, cote){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none';
  inp.onchange = async () => { const f = inp.files && inp.files[0]; inp.remove(); if(f) await ppImgAppliquer(ctx, cote, f); };
  inp.oncancel = () => inp.remove();
  document.body.appendChild(inp);
  inp.click();
}
async function ppImgAppliquer(ctx, cote, file){
  let url = '';
  try{ url = await ppImgReduire(file); }
  catch(e){ ppToast("Impossible de lire cette image. Essaie une photo JPG ou PNG."); return; }
  ppImgPoser(ctx, cote, url, true);
}
function ppImgPoser(ctx, cote, url, fermer){
  const cible = ppImgCible(ctx); if(!cible) return;
  const champ = ppImgChamp(cote), ancienne = cible[champ] || '';
  if(url && url !== ancienne && !ppImgPlace(url, ctx === 'fi' ? ancienne.length : 0)){ ppToast(MSG_IMG_PLEIN); return; }
  cible[champ] = url || '';
  if(fermer && ppImgOuvert === ctx + '|' + cote) ppImgOuvert = null;
  ppImgRafraichir(ctx, cote);
  if(cote === 'q') ppIvGris(ctx);
}
function ppImgRetirer(ctx, cote){ ppImgPoser(ctx, cote, '', true); }
function ppImgDeBanque(ctx, cote, k){ const url = iaImgBanque[k]; if(url) ppImgPoser(ctx, cote, url, true); }
/* IA : envoie les fichiers à Gemini en numérotant les photos (« Image 1 », « Image 2 »…) ; `debut` = nb de photos déjà numérotées. */
function ppPartsFichiers(liste, debut){
  const parts = []; let n = debut || 0;
  (liste || []).forEach(f => {
    if(f.texte !== undefined) parts.push({ text: `\n\nDocument « ${f.name} » :\n${f.texte}` });
    else if(ppEstPhoto(f)){ n++; parts.push({ text: `\n\nImage ${n} :` }); parts.push({ inline_data: { mime_type: f.mimeType, data: f.dataBase64 } }); }
    else parts.push({ inline_data: { mime_type: f.mimeType, data: f.dataBase64 } });
  });
  return { parts, total: n };
}
const PROMPT_IMAGES = `Images jointes : elles sont numérotées (« Image 1 », « Image 2 »…). Tu peux illustrer une carte avec l'une d'elles, mais SEULEMENT si l'image est une vraie illustration (carte géographique, schéma, figure, graphique, photo, tableau) utile ou nécessaire à cette carte. Jamais pour une photo de simple texte, de notes ou de cours écrit : celles-ci servent uniquement à lire le contenu. Pour illustrer une carte, ajoute le champ facultatif "imageQuestion" (l'image s'affiche avec la question) ou "imageReponse" (elle s'affiche avec la réponse), avec le NUMÉRO de l'image (un entier). Exemple de forme : { "question": "<question qui renvoie à l'illustration>", "reponse": "<réponse>", "imageQuestion": 2 }. Quand une image est attachée à la question, la question peut y renvoyer (« sur cette carte », « sur ce schéma »). N'ajoute ces champs que si tu es sûr de toi ; sinon ne les mets pas. Initiative : quand une image jointe montre une illustration que la carte exploite (la question porte sur ce qu'on y voit, ou la réponse est cette illustration), joins-la de ton propre chef, sans que l'utilisateur ait à le demander. En revanche, si le contenu évoque quelque chose qui aurait besoin d'une image mais qu'AUCUNE image jointe ne la montre, n'ajoute rien : ne cherche jamais d'image toi-même. Découpage : une photo est souvent une page de cours avec du texte autour. Si l'illustration n'en occupe qu'une partie, ajoute en plus "zoneImageQuestion" (ou "zoneImageReponse", selon le côté) : [ymin, xmin, ymax, xmax], quatre entiers de 0 à 1000 (0,0 = coin haut-gauche de la photo ; 1000,1000 = coin bas-droit). Cadre SERRÉ sur l'illustration seule, avec ses étiquettes, flèches et légende si elles en font partie, mais SANS le texte du cours, les titres, les marges ni les autres figures. Si la photo EST l'illustration (elle la remplit déjà), n'ajoute pas de zone. Si la photo contient plusieurs illustrations, donne la zone de celle qui correspond à la carte. Cette consigne complète le format JSON demandé plus haut.`;
async function ppImgBanqueAjouter(files){
  if(!iaImgBanque.src) iaImgBanque.src = [];   // v156 : photos d'origine (même numéro que la banque), pour pouvoir y découper une illustration
  for(const f of (files || [])){
    if(!ppEstPhoto(f)) continue;
    let url = '';
    try{ url = await ppImgReduire(ppBlobDepuisBase64(f.dataBase64, f.mimeType)); }catch(e){}
    iaImgBanque.push(url);
    iaImgBanque.src[iaImgBanque.length - 1] = f;
  }
}
/* v156 : zone [ymin, xmin, ymax, xmax] sur 0-1000 renvoyée par l'IA -> zone valide, ou null (photo entière). */
function ppZoneValide(z){
  if(!Array.isArray(z) || z.length !== 4) return null;
  const n = z.map(Number);
  if(n.some(v => !isFinite(v))) return null;
  const [y0, x0, y1, x1] = n.map(v => Math.max(0, Math.min(1000, v)));
  if(y1 - y0 < 40 || x1 - x0 < 40) return null;          // trop petite : sans doute une erreur
  if((y1 - y0) * (x1 - x0) > 920000) return null;        // presque toute la photo : on garde la photo entière
  return [y0, x0, y1, x1];
}
/* Découpe la zone dans la photo d'origine (marge de 1,5 %), puis réduit comme une photo. */
async function ppImgRogner(f, zone){
  const bmp = await createImageBitmap(ppBlobDepuisBase64(f.dataBase64, f.mimeType), { imageOrientation: 'from-image' });
  try{
    const M = 15;
    const y0 = Math.max(0, zone[0] - M), x0 = Math.max(0, zone[1] - M), y1 = Math.min(1000, zone[2] + M), x1 = Math.min(1000, zone[3] + M);
    const sx = Math.round(x0 / 1000 * bmp.width), sy = Math.round(y0 / 1000 * bmp.height);
    const sw = Math.max(1, Math.round((x1 - x0) / 1000 * bmp.width)), sh = Math.max(1, Math.round((y1 - y0) / 1000 * bmp.height));
    const ech = Math.min(1, 1600 / Math.max(sw, sh));
    const w = Math.max(1, Math.round(sw * ech)), h = Math.max(1, Math.round(sh * ech));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h);
    cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high'; cx.drawImage(bmp, sx, sy, sw, sh, 0, 0, w, h);
    const blob = await new Promise((ok, ko) => cv.toBlob(b => b ? ok(b) : ko(new Error('toBlob')), 'image/jpeg', 0.92));
    cv.width = cv.height = 0;
    return await ppImgReduire(blob);
  }finally{ if(bmp.close) bmp.close(); }
}
/* Remplace les numéros d'images renvoyés par l'IA (nImgQ / nImgR) par les vraies images de la banque. */
async function ppImgResoudre(cartes, garderRecherche){
  // v156 : si l'IA a donné une zone, on découpe l'illustration dans la photo d'origine ; sinon (ou en cas d'échec) photo entière.
  const resoudre = async (n, zone) => {
    if(!Number.isInteger(n)) return '';
    const entiere = iaImgBanque[n - 1];
    if(!entiere) return '';
    const z = ppZoneValide(zone), src = iaImgBanque.src && iaImgBanque.src[n - 1];
    if(z && src){ try{ const d = await ppImgRogner(src, z); if(d) return d; }catch(e){} }
    return entiere;
  };
  const sortie = [];
  for(const c of cartes){
    const out = { ...c };
    const q = await resoudre(c.nImgQ, c.zQ), r = await resoudre(c.nImgR, c.zR);
    delete out.nImgQ; delete out.nImgR; delete out.zQ; delete out.zR;
    if(!garderRecherche){ delete out.rechercheImage; delete out.rechercheCote; }   // v155 : seule la génération initiale cherche des images
    if(q) out.imageQuestion = q;
    if(r) out.imageReponse = r;
    sortie.push(out);
  }
  return sortie;
}

/* ================= v155 : images trouvées sur Wikimedia Commons =================
   L'IA n'ajoute JAMAIS d'image d'elle-même : seulement si le texte de l'utilisateur en demande explicitement.
   Elle écrit alors un mot-clé (`rechercheImage`) et le côté voulu (`rechercheCote`). L'app cherche sur Wikimedia
   Commons (API publique, sans clé), télécharge la miniature de la première image utilisable et la réduit comme une
   photo (ppImgReduire). L'image arrive dans l'aperçu : l'utilisateur la garde, la change ou la retire. */
const PROMPT_RECHERCHE_IMAGES = `Recherche d'images : par défaut, N'AJOUTE AUCUNE image et ne prends JAMAIS l'initiative d'en chercher. Ajoute le champ facultatif "rechercheImage" à une carte SEULEMENT si le texte de l'utilisateur demande explicitement une image, une illustration, une carte géographique, un schéma ou une photo pour ce sujet, et seulement pour les cartes concernées par cette demande. "rechercheImage" doit être PRÉCIS : 3 à 8 mots-clés (pas une phrase) qui combinent le sujet exact, le type d'image voulu (schéma, carte, photo, coupe, diagramme…), un détail qui distingue ce qu'on veut des sujets proches (époque, organe, région, vue, « légendé »…) et, si cela aide, un ou deux mots en anglais. Forme : "<sujet précis> <type d'image> <détail distinctif>". Ajoute aussi "rechercheCote" : "question" si l'image doit s'afficher avec la question, ou "reponse" si elle doit s'afficher avec la réponse. Maximum 6 cartes avec "rechercheImage" par réponse. Si une image jointe montre déjà ce qu'il faut, utilise-la (imageQuestion / imageReponse) au lieu de ce champ. Exemple de forme : { "question": "<question>", "reponse": "<réponse>", "rechercheImage": "<mot-clé 1> <mot-clé 2> <mot-clé 3> <mot-clé 4>", "rechercheCote": "question" }.`;
const IMG_RECHERCHE_MAX = 6;
const IMG_WIKI_API = 'https://commons.wikimedia.org/w/api.php';
async function ppFetchDelai(url, ms){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 10000);
  try{ return await fetch(url, { signal: ctl.signal }); }finally{ clearTimeout(t); }
}
/* Une recherche -> data URL réduite, ou '' si rien d'utilisable (aucun résultat, réseau, format non lisible). */
async function ppImgEssaiWikimedia(q){
  try{
    const url = IMG_WIKI_API + '?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=8&gsrsearch=' + encodeURIComponent(q)
      + '&prop=imageinfo&iiprop=url%7Cmime%7Csize&iiurlwidth=' + IMG_COTE_MAX;
    const rep = await ppFetchDelai(url, 10000);
    if(!rep.ok) return '';
    const data = await rep.json();
    const pages = data && data.query && data.query.pages ? Object.values(data.query.pages) : [];
    pages.sort((a, b) => (a.index || 0) - (b.index || 0));
    for(const p of pages){
      const ii = p.imageinfo && p.imageinfo[0];
      if(!ii || !ii.thumburl || !/^https:\/\/upload\.wikimedia\.org\//.test(ii.thumburl)) continue;
      if(!/^image\/(jpeg|png|webp|svg\+xml)$/.test(ii.mime || '')) continue;
      if((ii.width || 0) < 200 || (ii.height || 0) < 150) continue;
      try{
        const img = await ppFetchDelai(ii.thumburl, 12000);
        if(!img.ok) continue;
        const blob = await img.blob();
        if(blob.size > 8 * 1024 * 1024) continue;
        return await ppImgReduire(blob);
      }catch(e){ /* image suivante */ }
    }
  }catch(e){}
  return '';
}
/* Mots-clés précis d'abord ; si Wikimedia ne trouve rien (trop de mots = aucun résultat), on retente avec les 5 puis les 3 premiers mots. */
async function ppImgChercherWikimedia(mot){
  const mots = String(mot || '').replace(/\s+/g, ' ').trim().slice(0, 120).split(' ').filter(Boolean);
  if(!mots.length) return '';
  const essais = [mots.join(' ')];
  if(mots.length > 5) essais.push(mots.slice(0, 5).join(' '));
  if(mots.length > 3) essais.push(mots.slice(0, 3).join(' '));
  for(const q of essais){ const r = await ppImgEssaiWikimedia(q); if(r) return r; }
  return '';
}
/* Pour chaque carte portant `rechercheImage`, cherche l'image (en parallèle, 6 au plus) et la pose du bon côté.
   Efface toujours les champs de recherche. Renvoie { trouvees, ratees, perdues }. */
async function ppImgChercherPourCartes(cartes){
  const cibles = [];
  cartes.forEach(c => {
    const mot = typeof c.rechercheImage === 'string' ? c.rechercheImage.trim() : '';
    const cote = c.rechercheCote === 'reponse' ? 'imageReponse' : 'imageQuestion';
    delete c.rechercheImage; delete c.rechercheCote;
    if(mot && cibles.length < IMG_RECHERCHE_MAX && !c[cote]) cibles.push({ c, mot, cote });
  });
  if(!cibles.length) return { trouvees: 0, ratees: 0, perdues: 0 };
  const urls = await Promise.all(cibles.map(x => ppImgChercherWikimedia(x.mot)));
  let trouvees = 0, ratees = 0;
  cibles.forEach((x, i) => { if(urls[i]){ x.c[x.cote] = urls[i]; trouvees++; } else ratees++; });
  const perdues = ppImgAjusterBudget(cartes);
  return { trouvees, ratees, perdues };
}

/* ================= v122 : visionneuse d'image (agrandir au toucher) =================
   Toucher une image de carte (révision, fiche) ou de synthèse l'ouvre en grand : elle « s'envole » depuis sa place,
   pince / molette / double toucher pour zoomer, glisser pour déplacer, glisser vers le bas ou toucher à côté
   (ou ✕, Échap) pour fermer : elle retourne à sa place. Rien n'est stocké, rien ne modifie la carte. */
let ppZ = null;
function ppZoomOuvrir(src, depuis){

/* Compression proportionnelle des intervalles quand une date de contrôle
   approche (cf. décision : option A pour l'absence de date => intervalles
   fixes inchangés ; option 1 pour la compression => scaling global par un
   ratio temps dispo / temps idéal, jamais en dessous d'1 jour).

   de la carte) : c'est le temps qu'il faudrait, à partir de maintenant,
   pour dérouler tous les paliers restants avec les intervalles classiques.
   Sans quoi une carte déjà avancée fausserait le ratio pour toute la matière.

   MASTERED_PALIER (voir plus haut) — les intervalles au-delà (INTERVALS[5],
   INTERVALS[6] = 60 et 90 jours) ne servent qu'au cycle de révision APRÈS
   maîtrise, jamais pour l'atteindre. Le temps "idéal" pour une carte ne doit

   pas la somme des 7 intervalles (205 jours) — cette dernière ne correspond
   à rien de réel et déclenchait une compression massive et un statut "trop
   ric-rac" même quand le contrôle était en réalité largement tenable. */
const INTERVALS_CACHE = {};

function getIntervalsForMatiere(matiere){
  const cfg = matieresConfig[matiere];
  const dateControle = cfg && cfg.dateControle;
  const today = todayStr();
  if(!dateControle || dateControle < today) return INTERVALS;

  const cacheKey = matiere + '|' + dateControle + '|' + today;
  if(INTERVALS_CACHE[cacheKey]) return INTERVALS_CACHE[cacheKey];

  const tempsIdeal = INTERVALS.slice(1, MASTERED_PALIER + 1).reduce((a, b) => a + b, 0);
  const tempsDispo = Math.round((new Date(dateControle + "T00:00:00") - new Date(today + "T00:00:00")) / 86400000);

  let result;
  if(tempsDispo >= tempsIdeal){
    result = INTERVALS;
  } else {
    const ratio = Math.max(0, tempsDispo) / tempsIdeal;
    result = INTERVALS.map(i => Math.max(1, Math.round(i * ratio)));
  }
  INTERVALS_CACHE[cacheKey] = result;
  return result;
}

function clearIntervalsCache(){
  for(const k in INTERVALS_CACHE) delete INTERVALS_CACHE[k];
}

/* Date du jour et arithmétique de dates en HEURE LOCALE (jamais UTC) :

   du décalage — todayStr() renverrait encore "hier" pendant cette fenêtre. */
function todayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function addDays(dateStr, n){
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(y, m - 1, d); // construit en heure locale, pas UTC
  date.setDate(date.getDate() + n);
  const yy = date.getFullYear();
  const mm = String(date.getMonth() + 1).padStart(2, '0');
  const dd = String(date.getDate()).padStart(2, '0');
  return `${yy}-${mm}-${dd}`;
}

  if(!/[\u000c\u0008\t\r\n]/.test(t) || t.indexOf('$') < 0) return t;
  t = t.replace(/\u000c/g, '\\f').replace(/\u0008/g, '\\b');
  t = t.replace(/(\$[^$\n]*)\t/g, '$1\\t').replace(/(\$[^$\n]*)\r/g, '$1\\r');
  t = t.replace(/(\$[^$\n]*)\n(abla|eq(?![a-z])|otin|ot(?![a-z])|u(?![a-z])|e(?![a-z])|i(?![a-z]))/g, '$1\\n$2');
  return t;
}
function escapeJsAttr(str){
  // v153 (constat 32) : 1) chaîne JavaScript sûre, 2) puis échappement HTML, car le navigateur décode
  // l'attribut onclick="..." AVANT d'exécuter le JavaScript (sinon « &#39; » redevient « ' » et ferme la chaîne).
  return String(str == null ? '' : str)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/[\r\n\u2028\u2029]/g, ' ')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

/* ---------------- Similarité entre noms de matières (fusion) ---------------- */
function normaliserMatiere(nom){
  return String(nom || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // enlève les accents
    .toLowerCase().trim().replace(/\s+/g, ' ');
}
function levenshtein(a, b){
  const m = a.length, n = b.length;
  if(m === 0) return n;
  if(n === 0) return m;
  const prev = new Array(n + 1);
  const cur = new Array(n + 1);
  for(let j = 0; j <= n; j++) prev[j] = j;
  for(let i = 1; i <= m; i++){
    cur[0] = i;
    for(let j = 1; j <= n; j++){
      const cout = a[i-1] === b[j-1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + cout);
    }
    for(let j = 0; j <= n; j++) prev[j] = cur[j];
  }
  return prev[n];
}
/* Renvoie le nom exact d'une matière existante jugée "vraiment similaire"
   au nom proposé (même matière avec faute de frappe, variante d'accent/casse,
   ou l'une incluse dans l'autre), sinon null. Ignore l'égalité stricte
   (déjà gérée ailleurs, pas besoin de demander une fusion pour ça). */
/* Même matière à la casse / aux accents / aux espaces près (« histoire » vs « Histoire ») :
   on réutilise le nom existant au lieu de créer une 2e matière. */
function nomMatiereCanonique(nom, existantes){
  const n = normaliserMatiere(nom);
  if(!n) return nom;
  if(existantes.includes(nom)) return nom;
  const trouve = existantes.find(e => normaliserMatiere(e) === n);
  return trouve || nom;
}
function trouverMatiereSimilaire(nomPropose, matieresExistantes){
  const n1 = normaliserMatiere(nomPropose);
  if(!n1) return null;
  for(const existante of matieresExistantes){
    const n2 = normaliserMatiere(existante);
    if(n2 === n1) return null; // déjà identique, pas une "fusion" à proposer
    if(n2.length >= 3 && (n1.includes(n2) || n2.includes(n1))) return existante;
    const dist = levenshtein(n1, n2);
    // Noms courts (« Géo » / « Bio ») : 2 lettres d'écart = autre matière, pas une faute de frappe.
    const seuil = Math.max(1, Math.min(2, Math.floor(Math.min(n1.length, n2.length) / 4)));
    if(dist <= seuil) return existante;
  }
  return null;
}

function getStreakData(){
  const defaut = { count: 0, lastDate: null };
  try{
    // 'null', un nombre, une chaîne ou un objet abîmé (import, synchro) ne doivent jamais faire planter l'accueil.
    const s = JSON.parse(localStorage.getItem('cartes-streak') || 'null');
    if(!s || typeof s !== 'object' || Array.isArray(s)) return defaut;
    return {
      count: (Number.isFinite(s.count) && s.count >= 0) ? Math.floor(s.count) : 0,
      lastDate: typeof s.lastDate === 'string' ? s.lastDate : null
    };
  }catch(e){ return defaut; }
}
/* Un jour ne casse le streak que s'il y avait au moins une carte due ce
   jour-là et qu'elle n'a pas été révisée (le jour n'est ni aujourd'hui ni
   dans le futur, donc "due" veut dire prochaineRevision <= ce jour, sans
   avoir été repoussée depuis par une révision plus tardive). On regarde si
   une carte existante a prochaineRevision <= jour ET palier sous le
   plafond "maîtrisé" : si aucune carte n'était due, journée neutre. */
function auMoinsUneCarteDueLe(jour){
  // Lissage des retards : des cartes en retard ont pu être décalées vers l'avant, donc
  // elles ne comptent plus « dues » ce jour-là. Le marqueur garde la date de la plus
  // vieille carte en retard AVANT décalage, pour que la série casse comme avant.
  try{
    const m = localStorage.getItem('lissage-marqueur-retard');
    if(m && m <= jour) return true;
  }catch(e){}
  return CARDS.some(c => (c.palier || 0) < MASTERED_PALIER && (c.prochaineRevision || jour) <= jour);
}
function bumpStreak(){
  const today = todayStr();
  let s = getStreakData();
  if(s.lastDate === today) return s;
  if(!s.lastDate){
    s.count = 1;
  } else if(s.lastDate === addDays(today, -1)){
    s.count += 1;
  } else {
    /* Un ou plusieurs jours sans révision entre lastDate et aujourd'hui :
       le streak ne casse que si un de ces jours avait vraiment des cartes
       dues. Sinon on continue simplement la série. */
    let casse = false;
    let jour = addDays(s.lastDate, 1);
    while(jour < today){
      if(auMoinsUneCarteDueLe(jour)){ casse = true; break; }
      jour = addDays(jour, 1);
    }
    s.count = casse ? 1 : s.count + 1;
  }
  s.lastDate = today;
  ppEcrire('cartes-streak', JSON.stringify(s));
  try{ localStorage.removeItem('lissage-marqueur-retard'); }catch(e){} // le marqueur a servi
  return s;
}
/* Série À AFFICHER : même règle que bumpStreak (sans rien écrire). Si un des jours sautés avait des cartes dues,
   la série est déjà perdue : on affiche 0 au lieu d'attendre la prochaine réponse. Sinon elle continue. */
function getStreakAffichee(){
  const s = getStreakData();
  if(!s.lastDate || s.count === 0) return s.count;
  const today = todayStr();
  if(s.lastDate >= addDays(today, -1)) return s.count;
  let jour = addDays(s.lastDate, 1);
  for(let i = 0; jour < today; i++){
    if(i > 400 || auMoinsUneCarteDueLe(jour)) return 0;
    jour = addDays(jour, 1);
  }
  return s.count;
}
let _lastStreakShown = null;
function renderStreak(){
  const el = document.getElementById('streak-num');
  if(!el) return; // pill masqué (icône réglages affichée à la place, voir renderTopbarRight)
  const count = getStreakAffichee();
  el.textContent = count;
  const pill = el.closest('.pp-streak');
  if(pill) pill.classList.toggle('is-zero', count === 0);
  if(_lastStreakShown !== null && count !== _lastStreakShown){
    if(pill){
      pill.classList.remove('bump');
      void pill.offsetWidth;
      pill.classList.add('bump');
    }
  }
  _lastStreakShown = count;
}

  { id:'study', icon:'cards', label:'Réviser' },

/* Écrans où l'icône réglages remplace le streak dans la topbar (voir
   renderTopbarRight) : des écrans de gestion de contenu, pas de révision au
   quotidien — le streak y est moins utile qu'un accès rapide aux réglages. */
const TOPBAR_SETTINGS_TABS = ['add', 'browse', 'settings'];

function switchTab(tab){
  if(tab === 'planning' && ppWide()) tab = 'study'; // grand écran : le planning est directement sur l'accueil
  if(tab === 'add' && activeTab !== 'add') ppAddReset();
  if(tab === 'planning' && activeTab !== 'planning') ppPlanReset();
  if(tab === 'browse' && activeTab !== 'browse') ppBrowseReset();
  ppFresh = (tab !== activeTab) || ppFresh;
  activeTab = tab;
  quizActive = false;
  ppSesHide();
  renderTopbarRight();
  // Le verrou anti-scroll de l'accueil (voir renderStudy) ne concerne que
  // l'onglet Réviser ; en quittant l'onglet, on le retire toujours — s'il
  // faut le reposer (retour sur l'accueil idle), renderStudy() s'en charge.
  document.body.classList.remove('lock-home-scroll');
  document.body.classList.remove('in-session');
  const tb = document.getElementById('tabbar-root');
  if(tb) tb.classList.remove('tabbar-hidden');
  document.getElementById('tab-study').style.display = tab === 'study' ? 'block' : 'none';
  document.getElementById('tab-browse').style.display = tab === 'browse' ? 'block' : 'none';
  document.getElementById('tab-planning').style.display = tab === 'planning' ? 'block' : 'none';
  document.getElementById('tab-quiz').style.display = 'none';
  document.getElementById('tab-add').style.display = tab === 'add' ? 'block' : 'none';
  document.getElementById('tab-settings').style.display = tab === 'settings' ? 'block' : 'none';
  if(tab === 'study'){ studySessionActive = false; buildQueue(); }
  if(tab === 'add') renderAdd();
  if(tab === 'planning') renderPlanning();
  if(tab === 'settings') renderSettings();
  render();
  renderTabbar();
  window.scrollTo({ top:0, behavior:'instant' in window ? 'instant' : 'auto' });
  reglerEntreeOnglet(tab);
}

/* Entrée animée à l'ouverture d'un écran seulement (voir .tab-settled en CSS). */

function getMatieres(){
  const fromCards = CARDS.map(c => c.matiere || 'Sans matière');
  const fromConfig = Object.keys(matieresConfig || {});
  return [...new Set([...fromCards, ...fromConfig])].sort();
}

/* Couleur stable par matière : un hash simple du nom pointe toujours vers la
   même teinte dans une palette pensée pour rester dans l'esprit chaud/papier
   de l'app (pas de bleu/violet vifs qui jureraient avec l'accent terracotta).
   Même matière = même couleur partout (pastille de filtre, tag sur la carte). */
const MATIERE_PALETTE = [
  '#6bc1ff', /* bleu */
  '#b39bff', /* violet */
  '#ffd93d', /* jaune */
  '#2ed8a3', /* vert menthe */
  '#ff4d7a', /* rose */
  '#ffb020', /* ambre */
  '#ff6b3d', /* orange (= accent) */
  '#7fe3e0', /* turquoise */
];
function couleurMatiere(nom){
  const s = String(nom || '');
  let hash = 0;
  for(let i=0;i<s.length;i++){ hash = (hash * 31 + s.charCodeAt(i)) >>> 0; }
  return MATIERE_PALETTE[hash % MATIERE_PALETTE.length];
}

/* Matières non archivées : celles qu'on propose partout où on révise, filtre
   ou crée des cartes. Une matière archivée reste consultable (Parcourir,
   Planning > Dates de contrôle) mais n'encombre plus le quotidien. */
function getMatieresActives(){
  return getMatieres().filter(m => !(matieresConfig[m] && matieresConfig[m].archive));
}

function toggleArchiveMatiere(nom){
  if(!matieresConfig[nom]) matieresConfig[nom] = {};
  matieresConfig[nom].archive = !matieresConfig[nom].archive;
  saveLocalArchiveMatiere(nom, matieresConfig[nom].archive);
  if(matiereFilter === nom) matiereFilter = 'toutes';
  recalcPlanning();
  saveLocalPlanning();
  renderPlanning();
  if(activeTab === 'study'){ buildQueue(); render(); }
}

function loadLocalArchiveOverlay(){
  return ppLireJSON('cartes-archive-overlay', {}, ppEstObjet);
}
function saveLocalArchiveMatiere(nom, archive){
  const overlay = loadLocalArchiveOverlay();
  if(archive) overlay[nom] = true; else delete overlay[nom];
  ppEcrire('cartes-archive-overlay', JSON.stringify(overlay));
}
function applyLocalArchiveOverlay(){
  const overlay = loadLocalArchiveOverlay();
  Object.keys(overlay).forEach(m => {
    if(!matieresConfig[m]) matieresConfig[m] = {};
    matieresConfig[m].archive = true;
  });
}

/* Contrôle passé → matière archivée. Le lendemain de la date de contrôle, la matière est archivée
   (ses cartes sortent des révisions) ET sa date est retirée : sinon, en la désarchivant, elle serait
   aussitôt re-archivée. Désarchiver est toujours possible (Planning > matière > Gérer la matière) ;
   il faudra alors saisir une nouvelle date si besoin. Ne touche JAMAIS aux cartes (palier, dates,
   derniereModification). Retourne les noms des matières archivées. */
function archiverMatieresControlePasse(){
  const today = todayStr(), faites = [];
  for(const [m, cfg] of Object.entries(matieresConfig)){
    if(!cfg || !cfg.dateControle || cfg.dateControle >= today || cfg.archive) continue;
    cfg.archive = true;
    saveLocalArchiveMatiere(m, true);
    cfg.dateControle = null;
    saveLocalDateControle(m, null);
    if(matiereFilter === m) matiereFilter = 'toutes';
    faites.push(m);
  }
  if(faites.length) clearIntervalsCache();
  return faites;
}
function messageControlePasse(noms){
  return noms.length === 1 ? 'Contrôle passé · ' + noms[0] + ' archivée'
                           : 'Contrôles passés · ' + noms.length + ' matières archivées';
}
/* Version « app ouverte » : archive, recalcule et rafraîchit (pas pendant une session ou un quiz). */
function appliquerArchivageControlesPasses(delaiToast){
  if(studySessionActive || quizActive) return 0;
  const noms = archiverMatieresControlePasse();
  if(!noms.length) return 0;
  recalcPlanning();
  saveLocalPlanning();
  try{ renderPlanning(); render(); renderStreak(); }catch(e){}
  setTimeout(() => { try{ ppToast(messageControlePasse(noms)); }catch(e){} }, delaiToast || 0);
  return noms.length;
}

/* Cartes à réviser, en tenant compte du mode ('due', 'all' ou 'today') et du
   filtre matière. 'today' = cartes déjà révisées aujourd'hui (derniereRevision
   === today) : sert au bouton "Revoir", pour rejouer ce qui vient d'être fait
   quand il n'y a plus rien de dû — une vraie révision comme les autres,
   answer()/nextPalier() ne dépendent pas de studyMode donc les paliers/dates
   avancent normalement. */
function getBaseCards(){
  const today = todayStr();
  let base;
  if(studyMode === 'all'){
    base = CARDS.slice();
  } else if(studyMode === 'today'){
    base = CARDS.filter(c => c.derniereRevision === today);
  } else {
    base = CARDS.filter(c => (c.prochaineRevision || today) <= today);
  }
  if(matiereFilter !== 'toutes'){
    base = base.filter(c => (c.matiere || 'Sans matière') === matiereFilter);
  } else {
    // Une matière archivée n'est jamais mélangée dans "Tout réviser" — il
    // faut la désarchiver pour la reprendre.
    const actives = getMatieresActives();
    base = base.filter(c => actives.includes(c.matiere || 'Sans matière'));
  }
  return base;
}

/* ---------------- Rappels légers de répétition espacée ----------------
   Deux petits rappels mélangés aux cartes du jour (session 'due' seulement) :
   - "surprise" : quelques cartes MAÎTRISÉES tirées au hasard, certains jours
     seulement (jour irrégulier) ;
   - "du lendemain" : environ 1 carte sur 3 vue pour la 1re fois et réussie
     du 1er coup, qui revient le lendemain.
   Un rappel est LÉGER : le réussir ne change ni le palier ni la date de
   prochaine révision (la carte n'est même pas modifiée). Le rater applique le
   comportement normal (rouge => palier 0 et demain ; orange comme d'habitude).
   Le tirage du jour est stocké (sinon il changerait à chaque buildQueue).
   Tout est stocké dans 2 clés localStorage à part, volontairement PAS dans
   l'export/la synchro : ce sont des données du jour, sans effet sur
   la progression, donc aucun risque avec les anciennes sauvegardes. */
const RAPPELS_SURPRISE_MIN = 3;
const RAPPELS_SURPRISE_MAX = 5;
const RAPPELS_SURPRISE_PROBA_JOUR = 0.5; // 1 jour sur 2 environ a un rappel surprise
const RAPPELS_LENDEMAIN_PROBA = 1 / 3;
const RAPPELS_LENDEMAIN_MAX = 5;
const RAPPELS_TOTAL_MAX = 10;
const RAPPELS_TIRAGE_KEY = 'rappels-tirage';       // { jour, surprise:[ids], faits:[ids] }
const RAPPELS_LENDEMAIN_KEY = 'rappels-lendemain'; // { 'AAAA-MM-JJ': [ids] }
let rappelsSession = new Set(); // ids des cartes de la file en cours qui sont des rappels (pas encore répondus)

function chargerRappelsLendemain(){
  try{
    const o = JSON.parse(localStorage.getItem(RAPPELS_LENDEMAIN_KEY) || '{}');
    if(!o || typeof o !== 'object' || Array.isArray(o)) return {};
    const propre = {};
    for(const j in o){ if(Array.isArray(o[j])) propre[j] = o[j]; }
    return propre;
  }catch(e){ return {}; }
}
function sauverRappelsLendemain(o){
  const today = todayStr();
  const propre = {};
  for(const j in o){ if(j >= today && o[j].length) propre[j] = o[j]; } // on oublie les jours passés
  try{ localStorage.setItem(RAPPELS_LENDEMAIN_KEY, JSON.stringify(propre)); }catch(e){}
}
function ajouterRappelLendemain(id){
  const demain = addDays(todayStr(), 1);
  const o = chargerRappelsLendemain();
  const l = o[demain] || [];
  if(l.includes(id) || l.length >= RAPPELS_LENDEMAIN_MAX) return false;
  l.push(id);
  o[demain] = l;
  sauverRappelsLendemain(o);
  return true;
}
function retirerRappelLendemain(id){
  const demain = addDays(todayStr(), 1);
  const o = chargerRappelsLendemain();
  if(!o[demain]) return;
  o[demain] = o[demain].filter(x => x !== id);
  sauverRappelsLendemain(o);
}
function chargerRappelsTirage(){
  try{
    const o = JSON.parse(localStorage.getItem(RAPPELS_TIRAGE_KEY) || 'null');
    if(o && o.jour === todayStr() && Array.isArray(o.surprise) && Array.isArray(o.faits)) return o;
  }catch(e){}
  return null;
}
function sauverRappelsTirage(o){
  try{ localStorage.setItem(RAPPELS_TIRAGE_KEY, JSON.stringify(o)); }catch(e){}
}
function marquerRappelFait(id, fait){
  const t = chargerRappelsTirage();
  if(!t) return;
  t.faits = t.faits.filter(x => x !== id);
  if(fait) t.faits.push(id);
  sauverRappelsTirage(t);
}
/* Tirage du jour des rappels surprise (fait une seule fois par jour, sur toutes
   les matières actives ; le filtre matière est appliqué plus tard à l'affichage).
   Ne prend que des cartes maîtrisées pas encore dues, hors matières archivées
   et hors matières dont le contrôle est déjà passé. */
function tirerRappelsSurprise(today){
  const nbLendemain = Math.min((chargerRappelsLendemain()[today] || []).length, RAPPELS_LENDEMAIN_MAX);
  const budget = Math.min(RAPPELS_SURPRISE_MAX, RAPPELS_TOTAL_MAX - nbLendemain);
  if(budget < 1 || Math.random() >= RAPPELS_SURPRISE_PROBA_JOUR) return [];
  const n = Math.min(budget, RAPPELS_SURPRISE_MIN + Math.floor(Math.random() * (RAPPELS_SURPRISE_MAX - RAPPELS_SURPRISE_MIN + 1)));
  const actives = getMatieresActives();
  const candidates = CARDS.filter(c => {
    const m = c.matiere || 'Sans matière';
    const cfg = matieresConfig[m];
    const controlePasse = !!(cfg && cfg.dateControle && cfg.dateControle < today);
    return (c.palier || 0) >= MASTERED_PALIER && (c.prochaineRevision || today) > today && actives.includes(m) && !controlePasse && c.id != null;
  });
  for(let i = candidates.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }
  return candidates.slice(0, n).map(c => c.id);
}
/* Cartes de rappel à mélanger aujourd'hui pour le filtre matière courant. */
function getRappelsPourFiltre(){
  try{
    const today = todayStr();
    let tirage = chargerRappelsTirage();
    if(!tirage){
      tirage = { jour: today, surprise: tirerRappelsSurprise(today), faits: [] };
      sauverRappelsTirage(tirage);
    }
    const lendemain = (chargerRappelsLendemain()[today] || []).slice(0, RAPPELS_LENDEMAIN_MAX);
    const ids = new Set(tirage.surprise.concat(lendemain));
    const actives = getMatieresActives();
    return CARDS.filter(c => {
      if(!ids.has(c.id) || tirage.faits.includes(c.id)) return false;
      if((c.prochaineRevision || today) <= today) return false; // déjà due : elle est déjà dans la file
      const m = c.matiere || 'Sans matière';
      return matiereFilter !== 'toutes' ? m === matiereFilter : actives.includes(m);
    });
  }catch(e){ return []; }
}

/* Mélange par matière (v110) : à chaque lancement de « Réviser », « Tout réviser » ou « S'entraîner », les cartes de CHAQUE matière sont
   mélangées (les matières restent groupées, dans l'ordre où elles apparaissent). On retient une empreinte de l'ordre du dernier lancement
   (clé locale à part, hors export et synchro) : un nouveau lancement sur le même contexte ne redonne JAMAIS le même ordre, ni la même
   première carte quand c'est possible. */
const ORDRE_SESSION_KEY = 'ordre-derniere-session';
function chargerOrdresSession(){ try{ return JSON.parse(localStorage.getItem(ORDRE_SESSION_KEY)) || {}; }catch(e){ return {}; } }
function hashOrdreCartes(liste){
  let h = 5381; const t = liste.map(c => c.id).join('|');
  for(let i = 0; i < t.length; i++) h = (((h << 5) + h) + t.charCodeAt(i)) | 0;
  return String(h);
}
function melangerParMatiere(cards, cle){
  if(!cards || cards.length < 2) return cards ? cards.slice() : [];
  const groupes = new Map();
  cards.forEach(c => { const m = c.matiere || 'Sans matière'; if(!groupes.has(m)) groupes.set(m, []); groupes.get(m).push(c); });
  const tirer = () => {
    const out = [];
    groupes.forEach(g => {
      const a = g.slice();
      for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      out.push(...a);
    });
    return out;
  };
  const ordres = chargerOrdresSession(), prev = ordres[cle];
  let res = tirer();
  if(prev){
    const peutChanger = [...groupes.values()].some(g => g.length > 1);
    const debutPeutChanger = groupes.values().next().value.length > 1;
    for(let i = 0; peutChanger && i < 12; i++){
      const autreOrdre = hashOrdreCartes(res) !== prev.h;
      const autreDebut = !debutPeutChanger || String(res[0].id) !== prev.first;
      if(autreOrdre && autreDebut) break;
      res = tirer();
    }
    if(peutChanger && hashOrdreCartes(res) === prev.h){ // filet : on échange deux voisines d'une même matière
      for(let i = 0; i < res.length - 1; i++){
        if((res[i].matiere || 'Sans matière') === (res[i + 1].matiere || 'Sans matière')){ [res[i], res[i + 1]] = [res[i + 1], res[i]]; break; }
      }
    }
  }
  try{
    ordres[cle] = { h: hashOrdreCartes(res), first: String(res[0].id) };
    const cles = Object.keys(ordres); if(cles.length > 40) delete ordres[cles[0]];
    localStorage.setItem(ORDRE_SESSION_KEY, JSON.stringify(ordres));
  }catch(e){}
  return res;
}

function buildQueue(melanger){
  queue = getBaseCards();
  rappelsSession = new Set();
  // Rappels mélangés aux cartes du jour, seulement s'il y a déjà des cartes dues
  // (pas de session juste pour un rappel).
  if(studyMode === 'due' && queue.length > 0){
    getRappelsPourFiltre().forEach(c => {
      rappelsSession.add(c.id);
      const pos = 1 + Math.floor(Math.random() * queue.length);
      queue.splice(Math.min(pos, queue.length), 0, c);
    });
  }
  if(melanger) queue = melangerParMatiere(queue, 'etude|' + studyMode + '|' + matiereFilter);
  currentIndex = 0;
  flipped = false;
}

function onMatiereFilterChange(val){
  if(val === matiereFilter) return;
  // Pendant une session active, une carte est affichée : on lui applique la
  // même transition douce (fade + léger retrait) que pour changer de carte
  // après une réponse, plutôt qu'un re-render brutal qui donnait l'impression
  // d'un bug. Direction neutre (vers le haut) puisque ce n'est pas une réponse.
  const scene = studySessionActive ? document.querySelector('#anki-card') : null;
  if(scene){
    scene.style.transition = 'opacity 0.2s cubic-bezier(.4,0,.2,1), transform 0.2s cubic-bezier(.4,0,.2,1)';
    scene.style.opacity = '0';
    scene.style.transform = 'translateY(-10px) scale(0.97)';
    setTimeout(() => {
      matiereFilter = val;
      buildQueue(true);
      currentIndex = 0;
      flipped = false;
      lastAnswer = null;
      justAdvanced = true;
      renderStudy();
    }, 170);
  } else {
    // Écran d'accueil (pas de session en cours) : le bloc entier était
    // reconstruit d'un coup par innerHTML. Le souci n'était pas seulement
    // l'absence de transition, mais aussi que chaque élément interne
    // (chiffre, bouton, séparateur, pastilles...) a sa propre animation
    // d'entrée façon "pop depuis opacity 0", avec des délais échelonnés
    // (voir .home-status, .home-secondary-sep, .home-secondary, .home-cta
    // plus haut). Ces animations sont pensées pour le tout premier
    // affichage de l'écran, mais rejouaient à l'identique à chaque clic sur
    // une matière — d'où l'impression de "tout disparaît puis réapparaît"
    // par morceaux. On les désactive pour ce cas précis (classe
    // .no-replay-anim, voir CSS) et on applique un unique fondu simple et
    // rapide sur l'ensemble du bloc à la place.
    const screen = document.querySelector('.home-screen');
    if(screen){
      screen.style.transition = 'opacity 0.12s ease-out';
      screen.style.opacity = '0';
      setTimeout(() => {
        matiereFilter = val;
        buildQueue();
        renderStudy();
        const newScreen = document.querySelector('.home-screen');
        if(newScreen){
          newScreen.classList.add('no-replay-anim');
          newScreen.style.transition = 'none';
          newScreen.style.opacity = '0';
          newScreen.getBoundingClientRect(); // force reflow avant de rétablir la transition
          requestAnimationFrame(() => {
            newScreen.style.transition = 'opacity 0.18s ease-out';
            newScreen.style.opacity = '1';
          });
        }
      }, 120);
    } else {
      matiereFilter = val;
      buildQueue();
      renderStudy();
    }
  }
}

/* ---- Bulle glissante générique pour groupes de pastilles (matières / filtres) ----
   Même principe que la barre de nav : une seule bulle, positionnée en absolu,
   glisse derrière la pastille active au lieu que chaque pastille change de
   couleur brutalement. On mémorise la position précédente (viewport) juste
   avant que le HTML du groupe soit détruit et reconstruit, pour pouvoir
   "rejouer" le glissement depuis l'ancienne position (technique FLIP). */
const pillBubblePrevRects = {};

function capturePillBubbleRect(groupKey, containerSelector){
  const bubble = document.querySelector(`${containerSelector} .pill-bubble`);
  pillBubblePrevRects[groupKey] = bubble ? bubble.getBoundingClientRect() : null;
}

function placePillBubble(groupKey, containerSelector, activeSelector){
  const container = document.querySelector(containerSelector);
  const prevRect = pillBubblePrevRects[groupKey];
  pillBubblePrevRects[groupKey] = null;
  if(!container) return;
  const activeEl = container.querySelector(activeSelector);
  let bubble = container.querySelector('.pill-bubble');
  if(!activeEl){
    if(bubble) bubble.remove();
    return;
  }
  if(!bubble){
    bubble = document.createElement('span');
    bubble.className = 'pill-bubble';
    container.insertBefore(bubble, container.firstChild);
  }
  const activeRect = activeEl.getBoundingClientRect();
  const targetX = activeEl.offsetLeft;
  const targetY = activeEl.offsetTop;
  bubble.style.width = activeEl.offsetWidth + 'px';
  bubble.style.height = activeEl.offsetHeight + 'px';
  const pillColor = activeEl.style.getPropertyValue('--pill-color');
  if(pillColor) bubble.style.setProperty('--pill-color', pillColor);
  else bubble.style.removeProperty('--pill-color');
  bubble.style.transition = 'none';
  if(prevRect){
    bubble.style.transform = `translate(${targetX + (prevRect.left - activeRect.left)}px, ${targetY + (prevRect.top - activeRect.top)}px)`;
  } else {
    bubble.style.transform = `translate(${targetX}px, ${targetY}px)`;
  }
  bubble.getBoundingClientRect(); // force reflow avant de rétablir la transition
  requestAnimationFrame(() => {
    bubble.style.transition = '';
    bubble.style.transform = `translate(${targetX}px, ${targetY}px)`;
  });
}

   Réservée aux actions importantes : lancer une révision, répondre (rouge / orange / vert, au bouton ou au glissé).
   Plus de vibration sur les simples appuis de boutons, ni au retournement de la carte, ni sur Générer / Ajouter. */
function haptique(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
(function(){
  const sel = '.pp-head button,.pp-nav button,.pp-home button,#pp-ses button,.pp-row,.pp-prog7,.pp-ctl,.pp-mat,.pp-li,.pp-sec,.pp-snd,.pp-chip,.pp-ibt,.pp-pill,.pp-invc,.pp-dash,.pp-bk2,.pp-back,.pp-alt button,.pp-pd,.pp-d,.pp-pdn,.pp-ib,.pp-mini,.pp-cta,.pp-undo,.home-cta,.home-matiere-due-item,.planning-strip,.filter-pill,.modal-actions button';
  document.addEventListener('pointerdown', e => {
    const b = e.target.closest ? e.target.closest(sel) : null;
    if(!b || b.disabled) return;
    const t0 = Date.now();
    b.classList.add('js-press');
    b._pressT0 = t0;
    const off = () => {
      ['pointerup','pointercancel','pointerleave'].forEach(k => b.removeEventListener(k, off));
      setTimeout(() => b.classList.remove('js-press'), Math.max(0, 120 - (Date.now() - t0)));
    };
    ['pointerup','pointercancel','pointerleave'].forEach(k => b.addEventListener(k, off));
  }, { passive:true });
  /* v83 — tap léger (Chromebook : toucher le pad sans appuyer, ou tap écran) : pointerdown, pointerup et click
     arrivent presque ensemble, donc l'écran change AVANT que l'animation d'enfoncement soit visible.
     Si le clic arrive moins de 110 ms après l'appui, on le met en attente le temps de montrer l'animation,
     puis on le rejoue (une seule fois). Un vrai appui fort dure déjà plus de 110 ms : aucun délai ajouté. */
  const MIN_PRESS = 110;
  document.addEventListener('click', e => {
    if(!e.isTrusted || e._rejoue) return;
    const b = e.target.closest ? e.target.closest(sel) : null;
    if(!b || b.disabled || !b._pressT0) return;
    const reste = MIN_PRESS - (Date.now() - b._pressT0);
    b._pressT0 = 0;
    if(reste <= 8) return;
    e.stopImmediatePropagation(); e.preventDefault();
    setTimeout(() => {
      if(!b.isConnected || b.disabled) return;
      const c = new MouseEvent('click', { bubbles:true, cancelable:true, view:window, detail:e.detail, clientX:e.clientX, clientY:e.clientY });

      const cible = (e.target && e.target.isConnected && b.contains(e.target)) ? e.target : b;
      cible.dispatchEvent(c);
    }, reste);
  }, true);
})();

  /* Chromebook (v84) : panneau « réponse » à droite + boutons sous les deux panneaux (display:none sur téléphone) */
  const raOut = !fl && anim === 'flip' && ppWide();  // retour à la question : le panneau rentre dans son emplacement
  const ra = `<div class="pp-rslot${fl ? ' hid' : ''}" onclick="${o.fnFlip}"><div class="pp-g"><kbd>Espace</kbd><br>pour afficher la réponse</div></div><div class="pp-ra${fl ? ' on' : (raOut ? ' out' : '')}" onclick="${o.fnFlip}"><div class="pp-v"><div class="pp-ch"><span class="pp-sticker" style="animation:none">${f.libArriere}</span></div><div style="margin:auto 0"><div class="pp-rule" style="margin:0 0 12px"></div><p class="pp-at${back.length > 90 ? ' pp-l' : ''}">${ppRichHtml(back)}</p>${f.imgArriere ? `<img class="pp-aimg" src="${f.imgArriere}" alt="" draggable="false">` : ''}</div></div></div>`;
  const acts = `<div class="pp-acts${fl ? '' : ' dim'}${(!fl && anim === 'flip') ? ' down' : ''}">${ans3}</div>`;  // .down = retour à la question : même animation que le 1er retournement, à l'envers
  ppSesShow(`<div class="pp-top"><div class="pp-bar1"><i style="background-color:${start}"></i><u></u></div></div>
  ${o.mp ? `<div class="pp-info"><span class="pp-mp">${o.mp}</span></div>` : ''}
  ${o.undo ? `<button class="pp-undo" onclick="undoLastAnswer()">${ppSvg('<path d="M3 10h10a5 5 0 0 1 5 5v1M3 10l4-4M3 10l4 4"/>',14)}Annuler la dernière réponse</button>` : ''}
  <div class="pp-stage"><div class="pp-card${anim === 'in' ? ' pp-in' : ''}" id="${o.ids.card}"><div class="pp-ch"><span class="pp-sticker" style="animation:none"><span class="pp-sk-p">${fl ? f.libArriere : f.libAvant}</span><span class="pp-sk-w">${f.libAvant}</span></span><span class="pp-tag" style="--c:${couleurMatiere(c.matiere)}"><span class="pp-dot"></span>${escapeHtml(c.matiere || '')}</span></div>
  <div class="pp-body${fl ? ' pp-flipped' : ''}" id="${o.ids.body}" onclick="${o.fnFlip}"><h1 class="pp-qt">${ppRichHtml(f.avant)}</h1>${f.imgAvant ? `<img class="pp-qimg" src="${f.imgAvant}" alt="" draggable="false">` : ''}${fl ? `<div class="pp-rule"></div><p class="pp-at${back.length > 90 ? ' pp-l' : ''}">${ppRichHtml(back)}</p>${f.imgArriere ? `<img class="pp-aimg" src="${f.imgArriere}" alt="" draggable="false">` : ''}` : ''}</div>
  <div class="pp-foot">${foot}</div><div class="pp-pastille"></div></div>${ra}</div>
  ${acts}
  <div class="pp-mb${anim === 'flip' ? ' pp-still' : ''}"><button class="pp-bk" aria-label="Retour à l'accueil" onclick="${o.fnBack}">${PP_IC.back}</button><span class="pp-mi">${ppSvg('<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',24)}</span><span class="pp-mt"><b class="${bump ? 'pp-bump' : ''}">${mas}</b><span>carte${mas > 1 ? 's' : ''} déjà maîtrisée${mas > 1 ? 's' : ''}</span></span><span class="pp-kh" aria-hidden="true"><span><i style="--c:var(--pink)"></i>Suppr</span><span><i style="--c:var(--amber)"></i>Maj</span><span><i style="--c:var(--green)"></i>Entrée</span></span></div>`);
  const root = document.getElementById('pp-ses');
  if(anim === 'flip'){
    // grand écran : le texte de la question ne change pas au retournement (la réponse est dans le panneau de droite) → aucun fondu
    const b = root.querySelector('.pp-body'); if(b && !ppKeep) b.style.animation = 'ppflipIn .32s ease-out both';
    // la nouvelle carte naît enfoncée (même position que l'ancienne) puis remonte : le retour de « l'enfoncement »
    const cd = root.querySelector('.pp-card');
    if(cd && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)){
      if(ppKeep && ppKeep.card){
        // grand écran : la nouvelle carte reprend pixel pour pixel la position de l'ancienne, puis remonte en douceur
        cd.style.transition = 'none'; cd.style.transform = ppKeep.card.t; cd.style.boxShadow = ppKeep.card.s;
        void cd.offsetWidth;
        requestAnimationFrame(() => requestAnimationFrame(() => { cd.style.transition = ''; cd.style.transform = ''; cd.style.boxShadow = ''; }));
      } else {
        cd.classList.add('pp-sink');
        requestAnimationFrame(() => requestAnimationFrame(() => cd.classList.remove('pp-sink')));
      }
    }
    if(ppKeep) Object.keys(ppKeep.loops).forEach(sel => { const el = root.querySelector(sel); if(el) el.style.animationDelay = '-' + ppKeep.loops[sel] + 'ms'; });
  }
  const fill = root.querySelector('.pp-bar1 i'), drop = root.querySelector('.pp-bar1 u');
  const nc = ppMoodColor(o.counts), lr = ppMood.last; ppMood.last = null; ppMood.pc = nc;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if(fill) fill.style.backgroundColor = nc;
    if(lr && drop){
      drop.style.setProperty('--dc', 'rgb(' + PP_MC[lr].slice(0,3).join(',') + ')');
      drop.classList.remove('on'); void drop.offsetWidth; drop.classList.add('on');
    }
  }));
}
