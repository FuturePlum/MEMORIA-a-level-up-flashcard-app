/* ---------------- Export / import complet de la progression ----------------
   Un seul fichier JSON qui regroupe tout ce qui doit survivre à un transfert
   vers un autre appareil ou une autre appli : les cartes avec leur palier et
   leurs dates de révision, les dates de contrôle par matière, et le streak.
   Format versionné pour pouvoir faire évoluer la structure plus tard sans
   casser la compatibilité avec d'anciens exports. */
let settingsImportMsg = null;
let dernierImportDejaPresentes = 0;
let dernierImportEchec = false;   // vrai si le dernier finaliserImport n'a rien pu écrire (stockage plein)

/* Construit l'objet de données complet (cartes + progression + réglages
   transférables). Réutilisé par l'export manuel ET par la synchro
   automatique, pour ne jamais avoir deux formats différents à maintenir. */
function construireDonneesProgression(options){
  // La synchro emporte maintenant aussi la clé Gemini (elle n'est envoyée que
  // si le code perso est assez solide : voir syncActif / verifierSoliditeCode).
  const cartes = CARDS.map(c => ({
    id: c.id,
    matiere: c.matiere || 'Sans matière',
    question: c.question,
    reponse: c.reponse,
    palier: c.palier || 0,
    prochaineRevision: c.prochaineRevision || null,
    derniereRevision: c.derniereRevision || null,
    derniereModification: c.derniereModification || null,
    difficultes: c.difficultes || 0,
    facileConsecutif: c.facileConsecutif || 0,
    facilite: facilitePour(c),
    inversible: c.inversible === true,
    ecrite: c.ecrite === true,
    ...(ppImgValide(c.imageQuestion) ? { imageQuestion: c.imageQuestion } : {}),
    ...(ppImgValide(c.imageReponse) ? { imageReponse: c.imageReponse } : {})
  }));
  const datesControle = {};
  const matieresArchivees = [];
  Object.keys(matieresConfig).forEach(m => {
    if(matieresConfig[m] && matieresConfig[m].dateControle){
      datesControle[m] = matieresConfig[m].dateControle;
    }
    if(matieresConfig[m] && matieresConfig[m].archive){
      matieresArchivees.push(m);
    }
  });
  let streak = null;
  try{ streak = JSON.parse(localStorage.getItem('cartes-streak') || 'null'); }catch(e){}
  let geminiApiKey = null, geminiApiKeyMaj = null;
  try{ geminiApiKey = localStorage.getItem('gemini_api_key') || null; }catch(e){}
  try{ geminiApiKeyMaj = localStorage.getItem('gemini_api_key_maj') || null; }catch(e){}
  const modelesSynthese = chargerModelesSynthese();

  return {
    format: 'filigrane-revisions',
    version: 3,
    exporteLe: todayStr(),
    cartes,
    cartesSupprimees: loadTombstones(),
    datesControle,
    datesControleMaj: loadDatesControleMaj(),
    matieresVides: loadEmptyMatieres(),
    matieresVidesDates: loadMatieresVidesDates(),
    matieresSupprimees: loadMatieresSupprimees(),
    matieresArchivees,
    streak,
    geminiApiKey,
    geminiApiKeyMaj,
    modelesSynthese,
    // v173 : données propres à l'appareil. Absentes de la synchro (pourSync : le contenu envoyé au serveur ne change pas),
    // présentes dans la sauvegarde pour que « Exporter la progression » soit complet.
    ...((options && options.pourSync) ? {} : {
      statsExtra: ppStatExtra(),
      seances: ppSeancesLire(),
      reglages: ppLireReglagesSauvegarde()
    })
  };
}

/* Réglages qui voyagent avec la sauvegarde (heure et relance du rappel, apparence, langue). Rien n'est enregistré
   tant que l'utilisateur n'a rien choisi : on ne sauvegarde que les clés présentes. */
function ppLireReglagesSauvegarde(){
  const r = {};
  try{ const v = localStorage.getItem('rappel-heure-preferee'); if(v) r.rappelHeure = v; }catch(e){}
  try{ const v = localStorage.getItem('rappel-relance-active'); if(v === '0' || v === '1') r.rappelRelance = v === '1'; }catch(e){}
  try{ const v = localStorage.getItem('fc-apparence'); if(v === 'clair' || v === 'sombre' || v === 'auto') r.apparence = v; }catch(e){}
  try{ const v = localStorage.getItem('fc-langue'); if(v === 'fr' || v === 'en') r.langue = v; }catch(e){}
  return r;
}

/* Restaure statistiques, séances et réglages d'une sauvegarde (v173). Une restauration ne fait jamais reculer :
   compteurs = le plus grand des deux ; séances = fusion sans doublon (60 dernières) ; réglages = seulement ceux
   que l'appareil n'a pas déjà choisis. */
function ppRestaurerAnnexes(a){
  if(!ppEstObjet(a)) return;
  if(ppEstObjet(a.statsExtra)){
    const loc = ppStatExtra();
    ppStatSave({
      record: Math.max(loc.record, Math.max(0, Math.floor(+a.statsExtra.record) || 0)),
      total: Math.max(loc.total, Math.max(0, Math.floor(+a.statsExtra.total) || 0))
    });
  }
  if(Array.isArray(a.seances)){
    const cle = s => [s.d, s.ms, s.n, s.v, s.m, s.e].join('|');
    const locales = ppSeancesLire(), vues = new Set(locales.map(cle));
    const ajout = ppSeancesNettoyer(a.seances).filter(s => !vues.has(cle(s)));
    if(ajout.length){
      const fusion = locales.concat(ajout).map((s, i) => ({ s, i }))
        .sort((x, y) => x.s.d < y.s.d ? -1 : x.s.d > y.s.d ? 1 : x.i - y.i)
        .map(o => o.s).slice(-60);
      ppEcrire(PP_SEANCES_KEY, JSON.stringify(fusion));
    }
  }
  const r = a.reglages;
  if(ppEstObjet(r)){
    const absent = k => { try{ return localStorage.getItem(k) === null; }catch(e){ return false; } };
    if(typeof r.rappelHeure === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(r.rappelHeure) && absent('rappel-heure-preferee')) ppEcrire('rappel-heure-preferee', r.rappelHeure);
    if(typeof r.rappelRelance === 'boolean' && absent('rappel-relance-active')) ppEcrire('rappel-relance-active', r.rappelRelance ? '1' : '0');
    if((r.apparence === 'clair' || r.apparence === 'sombre' || r.apparence === 'auto') && absent('fc-apparence')) ppEcrire('fc-apparence', r.apparence);
    if((r.langue === 'fr' || r.langue === 'en') && absent('fc-langue')) ppEcrire('fc-langue', r.langue);
  }
}

function exportProgression(){
  const data = construireDonneesProgression();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  telechargerBlob(blob, `revisions-sauvegarde-${todayStr()}.json`);
}

function handleImportFile(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{
      data = JSON.parse(reader.result);
    }catch(e){
      settingsImportMsg = { type:'err', text:'Fichier JSON invalide.' };
      renderSettings();
      return;
    }
    try{
      importerProgression(data);
    }catch(e){
      settingsImportMsg = { type:'err', text:'Import interrompu : fichier mal formé.' };
      renderSettings();
    }
  };
  reader.onerror = () => {
    settingsImportMsg = { type:'err', text:'Impossible de lire le fichier.' };
    renderSettings();
  };
  reader.readAsText(file);
}

function importerProgression(data){
  // Compatible avec deux formats : le nouveau ({format, cartes, datesControle, ...})
  // et l'ancien export simple (un tableau brut de cartes, sans metadata).
  let cartes, datesControle = {}, matieresVides = [], streak = null, matieresArchivees = [], geminiApiKey = null, modelesSynthese = [], annexes = null, cleMsg = '';
  if(Array.isArray(data)){
    cartes = data;
  } else if(data && Array.isArray(data.cartes)){
    cartes = data.cartes;
    datesControle = ppEstObjet(data.datesControle) ? data.datesControle : {};
    matieresVides = Array.isArray(data.matieresVides) ? data.matieresVides.filter(m => typeof m === 'string' && m.trim()).map(m => m.trim()) : [];
    streak = ppEstObjet(data.streak) ? data.streak : null;
    matieresArchivees = Array.isArray(data.matieresArchivees) ? data.matieresArchivees : [];
    geminiApiKey = typeof data.geminiApiKey === 'string' ? data.geminiApiKey : null;
    modelesSynthese = Array.isArray(data.modelesSynthese) ? data.modelesSynthese : [];
    annexes = { statsExtra: data.statsExtra, seances: data.seances, reglages: data.reglages };
  } else {
    settingsImportMsg = { type:'err', text:'Format de fichier non reconnu.' };
    renderSettings();
    return;
  }

  const items = [];
  for(const item of cartes){
    if(!item || typeof item !== 'object') continue;
    const question = (item.question || '').toString().trim();
    const reponse = (item.reponse || '').toString().trim();
    const matiere = (item.matiere || 'Sans matière').toString().trim();
    if((!question && !ppImgValide(item.imageQuestion)) || (!reponse && !ppImgValide(item.imageReponse))) continue;
    const palier = Number.isInteger(item.palier) ? Math.max(0, Math.min(item.palier, INTERVALS.length - 1)) : 0;
    const prochaineRevision = typeof item.prochaineRevision === 'string' ? item.prochaineRevision : null;
    const derniereRevision = typeof item.derniereRevision === 'string' ? item.derniereRevision : null;
    const difficultes = Number.isFinite(item.difficultes) ? Math.max(0, item.difficultes) : 0;
    const facileConsecutif = Number.isFinite(item.facileConsecutif) ? Math.max(0, item.facileConsecutif) : 0;
    const facilite = facilitePour({ facilite: item.facilite }); // absent (ancien export) => 1
    const inversible = item.inversible === true, ecrite = item.ecrite === true;
    const imgs = ppImgPatch(item);
    // Absent sur un vieux payload version 2 (ou export sans champ) : null,
    // traité comme "très ancien" partout où c'est comparé (voir fusionnerDepuisSync).
    const derniereModification = typeof item.derniereModification === 'string' ? item.derniereModification : null;
    items.push({ id: (item.id && /^[\w.-]{1,64}$/.test(String(item.id))) ? String(item.id) : null, matiere, question, reponse, palier, prochaineRevision, derniereRevision, derniereModification, difficultes, facileConsecutif, facilite, inversible, ecrite, ...imgs });
  }
  if(items.length === 0){
    // Une sauvegarde peut ne contenir que des matières vides (aucune carte) : on les restaure quand même.
    const videsAjoutees = matieresVides.filter(m => typeof m === 'string' && m.trim() && !getMatieres().includes(m.trim()));
    if(videsAjoutees.length === 0){
      settingsImportMsg = { type:'err', text:'Aucune carte valide trouvée dans le fichier.' };
      renderSettings();
      return;
    }
    videsAjoutees.forEach(m => addEmptyMatiere(m.trim()));
    ppRestaurerAnnexes(annexes);
    settingsImportMsg = { type:'ok', text:`Sauvegarde restaurée : ${videsAjoutees.length} matière${videsAjoutees.length>1?'s':''} vide${videsAjoutees.length>1?'s':''} ajoutée${videsAjoutees.length>1?'s':''} (aucune carte dans le fichier).` };
    if(cleMsg) settingsImportMsg.text += cleMsg;
    renderSettings();
    render();
    return;
  }

  resolveImportMatieres(items, 0, {}, (renommages) => {
    // Les dates de contrôle sont enregistrées AVANT le placement : les cartes
    // NEUVES du fichier doivent éviter la zone tampon (finaliserImport lit
    // matieresConfig[...].dateControle). Les cartes déjà datées d'un backup
    // ne sont pas concernées (estCarteNeuve est faux pour elles).
    Object.keys(datesControle).forEach(m => {
      const matiereFinale = renommages[m] || m;
      if(!matieresConfig[matiereFinale]) matieresConfig[matiereFinale] = {};
      matieresConfig[matiereFinale].dateControle = datesControle[m];
      saveLocalDateControle(matiereFinale, datesControle[m]);
    });
    const echecsAvant = ppEcritureEchecs;
    const repliRestauration = finaliserImport(items, renommages);
    if(dernierImportEchec){
      settingsImportMsg = { type:'err', text:'Stockage plein : restauration annulée, aucune carte ajoutée.' };
      renderSettings();
      return;
    }

    matieresVides.forEach(m => { if(!getMatieres().includes(m)) addEmptyMatiere(m); });
    matieresArchivees.forEach(m => {
      const matiereFinale = renommages[m] || m;
      if(!matieresConfig[matiereFinale]) matieresConfig[matiereFinale] = {};
      matieresConfig[matiereFinale].archive = true;
      saveLocalArchiveMatiere(matiereFinale, true);
    });
    if(streak){
      ppEcrire('cartes-streak', JSON.stringify(streak));
      renderStreak();
    }
    // v153 (constat 37) : une clé venue d'un fichier ne remplace JAMAIS la clé locale ; elle n'est reprise
    // que s'il n'y en a pas, et l'utilisateur en est prévenu (les cours partent vers le projet Google de cette clé).
    cleMsg = '';
    if(geminiApiKey){
      let cleLocale = '';
      try{ cleLocale = (localStorage.getItem('gemini_api_key') || '').trim(); }catch(e){}
      if(!cleLocale){
        if(ppEcrire('gemini_api_key', geminiApiKey.trim())) cleMsg = ' La clé Gemini du fichier a été enregistrée (tu n\u2019en avais pas).';
      } else if(cleLocale !== geminiApiKey.trim()){
        cleMsg = ' La clé Gemini du fichier n\u2019a pas été utilisée : tu gardes la tienne.';
      }
    }
    fusionnerModelesSynthese(modelesSynthese);
    ppRestaurerAnnexes(annexes);
    recalcPlanning();
    saveLocalPlanning();

    if(ppEcritureEchecs > echecsAvant){
      settingsImportMsg = { type:'err', text:'Restauration incomplète : stockage plein, une partie des données n\u2019a pas été enregistrée.' };
      renderSettings();
      render();
      return;
    }
    settingsImportMsg = { type:'ok', text:`Sauvegarde restaurée : ${items.length - dernierImportDejaPresentes} carte${(items.length - dernierImportDejaPresentes)>1?'s':''} ajoutée${(items.length - dernierImportDejaPresentes)>1?'s':''}${dernierImportDejaPresentes ? ` (${dernierImportDejaPresentes} déjà présente${dernierImportDejaPresentes>1?'s':''}, ignorée${dernierImportDejaPresentes>1?'s':''})` : ''}.${repliRestauration ? ' ' + MSG_AVERTISSEMENT_REPLI_ZONE : ''}` };
    renderSettings();
    render();
  });
}

/* Ancien export simple (cartes seules, sans dates de contrôle ni streak) —
   conservé pour compatibilité mais l'export complet ci-dessus est préféré. */
function genId(){
  return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* Parcourt les matières distinctes du lot importé une à une et, pour chaque nom
   qui ressemble "vraiment vraiment" à une matière déjà existante (ou déjà choisie
   dans ce même import), demande à l'utilisateur de fusionner ou créer séparément.
   `renommages` accumule matière-du-JSON -> matière-finale-à-utiliser. */
function resolveImportMatieres(items, fromIndex, renommages, onDone){
  const matieresDistinctes = [...new Set(items.map(i => i.matiere))];
  for(let i = fromIndex; i < matieresDistinctes.length; i++){
    const nom = matieresDistinctes[i];
    if(renommages.hasOwnProperty(nom)) continue;
    const referenceExistantes = [...getMatieres(), ...Object.values(renommages)];
    const canon = nomMatiereCanonique(nom, referenceExistantes);
    if(canon !== nom){ renommages[nom] = canon; continue; }
    const similaire = trouverMatiereSimilaire(nom, referenceExistantes);
    if(similaire){
      askMergeMatiere(similaire, nom, (nomFinal) => {
        renommages[nom] = nomFinal;
        resolveImportMatieres(items, i + 1, renommages, onDone);
      });
      return;
    }
    renommages[nom] = nom;
  }
  onDone(renommages);
}

/* Plafond de nouvelles cartes introduites par jour, par matière (et non
   toutes matières confondues : chaque matière a son propre contrôle et son
   propre calcul de compression, un plafond global ferait piocher dans le
   quota d'une matière à cause d'une autre ajoutée le même jour — cf.
   discussion). Valeur fixe plutôt qu'un pourcentage de la matière : un
   pourcentage reproduit le même écrasement à grande échelle (15% de 800
   cartes = 120, le problème qu'on évite justement). */
const NOUVELLES_CARTES_MAX_PAR_JOUR = 20;

/* Plafond de charge globale quotidienne (toutes matières confondues), utilisé
   en plus du plafond par matière ci-dessus. Sans lui, deux matières ajoutées
   le même jour pouvaient chacune caser leurs 20 cartes/jour au même endroit
   du calendrier et créer un jour à 40+ cartes dues alors que chaque matière,
   isolément, respectait son propre plafond. */
const CHARGE_GLOBALE_MAX_PAR_JOUR = 30;
/* Hypothèse de la projection « rappels prévus » (semaine) : part des révisions réussies / difficiles / ratées.
   Volontairement prudente : mieux vaut des chiffres un peu hauts qui BAISSENT que des chiffres bas qui montent. */
const PROJECTION_PROBA = { vert: 0.70, orange: 0.20, rouge: 0.10 };

/* Compte, pour une date donnée, le nombre de cartes déjà dues ce jour-là
   toutes matières confondues (CARDS = état actuel avant ce lot, + ce que le
   lot en cours vient déjà de caser via compteurGlobalParJour). Sert de base
   pour ne jamais dépasser CHARGE_GLOBALE_MAX_PAR_JOUR au total un jour donné. */
function chargeDejaPresente(jour, compteurGlobalParJour){
  if(compteurGlobalParJour[jour] != null) return compteurGlobalParJour[jour];
  const n = CARDS.filter(c => (c.palier || 0) < MASTERED_PALIER && (c.prochaineRevision || todayStr()) === jour).length;
  compteurGlobalParJour[jour] = n;
  return n;
}

/* Compte, pour une matière et une date données, le nombre de cartes DE
   CETTE MATIÈRE déjà dues ce jour-là — calculé depuis CARDS (donc y compris
   les cartes casées par un import PRÉCÉDENT), mis en cache dans
   compteurJourParMatiere puis incrémenté normalement au fil de CE lot.
   Sans ce calcul depuis CARDS, le plafond par matière ne "voyait" que les
   cartes ajoutées par le lot en cours : deux imports successifs de la même
   matière le même jour pouvaient chacun placer jusqu'à leur propre plafond,
   dépassant largement NOUVELLES_CARTES_MAX_PAR_JOUR au total sur ce jour
   pour cette matière (seul le plafond global finissait par arrêter ça, bien
   plus tard que prévu). */
function chargeMatiereDejaPresente(matiere, jour, compteurJourParMatiere){
  if(!compteurJourParMatiere[matiere]) compteurJourParMatiere[matiere] = {};
  if(compteurJourParMatiere[matiere][jour] != null) return compteurJourParMatiere[matiere][jour];
  const n = CARDS.filter(c => c.matiere === matiere && (c.palier || 0) < MASTERED_PALIER && (c.prochaineRevision || todayStr()) === jour).length;
  compteurJourParMatiere[matiere][jour] = n;
  return n;
}

/* ÉTAPE E — Dernier jour où une carte NEUVE peut encore être introduite.
   Une carte neuve introduite le jour J passe palier 1 à J, puis chaque palier
   suivant tombe après l'intervalle de CE palier : elle est maîtrisée au plus
   tôt à J + INTERVALS[1] + … + INTERVALS[MASTERED_PALIER-1] (intervalles
   éventuellement resserrés par getIntervalsForMatiere — la même règle que la
   simulation de getMasteryLoad, donc la barre de marge et le placement ne
   peuvent plus se contredire). Pour être maîtrisée AU PLUS TARD le jour du
   contrôle, il faut donc l'introduire au plus tard à D − cette durée.
   La zone tampon (D-2 … D) ne bloque que l'INTRODUCTION de cartes neuves, pas
   la fin de leur montée de paliers : on prend le plus strict des deux. */
function dureeMinimaleMaitrise(matiere){
  const iv = getIntervalsForMatiere(matiere);
  let total = 0;
  for(let p = 1; p < MASTERED_PALIER; p++) total += iv[p];
  return total;
}

/* Borne EXCLUSIVE de la fenêtre où l'on place les cartes neuves : on les place
   aux jours strictement avant cette date. Jamais au-delà du début de la zone
   tampon, jamais plus tard que « dernier jour d'introduction » + 1. */
function finFenetreCartesNeuves(matiere, dateControle){
  const finZone = addDays(dateControle, -ZONE_REVISION_AVANT_CONTROLE_JOURS);
  const finMaitrise = addDays(dateControle, -dureeMinimaleMaitrise(matiere) + 1);
  return finMaitrise < finZone ? finMaitrise : finZone;
}

/* Calcule la meilleure date pour une carte neuve d'une matière donnée :
   - jamais avant aujourd'hui, jamais après la date de contrôle de la
     matière si elle existe (sinon la carte ne serait jamais vue à temps) ;
   - respecte le plafond par matière (NOUVELLES_CARTES_MAX_PAR_JOUR) ET le
     plafond global toutes matières (CHARGE_GLOBALE_MAX_PAR_JOUR), les deux
     calculés à partir de l'état réel (CARDS), pas seulement de ce que le
     lot en cours est en train d'ajouter ;
   - avec un contrôle, vise en plus un plafond proportionnel à la fenêtre
     restante (nbCartesMatiere / joursRestants) pour étaler sur TOUTE la
     fenêtre plutôt que de remplir goulûment les tout premiers jours puis
     de s'arrêter sec au plafond fixe ;
   - regroupe (ne cherche pas plus loin que nécessaire) s'il y a de la marge,
     et étale davantage si la charge est déjà là ou si le contrôle est loin —
     l'étalement n'est qu'une conséquence du respect de ces plafonds, pas un
     objectif en soi ;
   - évite la zone tampon avant le contrôle (ZONE_REVISION_AVANT_CONTROLE_JOURS,
     jours [D-2, D]) : cherche d'abord strictement avant, et n'y place la
     carte qu'en repli si aucun autre jour n'a de place ;
   - renvoie { jour, repli } : repli vaut true si la carte a dû être placée
     dans la zone tampon (sert à prévenir l'utilisateur, étape 4). */
function meilleurJourPourCarteNeuve(matiere, today, dateControle, compteurJourParMatiere, compteurGlobalParJour, plafondProportionnel){
  const plafondMatiereJour = plafondProportionnel ? Math.min(NOUVELLES_CARTES_MAX_PAR_JOUR, plafondProportionnel) : NOUVELLES_CARTES_MAX_PAR_JOUR;
  const aDePlace = (jour) => {
    const dejaMatiere = chargeMatiereDejaPresente(matiere, jour, compteurJourParMatiere);
    const dejaGlobal = chargeDejaPresente(jour, compteurGlobalParJour) + (compteurGlobalParJour['_ajout_' + jour] || 0);
    return dejaMatiere < plafondMatiereJour && dejaGlobal < CHARGE_GLOBALE_MAX_PAR_JOUR;
  };

  // Sans date de contrôle : comportement inchangé, aucune zone tampon.
  if(!dateControle){
    let jour = today;
    // Garde-fou : jamais plus d'un an de recherche (évite tout gel de l'app).
    for(let essai = 0; essai < 366; essai++){
      if(aDePlace(jour)) return { jour, repli: false };
      jour = addDays(jour, 1);
    }
    return { jour: today, repli: false };
  }

  // Avec un contrôle, en deux temps.
  // Temps 1 : chercher un jour avec de la place STRICTEMENT avant la zone
  // tampon (donc avant D - ZONE_REVISION_AVANT_CONTROLE_JOURS). Si le
  // contrôle est trop proche, cette fenêtre est vide (finZone <= today) et la
  // boucle ne tourne pas : tout part directement en repli. La boucle est
  // bornée par finZone, elle ne peut donc jamais tourner sans fin.
  const finZone = finFenetreCartesNeuves(matiere, dateControle); // étape E : fenêtre = jusqu'au dernier jour d'introduction utile
  let jour = today;
  while(jour < finZone){
    if(aDePlace(jour)) return { jour, repli: false };
    jour = addDays(jour, 1);
  }

  // Temps 2 (repli) : aucun jour libre hors zone → « sauf s'il n'y a pas le
  // choix ». On cherche dans la zone tampon avec les mêmes plafonds, en
  // partant du premier jour de la zone (mais jamais avant aujourd'hui).
  // Bornée par le contrôle : au jour du contrôle (ou après), on force ce
  // jour plutôt que de dépasser le contrôle — mieux vaut un jour un peu
  // chargé qu'une carte jamais vue.
  jour = finZone > today ? finZone : today;
  while(jour < dateControle){
    if(aDePlace(jour)) return { jour, repli: true };
    jour = addDays(jour, 1);
  }
  return { jour: dateControle, repli: true };
}

/* Version "temps réel" du plafonnement ci-dessus, pour les cas où une carte
   EXISTANTE change de date (révision normale, quiz, recalcul après une date
   de contrôle) — pas seulement l'arrivée d'une carte neuve à l'import.
   Même principe que meilleurJourPourCarteNeuve (plafond par matière +
   plafond global, jamais au-delà de la date de contrôle si elle est
   dépassée), mais calculé directement depuis CARDS à chaque appel — pas de
   compteurs à faire vivre entre plusieurs cartes d'un même lot, puisqu'ici
   chaque carte est traitée pour elle-même. excludeId retire la carte qu'on
   est en train de replacer de son propre décompte : sinon elle se compterait
   elle-même sur son ancienne date si celle-ci est aussi le jour candidat.
   Ne recule jamais une date déjà calculée par la répétition espacée — ne
   fait que la repousser si le jour visé est déjà plein, jamais l'avancer. */
/* Vrai si une carte neuve placée à `jour` est dans la zone tampon [D-ZONE, D]
   (donc en repli). Faux sans contrôle futur, ou si le jour est après le contrôle.
   Sert aux chemins B et C (plafonnerDateRevision ne renvoie qu'une date). */
function estEnRepliZoneTampon(jour, dateControle){
  if(!dateControle || !jour) return false;
  return jour >= addDays(dateControle, -ZONE_REVISION_AVANT_CONTROLE_JOURS) && jour <= dateControle;
}

function plafonnerDateRevision(matiere, jourCandidat, dateControle, excludeId, interdireZoneTampon){
  // interdireZoneTampon (optionnel, défaut false = comportement v13 inchangé) :
  // à passer à true UNIQUEMENT pour une carte NEUVE (jamais révisée). Même
  // logique en deux temps que meilleurJourPourCarteNeuve : on cherche d'abord
  // strictement avant la zone tampon [D-ZONE, D], puis en repli dans la zone si
  // tout est plein, jamais au-delà du contrôle. Une carte DÉJÀ révisée ne doit
  // jamais passer ce paramètre : tomber dans la zone tampon est voulu pour elle.
  if(interdireZoneTampon && dateControle){
    // Carte déjà STRICTEMENT après le contrôle : on la laisse telle quelle. Le
    // jour du contrôle lui-même fait partie de la zone tampon [D-ZONE, D] : une
    // carte neuve posée dessus doit donc essayer d'en sortir.
    if(jourCandidat > dateControle) return jourCandidat;
    const aDePlace = (j) => {
      const dejaMatiere = CARDS.filter(c => c.matiere === matiere && c.id !== excludeId && (c.palier || 0) < MASTERED_PALIER && (c.prochaineRevision || todayStr()) === j).length;
      const dejaGlobal = CARDS.filter(c => c.id !== excludeId && (c.palier || 0) < MASTERED_PALIER && (c.prochaineRevision || todayStr()) === j).length;
      return dejaMatiere < NOUVELLES_CARTES_MAX_PAR_JOUR && dejaGlobal < CHARGE_GLOBALE_MAX_PAR_JOUR;
    };
    const finZone = finFenetreCartesNeuves(matiere, dateControle); // étape E (même règle que l'import)
    const today = todayStr();
    // Temps 1 : hors zone. Si la carte est déjà DANS la zone, on repart
    // d'aujourd'hui pour l'en faire sortir. Bornée par finZone : pas de boucle infinie.
    let jour = jourCandidat < finZone ? jourCandidat : today;
    while(jour < finZone){
      if(aDePlace(jour)) return jour;
      jour = addDays(jour, 1);
    }
    // Temps 2 (repli) : rien de libre hors zone. Bornée par le contrôle.
    jour = finZone > today ? finZone : today;
    while(jour < dateControle){
      if(aDePlace(jour)) return jour;
      jour = addDays(jour, 1);
    }
    return dateControle;
  }
  let jour = jourCandidat;
  // Garde-fou : jamais plus d'un an de recherche (évite tout gel de l'app).
  for(let essai = 0; essai < 366; essai++){
    const dejaMatiere = CARDS.filter(c => c.matiere === matiere && c.id !== excludeId && (c.palier || 0) < MASTERED_PALIER && (c.prochaineRevision || todayStr()) === jour).length;
    const dejaGlobal = CARDS.filter(c => c.id !== excludeId && (c.palier || 0) < MASTERED_PALIER && (c.prochaineRevision || todayStr()) === jour).length;
    const okMatiere = dejaMatiere < NOUVELLES_CARTES_MAX_PAR_JOUR;
    const okGlobal = dejaGlobal < CHARGE_GLOBALE_MAX_PAR_JOUR;
    if(dateControle && jour >= dateControle) return jour;
    if(okMatiere && okGlobal) return jour;
    jour = addDays(jour, 1);
  }
  return jourCandidat;
}

function finaliserImport(items, renommages){
  const existingIds = new Set(CARDS.map(c => c.id));
  // Carte déjà présente (même id, même matière/question/réponse) : on l'ignore,
  // sinon réimporter une sauvegarde duplique toutes les cartes.
  const cartesParId = new Map(CARDS.map(c => [c.id, c]));
  let dejaPresentes = 0;
  items = items.filter(it => {
    const ex = it.id ? cartesParId.get(it.id) : null;
    const meme = ex && (renommages[it.matiere] || it.matiere) === (ex.matiere || 'Sans matière') && ex.question === it.question && ex.reponse === it.reponse;
    if(meme){ dejaPresentes++; return false; }
    return true;
  });
  const imported = loadImportedCards();
  const today = todayStr();
  let ajoutees = 0;
  const matieresTouchees = new Set();
  // Compteur { matiere: { jour: nombre déjà casé ce jour-là } } — sert
  // uniquement à étaler les cartes NEUVES (jamais révisées, sans date déjà
  // posée) de ce lot précis. Une carte restaurée depuis un JSON de backup a
  // déjà sa vraie prochaineRevision/derniereRevision/palier : elle n'est
  // jamais concernée par ce plafond, seulement redistribuée si c'est
  // réellement une carte neuve créée par ce lot.
  const compteurJourParMatiere = {};
  // Charge globale toutes matières : mémorise la charge déjà due (calculée
  // depuis CARDS) par jour, plus un compteur séparé ('_ajout_'+jour) pour ce
  // que CE lot est en train d'ajouter au fil de la boucle — les deux se
  // cumulent dans meilleurJourPourCarteNeuve/chargeDejaPresente ci-dessus.
  const compteurGlobalParJour = {};
  // Passe à true si au moins une carte neuve a dû être placée dans la zone
  // tampon avant le contrôle (repli). Sert à ajouter l'avertissement au message
  // final et est renvoyée à l'appelant (importerProgression).
  let auMoinsUnRepli = false;
  // Pré-passe : compte, par matière, combien de cartes NEUVES ce lot en
  // contient au total — nécessaire pour calculer le plafondProportionnel
  // (nbCartesMatiere / joursRestants) avant de savoir où les caser.
  const nbCartesNeuvesParMatiere = {};
  for(const it of items){
    if(!it.prochaineRevision && !it.derniereRevision && !it.palier){
      const m = renommages[it.matiere] || it.matiere;
      nbCartesNeuvesParMatiere[m] = (nbCartesNeuvesParMatiere[m] || 0) + 1;
    }
  }
  // Mémorise, par matière, le nombre de cartes déjà casées dans la fenêtre de
  // contrôle AVANT ce lot (calculé depuis CARDS) — évite de refiltrer CARDS
  // à chaque carte d'une même matière dans la boucle principale ci-dessous.
  const dejaDansFenetreParMatiere = {};
  for(const it of items){
    const matiere = renommages[it.matiere] || it.matiere;
    let id = it.id || genId();
    while(existingIds.has(id)) id = genId();
    existingIds.add(id);

    const estCarteNeuve = !it.prochaineRevision && !it.derniereRevision && !it.palier;
    let prochaineRevision = it.prochaineRevision || today;
    if(estCarteNeuve){
      const cfg = matieresConfig[matiere];
      const dateControle = (cfg && cfg.dateControle && cfg.dateControle >= today) ? cfg.dateControle : null;
      // Plafond proportionnel à la fenêtre restante, calculé une fois par
      // matière (nbTotalMatiere posé plus bas) : nbCartesMatiere / joursRestants,
      // arrondi au-dessus pour ne jamais tomber à 0 et bloquer l'étalement.
      let plafondProportionnel = null;
      if(dateControle){
        // Fenêtre raccourcie de la zone tampon : les cartes neuves ne sont pas
        // placées dans [D-ZONE, D], donc on répartit sur (jours restants - ZONE)
        // jours, avec un minimum de 1 (contrôle très proche : tout part en repli).
        // Étape E : la fenêtre s'arrête au dernier jour où une carte neuve a encore le
        // temps d'être maîtrisée (finFenetreCartesNeuves), pas seulement à la zone tampon.
        const finZoneFenetre = finFenetreCartesNeuves(matiere, dateControle);
        // On étale sur la fenêtre MOINS la marge visée (MARGE_CONTROLE_VISEE_JOURS) : les
        // cartes passent donc en priorité sur les premiers jours, et la dernière est
        // maîtrisée avec ~3 jours d'avance (statut « large »). Contrôle très proche :
        // l'étalement tombe à 1 jour et seuls les plafonds 20/matière et 30/jour limitent.
        const joursRestants = Math.max(1, Math.round((new Date(finZoneFenetre + "T00:00:00") - new Date(today + "T00:00:00")) / 86400000) - MARGE_CONTROLE_VISEE_JOURS);
        // Borne haute de la fenêtre où l'on compte les cartes déjà présentes :
        // strictement avant la zone tampon (même règle que meilleurJourPourCarteNeuve).
        // Le total à répartir inclut aussi les cartes de cette matière déjà
        // casées dans la fenêtre par un import PRÉCÉDENT (pas seulement les
        // nbTotalMatiere cartes neuves de CE lot) : sans ça, un 2e import
        // sur la même matière/contrôle ignore ce que le 1er a déjà réparti
        // et finit par tout déborder sur le dernier jour (celui du contrôle)
        // faute de place, alors qu'une vraie répartition partagée aurait pu
        // élargir un peu le plafond de chaque jour pour absorber les deux
        // lots ensemble sur toute la fenêtre.
        if(dejaDansFenetreParMatiere[matiere] == null){
          dejaDansFenetreParMatiere[matiere] = CARDS.filter(c => c.matiere === matiere && (c.palier || 0) < MASTERED_PALIER && c.prochaineRevision >= today && c.prochaineRevision < finZoneFenetre).length;
        }
        const nbTotalMatiere = (nbCartesNeuvesParMatiere[matiere] || 0) + dejaDansFenetreParMatiere[matiere];
        plafondProportionnel = Math.max(1, Math.ceil(nbTotalMatiere / joursRestants));
      }
      const { jour, repli } = meilleurJourPourCarteNeuve(matiere, today, dateControle, compteurJourParMatiere, compteurGlobalParJour, plafondProportionnel);
      if(repli) auMoinsUnRepli = true;
      // meilleurJourPourCarteNeuve ne crée pas toujours ce compteur (contrôle à J+0 :
      // aucune boucle ne tourne). On le crée ici avant de l'incrémenter.
      if(!compteurJourParMatiere[matiere]) compteurJourParMatiere[matiere] = {};
      compteurJourParMatiere[matiere][jour] = (compteurJourParMatiere[matiere][jour] || 0) + 1;
      compteurGlobalParJour['_ajout_' + jour] = (compteurGlobalParJour['_ajout_' + jour] || 0) + 1;
      prochaineRevision = jour;
    }

    const carte = {
      id, matiere, question: it.question, reponse: it.reponse,
      palier: it.palier || 0,
      prochaineRevision,
      derniereRevision: it.derniereRevision || null,
      // Un import manuel/IA (pas de derniereModification dans le fichier source,
      // ou restauration d'un vieux backup) pose l'horodatage technique à
      // "maintenant" : c'est bien une modification qui vient de se produire
      // sur cet appareil, elle doit pouvoir l'emporter en cas de future sync.
      derniereModification: it.derniereModification || new Date().toISOString(),
      difficultes: it.difficultes || 0,
      facileConsecutif: it.facileConsecutif || 0,
      facilite: facilitePour(it),
      inversible: it.inversible === true,
      ecrite: it.ecrite === true
    };
    if(ppImgValide(it.imageQuestion)) carte.imageQuestion = it.imageQuestion;
    if(ppImgValide(it.imageReponse)) carte.imageReponse = it.imageReponse;
    imported.push(carte);
    // L'overlay est ce qui est réappliqué par-dessus CARDS à chaque chargement
    // (voir applyLocalOverlay) : sans ça, difficultes/facileConsecutif seraient
    // perdus au prochain rechargement même si présents en mémoire juste après l'import.
    saveLocalOverlay(id, {
      palier: carte.palier,
      prochaineRevision: carte.prochaineRevision,
      derniereRevision: carte.derniereRevision,
      derniereModification: carte.derniereModification,
      difficultes: carte.difficultes,
      facileConsecutif: carte.facileConsecutif,
      facilite: carte.facilite,
      inversible: carte.inversible,
      ecrite: carte.ecrite
    });
    matieresTouchees.add(matiere);
    ajoutees++;
  }
  dernierImportEchec = false;
  if(!saveImportedCards(imported)){
    // Stockage plein : rien n'est ajouté (sinon les cartes disparaîtraient au rechargement avec un message de succès).
    dernierImportEchec = true;
    importMsg = { type:'err', text:'Stockage plein : import annulé, aucune carte ajoutée. Supprime des images ou des cartes.' };
    renderAdd();
    return false;
  }
  if(ajoutees > 0) CARDS = CARDS.concat(imported.slice(-ajoutees)); // slice(-0) renverrait TOUT
  dernierImportDejaPresentes = dejaPresentes;
  recalcPlanning();
  saveLocalPlanning();
  importMsg = { type:'ok', text:`${ajoutees} carte${ajoutees>1?'s':''} importée${ajoutees>1?'s':''} (${[...matieresTouchees].join(', ')}). Planning recalculé.${auMoinsUnRepli ? ' ' + MSG_AVERTISSEMENT_REPLI_ZONE : ''}` };
  if(matiereFilter !== 'toutes' && !getMatieres().includes(matiereFilter)) matiereFilter = 'toutes';
  renderAdd();
  render();
  return auMoinsUnRepli;
}

/* ---------------- Étalement des retards ----------------
   Quand tu sautes des jours, les cartes en retard s'empilent sur AUJOURD'HUI. Ici,
   si plus de CHARGE_GLOBALE_MAX_PAR_JOUR cartes (30) sont dues aujourd'hui, on en garde
   30 et on décale les autres sur les jours suivants, sans jamais dépasser :
   - LISSAGE_RETARDS_MAX_JOURS jours de décalage (3) ;
   - pour une matière avec contrôle : le dernier jour où la carte peut encore être
     maîtrisée à temps (D − temps minimum restant pour monter ses paliers, avec les
     intervalles resserrés), et au plus tard la veille du contrôle. C'est ce qui
     « utilise la marge » avant le contrôle, jamais au-delà.
   Priorité pour rester aujourd'hui : les cartes qui ont le MOINS de marge (contrôle le
   plus proche), puis les plus anciennes. Si aucune place n'existe dans la fenêtre,
   la carte reste due aujourd'hui (jamais perdue, jamais repoussée sans limite).
   Idempotent : relancé, il ne fait rien tant qu'il y a ≤ 30 cartes dues aujourd'hui. */
const LISSAGE_RETARDS_ACTIF = true;
const LISSAGE_RETARDS_MAX_JOURS = 3;

function annoncerEtalement(n, delaiMs){
  if(!(n > 0)) return;
  const msg = n + ' carte' + (n > 1 ? 's' : '') + ' en retard étalée' + (n > 1 ? 's' : '') + ' sur les prochains jours';
  setTimeout(() => { try{ ppToast(msg); }catch(e){} }, delaiMs || 0);
}

function lisserRetards(){
  if(!LISSAGE_RETARDS_ACTIF) return 0;
  const today = todayStr();
  const actives = new Set(getMatieresActives());
  const dues = CARDS.filter(c => actives.has(c.matiere || 'Sans matière') && (c.palier || 0) < MASTERED_PALIER && (c.prochaineRevision || today) <= today);
  if(dues.length <= CHARGE_GLOBALE_MAX_PAR_JOUR) return 0;

  const ecart = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
  const info = new Map();
  for(const c of dues){
    const m = c.matiere || 'Sans matière';
    const cfg = matieresConfig[m];
    const D = (cfg && cfg.dateControle && cfg.dateControle >= today) ? cfg.dateControle : null;
    let limite = addDays(today, LISSAGE_RETARDS_MAX_JOURS);
    if(D){
      const iv = getIntervalsForMatiere(m);
      let reste = 0;
      for(let q = (c.palier || 0) + 1; q < MASTERED_PALIER; q++) reste += iv[q];
      const dernier = addDays(D, -Math.max(1, reste));
      if(dernier < limite) limite = dernier;
    }
    info.set(c.id, { limite, marge: ecart(today, limite) });
  }
  // Les plus serrées d'abord (restent aujourd'hui), puis les plus anciennes.
  // Une carte ratée (orange/rouge) est replanifiée au lendemain de sa révision : à marge
  // égale elle reste aujourd'hui avant les autres (on ne retarde pas ce qu'on réapprend).
  const ratee = (c) => !!c.derniereRevision && (c.prochaineRevision || today) <= addDays(c.derniereRevision, 1);
  const ordre = dues.slice().sort((a, b) => {
    const d = info.get(a.id).marge - info.get(b.id).marge;
    if(d !== 0) return d;
    const r = (ratee(a) ? 0 : 1) - (ratee(b) ? 0 : 1);
    if(r !== 0) return r;
    const ra = a.prochaineRevision || today, rb = b.prochaineRevision || today;
    return ra < rb ? -1 : ra > rb ? 1 : 0;
  });
  const reste = ordre.slice(CHARGE_GLOBALE_MAX_PAR_JOUR);
  const idsReste = new Set(reste.map(c => c.id));
  // Charge déjà prévue chaque jour futur (hors cartes qu'on est en train de bouger).
  const charge = {};
  for(const c of CARDS){
    if((c.palier || 0) >= MASTERED_PALIER || idsReste.has(c.id)) continue;
    const j = c.prochaineRevision || today;
    if(j > today) charge[j] = (charge[j] || 0) + 1;
  }
  let plusVieux = null, deplacees = 0;
  for(const c of reste){
    const { limite } = info.get(c.id);
    let jour = addDays(today, 1), cible = null;
    while(jour <= limite){
      if((charge[jour] || 0) < CHARGE_GLOBALE_MAX_PAR_JOUR){ cible = jour; break; }
      jour = addDays(jour, 1);
    }
    if(!cible) continue; // pas de place dans la fenêtre : reste due aujourd'hui
    const orig = c.prochaineRevision || today;
    if(orig < today && (!plusVieux || orig < plusVieux)) plusVieux = orig;
    charge[cible] = (charge[cible] || 0) + 1;
    // IMPORTANT : on ne touche PAS à derniereModification. Elle sert à la synchro à
    // départager deux appareils : si on la mettait à « maintenant », un simple
    // décalage de date écraserait une révision faite ailleurs un peu plus tôt (la
    // carte reprendrait son ancien palier). Sans ça, la révision réelle gagne toujours,
    // et chaque appareil étale ses propres retards de son côté.
    c.prochaineRevision = cible;
    saveLocalOverlay(c.id, { prochaineRevision: cible });
    deplacees++;
  }
  if(deplacees > 0){
    if(plusVieux && getStreakData().lastDate !== today){
      // On garde la date la plus ancienne si un marqueur existe déjà. Pas de marqueur
      // si tu as déjà révisé aujourd'hui (la série est validée, rien à protéger).
      try{
        const ex = localStorage.getItem('lissage-marqueur-retard');
        if(!ex || plusVieux < ex) localStorage.setItem('lissage-marqueur-retard', plusVieux);
      }catch(e){}
    }
    recalcPlanning();
    saveLocalPlanning();
  }
  return deplacees;
}

/* ---------------- Fusion silencieuse depuis la synchro cross-device ----------------
   Chemin dédié, séparé de importerProgression()/finaliserImport() (utilisés
   par la restauration JSON manuelle et l'import IA) : la sync est déclenchée
   automatiquement à l'ouverture de l'app (voir recupererDepuisSync/init), et
   ne doit donc JAMAIS pouvoir ouvrir de dialogue interactif — en particulier
   pas resolveImportMatieres()/askMergeMatiere(), qui proposent une fusion de
   noms de matières proches. Ici les matières sont fusionnées silencieusement
   par nom exact : les deux appareils sont censés partager les mêmes noms,
   un éventuel doublon proche pourra toujours être corrigé à la main ensuite.

   Algorithme (par carte reçue) :
   - Tombstone local plus récent que la modif reçue -> ignorée (ne pas
     recréer une carte supprimée localement).
   - Id absent en local -> ajoutée telle quelle (comme une carte restaurée
     de backup : pas de plafonnement d'étalement, elle garde ses vraies dates).
   - Id déjà présent en local :
       - modif reçue plus récente que la modif locale -> écrase les champs
         de progression/contenu de la carte locale.
       - sinon -> la version locale est gardée telle quelle.
   Puis, pour chaque tombstone reçu du serveur :
       - la carte existe encore en local ET sa dernière modification locale
         est antérieure à la suppression distante -> supprimée localement.
       - sinon (modifiée localement après la suppression distante) -> gardée.

   Absence de derniereModification (vieux payload version 2, ou carte locale
   jamais retouchée depuis la mise à jour de l'app) traitée comme "très
   ancien" (epoch 0) : elle perd systématiquement tout conflit contre une
   version qui a un vrai horodatage. */
/* Dates de contrôle reçues de l'autre appareil. La plus récente gagne (horodatage
   par matière, cf. saveLocalDateControle). Une date effacée là-bas (absente de
   `datesControle` mais horodatée dans `datesControleMaj`) est effacée ici aussi.
   Une matière inconnue localement est ignorée (elle arrive avec ses cartes).
   Renvoie le nombre de dates modifiées. */
function fusionnerDatesControleDepuisSync(data, tsOf, nomsChanges){
  const dates = (data && data.datesControle && typeof data.datesControle === 'object') ? data.datesControle : {};
  const majRecu = (data && data.datesControleMaj && typeof data.datesControleMaj === 'object') ? data.datesControleMaj : {};
  const majLocal = loadDatesControleMaj();
  const existantes = new Set(getMatieres());
  const noms = new Set([...Object.keys(dates), ...Object.keys(majRecu)]);
  let changees = 0;
  noms.forEach(m => {
    if(!existantes.has(m)) return;
    const dateRecue = (typeof dates[m] === 'string' && dates[m]) ? dates[m] : null;
    const dateLocale = (matieresConfig[m] && matieresConfig[m].dateControle) || null;
    if(dateRecue === dateLocale) return;
    const tsRecu = tsOf(majRecu[m]);
    const tsLocal = tsOf(majLocal[m]);
    // Égalité (anciens appareils sans horodatage) : on ne remplit qu'une date vide.
    const recuGagne = tsRecu > tsLocal || (tsRecu === tsLocal && !dateLocale && dateRecue);
    if(!recuGagne) return;
    if(!matieresConfig[m]) matieresConfig[m] = {};
    matieresConfig[m].dateControle = dateRecue;
    saveLocalDateControle(m, dateRecue, majRecu[m] || undefined);
    if(nomsChanges) nomsChanges.push(m);
    changees++;
  });
  return changees;
}

/* Clé Gemini reçue de l'autre appareil : reprise si elle est plus récente que la
   nôtre, ou si on n'en a pas (et qu'on ne l'a pas volontairement retirée après). */
function fusionnerCleGeminiDepuisSync(data, tsOf){
  const cleRecue = (data && typeof data.geminiApiKey === 'string') ? data.geminiApiKey.trim() : '';
  if(!cleRecue) return; // jamais d'effacement à distance : « Changer » ne touche que cet appareil
  let cleLocale = '', majLocale = null;
  try{ cleLocale = localStorage.getItem('gemini_api_key') || ''; majLocale = localStorage.getItem('gemini_api_key_maj'); }catch(e){ return; }
  if(cleRecue === cleLocale) return;
  const tsRecu = tsOf(data.geminiApiKeyMaj);
  const tsLocal = tsOf(majLocale);
  if(tsRecu > tsLocal || (tsRecu === tsLocal && !cleLocale)){
    if(ppEcrire('gemini_api_key', cleRecue) && data.geminiApiKeyMaj) ppEcrire('gemini_api_key_maj', data.geminiApiKeyMaj);
  }
}

/* Matières VIDES reçues de l'autre appareil (avant, `matieresVides` était envoyé mais jamais lu). Une matière vide reçue
   n'est reprise que si elle n'a pas été supprimée ici APRÈS sa création ; une suppression reçue retire notre matière
   vide si elle a été créée avant. Renvoie le nombre de changements. */
function fusionnerMatieresVidesDepuisSync(data, tsOf){
  let changees = 0;
  const recues = Array.isArray(data.matieresVides) ? data.matieresVides.filter(m => typeof m === 'string' && m.trim()).map(m => m.trim()) : [];
  const datesRecues = ppEstObjet(data.matieresVidesDates) ? data.matieresVidesDates : {};
  const supRecues = ppEstObjet(data.matieresSupprimees) ? data.matieresSupprimees : {};
  const supLocales = loadMatieresSupprimees();
  for(const nom of recues){
    if(getMatieres().includes(nom)) continue;
    const cree = tsOf(datesRecues[nom]);
    if(tsOf(supLocales[nom]) > cree || tsOf(supRecues[nom]) > cree) continue;
    addEmptyMatiere(nom, typeof datesRecues[nom] === 'string' ? datesRecues[nom] : undefined);
    changees++;
  }
  for(const nom of Object.keys(supRecues)){
    if(typeof supRecues[nom] !== 'string') continue;
    const sup = tsOf(supRecues[nom]);
    const dates = loadMatieresVidesDates();
    if(loadEmptyMatieres().includes(nom) && tsOf(dates[nom]) < sup && !CARDS.some(c => (c.matiere || 'Sans matière') === nom)){
      deleteMatiereCompletement(nom);   // matière vide supprimée sur l'autre appareil
      changees++;
    }
    const sl = loadMatieresSupprimees();
    if(sup > tsOf(sl[nom])){ sl[nom] = supRecues[nom]; ppEcrire('cartes-matieres-supprimees', JSON.stringify(sl)); }
  }
  return changees;
}

function fusionnerDepuisSync(data){
  let cartesRecues, tombstonesRecus = [], reglagesRecus = null;
  if(Array.isArray(data)){
    cartesRecues = data;
  } else if(data && Array.isArray(data.cartes)){
    cartesRecues = data.cartes;
    tombstonesRecus = Array.isArray(data.cartesSupprimees) ? data.cartesSupprimees : [];
    fusionnerModelesSynthese(data.modelesSynthese); // modèles de consignes de synthèse
    reglagesRecus = data; // dates de contrôle + clé Gemini, appliquées après les cartes
  } else {
    return;
  }

  const tsOf = (v) => {
    if(!v) return 0;
    const t = Date.parse(v);
    return Number.isFinite(t) ? t : 0;
  };

  const tombstonesLocaux = loadTombstones();
  const tombstonesLocauxParId = new Map(tombstonesLocaux.map(t => [t.id, t]));

  const imported = loadImportedCards();
  const importedParId = new Map(imported.map(c => [c.id, c]));
  const cardsParId = new Map(CARDS.map(c => [c.id, c]));

  let ajoutees = 0, misesAJour = 0, ignorees = 0;
  const matieresTouchees = new Set();
  const reactivees = [];   // cartes supprimées ici mais modifiées plus récemment ailleurs : elles reviennent, il faut les sortir de « cartes-deleted »

  for(const item of cartesRecues){
    if(!item || typeof item !== 'object') continue;
    const id = item.id ? String(item.id) : null;
    if(!id) continue;
    const question = (item.question || '').toString().trim();
    const reponse = (item.reponse || '').toString().trim();
    if((!question && !ppImgValide(item.imageQuestion)) || (!reponse && !ppImgValide(item.imageReponse))) continue;
    const matiere = (item.matiere || 'Sans matière').toString().trim();
    const palier = Number.isInteger(item.palier) ? Math.max(0, Math.min(item.palier, INTERVALS.length - 1)) : 0;
    // Sans date reçue : aujourd'hui (jamais null, sinon la carte compterait comme due tous les jours).
    const prochaineRevision = typeof item.prochaineRevision === 'string' ? item.prochaineRevision : todayStr();
    const derniereRevision = typeof item.derniereRevision === 'string' ? item.derniereRevision : null;
    const derniereModificationRecue = typeof item.derniereModification === 'string' ? item.derniereModification : null;
    const difficultes = Number.isFinite(item.difficultes) ? Math.max(0, item.difficultes) : 0;
    const facileConsecutif = Number.isFinite(item.facileConsecutif) ? Math.max(0, item.facileConsecutif) : 0;
    const inversible = item.inversible === true, ecrite = item.ecrite === true;
    const imgs = ppImgPatch(item);
    // Absent (autre appareil pas encore à jour) : on ne touche pas à la facilité locale.
    const faciliteRecue = Number.isFinite(item.facilite) ? facilitePour({ facilite: item.facilite }) : null;

    // Tombstone local plus récent que la modif reçue -> on vient de la
    // supprimer ici, ne pas la laisser revenir.
    const tombstoneLocal = tombstonesLocauxParId.get(id);
    if(tombstoneLocal && tsOf(tombstoneLocal.supprimeLe) > tsOf(derniereModificationRecue)){
      ignorees++;
      continue;
    }

    const localCarte = cardsParId.get(id);
    const patch = {
      matiere, question, reponse, palier, prochaineRevision, derniereRevision,
      derniereModification: derniereModificationRecue, difficultes, facileConsecutif, inversible, ecrite
    };
    if(faciliteRecue !== null) patch.facilite = faciliteRecue;

    if(!localCarte){
      // Nouvelle carte pour cet appareil : ajoutée telle quelle, comme une
      // restauration de backup (garde ses vraies dates, pas d'étalement).
      const nouvelle = { id, ...patch, ...imgs };
      imported.push(nouvelle);
      importedParId.set(id, nouvelle);
      CARDS.push(nouvelle);
      cardsParId.set(id, nouvelle);
      saveLocalOverlay(id, patch);
      reactivees.push(id);
      matieresTouchees.add(matiere);
      ajoutees++;
      continue;
    }

    if(tsOf(derniereModificationRecue) > tsOf(localCarte.derniereModification)){
      Object.assign(localCarte, patch, imgs);
      const importedCarte = importedParId.get(id);
      if(importedCarte){ Object.assign(importedCarte, patch, imgs); ppOverlayRetirerImages(id); }
      saveLocalOverlay(id, importedCarte ? patch : { ...patch, ...imgs });
      matieresTouchees.add(matiere);
      misesAJour++;
    }
    // Sinon : version locale plus récente ou égale, on ne touche à rien.
  }
  saveImportedCards(imported);
  // Une carte revenue ne doit plus figurer dans « cartes-deleted » (sinon elle disparaît au démarrage hors ligne) ni dans le tombstone local.
  retirerSuppressionsLocales(reactivees);

  // Tombstones reçus : propager les suppressions faites sur l'autre appareil.
  let supprimees = 0;
  const idsAEffacer = [];
  for(const t of tombstonesRecus){
    if(!t || !t.id) continue;
    const localCarte = cardsParId.get(t.id);
    if(!localCarte) continue; // déjà absente localement, rien à faire
    if(tsOf(localCarte.derniereModification) < tsOf(t.supprimeLe)){
      CARDS = CARDS.filter(c => c.id !== t.id);
      cardsParId.delete(t.id);
      idsAEffacer.push(t.id);
      supprimees++;
    }
    // Sinon : modifiée localement après la suppression distante -> on la garde.
  }
  saveLocalDeleteLot(idsAEffacer);
  if(supprimees > 0){
    // Retire aussi des cartes "importées" celles qu'on vient de supprimer
    // (celles qui viennent du seed n'y sont de toute façon pas stockées).
    const idsSupprimes = new Set(tombstonesRecus.filter(t => t && t.id).map(t => t.id));
    saveImportedCards(loadImportedCards().filter(c => !idsSupprimes.has(c.id) || CARDS.some(cc => cc.id === c.id)));
  }

  // Fusionne aussi les tombstones reçus dans la liste locale, pour que ce
  // même appareil sache déjà (sans attendre un futur envoi) qu'ils existent
  // s'il resynchronise avec un troisième appareil plus tard.
  if(tombstonesRecus.length){
    const fusion = new Map(tombstonesLocaux.map(t => [t.id, t]));
    for(const t of tombstonesRecus){
      if(!t || !t.id) continue;
      const existant = fusion.get(t.id);
      if(!existant || tsOf(t.supprimeLe) > tsOf(existant.supprimeLe)) fusion.set(t.id, { id: t.id, supprimeLe: t.supprimeLe });
    }
    saveTombstones([...fusion.values()]);
  }

  // Dates de contrôle et clé Gemini : appliquées APRÈS les cartes, pour que les
  // matières reçues existent déjà ici (sinon on créerait des matières fantômes).
  const nomsDatesChangees = [];
  const datesChangees = reglagesRecus ? fusionnerDatesControleDepuisSync(reglagesRecus, tsOf, nomsDatesChangees) : 0;
  if(reglagesRecus) fusionnerCleGeminiDepuisSync(reglagesRecus, tsOf);
  const videsChangees = reglagesRecus ? fusionnerMatieresVidesDepuisSync(reglagesRecus, tsOf) : 0;

  if(ajoutees > 0 || misesAJour > 0 || supprimees > 0 || datesChangees > 0 || videsChangees > 0){
    if(matiereFilter !== 'toutes' && !getMatieres().includes(matiereFilter)) matiereFilter = 'toutes';
    // Une date de contrôle reçue : chaque appareil recale SES cartes (sans toucher à derniereModification, donc sans
    // jamais écraser une révision de l'autre appareil).
    if(nomsDatesChangees.length){
      clearIntervalsCache();
      nomsDatesChangees.forEach(m => { try{ reprogrammerCartesMatiere(m); }catch(e){} });
    }
    recalcPlanning();
    saveLocalPlanning();
  }
}

function createCardWithMatiere(matiere, question, reponse, keepOpen, images){
  if(images && (images.q || images.r) && !ppImgPlace((images.q || '') + (images.r || ''), 0)){ ppToast(MSG_IMG_PLEIN); return false; }
  const today = todayStr();
  const id = genId();
  const imported = loadImportedCards();
  // Une seule carte à la fois ici (contrairement à finaliserImport, qui gère
  // un lot) : pas besoin de compteurs à faire vivre entre plusieurs cartes,
  // le même plafonnerDateRevision que answer()/quizAnswer() suffit — sans
  // lui, ajouter une carte manuelle un jour déjà plein pour cette matière (ou
  // globalement) contournait totalement le plafond de l'import.
  const cfgMatiereCreate = matieresConfig[matiere];
  const dateControleCreate = (cfgMatiereCreate && cfgMatiereCreate.dateControle && cfgMatiereCreate.dateControle >= today) ? cfgMatiereCreate.dateControle : null;
  // Carte créée = toujours neuve : elle évite la zone tampon avant le contrôle.
  const prochaineRevision = plafonnerDateRevision(matiere, today, dateControleCreate, id, true);
  const newCard = { id, matiere, question, reponse, palier: 0, prochaineRevision, derniereRevision: null, derniereModification: new Date().toISOString(), inversible: createInversible === true, ecrite: createEcrite === true };
  if(images && images.q) newCard.imageQuestion = images.q;
  if(images && images.r) newCard.imageReponse = images.r;
  imported.push(newCard);
  if(!saveImportedCards(imported)) return false;   // stockage plein : ppEcrire a prévenu, la carte n'est pas ajoutée
  CARDS = CARDS.concat([newCard]);
  clearEmptyMatiereIfHasCards(matiere);
  recalcPlanning();
  saveLocalPlanning();
  matiereFilter = matiere;
  if(activeTab === 'study') buildQueue();
  render();
  // Repli : la carte neuve a dû être placée dans la zone tampon → on prévient.
  showCreatedToast(estEnRepliZoneTampon(prochaineRevision, dateControleCreate) ? MSG_AVERTISSEMENT_REPLI_ZONE : null);
  if(keepOpen){
    // Vide les champs en place, sans détruire/recréer la page (transition fluide).
    resetCreateCardFields();
  } else {
    closeCreateCard();
  }
  return true;
}
