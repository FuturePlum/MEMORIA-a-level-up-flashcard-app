/* Génère de NOUVELLES cartes à partir des seuls fichiers ajoutés après coup.
   Les cartes existantes sont transmises à l'IA pour qu'elle évite les doublons ;
   les nouvelles sont ajoutées à la fin de l'aperçu (les ⇄ déjà cochés ne bougent pas). */
async function genererCartesSupp(){
  if(!iaCartesPreview || iaSuppEnCours) return;
  const zoneTexteSupp = document.getElementById('ia-supp-textarea');
  const texteSupp = ((zoneTexteSupp ? zoneTexteSupp.value : iaTexteSupp) || '').trim();
  iaTexteSupp = texteSupp;
  if(!texteSupp && iaFichiersSupp.length === 0){ importMsg = { type:'err', text:'Colle d\'abord un texte, ou ajoute une photo ou un document.' }; renderAdd(); return; }
  if(poidsFichiers(iaFichiersSupp) > POIDS_MAX_ENVOI){ importMsg = { type:'err', text: msgTropLourd(poidsFichiers(iaFichiersSupp)) }; renderAdd(); return; }
  if(!getGeminiKey()){ importMsg = { type:'err', text:"Ajoute ta clé API Gemini dans Réglages d'abord." }; renderAdd(); return; }

  iaSuppEnCours = true;
  const btn = document.getElementById('ia-supp-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Génération en cours...'; }
  importMsg = null;

  const existantes = JSON.stringify(iaCartesPreview.cartes.filter(c => c.question).map(c => ({ question: c.question, reponse: c.reponse })));
  const parts = [{ text: `${GEMINI_SYSTEM_PROMPT}\n\nDes cartes existent déjà sur ce cours (JSON) :\n${existantes}\n\nGénère UNIQUEMENT de nouvelles cartes à partir du nouveau contenu ci-dessous (texte et/ou documents/images joints). Ne reprends, ne reformule et ne duplique aucune carte existante. Réponds uniquement avec le tableau JSON des nouvelles cartes.${texteSupp ? ('\n\nNouveau texte de cours :\n' + texteSupp) : ''}` }];
  const pfSupp = ppPartsFichiers(iaFichiersSupp, iaImgBanque.length);
  parts.push(...pfSupp.parts);
  if(pfSupp.total > iaImgBanque.length) parts.push({ text: PROMPT_IMAGES });

  let nouvelles;
  try{
    nouvelles = await appelerGeminiPourCartes(parts, { garderImages: true, onRetry: () => { const b = document.getElementById('ia-supp-btn'); if(b) b.textContent = 'Nouvelle tentative...'; } });
  }finally{
    iaSuppEnCours = false;
    const b = document.getElementById('ia-supp-btn');
    if(b){ b.disabled = false; b.textContent = "Générer d'autres cartes"; }
  }
  if(nouvelles === null){ renderAdd(); return; }
  if(!iaCartesPreview){ renderAdd(); return; } // aperçu fermé pendant l'attente

  await ppImgBanqueAjouter(iaFichiersSupp);   // les nouvelles photos prolongent la numérotation
  if(!iaCartesPreview){ renderAdd(); return; }
  nouvelles = await ppImgResoudre(nouvelles);
  const deja = new Set(iaCartesPreview.cartes.map(c => (c.question || '').trim().toLowerCase()));
  const aAjouter = nouvelles.filter(c => !deja.has(c.question.trim().toLowerCase())).map(c => ({ ...c, inversible: false }));
  iaCartesPreview.cartes.push(...aAjouter);
  iaFichiersOriginal.push(...iaFichiersSupp.map(f => ({ ...f }))); // pour la synthèse et les ajustements
  if(texteSupp) iaCoursOriginal = (iaCoursOriginal ? iaCoursOriginal + '\n\n' : '') + texteSupp; // idem pour le texte
  iaFichiersSupp = []; iaFichiersSuppMsg = null; iaTexteSupp = ''; iaRefineBrouillon = '';
  importMsg = aAjouter.length
    ? { type:'ok', text: `${aAjouter.length} nouvelle${aAjouter.length > 1 ? 's' : ''} carte${aAjouter.length > 1 ? 's' : ''} ajoutée${aAjouter.length > 1 ? 's' : ''} à la fin de la liste.` }
    : { type:'err', text:'Aucune nouvelle carte : tout existait déjà.' };
  renderAdd();
}

/* ================= FICHE DE SYNTHÈSE =================
   À partir du même cours (texte + fichiers joints) que les flashcards, l'IA
   rédige une synthèse selon des consignes écrites par l'utilisateur.
   Résultat : Markdown modifiable, exportable en .docx et en PDF.
   Tout se passe dans le navigateur (aucun serveur, aucune librairie externe).

   Deux entrées, un seul écran :
   - Bouton A (onglet Ajouter) : cours = texte saisi + fichiers en cours d'ajout.
   - Bouton B (aperçu des cartes) : cours = celui gardé en mémoire avec les cartes.
   Rien n'est sauvegardé automatiquement, sauf les MODÈLES de consignes. */

const GEMINI_SYNTHESE_SYSTEM_PROMPT = `Tu rédiges une fiche de synthèse à partir du cours fourni, comme un élève organisé qui révise. Réponds uniquement en Markdown, sans phrase d'introduction ni de conclusion, sans bloc de code englobant, sans ligne de séparation (---).

Style à respecter toujours :
- Un titre # pour le sujet, puis des blocs numérotés avec des titres ## (« 1. Définition », « 2. … »). Sous-parties en ###. Un bloc = une seule idée, court et clair.
- Style télégraphique, sans phrases complètes : le sujet est écrit une seule fois (dans le titre du bloc), puis les actions en verbes seuls, sans sujet ni « il/elle », sans « puis/ensuite/et » inutiles, sans mots de liaison ni compléments évidents. Garde un article seulement s'il est utile. Exemple : « Hitler supprime l'opposition. Il crée ensuite le IIIe Reich, rejette Versailles puis réarme l'Allemagne. » → titre « Hitler chancelier · 1933 », puis « Supprime l'opposition, crée le IIIe Reich, rejette Versailles, réarme ». Dans les matières de raisonnement (sciences, économie, droit…), garde les liens de cause et de condition (« car », « donc », « si… alors ») quand ils font comprendre : ne les supprime pas.
- Privilégie les symboles aux mots dès que c'est possible. Raccourcis à utiliser : « → » définir ou relier ; « ⇒ » conséquence ou conclusion ; « = » égale ou signifie ; « ≠ » différent de ou opposé à ; « ↑ » augmente ; « ↓ » diminue. N'utilise pas « > » ni « + » à la place de mots.
- Mots-clés et dates importants en **gras**. Exemples en *italique* (« Exemple : … »). Une règle ou une formule est toujours suivie d'un exemple, calculé pas à pas si c'est chiffré. Formules et définitions clés en citation (>).
- Tableau Markdown seulement pour comparer plusieurs éléments.
- Pastilles 🟢 (positif, avantage), 🔵 (neutre, information), 🔴 (négatif, danger, tragique, inconvénient) : seulement quand un élément est clairement positif, négatif ou neutre (avantages/inconvénients, bilans…), jamais à chaque puce.
- Histoire : blocs chronologiques, titre = sujet + date (« Munich · 1938 »), puis actions en verbes seuls. Sciences : définition, formule, exemple calculé. Autres matières (économie, droit, langues, géographie…) : définition ou principe, puis explication courte, puis exemple.
- Termine par un bloc « À retenir » de 3 à 5 puces.
- Synthèse courte, mais qui garde tout ce qui est important. Reste fidèle au cours, n'invente rien. Écris dans la langue du cours.

Si l'utilisateur donne des précisions, elles passent avant ce style en cas de conflit.`;

/* ---- v122 : images dans les synthèses ----
   Les images vivent dans syntheseEtat.images (jamais sauvegardées, comme la synthèse). Dans le Markdown, une image est
   une ligne seule  ![légende](img:N)  (N = numéro, à partir de 1). Elle vient soit d'une photo jointe (l'IA la voit,
   numérotée « Image N »), soit d'une carte de la matière (Parcourir), soit ajoutée à la main avec le bouton « Ajouter une image ». */
const SYN_IMG_MAX = 24;
const PROMPT_IMAGES_SYNTH = `Images : certaines illustrations sont numérotées. Soit elles sont jointes (« Image 1 », « Image 2 »…) et tu les vois, soit elles sont signalées dans le cours par « [illustration … img:N] » (tu ne les vois pas, elles appartiennent à une carte). Tu peux en insérer dans la synthèse, mais SEULEMENT si c'est une vraie illustration utile (carte géographique, schéma, figure, graphique, photo, tableau en image), jamais une simple page de texte ou de notes : dans ce cas, reprends son contenu en texte. Pour insérer une image : une ligne seule, juste après le bloc concerné, au format ![légende courte](img:N) (N = son numéro). Chaque image au maximum une fois, n'invente aucun numéro, et si aucune image n'est utile n'en mets pas. Dans une synthèse existante, garde les lignes ![…](img:N) déjà présentes sauf demande contraire.`;
function promptSyntheseBase(s){
  return GEMINI_SYNTHESE_SYSTEM_PROMPT + ((s && s.images && s.images.length) ? '\n\n' + PROMPT_IMAGES_SYNTH : '');
}
function synJpegInfo(b64){
  try{
    const bin = atob(b64); let i = 2;
    while(i < bin.length - 9){
      if(bin.charCodeAt(i) !== 0xFF){ i++; continue; }
      const m = bin.charCodeAt(i + 1);
      if(m === 0xFF){ i++; continue; }
      if(m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC){
        return { h: (bin.charCodeAt(i + 5) << 8) | bin.charCodeAt(i + 6), w: (bin.charCodeAt(i + 7) << 8) | bin.charCodeAt(i + 8), c: bin.charCodeAt(i + 9) };
      }
      i += 2 + ((bin.charCodeAt(i + 2) << 8) | bin.charCodeAt(i + 3));
    }
  }catch(e){}
  return null;
}
/* Ajoute une data URL JPEG à une liste d'images de synthèse ; renvoie son numéro (à partir de 1) ou 0. */
function synImgPush(liste, url){
  const m = /^data:image\/jpeg;base64,([A-Za-z0-9+\/=]+)$/.exec(url || '');
  if(!m) return 0;
  const info = synJpegInfo(m[1]) || { w:800, h:600, c:3 };
  liste.push({ url, b64:m[1], w:info.w || 800, h:info.h || 600, c:info.c || 3 });
  return liste.length;
}
function synImage(n){
  const s = syntheseEtat;
  return (s && s.images && s.images[n - 1]) || null;
}
/* Prépare les photos jointes : réduites une fois, numérotées (f.synN), gardées en mémoire pour l'aperçu et les exports. */
async function synBanqueSync(s, liste){
  for(const f of (liste || [])){
    if(!ppEstPhoto(f) || f.synN) continue;
    if(s.images.length >= SYN_IMG_MAX) continue;
    try{
      const url = await ppImgReduire(ppBlobDepuisBase64(f.dataBase64, f.mimeType));
      const n = synImgPush(s.images, url);
      if(n) f.synN = n;
    }catch(e){}
  }
}
function synFigureHtml(b){
  const im = synImage(b.n);
  if(!im) return '';
  const leg = b.legende ? `<figcaption>${enLigneHtml(b.legende)}</figcaption>` : '';
  return `<figure class="synth-fig"><img src="${im.url}" alt="${attrEchappe(b.legende || 'Illustration')}">${leg}</figure>`;
}
async function synImgChoisie(ev){
  const s = syntheseEtat, inp = ev.target, file = inp.files && inp.files[0];
  inp.value = '';
  if(!s || !file) return;
  if(s.images.length >= SYN_IMG_MAX){ ppToast('Maximum ' + SYN_IMG_MAX + ' images'); return; }
  let url = '';
  try{ url = await ppImgReduire(file); }catch(e){ ppToast('Image illisible'); return; }
  const n = synImgPush(s.images, url);
  if(!n){ ppToast('Image illisible'); return; }
  const zone = document.getElementById('synth-markdown');
  let md = zone ? zone.value : s.markdown;
  const ligne = `![](img:${n})`;
  const pos = Math.max(0, Math.min(md.length, (typeof s.curseur === 'number') ? s.curseur : md.length));
  md = md.slice(0, pos).replace(/\s+$/, '') + (pos > 0 ? '\n\n' : '') + ligne + '\n\n' + md.slice(pos).replace(/^\s+/, '');
  s.markdown = md.replace(/\s+$/, '') + '\n'; s.curseur = null; s.copie = false; s.msg = null;
  renderSynthese();
  ppToast('Image ajoutée');
}

/* Précisions facultatives de l'utilisateur, ajoutées au style par défaut. */
function textePrecisionsSynthese(consignes){
  const t = String(consignes || '').trim();
  return t ? `\n\nPrécisions de l'utilisateur :\n${t}` : '';
}

/* --- État de session (jamais sauvegardé, sauf les modèles) --- */
let syntheseEtat = null;
/* { source:'ajout'|'apercu'|'parcourir', matiere, cours, fichiers:[…], consignes, modeleChoisi,
     markdown, vue:'edition'|'apercu', etape:'consignes'|'resultat',
     enCours:false, msg:null, copie:false } */

/* --- Modèles de consignes : stockés en local ET synchronisés --- */
const SYNTHESE_MODELES_KEY = 'synthese-modeles';

function chargerModelesSynthese(){
  try{
    const brut = JSON.parse(localStorage.getItem(SYNTHESE_MODELES_KEY) || '[]');
    return nettoyerModelesSynthese(brut);
  }catch(e){ return []; }
}

function nettoyerModelesSynthese(liste){
  if(!Array.isArray(liste)) return [];
  const vus = new Set();
  const propres = [];
  for(const m of liste){
    if(!m || typeof m !== 'object') continue;
    const nom = String(m.nom || '').trim();
    const texte = String(m.texte || '').trim();
    if(!nom || !texte) continue;
    const cle = nom.toLowerCase();
    if(vus.has(cle)) continue;
    vus.add(cle);
    propres.push({ nom, texte, modifieLe: typeof m.modifieLe === 'string' ? m.modifieLe : null });
  }
  return propres;
}

function sauverModelesSynthese(liste){
  ppEcrire(SYNTHESE_MODELES_KEY, JSON.stringify(nettoyerModelesSynthese(liste)));
  if(typeof envoyerVersSync === 'function') envoyerVersSync();
}

/* Fusion (import de sauvegarde ou synchro) : pour un même nom, on garde le plus
   récent ; les modèles qui n'existent que d'un côté sont conservés. Un modèle
   supprimé sur un appareil peut donc revenir depuis l'autre : c'est voulu, on
   préfère ne jamais perdre une consigne rédigée avec soin. */
function fusionnerModelesSynthese(recus){
  const distants = nettoyerModelesSynthese(recus);
  if(!distants.length) return;
  const ts = (v) => { const t = v ? Date.parse(v) : 0; return Number.isFinite(t) ? t : 0; };
  const locaux = chargerModelesSynthese();
  const parNom = new Map(locaux.map(m => [m.nom.toLowerCase(), m]));
  let change = false;
  for(const d of distants){
    const l = parNom.get(d.nom.toLowerCase());
    if(!l){ parNom.set(d.nom.toLowerCase(), d); change = true; }
    else if(ts(d.modifieLe) > ts(l.modifieLe) && d.texte !== l.texte){ parNom.set(d.nom.toLowerCase(), d); change = true; }
  }
  if(!change) return;
  ppEcrire(SYNTHESE_MODELES_KEY, JSON.stringify([...parNom.values()]));
}

/* Renvoie { texte } ou { erreur }. */
/* v117 : cette fonction était appelée (génération, ajustement, « Compléter ») mais n'existait nulle part :
   l'appel plantait avant d'envoyer quoi que ce soit et l'écran restait sur « Génération en cours » sans message.
   Elle construit les `parts` Gemini du cours : le texte, puis chaque fichier (texte extrait, ou image/PDF en base64). */
function partiesCoursSynthese(src){
  const cours = String((src && src.cours) || '').trim();
  const fichiers = (src && src.fichiers) || [];
  const parts = [{ text: cours ? ('\n\nCours :\n' + cours) : '\n\nRédige la synthèse à partir des documents/images joints.' }];
  fichiers.forEach(f => {
    if(f.texte !== undefined) parts.push({ text: `\n\nDocument « ${f.name} » :\n${f.texte}` });
    else {
      if(f.synN && ppEstPhoto(f)) parts.push({ text: `\n\nImage ${f.synN} :` });
      parts.push({ inline_data: { mime_type: f.mimeType, data: f.dataBase64 } });
    }
  });
  return parts;
}

/* v117 : filet de sécurité — si une erreur imprévue survient pendant une synthèse, on débloque l'écran et on l'affiche. */

  s.enCours = false;
  s.msg = { type:'err', text:"Erreur inattendue dans l'app. Réessaie, et si ça recommence, ferme puis rouvre l'app." };
  if(syntheseEtat === s) renderSynthese();

async function appelerGeminiPourSynthese(parts, options){
  const opts = options || {};
  const conserve = opts.texteConserve !== false;
  const key = getGeminiKey();
  if(!key) return { erreur: "Ajoute ta clé API Gemini dans Réglages d'abord." };
  if(!/^[\x21-\x7e]+$/.test(key)) return { erreur: 'La clé Gemini contient des caractères non valides : copie-la de nouveau depuis Google.' };
  let response;
  try{
    response = await fetchGeminiAvecRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({ contents: [{ parts }] })
    }, opts.onRetry);
  }catch(err){
    return { erreur: messageErreurReseau(err, conserve) };
  }
  if(!response.ok) return { erreur: messageErreurGemini(response.status, conserve) };
  let data;
  try{ data = await response.json(); }
  catch(e){ return { erreur: 'Réponse du serveur illisible, réessaie.' }; }
  const cand = data && data.candidates && data.candidates[0];
  const brut = cand && cand.content && Array.isArray(cand.content.parts)
    ? cand.content.parts.map(p => p.text || '').join('')
    : '';
  const texte = nettoyerReponseSynthese(brut);
  if(!texte){
    const motif = (data && data.promptFeedback && data.promptFeedback.blockReason) || (cand && cand.finishReason) || '';
    return { erreur: (motif && motif !== 'STOP')
      ? "L'IA a bloqué ou refusé cette demande (contenu filtré). Modifie un peu le texte et réessaie."
      : "L'IA n'a rien renvoyé, réessaie." };
  }
  return { texte, tronque: !!(cand && cand.finishReason === 'MAX_TOKENS') };
}

/* Retire un éventuel bloc ``` qui envelopperait toute la réponse. */
function nettoyerReponseSynthese(texte){
  let t = String(texte || '').trim();
  const m = t.match(/^```(?:markdown|md)?[ \t]*\n([\s\S]*?)\n```$/i);
  if(m) t = m[1].trim();
  return t;
}

/* ================= Markdown -> blocs =================
   Sous-ensemble volontairement limité : titres #-###, paragraphes, listes à
   puces / numérotées (imbriquées par indentation), tableaux, citations, règle,
   gras, italique, code en ligne. Les deux exports (HTML et Word) partent des
   mêmes blocs pour rester identiques. */
function analyserMarkdown(md){
  const lignes = String(md || '').replace(/\r\n?/g, '\n').split('\n');
  const blocs = [];
  let para = [];
  const viderPara = () => { if(para.length){ blocs.push({ type:'p', texte: para.join(' ') }); para = []; } };
  const estLigneTable = l => /^\s*\|.*\|\s*$/.test(l);
  const estSepTable = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l) && l.includes('-');
  const cellules = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());

  for(let i = 0; i < lignes.length; i++){
    const l = lignes[i];
    if(!l.trim()){ viderPara(); continue; }

    const mi = l.match(/^\s*(?:[-*+]\s+)?!\[([^\]]*)\]\(img:(\d+)\)\s*$/);
    if(mi){ viderPara(); blocs.push({ type:'img', n: parseInt(mi[2], 10), legende: mi[1].trim() }); continue; }

    let m = l.match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/);
    if(m){ viderPara(); blocs.push({ type:'h', niveau: Math.min(m[1].length, 3), texte: m[2] }); continue; }

    if(/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(l)){ viderPara(); blocs.push({ type:'hr' }); continue; }

    if(estLigneTable(l) && i + 1 < lignes.length && estSepTable(lignes[i + 1])){
      viderPara();
      const entete = cellules(l);
      const lignesTable = [];
      i += 2;
      while(i < lignes.length && estLigneTable(lignes[i])){ lignesTable.push(cellules(lignes[i])); i++; }
      i--;
      blocs.push({ type:'table', entete, lignes: lignesTable });
      continue;
    }

    m = l.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if(m){
      viderPara();
      const items = [];
      while(i < lignes.length){
        const mm = lignes[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if(!mm) break;
        const indent = mm[1].replace(/\t/g, '    ').length;
        items.push({ niveau: Math.min(Math.floor(indent / 2), 3), ordonne: /\d/.test(mm[2]), texte: mm[3] });
        i++;
      }
      i--;
      blocs.push({ type:'liste', items });
      continue;
    }

    m = l.match(/^\s{0,3}>\s?(.*)$/);
    if(m){
      viderPara();
      const morceaux = [m[1]];
      while(i + 1 < lignes.length && /^\s{0,3}>\s?/.test(lignes[i + 1])){ i++; morceaux.push(lignes[i].replace(/^\s{0,3}>\s?/, '')); }
      blocs.push({ type:'citation', texte: morceaux.join(' ') });
      continue;
    }

    para.push(l.trim());
  }
  viderPara();
  return blocs;
}

/* Découpe le texte d'une ligne en morceaux {t, gras, italique, code}. */
function decouperEnLigne(texte){
  const morceaux = [];
  const re = /(\*\*\*[^*]+?\*\*\*|\*\*[^*]+?\*\*|__[^_]+?__|`[^`]+?`|\*[^*\s][^*]*?\*|_[^_\s][^_]*?_)/g;
  let dernier = 0, m;
  const nettoyer = s => s.replace(/\\([\\`*_{}\[\]()#+\-.!|>])/g, '$1');
  const s = String(texte || '');
  while((m = re.exec(s)) !== null){
    if(m.index > dernier) morceaux.push({ t: nettoyer(s.slice(dernier, m.index)) });
    const brut = m[0];
    if(brut.startsWith('***')) morceaux.push({ t: brut.slice(3, -3), gras:true, italique:true });
    else if(brut.startsWith('**') || brut.startsWith('__')) morceaux.push({ t: brut.slice(2, -2), gras:true });
    else if(brut.startsWith('`')) morceaux.push({ t: brut.slice(1, -1), code:true });
    else morceaux.push({ t: brut.slice(1, -1), italique:true });
    dernier = m.index + brut.length;
  }
  if(dernier < s.length) morceaux.push({ t: nettoyer(s.slice(dernier)) });
  return morceaux.filter(x => x.t !== '');
}

function enLigneHtml(texte){
  return decouperEnLigne(texte).map(x => {
    let h = escapeHtml(x.t);
    if(x.code) h = `<code>${h}</code>`;
    if(x.gras) h = `<strong>${h}</strong>`;
    if(x.italique) h = `<em>${h}</em>`;
    return h;
  }).join('');
}

function markdownVersHtml(md){
  const blocs = analyserMarkdown(md);
  if(!blocs.length) return '<p style="color:var(--muted);">(Synthèse vide)</p>';
  return blocs.map(b => {
    if(b.type === 'h') return `<h${b.niveau}>${enLigneHtml(b.texte)}</h${b.niveau}>`;
    if(b.type === 'p') return `<p>${enLigneHtml(b.texte)}</p>`;
    if(b.type === 'hr') return '<hr>';
    if(b.type === 'citation') return `<blockquote>${enLigneHtml(b.texte)}</blockquote>`;
    if(b.type === 'img') return synFigureHtml(b);
    if(b.type === 'table'){
      return `<div class="synth-table-wrap"><table><thead><tr>${b.entete.map(c => `<th>${enLigneHtml(c)}</th>`).join('')}</tr></thead><tbody>${b.lignes.map(r => `<tr>${b.entete.map((_, k) => `<td>${enLigneHtml(r[k] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }
    if(b.type === 'liste'){
      // Rendu imbriqué : on ouvre/ferme des <ul>/<ol> selon le niveau.
      let html = '', pile = [];
      for(const it of b.items){
        const balise = it.ordonne ? 'ol' : 'ul';
        while(pile.length > it.niveau + 1) html += `</li></${pile.pop()}>`;
        if(pile.length === it.niveau + 1){ html += '</li>'; }
        while(pile.length < it.niveau + 1){ html += `<${balise}>`; pile.push(balise); }
        html += `<li>${enLigneHtml(it.texte)}`;
      }
      while(pile.length) html += `</li></${pile.pop()}>`;
      return html;
    }
    return '';
  }).join('\n');
}

function telechargerBlob(blob, nom){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nom;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ================= Export Word (.docx) sans librairie =================
   Un .docx est un zip de fichiers XML. On écrit ce zip à la main (entrées
   « stockées », sans compression : Word les lit très bien). */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(octets){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < octets.length; i++) c = CRC_TABLE[(c ^ octets[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function creerZip(entrees){
  const enc = new TextEncoder();
  const morceaux = [];
  const central = [];
  let offset = 0;
  const now = new Date();
  const heureDos = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dateDos = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  for(const e of entrees){
    const nom = enc.encode(e.nom);
    const data = typeof e.data === 'string' ? enc.encode(e.data) : e.data;
    const crc = crc32(data);
    const loc = new DataView(new ArrayBuffer(30));
    loc.setUint32(0, 0x04034b50, true); loc.setUint16(4, 20, true); loc.setUint16(6, 0x0800, true);
    loc.setUint16(8, 0, true); loc.setUint16(10, heureDos, true); loc.setUint16(12, dateDos, true);
    loc.setUint32(14, crc, true); loc.setUint32(18, data.length, true); loc.setUint32(22, data.length, true);
    loc.setUint16(26, nom.length, true); loc.setUint16(28, 0, true);
    morceaux.push(new Uint8Array(loc.buffer), nom, data);
    const cen = new DataView(new ArrayBuffer(46));
    cen.setUint32(0, 0x02014b50, true); cen.setUint16(4, 20, true); cen.setUint16(6, 20, true); cen.setUint16(8, 0x0800, true);
    cen.setUint16(10, 0, true); cen.setUint16(12, heureDos, true); cen.setUint16(14, dateDos, true);
    cen.setUint32(16, crc, true); cen.setUint32(20, data.length, true); cen.setUint32(24, data.length, true);
    cen.setUint16(28, nom.length, true); cen.setUint32(42, offset, true);
    central.push(new Uint8Array(cen.buffer), nom);
    offset += 30 + nom.length + data.length;
  }
  let tailleCentral = 0;
  central.forEach(c => { tailleCentral += c.length; });
  const fin = new DataView(new ArrayBuffer(22));
  fin.setUint32(0, 0x06054b50, true);
  fin.setUint16(8, entrees.length, true); fin.setUint16(10, entrees.length, true);
  fin.setUint32(12, tailleCentral, true); fin.setUint32(16, offset, true);
  return new Blob([...morceaux, ...central, new Uint8Array(fin.buffer)], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

function xmlEchappe(t){
  return String(t).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]))
    // caractères interdits en XML 1.0
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g, '');
}

function runsDocx(texte, base){
  base = base || {};
  return decouperEnLigne(texte).map(x => {
    const gras = x.gras || base.gras;
    const ital = x.italique || base.italique;
    const props = (gras ? '<w:b/>' : '') + (ital ? '<w:i/>' : '')
      + (x.code ? '<w:rFonts w:ascii="Consolas" w:hAnsi="Consolas" w:cs="Consolas"/><w:shd w:val="clear" w:color="auto" w:fill="EEEEEE"/>' : '')
      + (base.taille ? `<w:sz w:val="${base.taille}"/><w:szCs w:val="${base.taille}"/>` : '');
    return `<w:r>${props ? `<w:rPr>${props}</w:rPr>` : ''}<w:t xml:space="preserve">${xmlEchappe(x.t)}</w:t></w:r>`;
  }).join('');
}

function blocsVersDocxXml(blocs, medias){
  const corps = [];
  // Numérotation : une instance (w:num) par liste ordonnée pour repartir à 1.
  const nums = [];
  for(const b of blocs){
    if(b.type === 'h'){
      corps.push(`<w:p><w:pPr><w:pStyle w:val="Titre${b.niveau}"/></w:pPr>${runsDocx(b.texte)}</w:p>`);
    } else if(b.type === 'p'){
      corps.push(`<w:p>${runsDocx(b.texte)}</w:p>`);
    } else if(b.type === 'hr'){
      corps.push('<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="999999"/></w:pBdr></w:pPr></w:p>');
    } else if(b.type === 'citation'){
      corps.push(`<w:p><w:pPr><w:pStyle w:val="Citation"/></w:pPr>${runsDocx(b.texte, { italique:true })}</w:p>`);
    } else if(b.type === 'liste'){
      // Une instance de numérotation par liste : elle repart de 1. Tous les
      // éléments ordonnés de CETTE liste partagent la même instance (les
      // sous-niveaux gardent ainsi leur propre compteur).
      let idOrdonne = null;
      for(const it of b.items){
        let id = 1; // 1 = puces
        if(it.ordonne){
          if(idOrdonne === null){ idOrdonne = nums.length + 3; nums.push(idOrdonne); }
          id = idOrdonne;
        }
        corps.push(`<w:p><w:pPr><w:pStyle w:val="ParagrapheListe"/><w:numPr><w:ilvl w:val="${it.niveau}"/><w:numId w:val="${id}"/></w:numPr></w:pPr>${runsDocx(it.texte)}</w:p>`);
      }
    } else if(b.type === 'img'){
      const im = synImage(b.n);
      if(im && medias){
        medias.push(im);
        const k = medias.length;
        let cx = im.w * 9525, cy = im.h * 9525;
        const sc = Math.min(1, 4680000 / cx, 3600000 / cy);
        cx = Math.round(cx * sc); cy = Math.round(cy * sc);
        const descr = xmlEchappe(b.legende || 'Illustration').replace(/"/g, '&quot;');
        corps.push(`<w:p><w:pPr><w:keepNext/><w:spacing w:before="120" w:after="60"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${k}" name="Image ${k}" descr="${descr}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${k}" name="image${k}.jpeg"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdImg${k}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`);
        if(b.legende) corps.push(`<w:p><w:pPr><w:spacing w:after="160"/></w:pPr>${runsDocx(b.legende, { italique:true, taille:18 })}</w:p>`);
      }
    } else if(b.type === 'table'){
      const nbCol = Math.max(b.entete.length, 1);
      const larg = Math.floor(9000 / nbCol);
      const cellule = (t, entete) => `<w:tc><w:tcPr><w:tcW w:w="${larg}" w:type="dxa"/>${entete ? '<w:shd w:val="clear" w:color="auto" w:fill="E9E4DC"/>' : ''}</w:tcPr><w:p>${runsDocx(t, entete ? { gras:true } : {})}</w:p></w:tc>`;
      const ligne = (cells, entete) => `<w:tr>${entete ? '<w:trPr><w:tblHeader/></w:trPr>' : ''}${b.entete.map((_, k) => cellule(cells[k] || '', entete)).join('')}</w:tr>`;
      corps.push(`<w:tbl><w:tblPr><w:tblW w:w="9000" w:type="dxa"/><w:tblBorders>`
        + ['top','left','bottom','right','insideH','insideV'].map(n => `<w:${n} w:val="single" w:sz="4" w:space="0" w:color="AAAAAA"/>`).join('')
        + `</w:tblBorders><w:tblCellMar><w:top w:w="60" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="60" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr>`
        + `<w:tblGrid>${b.entete.map(() => `<w:gridCol w:w="${larg}"/>`).join('')}</w:tblGrid>`
        + ligne(b.entete, true) + b.lignes.map(r => ligne(r, false)).join('') + '</w:tbl>');
      corps.push('<w:p/>'); // Word exige un paragraphe après un tableau
    }
  }
  return { corps: corps.join(''), nums };
}

function construireDocxBlob(markdown){
  const blocs = analyserMarkdown(markdown);
  const medias = [];

  const NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';

  const document = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document ${NS}><w:body>${corps || '<w:p/>'}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1417" w:right="1417" w:bottom="1417" w:left="1417" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;

  const style = (id, nom, opts) => `<w:style w:type="paragraph" w:styleId="${id}"><w:name w:val="${nom}"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/>${opts}</w:style>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles ${NS}><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri" w:eastAsia="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/><w:lang w:val="fr-FR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="120" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>
<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>
${style('Titre1', 'heading 1', '<w:pPr><w:keepNext/><w:spacing w:before="360" w:after="120"/><w:outlineLvl w:val="0"/></w:pPr><w:rPr><w:b/><w:color w:val="2B2A27"/><w:sz w:val="36"/><w:szCs w:val="36"/></w:rPr>')}
${style('Titre2', 'heading 2', '<w:pPr><w:keepNext/><w:spacing w:before="560" w:after="100"/><w:outlineLvl w:val="1"/></w:pPr><w:rPr><w:b/><w:color w:val="A9502E"/><w:sz w:val="30"/><w:szCs w:val="30"/></w:rPr>')}
${style('Titre3', 'heading 3', '<w:pPr><w:keepNext/><w:spacing w:before="200" w:after="80"/><w:outlineLvl w:val="2"/></w:pPr><w:rPr><w:b/><w:color w:val="4A4842"/><w:sz w:val="26"/><w:szCs w:val="26"/></w:rPr>')}
${style('ParagrapheListe', 'List Paragraph', '<w:pPr><w:spacing w:after="60"/><w:contextualSpacing/></w:pPr>')}
${style('Citation', 'Quote', '<w:pPr><w:pBdr><w:left w:val="single" w:sz="18" w:space="8" w:color="C76A45"/></w:pBdr><w:ind w:left="360"/></w:pPr><w:rPr><w:i/><w:color w:val="555555"/></w:rPr>')}
</w:styles>`;

  // Numérotation : abstractNum 0 = puces, 1 = numérotée. w:num 1 = puces ;
  // chaque w:num >= 3 est une liste numérotée qui repart de 1.
  const niveauxPuces = [0,1,2,3].map(l => `<w:lvl w:ilvl="${l}"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="${['•','–','▪','·'][l]}"/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="${540 + l * 360}" w:hanging="270"/></w:pPr></w:lvl>`).join('');
  const fmts = ['decimal','lowerLetter','lowerRoman','decimal'];
  const niveauxNum = [0,1,2,3].map(l => `<w:lvl w:ilvl="${l}"><w:start w:val="1"/><w:numFmt w:val="${fmts[l]}"/><w:lvlText w:val="%${l + 1}."/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="${540 + l * 360}" w:hanging="360"/></w:pPr></w:lvl>`).join('');
  const numbering = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:numbering ${NS}><w:abstractNum w:abstractNumId="0"><w:multiLevelType w:val="hybridMultilevel"/>${niveauxPuces}</w:abstractNum><w:abstractNum w:abstractNumId="1"><w:multiLevelType w:val="hybridMultilevel"/>${niveauxNum}</w:abstractNum><w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num>${nums.map(id => `<w:num w:numId="${id}"><w:abstractNumId w:val="1"/><w:lvlOverride w:ilvl="0"><w:startOverride w:val="1"/></w:lvlOverride></w:num>`).join('')}</w:numbering>`;

  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/></Types>`;
  const relsRacine = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const relsDoc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/></Relationships>`;

  return creerZip([
    { nom: '[Content_Types].xml', data: contentTypes },
    { nom: '_rels/.rels', data: relsRacine },
    { nom: 'word/document.xml', data: document },
    { nom: 'word/styles.xml', data: styles },
    { nom: 'word/numbering.xml', data: numbering },
    { nom: 'word/_rels/document.xml.rels', data: relsDoc.replace('</Relationships>', medias.map((m, i) => `<Relationship Id="rIdImg${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image${i + 1}.jpeg"/>`).join('') + '</Relationships>') },
    ...medias.map((m, i) => { const bin = atob(m.b64), u = new Uint8Array(bin.length); for(let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k); return { nom: `word/media/image${i + 1}.jpeg`, data: u }; })
  ]);
}

function exporterSyntheseDocx(){
  const s = syntheseEtat; if(!s) return;
  const zone = document.getElementById('synth-markdown');
  if(zone) s.markdown = zone.value;
  if(!s.markdown.trim()){ s.msg = { type:'err', text:'La synthèse est vide.' }; renderSynthese(); return; }
  try{
    telechargerBlob(construireDocxBlob(s.markdown), nomFichierSynthese('docx'));
    s.msg = { type:'ok', text:'Fichier Word enregistré dans tes téléchargements.' };
  }catch(e){
    s.msg = { type:'err', text:"Impossible de créer le fichier Word. Utilise « Copier » puis colle dans Word." };
  }
  renderSynthese();
}

const PDF_INDICE = {'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9','₊':'+','₋':'-'};
const PDF_EXPOSANT = {'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁺':'+','⁻':'-'};
const PDF_ENCRE = [0.17,0.16,0.15], PDF_ACCENT = [0.663,0.314,0.18], PDF_GRIS = [0.42,0.40,0.36], PDF_TITRE3 = [0.29,0.28,0.26];

function pdfN(n){ return String(Math.round(n * 100) / 100); }
function pdfCol(a){ return a.map(pdfN).join(' '); }
function pdfEchapper(b){ const c = String.fromCharCode(b); return (c === '(' || c === ')' || c === '\\') ? '\\' + c : c; }

function pdfLargeurCar(cp, f){
  if(f === 'F6') return 600;
  const gras = (f === 'F2' || f === 'F4');
  if(cp >= 32 && cp <= 126) return (gras ? PDF_LARG_B : PDF_LARG_R)[cp - 32];
  if(PDF_LARG_SPE[cp]) return PDF_LARG_SPE[cp][gras ? 1 : 0];
  if(cp >= 0xC0 && cp <= 0xFF){
    const base = String.fromCharCode(cp).normalize('NFD').charCodeAt(0);
    if(base >= 32 && base <= 126) return (gras ? PDF_LARG_B : PDF_LARG_R)[base - 32];
  }
  return gras ? 611 : 556;
}

/* Un caractère → descripteur de glyphe, ou null s'il n'existe pas dans le PDF. */
let pdfIgnores = 0; // v153 (constat 39) : nombre de caractères non pris en charge omis pendant la construction du PDF
function pdfGlyphe(ch, police, taille){
  let cp = ch.codePointAt(0);
  if(cp === 0xFE0F || cp === 0x200D || cp === 0x20E3) return null;
  if(PDF_POINTS[ch]) return { pt: PDF_POINTS[ch].map(v => v / 255), w: taille * 0.95, t: taille };
  let rise = 0, t = taille;
  if(PDF_INDICE[ch] !== undefined){ ch = PDF_INDICE[ch]; cp = ch.charCodeAt(0); rise = -taille * 0.2; t = taille * 0.68; }
  else if(PDF_EXPOSANT[ch] !== undefined){ ch = PDF_EXPOSANT[ch]; cp = ch.charCodeAt(0); rise = taille * 0.38; t = taille * 0.68; }
  if(PDF_SYMBOLE[cp]){ const [b, w] = PDF_SYMBOLE[cp]; return { f:'F5', b, w: w * t / 1000, t, rise }; }
  if(cp === 0x2212 || cp === 0x2011) cp = 0x2D;
  if(cp === 0xA0 || cp === 0x202F || cp === 0x2009) cp = 0x20;
  let b;
  if(cp < 0x20) return null;
  if(cp < 0x7F) b = cp;
  else if(cp >= 0xA0 && cp <= 0xFF) b = cp;
  else if(PDF_CP1252[cp]) b = PDF_CP1252[cp];
  else return null;
  return { f: police, b, w: pdfLargeurCar(cp, police) * t / 1000, t, rise };
}

/* Texte Markdown en ligne → liste de mots (et d'espaces) mesurés. */
function pdfMots(texte, base){
  const mots = []; let mot = null;
  for(const p of decouperEnLigne(texte)){
    const gras = base.gras || p.gras, ital = base.italique || p.italique;
    const police = p.code ? 'F6' : (gras && ital ? 'F4' : gras ? 'F2' : ital ? 'F3' : 'F1');
    const couleur = p.code ? [0.55,0.25,0.15] : base.couleur;
    for(const ch of p.t){
      if(/\s/.test(ch)){
        if(mot){ mots.push(mot); mot = null; }
        mots.push({ espace:true, w: 278 * base.taille / 1000 });
        continue;
      }
      const g = pdfGlyphe(ch, police, base.taille);
      if(!g){
        const cp0 = ch.codePointAt(0);
        if(!(cp0 === 0xFE0F || cp0 === 0x200D || cp0 === 0x20E3 || cp0 < 0x20)) pdfIgnores++;
        continue;
      }
      if(!mot) mot = { cells: [], w: 0 };
      const last = mot.cells[mot.cells.length - 1];
      if(g.pt) mot.cells.push({ pt: g.pt, w: g.w, t: g.t });
      else if(last && !last.pt && last.f === g.f && last.t === g.t && last.rise === g.rise && last.couleur === couleur){ last.s += pdfEchapper(g.b); last.w += g.w; last.cs.push([pdfEchapper(g.b), g.w]); }
      else mot.cells.push({ f: g.f, t: g.t, rise: g.rise, couleur, s: pdfEchapper(g.b), w: g.w, cs: [[pdfEchapper(g.b), g.w]] });
      mot.w += g.w;
    }
  }
  if(mot) mots.push(mot);
  return mots;
}

/* v153 (constat 40) : un mot plus large que la ligne est coupé en morceaux de la largeur de la ligne. */
function pdfCouperMot(m, largeur){
  const out = []; let cells = [], w = 0;
  const vider = () => { if(cells.length){ out.push({ cells, w }); cells = []; w = 0; } };
  for(const c of m.cells){
    if(c.pt || !c.cs){ if(cells.length && w + c.w > largeur) vider(); cells.push(c); w += c.w; continue; }
    let cur = null;
    for(const [t, gw] of c.cs){
      if(w + gw > largeur && (cells.length || cur)){ if(cur){ cells.push(cur); cur = null; } vider(); }
      if(!cur) cur = { f: c.f, t: c.t, rise: c.rise, couleur: c.couleur, s: '', w: 0, cs: [] };
      cur.s += t; cur.w += gw; cur.cs.push([t, gw]); w += gw;
    }
    if(cur) cells.push(cur);
  }
  vider();
  return out;
}
function pdfMiseEnLignes(mots, largeur){
  const lignes = []; let cur = [], w = 0;
  const rognerFin = () => { while(cur.length && cur[cur.length - 1].espace) w -= cur.pop().w; };
  for(const m0 of mots){
    if(!m0.espace && m0.w > largeur + 0.01 && largeur > 20){
      for(const m of pdfCouperMot(m0, largeur)){
        if(cur.length && w + m.w > largeur + 0.01){ rognerFin(); lignes.push({ mots: cur, w }); cur = []; w = 0; }
        cur.push(m); w += m.w;
      }
      continue;
    }
    const m = m0;
    if(m.espace){ if(cur.length){ cur.push(m); w += m.w; } continue; }
    if(cur.length && w + m.w > largeur + 0.01){ rognerFin(); lignes.push({ mots: cur, w }); cur = []; w = 0; }
    cur.push(m); w += m.w;
  }
  rognerFin();
  if(cur.length) lignes.push({ mots: cur, w });
  return lignes;
}

function pdfDessinerLigne(E, ligne, x, yBase){
  let cx = x;
  for(const m of ligne.mots){
    if(m.espace){ cx += m.w; continue; }
    for(const c of m.cells){
      if(c.pt){
        const r = c.t * 0.33, ox = cx + c.t * 0.42, oy = yBase + c.t * 0.3, k = 0.5523 * r;
        E.p.push(`${pdfCol(c.pt)} rg ${pdfN(ox + r)} ${pdfN(oy)} m ${pdfN(ox + r)} ${pdfN(oy + k)} ${pdfN(ox + k)} ${pdfN(oy + r)} ${pdfN(ox)} ${pdfN(oy + r)} c ${pdfN(ox - k)} ${pdfN(oy + r)} ${pdfN(ox - r)} ${pdfN(oy + k)} ${pdfN(ox - r)} ${pdfN(oy)} c ${pdfN(ox - r)} ${pdfN(oy - k)} ${pdfN(ox - k)} ${pdfN(oy - r)} ${pdfN(ox)} ${pdfN(oy - r)} c ${pdfN(ox + k)} ${pdfN(oy - r)} ${pdfN(ox + r)} ${pdfN(oy - k)} ${pdfN(ox + r)} ${pdfN(oy)} c f`);
      }else{
        E.p.push(`BT /${c.f} ${pdfN(c.t)} Tf ${pdfCol(c.couleur)} rg 1 0 0 1 ${pdfN(cx)} ${pdfN(yBase + c.rise)} Tm (${c.s}) Tj ET`);
      }
      cx += c.w;
    }
  }
}

/* Écrit des lignes en gérant les sauts de page ligne par ligne. */
function pdfEcrireLignes(E, lignes, x, taille, lh, avant){
  for(const l of lignes){
    if(E.y - lh < E.bas) E.nouvellePage();
    if(avant) avant(E, l, E.y - lh, lh);
    pdfDessinerLigne(E, l, x, E.y - lh + (lh - taille) * 0.5 + taille * 0.2);
    E.y -= lh;
  }
}

function pdfTableau(E, b){
  const nc = b.entete.length, taille = 9.5, lh = 13, pad = 4;
  const x0 = E.mx, total = E.W - 2 * E.mx;
  const rangs = [b.entete, ...b.lignes].map((row, ri) => b.entete.map((_, k) => pdfMots(row[k] || '', { gras: ri === 0, taille, couleur: PDF_ENCRE })));
  const nat = Array(nc).fill(0), mini = Array(nc).fill(0);
  rangs.forEach(row => row.forEach((mots, k) => {
    let w = 0, mx = 0;
    mots.forEach(m => { w += m.w; if(!m.espace) mx = Math.max(mx, m.w); });
    nat[k] = Math.max(nat[k], w); mini[k] = Math.max(mini[k], mx);
  }));
  const dispo = total - 2 * pad * nc;
  const somme = a => a.reduce((x, y) => x + y, 0);
  let cols;
  if(somme(nat) <= dispo) cols = nat.map(w => w + (dispo - somme(nat)) * (w / (somme(nat) || 1)));
  else if(somme(mini) >= dispo) cols = mini.map(w => w * dispo / somme(mini));
  else {
    const extra = dispo - somme(mini), veut = nat.map((w, k) => Math.max(0, w - mini[k])), sv = somme(veut) || 1;
    cols = mini.map((w, k) => w + extra * veut[k] / sv);
  }
  E.y -= 4;
  rangs.forEach((row, ri) => {
    const lignesCell = row.map((mots, k) => pdfMiseEnLignes(mots, cols[k]));
    const h = Math.max(1, ...lignesCell.map(l => l.length)) * lh + 2 * pad;
    if(E.y - h < E.bas) E.nouvellePage();
    let cx = x0;
    row.forEach((_, k) => {
      const w = cols[k] + 2 * pad, yb = E.y - h;
      if(ri === 0) E.p.push(`0.93 0.91 0.88 rg ${pdfN(cx)} ${pdfN(yb)} ${pdfN(w)} ${pdfN(h)} re f`);
      E.p.push(`0.78 0.76 0.72 RG 0.6 w ${pdfN(cx)} ${pdfN(yb)} ${pdfN(w)} ${pdfN(h)} re S`);
      lignesCell[k].forEach((l, i) => pdfDessinerLigne(E, l, cx + pad, E.y - pad - (i + 1) * lh + (lh - taille) * 0.5 + taille * 0.2));
      cx += w;
    });
    E.y -= h;
  });
  E.y -= 10;
}

function pdfAssembler(pages, W, H, imgs){
  const objs = ['', ''];
  const add = s => { objs.push(s); return objs.length; };
  const polices = [['F1','Helvetica',true],['F2','Helvetica-Bold',true],['F3','Helvetica-Oblique',true],['F4','Helvetica-BoldOblique',true],['F5','Symbol',false],['F6','Courier',true]];
  const ids = polices.map(([, nom, enc]) => add(`<< /Type /Font /Subtype /Type1 /BaseFont /${nom}${enc ? ' /Encoding /WinAnsiEncoding' : ''} >>`));
  const xo = (imgs || []).map((im, i) => { const bin = atob(im.b64); return `/Im${i} ${add(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /${im.c === 1 ? 'DeviceGray' : 'DeviceRGB'} /BitsPerComponent 8 /Filter /DCTDecode /Length ${bin.length} >>\nstream\n${bin}\nendstream`)} 0 R`; }).join(' ');
  const res = `<< /Font << ${polices.map((p, i) => `/${p[0]} ${ids[i]} 0 R`).join(' ')} >>${xo ? ` /XObject << ${xo} >>` : ''} >>`;
  const kids = [];
  pages.forEach(contenu => {
    const flux = contenu.join('\n');
    const idC = add(`<< /Length ${flux.length} >>\nstream\n${flux}\nendstream`);
    kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pdfN(W)} ${pdfN(H)}] /Resources ${res} /Contents ${idC} 0 R >>`));
  });
  objs[0] = '<< /Type /Catalog /Pages 2 0 R >>';
  objs[1] = `<< /Type /Pages /Kids [${kids.map(k => k + ' 0 R').join(' ')}] /Count ${kids.length} >>`;
  let out = '%PDF-1.4\n%\u00E2\u00E3\u00CF\u00D3\n';
  const offs = [];
  objs.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const xref = out.length;
  out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
  out += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const u = new Uint8Array(out.length);
  for(let i = 0; i < out.length; i++) u[i] = out.charCodeAt(i) & 255;
  return new Blob([u], { type: 'application/pdf' });
}

function construirePdfBlob(md){
  pdfIgnores = 0;
  const E = { W: 595.28, H: 841.89, mx: 52, haut: 56, bas: 62, pages: [], imgs: [], p: null, y: 0,
    nouvellePage(){ this.p = []; this.pages.push(this.p); this.y = this.H - this.haut; } };
  E.nouvellePage();
  const L = E.W - 2 * E.mx;
  const debutPage = () => E.y >= E.H - E.haut - 0.5;

  for(const b of analyserMarkdown(md)){
    if(b.type === 'h'){
      const taille = { 1: 20, 2: 15, 3: 12.5 }[b.niveau], lh = taille * 1.3;
      const avant = debutPage() ? 0 : { 1: 24, 2: 34, 3: 16 }[b.niveau];
      const couleur = { 1: PDF_ENCRE, 2: PDF_ACCENT, 3: PDF_TITRE3 }[b.niveau];
      if(E.y - avant - lh - 46 < E.bas){ E.nouvellePage(); } else E.y -= avant;
      const lignes = pdfMiseEnLignes(pdfMots(b.texte, { gras: true, taille, couleur }), L);
      pdfEcrireLignes(E, lignes, E.mx, taille, lh);
      if(b.niveau === 1){ E.p.push(`${pdfCol(PDF_ACCENT)} RG 1.2 w ${pdfN(E.mx)} ${pdfN(E.y - 3)} m ${pdfN(E.mx + L)} ${pdfN(E.y - 3)} l S`); E.y -= 8; }
      else E.y -= 4;
    }else if(b.type === 'p'){
      const lignes = pdfMiseEnLignes(pdfMots(b.texte, { taille: 10.5, couleur: PDF_ENCRE }), L);
      pdfEcrireLignes(E, lignes, E.mx, 10.5, 15);
      E.y -= 7;
    }else if(b.type === 'liste'){
      const cpt = [0, 0, 0, 0];
      for(const it of b.items){
        const n = it.niveau;
        for(let k = n + 1; k < 4; k++) cpt[k] = 0;
        if(it.ordonne) cpt[n]++;
        const ind = n * 16, xt = E.mx + ind + 16;
        const lignes = pdfMiseEnLignes(pdfMots(it.texte, { taille: 10.5, couleur: PDF_ENCRE }), L - ind - 16);
        if(E.y - 15 < E.bas) E.nouvellePage();
        const yBase = E.y - 15 + (15 - 10.5) * 0.5 + 10.5 * 0.2;
        const marque = it.ordonne ? pdfMots(cpt[n] + '.', { gras: true, taille: 10.5, couleur: PDF_ACCENT }) : pdfMots(n === 0 ? '\u2022' : '\u2013', { gras: true, taille: 10.5, couleur: PDF_ACCENT });
        pdfDessinerLigne(E, { mots: marque, w: 0 }, E.mx + ind + 2, yBase);
        pdfEcrireLignes(E, lignes, xt, 10.5, 15);
        E.y -= 2.5;
      }
      E.y -= 5;
    }else if(b.type === 'citation'){
      const lignes = pdfMiseEnLignes(pdfMots(b.texte, { gras: false, taille: 11, couleur: PDF_ENCRE }), L - 22);
      E.y -= 3;
      pdfEcrireLignes(E, lignes, E.mx + 14, 11, 17, (E2, l, yb, lh) => {
        E2.p.push(`0.965 0.945 0.918 rg ${pdfN(E2.mx)} ${pdfN(yb)} ${pdfN(L)} ${pdfN(lh)} re f`);
        E2.p.push(`${pdfCol(PDF_ACCENT)} rg ${pdfN(E2.mx)} ${pdfN(yb)} 2.5 ${pdfN(lh)} re f`);
      });
      E.y -= 10;
    }else if(b.type === 'table'){
      pdfTableau(E, b);
    }else if(b.type === 'img'){
      const im = synImage(b.n);
      if(im){
        let idx = E.imgs.indexOf(im);
        if(idx < 0){ E.imgs.push(im); idx = E.imgs.length - 1; }
        const sc = Math.min(L * 0.82 / im.w, 250 / im.h, 0.75);
        const w = im.w * sc, h = im.h * sc;
        const leg = b.legende ? pdfMiseEnLignes(pdfMots(b.legende, { italique: true, taille: 9, couleur: PDF_GRIS }), L) : [];
        if(E.y - h - 14 - leg.length * 12 < E.bas) E.nouvellePage();
        E.y -= 6;
        E.p.push(`q ${pdfN(w)} 0 0 ${pdfN(h)} ${pdfN(E.mx)} ${pdfN(E.y - h)} cm /Im${idx} Do Q`);
        E.y -= h + 6;
        if(leg.length) pdfEcrireLignes(E, leg, E.mx, 9, 12);
        E.y -= 8;
      }
    }else if(b.type === 'hr'){
      E.y -= 6;
      E.p.push(`0.8 0.78 0.75 RG 0.6 w ${pdfN(E.mx)} ${pdfN(E.y)} m ${pdfN(E.mx + L)} ${pdfN(E.y)} l S`);
      E.y -= 8;
    }
  }
  const N = E.pages.length;
  E.pages.forEach((p, i) => {
    const txt = `${i + 1} / ${N}`;
    p.push(`BT /F1 8 Tf 0.55 0.55 0.55 rg 1 0 0 1 ${pdfN(E.W / 2 - txt.length * 2.2)} 30 Tm (${txt}) Tj ET`);
  });
  return pdfAssembler(E.pages, E.W, E.H, E.imgs);
}


/* ================= Export PDF =================
   Feuille d'impression dédiée : on affiche le rendu dans #synth-print (caché à
   l'écran, seul visible à l'impression) puis window.print(). L'utilisateur
   choisit « Enregistrer en PDF ». Accents et tableaux sont ceux du navigateur. */
function exporterSynthesePdf(){
  const s = syntheseEtat; if(!s) return;
  const zone = document.getElementById('synth-markdown');
  if(zone) s.markdown = zone.value;
  if(!s.markdown.trim()){ s.msg = { type:'err', text:'La synthèse est vide.' }; renderSynthese(); return; }
  try{
    telechargerBlob(construirePdfBlob(s.markdown), nomFichierSynthese('pdf'));
    const nbOmis = pdfIgnores;
    s.msg = nbOmis > 0
      ? { type:'ok', text:'PDF enregistré, mais ' + nbOmis + ' caractère' + (nbOmis > 1 ? 's' : '') + ' non pris en charge (alphabets non latins, emojis) ' + (nbOmis > 1 ? 'ont' : 'a') + ' été omis. Utilise l\u2019export Word pour tout garder.' }
      : { type:'ok', text:'PDF enregistré dans tes téléchargements.' };
  }catch(e){
    exporterSynthesePdfImpression(); // secours : ancienne méthode via la boîte d'impression
    return;
  }
  renderSynthese();
}
function exporterSynthesePdfImpression(){
  const s = syntheseEtat; if(!s) return;
  const zone = document.getElementById('synth-markdown');
  if(zone) s.markdown = zone.value;
  if(!s.markdown.trim()){ s.msg = { type:'err', text:'La synthèse est vide.' }; renderSynthese(); return; }
  let feuille = document.getElementById('synth-print');
  if(!feuille){
    feuille = document.createElement('div');
    feuille.id = 'synth-print';
    document.body.appendChild(feuille);
  }
  feuille.innerHTML = `<div class="synth-rendu">${markdownVersHtml(s.markdown)}</div>`;
  const titreAvant = document.title;
  document.title = nomFichierSynthese('pdf').replace(/\.pdf$/, ''); // nom proposé par « Enregistrer en PDF »
  // La classe d'impression doit rester posée TANT QUE la boîte d'impression est
  // ouverte : sur mobile, window.print() rend la main tout de suite et la page
  // est capturée après. On ne nettoie donc qu'à « afterprint » (avec un filet
  // de sécurité si le navigateur ne l'envoie jamais).
  let fini = false;
  const nettoyer = () => {
    if(fini) return; fini = true;
    document.body.classList.remove('synth-impression');
    document.title = titreAvant;
    feuille.innerHTML = '';
    window.removeEventListener('afterprint', nettoyer);
  };
  window.addEventListener('afterprint', nettoyer);
  document.body.classList.add('synth-impression');
  setTimeout(() => {
    try{ window.print(); }catch(e){ nettoyer(); return; }
    setTimeout(nettoyer, 120000); // filet de sécurité
  }, 80);
}
