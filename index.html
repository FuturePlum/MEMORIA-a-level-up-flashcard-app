.pp-conf{position:absolute;left:50%;top:0;width:9px;height:14px;border-radius:2px;background:var(--c);opacity:0;animation:ppconf 1.1s ease-out forwards;animation-delay:var(--d)}
.pp-btns{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.pp-btns .pp-cta{margin:0}
/* v162 : écran de fin de séance — une carte centrée (plus de barre orange sur toute la largeur), pastille ✓, boutons à la taille de l'app */
.pp-done{max-width:440px}
.pp-okm{width:68px;height:68px;margin:0 auto 16px;border-radius:22px;display:grid;place-items:center;background:var(--c-gsoft);border:2px solid color-mix(in srgb,var(--green) 55%,transparent);color:var(--green);box-shadow:0 4px 0 color-mix(in srgb,var(--green) 26%,transparent);animation:pppop .45s var(--pps) both}
.pp-okm svg{width:32px;height:32px}
.pp-done .pp-btns .pp-cta{height:50px;font-size:16px;border-radius:16px;box-shadow:0 4px 0 var(--orange-d)}
.pp-done .pp-btns .pp-cta.pp-ghost,.pp-done .pp-btns .pp-cta.pp-quiet{box-shadow:0 3px 0 var(--c-edge);background:var(--panel)}
.pp-done .pp-btns .pp-cta.pp-quiet{color:var(--cream)}
.pp-done .pp-btns .pp-cta svg{flex:none}
@media (min-width:900px) and (min-height:480px){
  .pp-done{max-width:480px;padding:34px 28px 26px;border-radius:28px;background:var(--panel);border:1.5px solid var(--line);box-shadow:0 5px 0 var(--c-edge)}
  .pp-done h2{font-size:30px}
  .pp-done .pp-bil>div{background:var(--bg)}
}
/* v168 : écran de fin d'entraînement dans le thème (même carte centrée que « Terminé pour aujourd'hui »), score dans une tuile colorée, liste « À revoir » défilante dans la carte */
.pp-qdone{display:flex;flex-direction:column;max-height:100%;min-height:0}
.pp-qdone .pp-score{align-self:center;margin:0 auto 14px;padding:14px 30px 16px;border-radius:26px;font-size:64px;background:color-mix(in srgb,var(--sc) 14%,transparent);border:2px solid color-mix(in srgb,var(--sc) 60%,transparent);box-shadow:0 4px 0 color-mix(in srgb,var(--sc) 28%,transparent)}

.pp-qdone .pp-errs{display:flex;flex-direction:column;min-height:0;margin:16px 0 0}
.pp-qdone .pp-errl{overflow-y:auto;min-height:0;max-height:38vh;padding-right:2px}
.pp-qdone .pp-btns{flex:none}

@media (min-width:900px) and (min-height:480px){
  body #pp-ses.pp-end{left:0;right:0;width:auto;margin:0;padding-left:var(--side);padding-right:var(--side)}

  .pp-done .pp-btns .pp-cta{height:58px;font-size:18px;border-radius:18px}
  .pp-qdone .pp-score{font-size:78px;padding:16px 40px 18px}
  .pp-qdone .pp-small{font-size:15px}
  .pp-qdone .pp-errl{max-height:34vh}

}
/* v169 : Chromebook / grand écran, mode sombre uniquement — la grille de points du fond est un peu plus présente (.07 → .11 ; le téléphone et le mode clair ne changent pas). Pour la régler : changer .11 dans les deux règles. */

    background:
      linear-gradient(var(--bg), rgba(var(--bgr),0) 130px),

    background:linear-gradient(var(--bg), rgba(var(--bgr),0) 130px), radial-gradient(circle at 90% 0%, rgba(255,107,61,.16), transparent 45%), radial-gradient(circle, rgba(var(--ov),.11) 1px, transparent 1.2px) 0 0/16px 16px, var(--bg);
    background-attachment:fixed;
  }
}

.pp-sheet .pp-set + .pp-hint:not(.pp-synh){margin:7px 2px 6px}

/* ============================================================
   ÉTAPE C — RÈGLE D'ANIMATION : « toujours un bouton qui s'enfonce »
   Un seul mécanisme pour tout ce qui se touche :
   - --d  = profondeur = hauteur de l'ombre décalée de l'élément (2px par défaut
            pour les éléments plats, sans ombre) ; --sc = couleur de cette ombre.
   - Appui (:active ou .js-press posé par le JS) : l'élément descend de --d et
     l'ombre tombe à 0. Relâché : il remonte avec un petit rebond (ressort, v73).
   - Aucun scale / rotation à l'appui ; le rebond n'existe qu'au retour (v73). Les durées viennent de --t-in
     (appui) et --t-out (retour). prefers-reduced-motion : durées ~0.
   Ne PAS rajouter de règle :active avec scale() ailleurs : ajouter le sélecteur
   aux deux listes ci-dessous (transition + appui), et --d/--sc si l'élément a une ombre.
   ============================================================ */
:root:root:root{ --ease-press:cubic-bezier(.34,1.56,.64,1); --t-in:.07s; --t-out:.36s; }
@media (prefers-reduced-motion:reduce){ :root:root:root{ --t-in:.01ms; --t-out:.01ms; } }
/* profondeur et couleur d'ombre des éléments « relief » (les autres : 2px, sans ombre) */
.pp-cta,.pp-show{ --d:4px; --sc:var(--orange-d); }
.pp-ans{ --d:4px; --sc:color-mix(in srgb,var(--c) 40%,var(--c-mixd)); }
.pp-ctl{ --d:4px; --sc:var(--c-ysh); }
.pp-sec,.pp-back{ --d:3px; --sc:var(--c-edge); }
.pp-snd{ --d:3px; --sc:var(--orange-d); }
.pp-mb .pp-bk{ --d:3px; --sc:var(--yellow-d); }
.pp-pd.sel{ --d:3px; --sc:var(--orange-d); }
.pp-tab.on{ --d:4px; --sc:var(--yellow-d); }
.pp-cta.pp-ghost,.pp-cta.pp-quiet{ --d:2px; }
.home-cta{ --d:4px; --sc:var(--accent-deep); }
.home-cta[style*="transparent"]{ --d:2px; }
.modal-actions .modal-save{ --d:4px; --sc:var(--accent-deep); }
.modal-actions .modal-cancel{ --d:3px; --sc:var(--c-edge); }
/* retour (relâchement) : même courbe pour tout le monde */
:is(.pp-cta,.pp-show,.pp-ans,.pp-ctl,.pp-sec,.pp-back,.pp-snd,.pp-mb .pp-bk,.pp-pd,.pp-row,.pp-prog7,.pp-mat,.pp-li,.pp-it,.pp-ghm,.pp-ib,.pp-pill,.pp-chip,.pp-invc,.pp-dash,.pp-bk2,.pp-ibt,.pp-alt button,.pp-pdn,.pp-d,.pp-mini,.pp-undo,.pp-gear,.pp-streak,.pp-tab:not(.on),.home-cta,.planning-strip,.filter-pill,.home-matiere-due-item,.modal-actions button){ transition:transform var(--t-out) var(--ease-press),box-shadow var(--t-out) var(--ease-press),background .2s,background-color .2s,border-color .2s,color .2s,opacity .2s; }
/* appui : l'élément descend de --d, l'ombre tombe à 0 */
:is(.pp-cta,.pp-show,.pp-ans,.pp-ctl,.pp-sec,.pp-back,.pp-snd,.pp-mb .pp-bk,.pp-pd,.pp-row,.pp-prog7,.pp-mat,.pp-li,.pp-it,.pp-ghm,.pp-ib,.pp-pill,.pp-chip,.pp-invc,.pp-dash,.pp-bk2,.pp-ibt,.pp-alt button,.pp-pdn,.pp-d,.pp-mini,.pp-undo,.pp-gear,.pp-streak,.pp-tab:not(.on),.home-cta,.planning-strip,.filter-pill,.home-matiere-due-item,.modal-actions button):active,:is(.pp-cta,.pp-show,.pp-ans,.pp-ctl,.pp-sec,.pp-back,.pp-snd,.pp-mb .pp-bk,.pp-pd,.pp-row,.pp-prog7,.pp-mat,.pp-li,.pp-it,.pp-ghm,.pp-ib,.pp-pill,.pp-chip,.pp-invc,.pp-dash,.pp-bk2,.pp-ibt,.pp-alt button,.pp-pdn,.pp-d,.pp-mini,.pp-undo,.pp-gear,.pp-streak,.pp-tab:not(.on),.home-cta,.planning-strip,.filter-pill,.home-matiere-due-item,.modal-actions button).js-press{ transform:translateY(var(--d,2px)); box-shadow:0 0 0 0 var(--sc,transparent); transition-duration:var(--t-in); }
/* onglet actif : il flotte à -5px ; l'appui le fait redescendre de --d */
.pp-tab.on{ transition:transform var(--t-out) var(--ease-press),box-shadow var(--t-out) var(--ease-press),background .2s,color .2s; }
.pp-tab.on:active,.pp-tab.on.js-press{ transform:translateY(calc(-5px + var(--d)));
  box-shadow:0 0 0 0 var(--sc),0 0 0 -8px rgba(var(--yr),0); transition-duration:var(--t-in); }
/* ============================================================
   ÉTAPE D — la carte de révision s'enfonce quand on la retourne.
   Son ombre orange (9px 9px) est diagonale : la carte descend donc de 9px en
   bas ET à droite, jusqu'à poser sur son ombre, puis remonte au retournement.
   ============================================================ */
.pp-card.pp-sink{ transform:translate(9px,9px); box-shadow:0 0 0 0 var(--orange); transition-duration:.2s,var(--t-in),var(--t-in); }

/* ============================================================
   CHROMEBOOK / ORDINATEUR (v70) — fenêtre large + souris + clavier.
   Tout est conditionné : le téléphone (Pixel 9a, étroit et tactile) n'est pas touché.
   - Mise en page large : barre latérale à gauche (--side), contenu centré dans le reste.
   - Souris : survol, curseur, anneau de focus clavier, barres de défilement fines.
   - Clavier : rappel des raccourcis sous la carte (cf. gererRaccourcisClavier + Échap).
   Seuil 900 × 480 : un téléphone en paysage (≈ 915 × 412) reste en mode téléphone.
   ============================================================ */
@media (min-width:900px) and (min-height:480px){
  :root:root:root{ --side:244px; }
  /* v82 : le contenu est centré sur TOUT l'écran (la barre latérale est hors du flux, on réserve juste la place
     de chaque côté pour qu'il ne passe jamais dessous quand la fenêtre est étroite). */
  body{ padding-left:var(--side); padding-right:var(--side); }
  .wrap{ max-width:680px; padding-left:24px; padding-right:24px; }
  .pp-page{ max-width:min(680px,calc(100% - 2 * var(--side))); left:0; }
  /* Révision : centrée sur TOUT l'écran (indépendamment de la barre latérale).
     La largeur est plafonnée pour ne jamais passer sous la barre à gauche. */
  #pp-ses{ left:0; right:0; margin:0 auto; width:min(680px,calc(100% - 2 * var(--side))); max-width:none; }
  .pp-sheet{ max-width:min(560px,calc(100% - 2 * var(--side))); left:0; }
  /* v82 : même hauteur qu'avant (top:24px), mais collée au contenu centré : bord gauche du contenu - largeur de la barre - 64px d'écart.
     Jamais à moins de 24px du bord de la fenêtre. Pour la rapprocher / l'éloigner : changer le 64px. */
  .tabbar{ width:196px; top:24px; left:max(24px, calc(max((100vw - 680px) / 2, var(--side)) - 196px - 64px)); }
  .pp-nav{ padding:10px; }
  .pp-tab{ flex:none; flex-direction:row; justify-content:flex-start; gap:12px; height:50px; padding:0 16px; margin:4px 0; font-size:14.5px; }
  .pp-tab.on{ transform:none; }

  /* Faux splash (v72) : sur grand écran la barre latérale et l'en-tête étaient visibles À TRAVERS le fondu de
     sortie, avec le logo du splash (centré sur tout l'écran) qui se superposait au contenu. On les garde
     cachés tant que le splash n'est pas retiré (body.splash-done), puis fondu doux. */
  body:not(.splash-done) .tabbar,

}
/* clavier : l'anneau de focus n'apparaît qu'à la navigation au clavier (Tab), jamais au clic */
:focus-visible{ outline:2.5px solid var(--yellow); outline-offset:3px; border-radius:10px; }
input:focus-visible,textarea:focus-visible{ outline-offset:1px; }
@media (hover:hover) and (pointer:fine){
  button,[onclick],[role="button"],summary,label[for]{ cursor:pointer; }
  button:disabled{ cursor:default; }

  :is(.pp-cta,.pp-show,.pp-ans,.pp-ctl,.pp-snd,.pp-row,.pp-mat,.pp-li,.pp-it,.pp-pill,.pp-chip,.pp-dash):not(:disabled):hover{ filter:brightness(1.1); }
  :is(.pp-sec,.pp-back,.pp-ib,.pp-ibt,.pp-bk2,.pp-mb .pp-bk):not(:disabled):hover{ filter:brightness(1.18); }
  .pp-body{ cursor:pointer; }

  /* barres de défilement fines et sombres (Chromebook : elles sont visibles) */
  *{ scrollbar-width:thin; scrollbar-color:var(--c-scroll) transparent; }
  /* v119 : rappel des touches (souris seulement), à droite de la barre de maîtrise : un point de la couleur du bouton + la touche,
     dans l'ordre des boutons (Pas su · Difficile · Facile). Très discret, plus lisible une fois la carte retournée.
     (L'ancien rappel en ::after ne s'affichait plus : .pp-acts s'est glissé entre .pp-stage et .pp-mb.) */
  #pp-ses .pp-kh{ display:flex; align-items:center; gap:11px; margin-left:auto; font-size:11.5px; font-weight:700; color:var(--muted); opacity:.5; white-space:nowrap; transition:opacity .25s; }
  #pp-ses .pp-kh i{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--c); margin-right:4px; vertical-align:1px; }
  #pp-ses .pp-acts:not(.dim) + .pp-mb .pp-kh{ opacity:.95; }

/* ============================================================
   COUCHE « VIE » (v74) — l'app bouge même quand on ne touche rien.
   Règles : (1) tout est dans @media (prefers-reduced-motion:no-preference) ;
   (2) JAMAIS d'animation en boucle sur `transform`/`box-shadow` d'un élément
   qui s'enfonce à l'appui (une animation écraserait :active) : les boucles
   passent par un parent, un pseudo-élément, `filter` ou `text-shadow` ;
   (3) les mouvements ponctuels (clin d'œil du bouton) passent par une classe
   posée 600 ms par le JS (« couche vie » en fin de fichier).
   Pour tout couper : ajouter la classe `sans-vie` sur <body>.
   ============================================================ */
@media (prefers-reduced-motion:no-preference){
  /* --- ambiance : deux lueurs qui dérivent lentement derrière tout --- */
  #vie-ambiance{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;mix-blend-mode:screen}
  #vie-ambiance canvas{display:block;width:100%;height:100%}
  body.sans-vie #vie-ambiance{display:none}

  /* --- logo d'en-tête : respire, avec un petit clin d'œil de temps en temps --- */

  /* --- accueil : le gros chiffre respire (son ombre orange se creuse), le bouton rayonne --- */

  /* --- barre du bas : l'icône active flotte, et saute à l'arrivée --- */
  .pp-tab.on svg{animation:vieTabHop .55s var(--pps) both}

  /* --- barres de progression : un reflet les parcourt --- */
  .pp-ctb,.pp-bar1{position:relative}
  .pp-ctb u{transform-origin:left center;animation:ppgrow .8s var(--pps) both}

  /* --- carte de révision : elle flotte sur son ombre (le parent bouge, pas la carte) --- */
  .pp-stage{animation:vieFloat 7s ease-in-out infinite}
  body.pp-ses-on .pp-dot{animation:vieDot 2.2s ease-out infinite}
  .pp-stage .pp-rule{transform-origin:left center;animation:vieRule 5s ease-in-out 1s infinite}

  /* --- réponses : les 3 boutons arrivent en cascade, la pastille de mode pulse --- */
  .pp-ans3 .pp-ans{animation:viePop .42s var(--pps) backwards}
  .pp-ans3 .pp-ans:nth-child(2){animation-delay:.06s}
  .pp-ans3 .pp-ans:nth-child(3){animation-delay:.12s}
  .pp-show:not([disabled]){animation:vieGlow 3.2s ease-in-out 1.5s infinite}
  .pp-mp{animation:vieBob 2.8s ease-in-out infinite}
  .pp-show.vie-nudge:not([disabled]){animation:vieNudge .62s var(--pps) both}

  /* une vue « still » (re-rendu identique) coupe les animations d'entrée : on garde seulement les boucles de vie */
  /* --- listes (Parcourir, Planning, feuilles) : entrée en cascade, plus longue que 7 éléments --- */
  .pp-brw .pp-mat,.pp-plan .pp-mat,.pp-brw .pp-li,.pp-plan .pp-li{animation:ppup .38s ease-out backwards}
  :is(.pp-mat,.pp-li,.pp-row):nth-child(2){animation-delay:.04s!important}
  :is(.pp-mat,.pp-li,.pp-row):nth-child(3){animation-delay:.08s!important}
  :is(.pp-mat,.pp-li,.pp-row):nth-child(4){animation-delay:.12s!important}
  :is(.pp-mat,.pp-li,.pp-row):nth-child(5){animation-delay:.16s!important}
  :is(.pp-mat,.pp-li,.pp-row):nth-child(6){animation-delay:.2s!important}
  :is(.pp-mat,.pp-li,.pp-row):nth-child(7){animation-delay:.24s!important}
  :is(.pp-mat,.pp-li,.pp-row):nth-child(n+8){animation-delay:.28s!important}
  .pp-still :is(.pp-mat,.pp-li,.pp-row){animation:none!important}

  /* --- onglets : le contenu qui apparaît glisse aussi, pas seulement les blocs --- */
  .pp-page{animation-timing-function:var(--pps)}


  @keyframes vieLogo{0%,78%,100%{transform:none}84%{transform:rotate(-9deg) translateY(-2px)}90%{transform:rotate(7deg)}95%{transform:rotate(-3deg)}}
  @keyframes vieBreath{0%,100%{text-shadow:6px 3px 0 var(--orange)}50%{text-shadow:9px 5px 0 var(--orange),0 0 36px rgba(255,107,61,.28)}}
  @keyframes vieGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,107,61,0))}50%{filter:drop-shadow(0 6px 16px rgba(255,107,61,.5))}}
  @keyframes vieNudge{0%{transform:none;box-shadow:0 4px 0 var(--orange-d)}30%{transform:translateY(4px);box-shadow:0 0 0 var(--orange-d)}100%{transform:none;box-shadow:0 4px 0 var(--orange-d)}}
  @keyframes vieTabHop{0%{transform:translateY(5px) scale(.8)}55%{transform:translateY(-4px) scale(1.12)}100%{transform:none}}
  @keyframes vieBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  @keyframes vieSweep{0%,55%{transform:translateX(-110%)}100%{transform:translateX(110%)}}
  @keyframes vieFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(.25deg)}}
  @keyframes vieDot{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}70%,100%{box-shadow:0 0 0 8px transparent}}
  @keyframes vieRule{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.5)}}
  @keyframes viePop{0%{opacity:0;transform:translateY(14px) scale(.9)}100%{opacity:1;transform:none}}
}
/* ============================================================
   CHROMEBOOK v84 — copie du prototype « maquettes-chromebook-v9 » (accueil, révision, parcourir).
   Éléments ajoutés pour le grand écran : .pp-cb (accueil), .pp-ra + .pp-acts (révision), .pp-fp (parcourir).
   Tous en display:none par défaut → le téléphone n'est pas touché.
   ============================================================ */
.pp-cb,.pp-ra,.pp-rslot,.pp-acts,.pp-fp,.pp-sk-w{ display:none; }
@media (min-width:900px) and (min-height:480px){
  body{ padding:0 30px 0 244px; }
  body .wrap{ max-width:none; padding:14px 0; }
  body .tabbar{ left:24px; top:24px; width:196px; }
  body .pp-nav{ border:1px solid var(--line); border-radius:28px; background:rgba(var(--bgr),.92); }
  #tab-planning,#tab-add,#tab-settings{ max-width:720px; margin:0 auto; }
  /* A · accueil : grande carte + modes à gauche, stats et semaine à droite */
  body .pp-home{ display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); grid-template-rows:auto 1fr auto; column-gap:26px; row-gap:0; height:calc(100vh - 80px); min-height:520px; }
  .pp-home>.pp-hero{ grid-column:1; grid-row:1/3; margin:0 9px 27px 0; padding:30px 32px; box-shadow:9px 9px 0 var(--orange); min-height:0;
    background:radial-gradient(420px 300px at 92% 0,rgba(255,107,61,.2),transparent 70%),linear-gradient(120deg,var(--panel) 50%,var(--c-pgrad1)); }
  .pp-home .pp-hero .pp-big{ font-size:clamp(110px,28vh,220px); text-shadow:6px 6px 0 var(--orange); margin:0 0 12px 2px; }
  .pp-home .pp-hero .pp-sub{ font-size:16px; }
  .pp-home>.pp-ctl{ grid-column:2; grid-row:1; margin-bottom:18px; }
  /* v119 : « Ajouter une date de contrôle » : même famille que le bandeau contrôle (jaune), mais plus plein et en pointillés = on peut le remplir */
  .pp-home>.pp-ctl.pp-ctl-add{ display:flex; align-items:center; border:2px dashed color-mix(in srgb,var(--yellow) 75%,transparent);
    background:linear-gradient(110deg,rgba(var(--yr),.2),rgba(var(--yr),.07) 70%),var(--c-yse); }
  .pp-ctl-add .pp-ctt b{ font-size:16px; color:var(--cream); }
  .pp-ctl-add>s{ display:grid; place-items:center; width:30px; height:30px; border-radius:50%; background:rgba(var(--yr),.18); }
  /* v163 : thème clair — plein jaune, texte foncé, pastilles inversées (avant : jaune très pâle presque invisible sur fond blanc) */
  :root:root:root[data-theme="light"] .pp-home>.pp-ctl.pp-ctl-add{ --sc:var(--yellow-d); border:2px dashed var(--yellow-d); background:linear-gradient(110deg,#ffe680,var(--yellow) 65%,#ffcf24); box-shadow:0 4px 0 var(--yellow-d); }
  :root:root:root[data-theme="light"] .pp-ctl-add .pp-ctt b{ color:#1a1405; font-size:17px; }
  :root:root:root[data-theme="light"] .pp-ctl-add>i{ background:#1a1405; color:var(--yellow); box-shadow:0 3px 0 rgba(26,20,5,.35); }
  :root:root:root[data-theme="light"] .pp-ctl-add>s{ background:#1a1405; color:var(--yellow); }
  .pp-home>.pp-opts{ grid-column:1; grid-row:3; margin:0 9px 0 0; gap:16px; }
  .pp-home>.pp-prog7{ display:none; }
  .pp-view>.pp-opts .pp-row{ padding:18px 20px; border-radius:20px; gap:12px; background:linear-gradient(160deg,var(--panel),var(--c-rowgrad)); }
  .pp-view>.pp-opts .pp-row .pp-ri{ width:44px; height:44px; border-radius:13px; }
  .pp-view>.pp-opts .pp-row b{ font-size:21px; }
  .pp-view>.pp-opts .pp-row>div>span{ font-size:14px; }
  .pp-home>.pp-cb{ grid-column:2; grid-row:2/4; display:flex; flex-direction:column; gap:16px; min-height:0; }
  .cb-wl{ flex:1 1 236px; min-height:226px; min-width:0; display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:13px 16px 12px; }
  .cb-h2{ display:flex; justify-content:space-between; align-items:baseline; font-weight:800; font-size:15px; margin-bottom:2px; }
  .cb-h2 small{ color:var(--muted); font-weight:600; font-size:13px; }
  .cb-wk{ flex:1; min-height:0; display:flex; gap:10px; margin-top:6px; }
  .cb-wc{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; }
  .cb-wc>b{ font-size:20px; line-height:1; font-weight:800; }
  .cb-tr{ flex:1; width:100%; display:flex; align-items:flex-end; min-height:0; }
  .cb-tr i{ display:block; width:100%; border-radius:10px 10px 4px 4px; background:rgba(var(--yr),.26); height:var(--h); min-height:6px; }
  .cb-wc.t .cb-tr i{ background:var(--yellow); box-shadow:0 4px 0 var(--yellow-d); }
  .cb-wc small{ color:var(--cream); font-weight:800; font-size:13px; }
  .cb-wc em{ font-style:normal; color:var(--muted); font-size:11.5px; font-weight:600; white-space:nowrap; height:14px; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
  .cb-wc.rest>b,.cb-wc.rest small{ opacity:.45; }
  /* B · révision : question | réponse côte à côte, boutons dessous */
  /* v91 : 8px de marge de chaque côté (le rebond de la carte et du bouton « Pas su » ne sont plus coupés par le bord) ; la position du contenu ne change pas.
     Fond identique à celui de la page (mêmes couches, attachées à la fenêtre) : plus de bande visible sur les côtés. */
  body #pp-ses{ left:236px; right:22px; width:auto; max-width:none; margin:0; padding:14px 8px;
    background:linear-gradient(var(--bg), rgba(var(--bgr),0) 130px), radial-gradient(circle at 90% 0%, rgba(255,107,61,.16), transparent 45%), radial-gradient(circle, rgba(var(--ov),.07) 1px, transparent 1.2px) 0 0/16px 16px, var(--bg); background-attachment:fixed; }
  #pp-ses .pp-stage{ display:grid; grid-template-columns:1.1fr 1fr; gap:26px; }
  #pp-ses .pp-card .pp-foot,#pp-ses .pp-card .pp-rule,#pp-ses .pp-card .pp-at{ display:none; }
  #pp-ses .pp-qt,#pp-ses .pp-body.pp-flipped .pp-qt{ font-size:clamp(30px,3.3vw,44px); line-height:1.08; letter-spacing:-.04em; color:var(--cream); font-weight:800; }
  #pp-ses .pp-body{ padding:0 22px; }
  #pp-ses .pp-card .pp-aimg{ display:none; }
  #pp-ses .pp-body.pp-flipped .pp-qimg{ max-height:32vh; margin-top:12px; }
  /* v103 : l'emplacement pointillé (.pp-rslot) reste toujours en place ; le panneau réponse (.pp-ra) en sort au retournement et y rentre au retour à la question */
  #pp-ses .pp-rslot,#pp-ses .pp-ra{ grid-column:2; grid-row:1; }
  #pp-ses .pp-rslot{ display:flex; flex-direction:column; min-height:0; padding:16px 18px; border:2px dashed var(--line); border-radius:26px; cursor:pointer; }
  #pp-ses .pp-ra{ display:flex; flex-direction:column; min-height:0; overflow:auto; padding:16px 18px; border:2px solid transparent; border-radius:26px; visibility:hidden; pointer-events:none; position:relative; z-index:1; transform-origin:50% 50%; }
  .pp-rslot .pp-g{ margin:auto; text-align:center; color:var(--muted); }
  .pp-rslot.hid .pp-g{ display:none; }
  .pp-rslot kbd{ display:inline-block; margin-bottom:8px; font:inherit; font-weight:800; font-size:12px; padding:4px 10px; border-radius:8px; background:rgba(var(--ov),.07); border:1px solid rgba(var(--ov),.13); color:var(--cream); }
  .pp-ra .pp-v{ display:none; flex-direction:column; flex:1; }
  .pp-ra .pp-ch{ padding:0; }
  #pp-ses .pp-sk-p{ display:none; }
  #pp-ses .pp-sk-w{ display:inline; }
  #pp-ses .pp-ra.on,#pp-ses .pp-ra.out{ visibility:visible; border-color:var(--cream); background:var(--panel); box-shadow:9px 9px 0 var(--yellow-d); cursor:default; }
  #pp-ses .pp-ra.on{ pointer-events:auto; cursor:pointer; animation:ppraIn .36s var(--ease-press) both; }
  #pp-ses .pp-ra.out{ animation:ppraOut .34s cubic-bezier(.3,.7,.4,1) both; }
  .pp-ra.out .pp-v{ display:flex; }
  .pp-ra.on .pp-g{ display:none; }
  .pp-ra.on .pp-v{ display:flex; }
  /* v87 : le panneau réponse se pose comme un bouton qui remonte (sans fondu depuis 0, sans rebond) ; son texte apparaît en fondu */
  /* v103 : la réponse a le MÊME rythme que la question : enfoncée puis relâchée avec le même rebond (--ease-press) en .44 s ; la carte question remonte aussi en .44 s (au lieu de .36 s).
     Au retour à la question, le panneau s'enfonce vite puis disparaît dans son emplacement. */
  #pp-ses .pp-card{ transition:border-color .2s, transform .44s var(--ease-press), box-shadow .44s var(--ease-press); }
  #pp-ses .pp-card.pp-sink{ transition-duration:.2s,var(--t-in),var(--t-in); }
  @keyframes ppraIn{ from{ transform:translate(9px,9px); box-shadow:0 0 0 0 var(--yellow-d); } to{ transform:none; box-shadow:9px 9px 0 var(--yellow-d); } }
  @keyframes ppraOut{ 0%{ transform:none; opacity:1; box-shadow:9px 9px 0 var(--yellow-d); } 30%{ transform:translate(9px,9px); opacity:1; box-shadow:0 0 0 0 var(--yellow-d); } 100%{ transform:translate(9px,9px); opacity:0; box-shadow:0 0 0 0 var(--yellow-d); } }
  @keyframes ppraTxt{ from{ opacity:0; } to{ opacity:1; } }
  #pp-ses .pp-ra.on .pp-v{ animation:ppraTxt .28s ease-out .08s both; }
  .pp-ra .pp-at{ margin:0; font-size:clamp(28px,3vw,40px); }
  .pp-ra .pp-at.pp-l{ font-size:24px; }
  #pp-ses .pp-acts{ display:block; flex:none; margin:12px 9px 6px 0; }
  #pp-ses .pp-acts.dim{ opacity:.4; pointer-events:none; filter:saturate(.5); }
  #pp-ses .pp-acts .pp-ans{ height:62px; flex-direction:column; }
  /* v92 : boutons Pas su / Difficile / Facile (grand écran seulement ; le téléphone garde son animation).
     Avant le retournement ils sont enfoncés (et grisés) ; au retournement ils sont relâchés : ils ressortent avec un petit rebond discret. */
  #pp-ses .pp-acts.dim .pp-ans{ transform:translateY(var(--d)); box-shadow:0 0 0 0 var(--sc); }
  @keyframes ppUnpress{ 0%{ transform:translateY(4px); box-shadow:0 0 0 0 var(--sc); } 55%{ transform:translateY(-1.5px); box-shadow:0 5.5px 0 var(--sc); } 100%{ transform:none; box-shadow:0 4px 0 var(--sc); } }
  @keyframes ppActsLit{ from{ opacity:.4; filter:saturate(.5); } to{ opacity:1; filter:saturate(1); } }
  #pp-ses .pp-acts:not(.dim){ animation:ppActsLit .26s ease-out; }
  #pp-ses .pp-acts:not(.dim) .pp-ans{ animation:ppUnpress .4s cubic-bezier(.25,.8,.3,1) backwards; }
  #pp-ses .pp-acts:not(.dim) .pp-ans:nth-child(2){ animation-delay:.04s; }
  #pp-ses .pp-acts:not(.dim) .pp-ans:nth-child(3){ animation-delay:.08s; }
  /* Retournement INVERSE (réponse → question) : exactement la même chorégraphie, jouée à l'envers dans le temps.
     Durée totale .48 s : la dernière touche relâchée en premier est donc la 1re à s'enfoncer, le grisé de l'ensemble finit en dernier. */
  #pp-ses .pp-acts.dim.down{ animation:ppActsLit .26s ease-out .22s backwards reverse; }
  #pp-ses .pp-acts.dim.down .pp-ans{ animation:ppUnpress .4s cubic-bezier(.25,.8,.3,1) backwards reverse; }
  #pp-ses .pp-acts.dim.down .pp-ans:nth-child(1){ animation-delay:.08s; }
  #pp-ses .pp-acts.dim.down .pp-ans:nth-child(2){ animation-delay:.04s; }
  #pp-ses .pp-acts.dim.down .pp-ans:nth-child(3){ animation-delay:0s; }
  @media (prefers-reduced-motion:reduce){ #pp-ses .pp-acts.dim.down, #pp-ses .pp-acts.dim.down .pp-ans{ animation:none; } }
  /* C · parcourir : liste à gauche (360px), fiche à droite */
  .pp-brw{ width:360px; }
  /* v105 : la carte sélectionnée est une pastille arrondie (fond + contour jaune doux) au lieu d'un rectangle brut ; le trait de séparation devient un pseudo-élément pour disparaître autour de la sélection */
  .pp-it{ position:relative; margin:0 -8px; padding:14px 6.5px; border:1.5px solid transparent; border-radius:14px; transition:transform .22s var(--pps), background .2s, border-color .2s; }

  .pp-fc .pp-qt{ font-size:34px; }
  .pp-fc .pp-at{ font-size:30px; margin:0; }
  .pp-fm2{ display:flex; gap:10px; margin-top:auto; align-items:stretch; flex-wrap:wrap; }
  .cb-st{ flex:1; min-width:140px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:12px 14px; }
  .cb-st strong{ display:block; font-size:18px; font-weight:800; line-height:1.15; }
  .pp-fm2 .pp-sec{ padding:0 18px; }
}

/* ============================================================
   CHROMEBOOK v85 — planning sur l'accueil, Ajouter / Réglages / Statistiques au style du prototype.
   Même seuil que v84. Téléphone inchangé (tout est dans ce media query ; .cb-mats n'existe que sur grand écran).
   ============================================================ */
.cb-mats{ display:none; }
@media (min-width:900px) and (min-height:480px){
  /* l'onglet Planning n'existe plus : il est sur l'accueil */
  .pp-tab[data-tab-id="planning"]{ display:none; }
  body .pp-home{ height:calc(100vh - 124px); min-height:560px; }
  /* accueil : semaine cliquable + détail du jour */
  .cb-wk{ margin-top:8px; }
  button.cb-wc{ background:none; border:0; padding:6px 2px 8px; border-radius:14px; cursor:pointer; color:inherit; font:inherit; transition:background .2s; }
  button.cb-wc:hover{ background:rgba(var(--ov),.04); }
  .cb-wc.sel{ background:rgba(var(--yr),.08); box-shadow:inset 0 0 0 1.5px rgba(var(--yr),.55); }
  .cb-wc em{ display:flex; align-items:center; gap:3px; justify-content:center; }
  .cb-wc.ctl em{ color:var(--yellow-t); }
  .cb-wc em svg{ width:12px; height:12px; flex:none; }
  .cb-wk.dense{ gap:4px; }
  .cb-wk.dense .cb-wc>b{ font-size:16px; }
  .cb-wk.dense .cb-wc small{ font-size:11px; text-align:center; line-height:1.15; }
  .cb-wk.dense .cb-wc em{ font-size:0; min-height:14px; }
  .cb-wk.dense .cb-wc:not(.ctl) em{ display:none; }
  .cb-det{ flex:none; margin-top:10px; flex-wrap:wrap; row-gap:8px; }
  .cb-empty{ flex:1; display:grid; place-items:center; text-align:center; color:var(--muted); font-weight:500; font-size:14px; line-height:1.5; padding:10px 18px; }
  /* v93 — accueil : matières et contrôles = liste compacte dans la colonne de droite, sous « Cette semaine ». La liste défile seule si besoin. */
  .cb-mats{ display:flex; flex-direction:column; flex:1 1 296px; min-height:150px; background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:13px 10px 10px 16px; }
  .cb-mh{ display:flex; align-items:center; gap:10px; margin-bottom:8px; padding-right:6px; }
  .cb-mh h3{ font-size:15px; font-weight:800; }
  .cb-mh .pp-sec{ margin-left:auto; width:auto; height:30px; padding:0 12px; font-size:12.5px; border-radius:11px; gap:5px; }
  .cb-ml{ flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:7px; padding:2px 6px 4px 0; }
  .cb-ml, .cb-wk{ scrollbar-width:none; -ms-overflow-style:none; overscroll-behavior:contain; }
  .cb-ml::-webkit-scrollbar, .cb-wk::-webkit-scrollbar{ display:none; width:0; height:0; }
  /* « Cette semaine » : les jours défilent en largeur jusqu'au dernier contrôle, sans barre ; fondu aux bords quand il reste des jours hors champ */
  .cb-wk{ overflow-x:auto; overflow-y:hidden; gap:6px; padding:0 2px 6px; --fl:0px; --fr:0px;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%);
    mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%); }
  .cb-wk.can-left{ --fl:26px; }
  .cb-wk.can-right{ --fr:26px; }
  .cb-wk .cb-wc{ flex:1 0 40px; }
  .cb-ml.can-down{ -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 30px),transparent); mask-image:linear-gradient(to bottom,#000 calc(100% - 30px),transparent); }
  .cb-ml .pp-mat{ flex:none; margin:0; padding:9px 12px 10px; border-radius:14px; background:rgba(var(--ov),.025); border-width:1px; }
  .cb-mr .pp-mtop{ font-size:14.5px; margin-bottom:7px; gap:8px; min-width:0; }
  .cb-mr .cb-mn{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cb-mr .pp-mtop .pp-risk{ font-size:9.5px; padding:1px 5px; flex:none; }
  .cb-mr .pp-mtop .pp-fl2{ font-size:12px; flex:none; white-space:nowrap; }
  .cb-mr .pp-mtop .pp-fl2.pp-add{ padding:1px 8px; }
  .cb-mr .pp-mtop .pp-fl2 svg{ width:13px; height:13px; }
  .cb-mb{ display:flex; align-items:center; gap:10px; }
  .cb-mb .pp-seg{ flex:1; height:7px; margin:0; gap:4px; }
  .cb-mb .pp-seg i{ border-radius:4px; }
  .cb-mc{ flex:none; color:var(--muted); font-weight:600; font-size:12px; white-space:nowrap; }
  .cb-mc b{ color:var(--cream); font-weight:800; }
  .cb-mats .pp-seg i{ animation:none; }
  .cb-ah{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:8px 2px 0; font-weight:800; }
  /* fenêtres (Réglages, contrôle, fiche…) : centrées au milieu de l'écran, au style « carte héros » */
  .pp-sheet{ top:50%; bottom:auto; left:50%; right:auto; margin:0; width:min(560px,calc(100% - 48px)); max-width:none; max-height:min(86vh,820px);
    padding:20px 24px 24px; border:2px solid var(--cream); border-radius:26px; box-shadow:9px 9px 0 var(--orange);
    transform:translate(-50%,-44%) scale(.96); opacity:0; pointer-events:none; transition:transform .35s var(--ease-press), opacity .2s; }
  .pp-sheet.on{ transform:translate(-50%,-50%); opacity:1; pointer-events:auto; }
  .pp-sheet .pp-grab{ display:none; }
  .pp-sheet:has(.pp-setroot){ width:min(900px,calc(100% - 48px)); }
  .pp-setcols{ display:grid; grid-template-columns:1fr 1fr; gap:0 30px; align-items:start; }
  .pp-setcols>div>h4:first-child{ margin-top:6px; }
  /* Statistiques et Synthèse : fenêtre centrée, fond assombri autour */
  .pp-page{ top:50%; bottom:auto; left:50%; right:auto; margin:0; width:min(780px,calc(100% - 60px)); max-width:none; height:min(88vh,840px);
    padding:22px 26px 0; border:2px solid var(--cream); border-radius:26px; animation:none;
    box-shadow:9px 9px 0 var(--orange), 0 0 0 100vmax rgba(5,5,10,.72); transform:translate(-50%,-50%); }
  /* v90 : la page ouverte (Statistiques, Synthèse) bloque aussi les clics autour d'elle (le fond assombri n'est qu'une ombre : il laissait passer les clics) */
  #modal-root:has(>.pp-page){ position:fixed; inset:0; z-index:60; }
  #pp-stats-page{ width:min(1020px,calc(100% - 60px)); height:auto; max-height:min(88vh,760px); }
  #pp-stats-page .pp-sb{ display:grid; grid-template-columns:1fr 1fr; gap:0 34px; align-content:start; padding-bottom:26px; }
  #pp-stats-page .pp-stats{ grid-column:1/-1; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:14px; }
  #pp-stats-page .pp-stat{ padding:18px 16px; border-radius:20px; }
  #pp-stats-page .pp-sgA{ grid-column:1; grid-row:2; }
  #pp-stats-page .pp-sgC{ grid-column:1; grid-row:3; }
  #pp-stats-page .pp-sgB{ grid-column:2; grid-row:2 / span 2; }
  #pp-stats-page .pp-sgB>.pp-sub2{ margin-top:8px!important; }
  #pp-stats-page .pp-heat{ gap:7px; grid-template-columns:repeat(15,1fr); }
  /* Ajouter : composeur « carte héros » à gauche, actions à droite */
  #tab-add{ max-width:1100px; }
  #tab-add .pp-add:has(>.pp-alt){ display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:0 30px; align-content:start; }
  #tab-add .pp-add:has(>.pp-alt)>*{ grid-column:1/-1; }
  #tab-add .pp-add:has(>.pp-alt)>.pp-cmp{ grid-column:1; grid-row:4 / span 4; align-self:start; margin:0 9px 9px 0; padding:12px 14px 14px;
    background:linear-gradient(120deg,var(--panel) 55%,var(--c-pgrad2)); border:2px solid var(--cream); border-radius:26px; box-shadow:9px 9px 0 var(--orange); }
  #tab-add .pp-add:has(>.pp-alt)>.pp-cmp:focus-within{ border-color:var(--yellow-b); box-shadow:9px 9px 0 var(--yellow-d); }
  :root:root #tab-add .pp-cmp textarea.pp-tall{ height:clamp(220px,42vh,420px); font-size:17px; }
  #tab-add .pp-add:has(>.pp-alt)>.pp-cta{ grid-column:2; grid-row:4; margin:0!important; height:60px; align-self:start; }
  #tab-add .pp-add:has(>.pp-alt)>.pp-note{ grid-column:2; grid-row:5; margin:12px 0 0!important; text-align:left; align-self:start; }
  #tab-add .pp-add:has(>.pp-alt)>.pp-alt{ grid-column:2; grid-row:6; flex-direction:column; align-items:stretch; gap:10px; margin-top:18px; align-self:start; }
  /* v111 : message de l'IA (ex. « Colle un cours… ») : encadré sous « Générer les cartes », dans la colonne de droite (le style vient de .pp-warn) */
  #tab-add .pp-add:has(>.pp-alt)>.pp-warn{ grid-column:2; grid-row:5; align-self:start; margin:12px 0 0; }
  #tab-add .pp-add:has(>.pp-alt):has(>.pp-warn)>.pp-note{ grid-row:6; }
  #tab-add .pp-add:has(>.pp-alt):has(>.pp-warn)>.pp-alt{ grid-row:7; }
  #tab-add .pp-alt button{ height:52px; border-radius:16px; justify-content:flex-start; padding:0 18px; font-size:15px; color:var(--cream); }
  #tab-add .pp-add:has(>.pp-side){ display:grid; grid-template-columns:1fr 1fr; gap:0 30px; align-content:start; }
  #tab-add .pp-add:has(>.pp-side)>*{ grid-column:1/-1; }
  #tab-add .pp-add:has(>.pp-side)>.pp-side-q{ grid-column:1; grid-row:4; }
  #tab-add .pp-add:has(>.pp-side)>.pp-side-r{ grid-column:2; grid-row:4; }
  :root:root #tab-add .pp-side .pp-fieldbox textarea{ min-height:clamp(180px,34vh,340px); font-size:17px; }
  #tab-add .pp-add:has(>.pp-pv){ display:grid; grid-template-columns:1fr 1fr; gap:0 20px; align-content:start; }
  #tab-add .pp-add:has(>.pp-pv)>*{ grid-column:1/-1; }
  #tab-add .pp-add:has(>.pp-pv)>.pp-pv{ grid-column:auto; }
}

/* ---- v140 : mode clair — identité propre (papier + traits d'encre + ombres dures), plus une simple inversion du sombre ---- */
:root:root:root[data-theme="light"]{ --line:#d6d2ee; }
:root:root:root[data-theme="light"] body{
  background:
    linear-gradient(var(--bg), rgba(var(--bgr),0) 130px),
    radial-gradient(circle at 92% 0%, rgba(122,90,248,.20), transparent 46%),
    radial-gradient(circle at 0% 100%, rgba(255,107,61,.14), transparent 42%),
    radial-gradient(circle at 50% 55%, rgba(47,124,240,.07), transparent 55%),
    radial-gradient(circle, rgba(var(--ov),.16) 1px, transparent 1.3px) 0 0/16px 16px,
    var(--bg) !important;
  background-attachment:fixed !important;
}
/* v146 : clair adouci — bordures et ombres chaudes au lieu du contour noir (le clair ne ressemble plus à un sombre « inversé »). */
:root:root:root[data-theme="light"] :is(.pp-row,.pp-prog7,.pp-mat,.pp-grp,.pp-sec,.cb-wl,.cb-mats,.pp-streak,.pp-gear){ border-color:var(--c-edge); }
:root:root:root[data-theme="light"] :is(.pp-row,.pp-prog7,.pp-mat,.pp-sec){ --d:3px; --sc:var(--c-edge); box-shadow:0 3px 0 var(--c-edge), 0 10px 22px rgba(var(--ov),.10); }
:root:root:root[data-theme="light"] :is(.pp-row,.pp-prog7,.pp-mat,.pp-sec):is(:active,.js-press){ box-shadow:0 0 0 0 var(--c-edge); }
:root:root:root[data-theme="light"] :is(.pp-grp,.cb-wl,.cb-mats){ box-shadow:0 4px 0 var(--c-edge), 0 12px 26px rgba(var(--ov),.12); }
:root:root:root[data-theme="light"] .pp-ctl{ border-color:var(--c-edge); }
:root:root:root[data-theme="light"] .pp-home .pp-hero .pp-big{ text-shadow:6px 6px 0 var(--orange); }
@media (min-width:900px) and (min-height:480px){
  :root:root:root[data-theme="light"] body .pp-nav{ border:2px solid var(--c-edge); background:var(--panel); box-shadow:0 4px 0 var(--c-edge), 0 12px 26px rgba(var(--ov),.12); }
}

/* v157 : touches de couleur du clair (le sombre n'est pas touché) — carte principale en dégradé pêche/lavande, panneaux et pastilles teintés. */
:root:root:root[data-theme="light"] .pp-home .pp-hero{
  background:
    radial-gradient(circle at 100% 0%, rgba(255,107,61,.22), transparent 52%),
    radial-gradient(circle at 0% 100%, rgba(122,90,248,.16), transparent 55%),
    linear-gradient(160deg, #ffffff 0%, #fff6f0 55%, #f3efff 100%);
}
:root:root:root[data-theme="light"] :is(.pp-grp,.cb-wl,.cb-mats){ background:linear-gradient(180deg, #ffffff 0%, #f8f6ff 100%); }
:root:root:root[data-theme="light"] :is(.pp-row,.pp-mat):hover{ background:#f6f3ff; }
:root:root:root[data-theme="light"] .pp-nav{ background:linear-gradient(180deg,#ffffff,#f5f2ff); }
:root:root:root[data-theme="light"] .pp-ctl{ background:#ffffff; }
:root:root:root[data-theme="light"] ::selection{ background:rgba(122,90,248,.25); }

/* ---- v132 : Apparence — contrôle à 3 positions (réutilise .pp-mode) ---- */
.pp-mode.m3{grid-template-columns:1fr 1fr 1fr}
.pp-mode.m3 i{width:calc((100% - 8px) / 3)}
.pp-mode.m3.p1 i{transform:translateX(100%)}
.pp-mode.m3.p2 i{transform:translateX(200%)}

/* ===== RÉPONSE À ÉCRIRE (étape 2) : tout est scopé #pp-ses.ecr (classe posée seulement quand la carte affichée est à écrire) ou sur des classes nouvelles ===== */
:root{--kbe:cubic-bezier(.2,.8,.2,1)}
.pp-ecrbox{background:var(--panel);border:2px solid var(--line);border-radius:18px;box-shadow:inset 0 3px 0 rgba(0,0,0,.16);padding:2px 4px;transition:border-color .2s;display:flex}
[data-theme=light] .pp-ecrbox{box-shadow:inset 0 3px 0 rgba(120,90,40,.12)}
.pp-ecrbox:focus-within{border-color:var(--yellow-b)}
.pp-card .pp-ecr-ta,.pp-card .pp-ecr-ta *{-webkit-user-select:text;user-select:text;touch-action:auto}
.pp-ecr-ta{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--cream);font:inherit;font-weight:700;font-size:17px;line-height:1.3;padding:11px 10px;resize:none;overflow-y:auto;max-height:var(--ecr-max,112px);min-height:46px;border-radius:14px}
.pp-ecr-ta::placeholder{color:var(--muted);font-weight:600}
.pp-ecr-ok{margin-top:10px}
body.kb #pp-ses.ecr .pp-ecr-ok{margin-top:8px;height:48px}
body.kb #pp-ses.ecr .pp-foot{padding:8px 12px 10px}
.pp-c2w{display:flex;flex-direction:column;gap:12px;text-align:left}
.pp-c2 small{display:block;color:var(--muted);font-weight:800;letter-spacing:.12em;font-size:11px;text-transform:uppercase;margin:0 0 5px}
.pp-c2 p{overflow-wrap:anywhere;word-break:break-word;margin:0;white-space:pre-line;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.pp-c2.mine{border-left:4px solid var(--line);padding-left:12px}
.pp-c2.mine p{font-size:19px;color:var(--cream);font-weight:700}
.pp-c2.mine p i{color:var(--muted);font-weight:600}
.pp-c2.good p{font-size:28px;color:var(--yellow-t)}
.pp-c2.good p.l{font-size:19px}
.pp-c2w.B{flex-direction:row;gap:0}
.pp-c2w.B .pp-c2{flex:1;min-width:0}
.pp-c2w.B .pp-c2.mine{border-left:0;padding:0 14px 0 0;border-right:2px dashed var(--line)}
.pp-c2w.B .pp-c2.good{padding-left:14px}
.pp-c2w.B .pp-c2.mine p{font-size:16px}
.pp-c2w.B .pp-c2.good p,.pp-c2w.B .pp-c2.good p.l{font-size:18px}
.pp-ecl{color:var(--muted);font-weight:800;letter-spacing:.12em;font-size:11px;text-transform:uppercase;margin:0 2px 8px}
.pp-ecw-h{margin-top:12px;text-align:center;color:var(--muted);font-size:13px}
.pp-ecw-h kbd{font:inherit;font-weight:800;font-size:12px;padding:3px 8px;border-radius:7px;background:rgba(var(--ov),.07);border:1px solid rgba(var(--ov),.13);color:var(--cream)}
.pp-ecrslot,.pp-ecw{cursor:default!important}
@media (min-width:900px) and (min-height:480px){
  .pp-ecw{display:flex;flex-direction:column;flex:1;min-height:0}
  .pp-ecw .pp-ecrbox{flex:1;min-height:0}
  .pp-ecw .pp-ecr-ta{max-height:none;font-size:clamp(20px,2vw,26px);padding:14px 14px}
  .pp-ecw .pp-ecr-ok{height:56px;flex:none}
  .pp-c2.good p{font-size:clamp(28px,3vw,40px)}
  .pp-c2.good p.l{font-size:24px}
  .pp-c2.mine p{font-size:22px}
  .pp-c2w.B .pp-c2.mine p{font-size:18px}
  .pp-c2w.B .pp-c2.good p{font-size:22px}
}
@media not all and (min-width:900px) and (min-height:480px){
  /* le clavier (hauteur --kbh) fait monter le bas de l'écran en douceur ; tout ce qui se replie le fait avec la même courbe */
  #pp-ses.ecr{bottom:var(--kbh,0px);transition:bottom .34s var(--kbe),padding-bottom .34s var(--kbe)}
  body.kb #pp-ses.ecr{padding-bottom:10px}
  #pp-ses.ecr .pp-mb{max-height:90px;overflow:hidden;transition:max-height .34s var(--kbe),margin .34s var(--kbe),padding .34s var(--kbe),border-width .34s var(--kbe),box-shadow .34s var(--kbe)}
  body.kb #pp-ses.ecr .pp-mb{max-height:0;margin-top:0;padding-top:0;padding-bottom:0;border-top-width:0;border-bottom-width:0;box-shadow:none}
  #pp-ses.ecr .pp-undo{max-height:44px;overflow:hidden;transition:max-height .34s var(--kbe),margin .34s var(--kbe),border-width .34s var(--kbe),transform var(--t-out) var(--ease-press),box-shadow var(--t-out) var(--ease-press),background .2s,border-color .2s,color .2s}
  body.kb #pp-ses.ecr .pp-undo{max-height:0;margin-top:0;margin-bottom:0;border-width:0}
  #pp-ses.ecr .pp-info{max-height:30px;overflow:hidden;transition:max-height .34s var(--kbe),margin .34s var(--kbe)}
  body.kb #pp-ses.ecr .pp-info{max-height:0;margin-top:0;margin-bottom:0}
  #pp-ses.ecr .pp-top,#pp-ses.ecr .pp-rcard .pp-ch,#pp-ses.ecr .pp-rb,#pp-ses.ecr .pp-foot{transition:padding .34s var(--kbe),margin .34s var(--kbe)}
  #pp-ses.ecr .pp-ecr-ok{transition:height .34s var(--kbe),margin-top .34s var(--kbe),transform var(--t-out) var(--ease-press),box-shadow var(--t-out) var(--ease-press),background .2s}
  .pp-ecr-ta{transition:max-height .34s var(--kbe)}
  /* « Ta réponse » : 2 lignes maximum (le reste est remplacé par « … »), on touche pour tout voir */
  .pp-c2.mine{cursor:pointer}
  .pp-c2.mine p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
  .pp-c2.mine.open p{display:block;-webkit-line-clamp:unset;line-clamp:unset}
  /* carte retournée : la question se compacte, la carte réponse prend la place, et son contenu défile (le doigt peut le faire glisser) */
  #pp-ses.ecr.ecr-fl .pp-stage>.pp-card:not(.pp-rcard){flex:0 1 auto;max-height:38vh}
  #pp-ses.ecr.ecr-fl .pp-stage>.pp-card:not(.pp-rcard) .pp-body{padding:12px 18px 20px}
  #pp-ses.ecr.ecr-fl .pp-stage>.pp-card:not(.pp-rcard) .pp-qt{line-height:1.25}
