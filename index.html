/* ---------------- Sens inversé (⇄) en révision ----------------
   Une carte "inversible" est présentée au hasard (50/50) dans un sens ou dans
   l'autre : sens normal = on voit la question puis la réponse ; sens inversé =
   on voit la réponse d'abord et on doit retrouver la question.
   Ce n'est PAS une deuxième carte : une seule progression (palier, dates...).
   Le tirage est mémorisé UNIQUEMENT ici, en mémoire de session — jamais dans
   la carte, jamais sauvegardé, jamais synchronisé.
   La clé identifie l'AFFICHAGE (position dans la file + id de carte) : tant
   qu'on regarde la même carte à la même place, le sens ne bouge pas (retour
   de carte, re-render, annulation) ; dès qu'on passe à la suivante, ou qu'une
   carte ratée est réinsérée plus loin (autre position), il est retiré au sort. */
let sensAffiche = { cle: null, inverse: false };
/* Réponse à écrire : réponse tapée, verrou, instant du retournement. Mémoire de session uniquement (voir le bloc « RÉPONSE À ÉCRIRE »). */
let ecr = { cle: null, typed: '', locked: false, flipT: 0 };
function sensPourAffichage(c, position, canal){
  if(!c || c.inversible !== true) return false;
  const cle = canal + ':' + position + ':' + c.id;
  if(sensAffiche.cle !== cle){
    sensAffiche = { cle, inverse: Math.random() < 0.5 };
  }
  return sensAffiche.inverse;
}
/* Textes des deux faces selon le sens : face avant (montrée d'abord) et face
   arrière (révélée), avec leurs libellés. */
function facesCarte(c, inverse){
  return inverse
    ? { avant: c.reponse, arriere: c.question, libAvant: 'Réponse', libArriere: 'Question', imgAvant: c.imageReponse || '', imgArriere: c.imageQuestion || '' }
    : { avant: c.question, arriere: c.reponse, libAvant: 'Question', libArriere: 'Réponse', imgAvant: c.imageQuestion || '', imgArriere: c.imageReponse || '' };
}

function renderStudyInner(){
  const el = document.getElementById('tab-study');
  const prevHomeView = !!el.querySelector('.pp-home');
  const planningHtml = planningStripHtml();
  const today = todayStr();

  if(!studySessionActive){
    if(!quizActive) ppSesHide();
    // Aucune carte du tout : vrai état vide avec invitation claire
    if(CARDS.length === 0){
      el.innerHTML = `
        <div class="home-empty-state">
          <span class="pp-sticker home-empty-sticker">Aucune carte</span>
          <div class="home-empty-icon">${icon('plus')}</div>
          <div class="home-empty-title">Ta première carte</div>
          <div class="home-empty-sub">Colle un cours à Claude, récupère les questions/réponses générées, et elles apparaîtront ici prêtes à réviser.</div>
          <button class="home-cta" onclick="switchTab('add')">Ajouter des cartes</button>
        </div>
      `;
      return;
    }

    // Carte filtrée si un filtre matière est actif — les cartes de matières
    // archivées sont exclues du décompte "toutes" de l'accueil, sinon elles
    // gonfleraient un total qu'on ne peut de toute façon plus réviser ici.
    const matieres = getMatieresActives();
    const filtered = matiereFilter === 'toutes'
      ? CARDS.filter(c => matieres.includes(c.matiere || 'Sans matière'))
      : CARDS.filter(c => (c.matiere || 'Sans matière') === matiereFilter);
    const dueTotal = filtered.filter(c => (c.prochaineRevision || today) <= today).length;
    const totalFiltered = filtered.length;

    // Répartition des cartes dues par matière (indépendamment du filtre courant),
    // pour toutes les matières y compris celles à 0 — sert à afficher un chiffre
    // sur chaque badge et à griser celles qui n'ont rien à réviser aujourd'hui.
    const dueCountByMatiereAll = matieres.map(m => ({
      matiere: m,
      count: CARDS.filter(c => (c.matiere || 'Sans matière') === m && (c.prochaineRevision || today) <= today).length
    }));
    const dueParMatiere = dueCountByMatiereAll.filter(x => x.count > 0);

    // Matières ayant au moins une carte déjà révisée aujourd'hui (derniereRevision
    // === today) — sert au bouton "Revoir" quand il n'y a plus rien de dû : on
    // propose de rejouer ce qui vient d'être fait plutôt qu'un bouton mort.
    const revuesCountByMatiereAll = matieres.map(m => ({
      matiere: m,
      count: CARDS.filter(c => (c.matiere || 'Sans matière') === m && c.derniereRevision === today).length
    }));
    const revuesParMatiere = revuesCountByMatiereAll.filter(x => x.count > 0);
    const revuesCountFiltre = matiereFilter !== 'toutes'
      ? (revuesCountByMatiereAll.find(x => x.matiere === matiereFilter) || { count: 0 }).count
      : revuesParMatiere.reduce((s, x) => s + x.count, 0);

    // Le filtre matière (chips) est l'unique sélecteur de matière de cet écran :
    // le bouton "Réviser" agit toujours sur la matière déjà choisie dans les chips.
    // S'il y a plusieurs matières dues et qu'aucun filtre n'est actif, on demande
    // de choisir dans les chips plutôt que de dupliquer le choix dans une liste à part.
    // Le CTA principal : UN seul bouton plein visible à la fois. S'il y a
    // plusieurs matières concernées (dues ou revues), le choix se fait dans
    // une modale (comme "Tout réviser"), jamais étalé en liste sur l'accueil
    // — avec 5 matières ça ferait 5 boutons pleine largeur d'un coup.
    const chev = PP_IC.chev;
    let actionHtml;
    if(dueParMatiere.length === 0){
      if(revuesParMatiere.length === 0){
        actionHtml = `<button class="pp-cta" disabled>Rien à réviser aujourd'hui</button>`;
      } else if(revuesParMatiere.length === 1){
        const only = revuesParMatiere[0];
        actionHtml = `<button class="pp-cta" onclick="startRevoirOnMatiere('${escapeJsAttr(only.matiere)}')">Revoir ${only.count} carte${only.count>1?'s':''} ${chev}</button>`;
      } else {
        const totRev = revuesParMatiere.reduce((t, x) => t + x.count, 0);
        actionHtml = `<button class="pp-cta" onclick="openChooseMatiereForRevoir()">Revoir ${totRev} carte${totRev>1?'s':''} ${chev}</button>`;
      }
    } else if(matiereFilter !== 'toutes'){
      const count = dueTotal;
      actionHtml = count > 0
        ? `<button class="pp-cta" onclick="startStudySession('due')">Réviser ${count} carte${count>1?'s':''} ${chev}</button>`
        : (revuesCountFiltre > 0
          ? `<button class="pp-cta" onclick="startStudySession('today')">Revoir ${revuesCountFiltre} carte${revuesCountFiltre>1?'s':''} ${chev}</button>`
          : `<button class="pp-cta" disabled>Rien à réviser en ${escapeHtml(matiereFilter)}</button>`);
    } else if(dueParMatiere.length === 1){
      const only = dueParMatiere[0];
      actionHtml = `<button class="pp-cta" onclick="startStudyOnMatiere('${escapeJsAttr(only.matiere)}')">Réviser ${only.count} carte${only.count>1?'s':''} ${chev}</button>`;
    } else {
      actionHtml = `<button class="pp-cta" onclick="openChooseMatiereForDue()">Réviser ${dueTotal} carte${dueTotal>1?'s':''} ${chev}</button>`;
    }

    const nbRappels = dueTotal > 0 ? getRappelsPourFiltre().length : 0;
    const rappelsTxt = nbRappels > 0 ? ` · + ${nbRappels} rappel${nbRappels>1?'s':''}` : '';
    const ppStill = !(ppFresh || !prevHomeView);
    ppFresh = false;
    const multi = matieres.length > 1 && matiereFilter === 'toutes';
    const rowAll = `<button class="pp-row" ${totalFiltered===0?'disabled':''} onclick="${multi ? 'openChooseMatiereForAll()' : "startStudySession('all')"}"><i class="pp-ri">${PP_IC.all.replace(/16/g,'18')}</i><div><b>Réviser tout${matiereFilter!=='toutes' ? ' — ' + escapeHtml(matiereFilter) : ''}</b><span>Compte pour la maîtrise des cartes</span></div><span style="color:var(--muted)">${PP_IC.chev}</span></button>`;
    const rowQuiz = `<button class="pp-row" ${totalFiltered<2?'disabled':''} onclick="${multi ? 'openChooseMatiereForQuiz()' : 'startQuizFromHome()'}"><i class="pp-ri">${PP_IC.quiz.replace(/16/g,'18')}</i><div><b>S'entraîner</b><span>Un score, sans pression</span></div><span style="color:var(--muted)">${PP_IC.chev}</span></button>`;
    el.innerHTML = `<div class="pp-view pp-home${ppStill ? ' pp-still' : ''}">${ppCtlHtml() || ppCtlAddHtml()}
  <div class="pp-hero"><div><span class="pp-sticker">${dueTotal > 0 ? "À réviser aujourd'hui" : 'Tout est à jour'}</span></div><div class="pp-hmid"><div class="pp-big" id="bigN" data-n="${dueTotal}">${dueTotal}</div>
  <p class="pp-sub">sur <b>${totalFiltered}</b> carte${totalFiltered>1?'s':''} au total${nbRappels > 0 ? ` · <span class="pp-rappel">+ ${nbRappels} rappel${nbRappels>1?'s':''}</span>` : ''}</p></div>
  ${actionHtml}</div>

  <div class="pp-opts">
   ${rowAll}
   ${rowQuiz}
  </div>
  ${ppProgressHtml()}${ppCbHtml(dueTotal)}</div>`;
    return;
  }

  // ---- Session active : écran du prototype (#pp-ses) ----
  el.innerHTML = '';
  if(queue.length === 0){
    const emptyMsg = studyMode === 'all'
      ? 'Aucune carte dans cette sélection.'
      : studyMode === 'today'
      ? 'Aucune carte révisée aujourd\'hui dans cette sélection.'
      : (matiereFilter !== 'toutes' ? 'Rien à réviser dans cette matière pour le moment.' : "Colle un cours à Claude pour ajouter des cartes.");
    ppMood.anim = '';
    ppSesShow(`<div class="pp-done"><div class="pp-okm">${PP_IC.ok}</div><h2>Rien à réviser</h2><p>${emptyMsg}</p><div class="pp-btns"><button class="pp-cta" onclick="exitStudySession()">${PP_HOME}Retour à l'accueil</button></div></div>`);
    return;
  }
  if(currentIndex >= queue.length){
    const nbErr = sessionErrors.length;
    // Matière suivante ayant des cartes dues (la plus chargée d'abord), seulement
    // après une session sur UNE matière (pas après « Tout réviser » / « Revoir »).
    const suivante = ((studyMode === 'due' || studyMode === 'errors') && matiereFilter !== 'toutes')
      ? (getMatieresDuesTriees(matiereFilter)[0] || null) : null;
    ecrReset();
    const many = !!(suivante || nbErr);
    const btnSuite = suivante
      ? `<button class="pp-cta" onclick="continuerAvecMatiere('${escapeJsAttr(suivante.matiere)}')">Continuer avec ${escapeHtml(suivante.matiere)} (${suivante.count} carte${suivante.count>1?'s':''})</button>`
      : '';
    const btnErreurs = nbErr
      ? `<button class="pp-cta${suivante ? ' pp-ghost' : ''}" onclick="startReviewSessionErrors()">Revoir ${nbErr} carte${nbErr>1?'s':''} en erreur</button>`
      : '';
    const btnRetour = `<button class="pp-cta${many ? ' pp-quiet' : ''}" onclick="exitStudySession()">${PP_HOME}Retour à l'accueil</button>`;
    ppMood.anim = '';
    ppSesShow(`<div class="pp-done">${ppConfetti()}<div class="pp-okm">${PP_IC.ok}</div><h2>Terminé pour aujourd'hui</h2><p>${sessionReviewed} carte${sessionReviewed>1?'s':''} révisée${sessionReviewed>1?'s':''}${sessionMastered ? ` · ${sessionMastered} nouvelle${sessionMastered>1?'s':''} maîtrisée${sessionMastered>1?'s':''}` : ''}.</p>
 ${ppBilanHtml()}<div class="pp-btns">${btnSuite}${btnErreurs}${btnRetour}</div></div>`);
    return;
  }
  const c = queue[currentIndex];
  const faces = facesCarte(c, sensPourAffichage(c, currentIndex, 'etude'));
  const o = {
    c, faces, flipped, counts: sessionMoodCounts, undo: !!lastAnswer,
    mp: { all:'tout', today:'revoir', errors:'erreurs' }[studyMode],
    ids: { card:'anki-card', body:'anki-card-body' },
    fnFlip: 'flipCard()', fnAns: 'answer', fnBack: 'exitStudySession()'
  };
  /* Réponse à écrire : l'animation est lue AVANT ppSesDraw (qui la remet à ''), le focus du champ aussi (le redessin le supprime). */
  const ecrOn = ecrActive(o), ecrAnim = ppMood.anim, ecrFoc = ecrOn ? ecrFocusCapture() : null;
  if(ecrOn) ecrEtat('study:' + currentIndex + ':' + c.id); else ecrReset();
  ppSesDraw(o);
  if(ecrOn){
    const root = ppSesRoot();
    root.classList.add('ecr'); root.classList.toggle('ecr-fl', !!flipped);
    ecrHabiller(o, ecrAnim, ecrFoc);
  }
  ecrMesure();
  justAdvanced = false;
}

/* Petit bloc "tableau de bord" pour occuper l'espace libre en bas de l'accueil :
   série de jours + cartes maîtrisées en un coup d'œil, et un mini graphique
   des révisions des 7 derniers jours (basé sur derniereRevision de chaque carte). */
function progressBlockHtml(){
  if(CARDS.length === 0) return '';

  const streak = getStreakAffichee();
  const masteredCount = CARDS.filter(c => (c.palier || 0) >= MASTERED_PALIER).length;

  const today = todayStr();
  const dayLabels = ['D','L','M','M','J','V','S'];
  const days = [];
  for(let i = 6; i >= 0; i--){
    const dateStr = addDays(today, -i);
    const jsDay = new Date(dateStr + 'T00:00:00').getDay();
    const count = CARDS.filter(c => c.derniereRevision === dateStr).length;
    days.push({ dateStr, label: dayLabels[jsDay], count, isToday: dateStr === today });
  }
  const maxCount = Math.max(1, ...days.map(d => d.count));

  const barsHtml = days.map(d => {
    const heightPct = d.count === 0 ? 4 : Math.max(14, Math.round((d.count / maxCount) * 100));
    return `
      <div class="home-progress-bar-col">
        <div class="home-progress-bar-track">
          <div class="home-progress-bar ${d.count > 0 ? 'has-activity' : ''} ${d.isToday ? 'is-today' : ''}" style="height:${heightPct}%" title="${d.count} carte${d.count>1?'s':''}"></div>
        </div>
        <span class="home-progress-bar-day ${d.isToday ? 'is-today' : ''}">${d.label}</span>
      </div>
    `;
  }).join('');

  return `
    <div class="home-progress" role="button" tabindex="0" onclick="openStreakModal()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault(); openStreakModal();}">
      <div class="home-progress-stats">
        <div class="home-progress-stat">
          <span class="home-progress-stat-icon is-streak">${icon('sparkle')}</span>
          <span class="home-progress-stat-body">
            <span class="home-progress-stat-num">${streak}</span>
            <span class="home-progress-stat-label">jour${streak>1?'s':''} de suite</span>
          </span>
        </div>
        <div class="home-progress-divider"></div>
        <div class="home-progress-stat">
          <span class="home-progress-stat-icon">${icon('checkCircle')}</span>
          <span class="home-progress-stat-body">
            <span class="home-progress-stat-num">${masteredCount}</span>
            <span class="home-progress-stat-label">maîtrisée${masteredCount>1?'s':''}</span>
          </span>
        </div>
      </div>
      <div class="home-progress-chart">${barsHtml}</div>
    </div>
  `;
}

/* Bandeau sous la carte affichant le nombre total de cartes déjà maîtrisées,
   avec un bouton retour à gauche. Volontairement STABLE pendant tout le
   déroulé d'un quiz/session : contrairement au palier de la carte en cours
   (qui change à chaque réponse), ce nombre ne bouge que quand une carte
   franchit MASTERED_PALIER — jamais pendant qu'on répond, ce qui évite de
   détourner l'attention pendant le test.
   `onBackFnName` : nom (string) de la fonction globale à appeler pour
   revenir à l'accueil des révisions. */

/* Classe d'animation d'entrée pour la carte affichée (session normale et quiz) :
   si la carte qui vient de disparaître avait une direction de sortie
   enregistrée (lastAdvanceDir, posée par answer()/quizAnswer()), la nouvelle
   entre du côté opposé pour un enchaînement fluide plutôt qu'un jaillissement
   vertical sans rapport. Sinon (premier affichage, changement de filtre,
   nouvelle session...), retombe sur l'animation neutre card-settle. Consomme
   lastAdvanceDir (remis à null) pour ne pas la réutiliser sur un rendu suivant
   qui ne serait pas la suite d'une réponse.
   La carte SORT vers la droite (dir=1, réponse orange/vert) → la SUIVANTE doit
   sembler venir de la droite pour prolonger le même mouvement, donc entre avec
   card-settle-from-right ; et inversement pour une sortie vers la gauche
   (dir=-1, réponse rouge) → card-settle-from-left. */

/* Classe de fondu d'entrée pour les 3 boutons de réponse (.study-actions) :
   uniquement au tout premier affichage d'une session, jamais entre deux
   cartes (voir isFirstCardOfSession plus haut). Consomme le flag. */

/* Convertit une couleur hex (#rgb ou #rrggbb) en [r,g,b]. */
function hexToRgb(hex){
  hex = hex.trim().replace('#','');
  if(hex.length === 3) hex = hex.split('').map(ch => ch+ch).join('');
  const n = parseInt(hex, 16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}

/* Poids appliqués à chaque niveau dans le mélange ci-dessous : à effectif égal,
   une réponse rouge doit tirer la teinte vers elle plus fort qu'une orange ou
   une verte (retour utilisateur : le rouge se "noyait" trop facilement dans
   le mélange). Le vert est légèrement en retrait pour la même raison inverse
   (il a tendance à dominer visuellement autrement). Purement une question de
   ressenti visuel, aucun lien avec les paliers de révision. */
const POIDS_TEINTE_SESSION = { rouge: 1.6, orange: 1.15, vert: 1 };

/* Couleur de la barre "teinte de session" (.study-mood-bar) : mélange pondéré
   des couleurs rouge/orange/vert au prorata du nombre de réponses de chaque
   type dans sessionMoodCounts (voir POIDS_TEINTE_SESSION ci-dessus pour la
   pondération). Lit --bad et --good via getComputedStyle pour suivre
   automatiquement le thème clair/sombre actif ; l'orange des boutons n'est
   pas une variable CSS (toujours #c98a3f, non thémé), donc fixe ici aussi.
   Neutre (gris de bordure --line) tant qu'aucune réponse n'a été donnée, pour
   ne rien laisser deviner avant que la session ait commencé. */
function sessionMoodColor(){
  const { rouge, orange, vert } = sessionMoodCounts;
  const p = POIDS_TEINTE_SESSION;
  const totalPoids = rouge*p.rouge + orange*p.orange + vert*p.vert;
  const cs = getComputedStyle(document.documentElement);
  if(totalPoids === 0) return cs.getPropertyValue('--line').trim() || '#e7ded0';
  const rougeRgb = hexToRgb(cs.getPropertyValue('--bad').trim() || '#e42e1f');
  const orangeRgb = hexToRgb('#c98a3f');
  const vertRgb = hexToRgb(cs.getPropertyValue('--good').trim() || '#1f8a5f');
  const mix = [0,1,2].map(i =>
    Math.round((rougeRgb[i]*rouge*p.rouge + orangeRgb[i]*orange*p.orange + vertRgb[i]*vert*p.vert) / totalPoids)
  );
  return `rgb(${mix[0]},${mix[1]},${mix[2]})`;
}

/* Couleur "pure" (non diluée) d'un niveau donné, utilisée uniquement pour le
   flash de la goutte (triggerMoodDrop) — jamais pour la teinte de fond, qui
   reste toujours le mélange complet de sessionMoodColor. */
function pureNiveauColor(niveau){
  const cs = getComputedStyle(document.documentElement);
  if(niveau === 'rouge') return cs.getPropertyValue('--bad').trim() || '#e42e1f';
  if(niveau === 'vert') return cs.getPropertyValue('--good').trim() || '#1f8a5f';
  return '#c98a3f';
}

/* Rejoue l'animation de la "goutte" (voir .study-mood-bar-drop en CSS) sur la
   barre de teinte : un flash de la couleur pure du niveau qui vient d'être
   ajouté, qui s'étale puis s'estompe très doucement pendant la carte
   suivante. Purement visuel — la teinte de fond réelle (sessionMoodColor) est
   déjà posée ailleurs au moment de l'appel, ce calque ne fait que passer
   dessus. Le retrait/repose de la classe avec un reflow forcé entre les deux
   permet de rejouer l'animation à l'identique à chaque réponse, y compris
   deux réponses de suite du même niveau. */
function triggerMoodDrop(niveau){
  const dropEl = document.getElementById('study-mood-bar-drop');
  if(!dropEl) return;
  dropEl.style.setProperty('--drop-color', pureNiveauColor(niveau));
  dropEl.classList.remove('is-active');
  void dropEl.offsetWidth; // force reflow pour pouvoir rejouer l'animation
  dropEl.classList.add('is-active');
}

/* Barre pleine unique dont la couleur cumule les réponses de la session (voir
   sessionMoodColor) — volontairement PAS une barre "combien il reste avant la
   fin" : ni segments, ni pourcentage, ni décompte. Cachée avant la 2e carte
   (total <= 1) comme l'étaient les anciens points, pour ne rien afficher sur
   une session à une seule carte. */

/* Compteur "maîtrisée(s)" affiché dans l'en-tête de session. Dans les modes
   normaux ('due'/'today'/'errors'), on garde sessionMastered : le nombre de
   promotions obtenues PENDANT cette session (ne redescend jamais, même si une
   carte déjà promue est ensuite ratée — voir doc de sessionMastered).
   En "Tout réviser" (studyMode 'all'), la file contient aussi toutes les
   cartes déjà maîtrisées depuis longtemps : les promotions y sont donc rares
   et sessionMastered restait bloqué à 0 la plupart du temps, ce qui donnait
   l'impression que rien ne se passait. On affiche à la place le total réel de
   cartes maîtrisées dans le paquet entier (recalculé à chaque réponse) — un
   chiffre qui bouge à chaque session un peu longue, et qui peut aussi
   redescendre si une carte maîtrisée est ratée ici (reflet honnête de l'état
   réel, pas juste des promotions). */

/* Nouvelle séance : le plafond de réinsertions repart de zéro (une PWA restée ouverte plusieurs jours le cumulait). */
function ppReinsertionsRaz(){ for(const c of CARDS) if(c.reinsertionsSession) c.reinsertionsSession = null; }
function startStudySession(mode){
  haptique(14);
  ppReinsertionsRaz();
  studyMode = mode || 'due';
  studySessionActive = true;
  sessionReviewed = 0;
  sessionMastered = 0;
  sessionErrors = [];
  lastAnswer = null;
  sessionMoodCounts = { rouge: 0, orange: 0, vert: 0 };
  ppSeanceRaz();
  ppMoodReset();
  buildQueue(true);
  justAdvanced = true;
  isFirstCardOfSession = true;
  const tb = document.getElementById('tabbar-root');
  if(tb) tb.classList.add('tabbar-hidden');
  renderStudy();
}

/* Matières actives ayant des cartes dues aujourd'hui, la plus chargée d'abord
   (à égalité : ordre alphabétique). `exclure` = matière à ne pas compter. */
function getMatieresDuesTriees(exclure){
  const today = todayStr();
  return getMatieresActives()
    .filter(m => m !== exclure)
    .map(m => ({ matiere: m, count: CARDS.filter(c => (c.matiere || 'Sans matière') === m && (c.prochaineRevision || today) <= today).length }))
    .filter(x => x.count > 0)
    .sort((a, b) => (b.count - a.count) || a.matiere.localeCompare(b.matiere, 'fr'));
}

/* « Tout enchaîner » : démarre par la matière la plus chargée, SANS mélanger les
   matières. À la fin, l'écran de fin propose « Continuer avec <suivante> ». */
function startStudyChain(){
  const liste = getMatieresDuesTriees(null);
  if(liste.length) startStudyOnMatiere(liste[0].matiere);
}

/* Retourne la carte SANS re-render de toute la page : évite le flash/clignotement
   qu'un renderStudy() complet provoquait (bandeau, dots de progression et carte
   étaient tous détruits et recréés d'un coup). On ne mute que le contenu de la
   carte, avec une transition douce sur la réponse qui apparaît. */
/* Étape D : la carte s'enfonce (classe .pp-sink : elle descend de son ombre orange) avant de se
   retourner. Le retournement attend au plus PP_ENFONCE_MS depuis le début de l'enfoncement (un vrai
   tap dure déjà plus : aucun retard en pratique) ; le nouvel écran réapparaît enfoncé puis remonte
   (voir ppSesDraw). Sans carte à l'écran ou avec « réduire les animations » : retournement immédiat. */
const PP_ENFONCE_MS = 80;
let ppFlipEnCours = false;
function ppRetournerApresEnfoncement(fn){
  /* carte « à écrire » : la carte réponse (téléphone) / le panneau de droite (grand écran) s'enfoncent avec la carte question */
  document.querySelectorAll('#pp-ses .pp-rcard,#pp-ses .pp-ecrslot').forEach(e => { e.style.animation = 'none'; e.classList.add('pp-sink'); });
  const card = document.querySelector('.pp-card');
  const reduit = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!card || reduit){ fn(); return; }
  if(ppFlipEnCours) return; // double tap : un seul retournement
  ppFlipEnCours = true;
  if(!card.classList.contains('pp-sink')){
    card.style.animation = 'none'; // sinon l'animation d'entrée (fill forwards) masque le transform
    card.classList.add('pp-sink');
    card._sinkT0 = Date.now();
  }
  const reste = Math.max(0, PP_ENFONCE_MS - (Date.now() - (card._sinkT0 || 0)));
  setTimeout(() => { ppFlipEnCours = false; fn(); }, reste);
}
function flipCard(){
  if(carteEnSortie) return;
  ecrBascule(flipped);
  ppRetournerApresEnfoncement(() => {
    if(carteEnSortie) return;
    flipped = !flipped;
    ppMood.anim = 'flip'; // l'écran est redessiné : la carte remonte, le corps joue son fondu
    renderStudy();
  });
}

/* 'orange' (Difficile) ne fait plus progresser ni reculer le palier : la carte
   revient plus tôt (cf. answer()) mais sans perdre l'avancement déjà acquis —
   contrairement à 'rouge' qui repart de zéro.

   Palier de "probation" avant maîtrise : une carte qui a déjà été marquée
   difficile/ratée au moins une fois (c.difficultes > 0) ne saute pas direct
   au palier "maîtrisée" sur un simple facile — elle doit enchaîner 2 facile
   d'affilée au dernier cap avant d'y être considérée vraiment acquise. Une
   carte qui n'a jamais posé souci avance normalement, un facile suffit. */
const FACILE_REQUIS_APRES_SOUCI = 2;

function nextPalier(c, niveau){
  const p = c.palier || 0;
  if(niveau === 'rouge'){
    c.difficultes = (c.difficultes || 0) + 1;
    c.facileConsecutif = 0;
    return 0;
  }
  if(niveau === 'orange'){
    c.difficultes = (c.difficultes || 0) + 1;
    c.facileConsecutif = 0;
    return Math.min(p, INTERVALS.length - 1);
  }
  // niveau === 'vert'
  const dejaEuSouci = (c.difficultes || 0) > 0;
  const auCapMaitrise = p === MASTERED_PALIER - 1; // dernier cran avant "maîtrisée"
  if(dejaEuSouci && auCapMaitrise){
    c.facileConsecutif = (c.facileConsecutif || 0) + 1;
    if(c.facileConsecutif < FACILE_REQUIS_APRES_SOUCI){
      return p; // reste au même palier : encore un facile à faire pour valider
    }
  }
  c.facileConsecutif = 0;
  return Math.min(p + 1, INTERVALS.length - 1);
}

/* ---------------- Facilité par carte ----------------
   Chaque carte a un petit coefficient de facilité (champ "facilite", absent =
   1 = normal) qui allonge ou raccourcit son intervalle de révision après une
   réussite. Vert : monte un peu ; orange : baisse un peu ; rouge : baisse plus.
   Toujours borné entre FACILITE_MIN et FACILITE_MAX, donc rien ne dérive, et il
   remonte tout seul quand la carte est de nouveau réussie (contrairement au
   compteur "difficultes", qui ne redescend jamais et sert à la probation).
   Il ne remplace ni les paliers, ni la probation, ni la compression avant
   contrôle : il ajuste seulement le nombre de jours du palier obtenu. */
const FACILITE_MIN = 0.7;
const FACILITE_MAX = 1.5;
const FACILITE_PAS = { vert: 0.1, orange: -0.1, rouge: -0.2 };

function facilitePour(c){
  const f = c && c.facilite;
  return Number.isFinite(f) ? Math.min(FACILITE_MAX, Math.max(FACILITE_MIN, f)) : 1;
}
function majFacilite(c, niveau){
  const f = facilitePour(c) + (FACILITE_PAS[niveau] || 0);
  c.facilite = Math.round(Math.min(FACILITE_MAX, Math.max(FACILITE_MIN, f)) * 100) / 100;
}

/* Réinsertion des cartes ratées ("rouge") ou difficiles ("orange") plus loin
   dans la queue de la session en cours, pour un vrai rappel en mémoire plutôt
   qu'une répétition mécanique immédiate — mais proportionnelle au nombre de
   cartes RESTANTES (queue.length - currentIndex - 1, après l'avoir retirée du
   compte) plutôt qu'un nombre fixe : un écart de 4 cartes n'a pas le même effet
   sur une session de 10 cartes que sur une de 80. Bornes min/max pour éviter
   les deux extrêmes (trop proche = pas de vrai rappel ; trop loin = elle sort
   de la queue avant d'être revue sur une petite session).
   Rouge (échec plus total) est réinséré plus loin qu'orange (juste difficile).
   MAX_REINSERTIONS plafonne le nombre de fois qu'une même carte peut être
   réinsérée DANS UNE SESSION (pas au total) : au-delà, elle n'est plus
   réinsérée ici mais reste programmée normalement (palier / lendemain) — évite
   qu'une carte très dure ne boucle indéfiniment dans la même session. */
const REINSERT_RATIO = { orange: 0.25, rouge: 0.40 };
const REINSERT_BOUNDS = { orange: [4, 12], rouge: [6, 18] };
const MAX_REINSERTIONS = { orange: 3, rouge: 2 };

function computeReinsertGap(niveau, remainingAfter){
  if(!REINSERT_BOUNDS[niveau]) return 0;   // 'vert' : jamais réinséré
  const ratio = REINSERT_RATIO[niveau];
  const [min, max] = REINSERT_BOUNDS[niveau];
  const raw = Math.round(remainingAfter * ratio);
  return Math.min(max, Math.max(min, raw));
}

/* ---------------- Sortie de carte + geste de glissement (prototype v31) ----------------
   Une seule sortie pour les boutons, le clavier ET le glissement : la carte part
   en 320 ms (vers la droite = facile, la gauche = pas su, le haut ou le bas =
   difficile). Au doigt : la pastille apparaît dès 45 px, se retire en revenant
   sous 33 px ; relâcher sans pastille ramène la carte avec un ressort. */
const GESTE_SEUIL = 45;
const GESTE_DESARME = 33;
let carteEnSortie = false;
let carteEnSortieT = null;   // minuteur du filet de sécurité : un seul à la fois, annulé dès que la carte est sortie
const PP_NV = { vert:['var(--green)','ok'], rouge:['var(--pink)','x'], orange:['var(--amber)','wave'] };

function sortirCarte(niveau, opts, apres){
  opts = opts || {};
  const scene = document.querySelector('.pp-card');
  lastAdvanceDir = null;
  if(!scene){ ppMood.anim = 'in'; apres(); clearTimeout(carteEnSortieT); carteEnSortie = false; return; }
  const sortie = niveau === 'orange' ? (opts.dy < 0 ? 'pp-out-up' : 'pp-out-mid') : (niveau === 'vert' ? 'pp-out-ok' : 'pp-out-ko');
  scene.style.animation = ''; scene.style.transition = '';
  scene.classList.add(sortie);
  const rc = document.querySelector('#pp-ses .pp-rcard');   // carte « à écrire » (téléphone) : la carte réponse sort avec la carte question
  if(rc){ rc.style.animation = ''; rc.style.transition = ''; rc.classList.add(sortie); }
  setTimeout(() => { ppMood.anim = 'in'; apres(); clearTimeout(carteEnSortieT); carteEnSortie = false; }, 320);
}

(function(){
  let st = null;
  function bloquerClic(){
    const h = ev => { ev.stopPropagation(); ev.preventDefault(); };
    document.addEventListener('click', h, true);
    setTimeout(() => document.removeEventListener('click', h, true), 80);
  }
  function retour(s){
    s.scene.style.transition = 'transform .4s var(--pps)';
    s.scene.style.transform = '';
    if(s.pa) s.pa.classList.remove('on');
    s.scene.classList.remove('armed');
    if(s.partner){ s.partner.style.transition = 'transform .4s var(--pps)'; s.partner.style.transform = ''; s.partner.classList.remove('armed'); }
  }

  document.addEventListener('pointerdown', e => {
    st = null;
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    if(carteEnSortie) return;
    const t = e.target;
    const scene = t && t.closest ? t.closest('.pp-card') : null;
    if(!scene || t.closest('button, a, input, textarea, select')) return;
    if(t.closest('.pp-ecrbox, .pp-ecr-ta, .pp-lock, .pp-rb')) return; // carte à écrire : champ, texte verrouillé, corps défilant → ni glissement ni retournement
    const modal = document.getElementById('modal-root');
    if(modal && modal.innerHTML.trim() !== '') return;
    const ctx = raccourciContexte();
    if(!ctx) return;
    if(ecrAffichee() && !ctx.flipped && !ecr.locked) return; // carte à écrire pas encore validée : on ne la note pas d'un glissement, il faut écrire puis Valider
    // carte « à écrire » (téléphone) : la carte question et la carte réponse bougent ensemble
    const rcE = document.querySelector('#pp-ses .pp-rcard');
    const partner = rcE ? (scene === rcE ? document.querySelector('#pp-ses .pp-card:not(.pp-rcard)') : rcE) : null;
    st = { id:e.pointerId, x:e.clientX, y:e.clientY, dx:0, dy:0, moved:false, lv:null, scene, partner, ctx, pa:scene.querySelector('.pp-pastille') || (partner && partner.querySelector('.pp-pastille')) };
    scene.style.animation = 'none'; scene.style.transition = ''; // la transition reste celle du CSS (enfoncement) jusqu'au début d'un glissement
    if(partner) partner.style.animation = 'none';
    const bd = t.closest('.pp-body');
    if(bd && bd.hasAttribute('onclick')){ scene.classList.add('pp-sink'); scene._sinkT0 = Date.now(); } // étape D (pas sur une carte à écrire dont le corps ne retourne rien)
  }, { passive:true });

  document.addEventListener('pointermove', e => {
    if(!st || e.pointerId !== st.id) return;
    const dx = e.clientX - st.x, dy = e.clientY - st.y, d = Math.hypot(dx, dy);
    if(!st.moved){
      if(d < 8) return;
      st.moved = true;
      st.scene.style.transition = 'none'; st.scene.classList.remove('pp-sink'); // c'est un glissement, pas un tap : la carte suit le doigt
      if(st.partner){ st.partner.style.transition = 'none'; st.partner.classList.remove('pp-sink'); }
      try{ st.scene.setPointerCapture(e.pointerId); }catch(err){}
    }
    st.dx = dx; st.dy = dy;
    const sc = st.scene;
    sc.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + (dx * .05) + 'deg)';
    if(st.partner) st.partner.style.transform = sc.style.transform;
    if(st.pa) st.pa.style.setProperty('--f', (.10 + Math.min(1, Math.max(0, (d - GESTE_SEUIL) / 110)) * .20).toFixed(3)); // v130 : le fond se remplit doucement avec la distance (10 % → 30 %)
    const n = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'vert' : 'rouge') : 'orange';
    if(d >= GESTE_SEUIL && st.lv !== n){
      st.lv = n;
      sc.style.setProperty('--pc', PP_NV[n][0]);
      if(st.pa){ st.pa.style.setProperty('--pc', PP_NV[n][0]); st.pa.innerHTML = PP_IC[PP_NV[n][1]]; st.pa.classList.add('on'); }
      sc.classList.add('armed');
      if(st.partner){ st.partner.style.setProperty('--pc', PP_NV[n][0]); st.partner.classList.add('armed'); }
      haptique(8);
    } else if(st.lv && d < GESTE_DESARME){
      st.lv = null;
      if(st.pa) st.pa.classList.remove('on');
      sc.classList.remove('armed');
      if(st.partner) st.partner.classList.remove('armed');
    }
  });

  function fin(e, annule){
    if(!st || e.pointerId !== st.id) return;
    const s = st; st = null;
    if(!s.moved){
      // simple tap : le onclick d'origine (retourner la carte) s'en charge et garde la carte enfoncée ;
      // si rien ne la retourne (tap hors zone, défilement annulé), elle remonte
      if(annule) s.scene.classList.remove('pp-sink');
      else setTimeout(() => { if(!ppFlipEnCours) s.scene.classList.remove('pp-sink'); }, 150);
      return;
    }
    bloquerClic();
    if(!annule && s.lv) s.ctx.answer(s.lv, { depuisGeste:true, dy:s.dy });
    else retour(s);
  }
  document.addEventListener('pointerup', e => fin(e, false));
  document.addEventListener('pointercancel', e => fin(e, true));

  // Le corps de la carte ne garde le défilement vertical natif que si sa réponse déborde.
  let majPlanifiee = false;
  function ajusterDefilement(){
    majPlanifiee = false;
    document.querySelectorAll('.pp-body').forEach(b => b.classList.toggle('peut-defiler', b.scrollHeight > b.clientHeight + 2));
  }
  new MutationObserver(() => {
    if(majPlanifiee) return;
    majPlanifiee = true;
    requestAnimationFrame(ajusterDefilement);
  }).observe(document.body, { childList:true, subtree:true });
})();

function answer(niveau, opts){
  if(carteEnSortie) return;
  const c = queue[currentIndex];
  if(!c) return;   // plus de carte courante (fin de file, carte supprimée) : rien à noter, et on n'arme pas le verrou
  carteEnSortie = true;
  clearTimeout(carteEnSortieT);   // sinon le minuteur d'une réponse précédente lèverait le verrou pendant cette animation
  carteEnSortieT = setTimeout(() => { carteEnSortie = false; }, 1500); // filet de sécurité
  haptique(niveau === 'vert' ? 12 : niveau === 'orange' ? [10,40,10] : [18,50,18]);
  const prevPalier = c.palier;
  const prevProchaineRevision = c.prochaineRevision;
  const prevDerniereRevision = c.derniereRevision;
  const prevDifficultes = c.difficultes || 0;
  const prevFacileConsecutif = c.facileConsecutif || 0;
  const prevFacilite = facilitePour(c);
  const prevMastered = (prevPalier || 0) >= MASTERED_PALIER;
  // Rappel léger : le réussir ne change rien à la carte ; le rater = comportement normal.
  const estRappel = rappelsSession.has(c.id);
  const rappelLeger = estRappel && niveau === 'vert';
  if(estRappel){ marquerRappelFait(c.id, true); rappelsSession.delete(c.id); }
  const palier = rappelLeger ? (c.palier || 0) : nextPalier(c, niveau);
  if(!rappelLeger) majFacilite(c, niveau);
  const intervals = getIntervalsForMatiere(c.matiere);
  // Facilité : ajuste la durée du palier obtenu. Quand les intervalles sont déjà
  // comprimés par un contrôle proche, on ne l'allonge jamais (seulement raccourci).
  let coefFacilite = facilitePour(c);
  if(intervals !== INTERVALS && coefFacilite > 1) coefFacilite = 1;
  const joursPalier = Math.max(1, Math.round(intervals[palier] * coefFacilite));
  /* "Difficile" et "Pas su" : on veut revoir la carte plus tard dans CETTE
     session (via réinsertion ci-dessous) ET qu'elle redevienne due dès demain
     si elle n'est pas revue aujourd'hui — pas dans 7/14/30 jours comme le
     palier actuel le prévoirait normalement. */
  const prochaineRevisionBrute = niveau !== 'vert' ? addDays(todayStr(), 1) : addDays(todayStr(), joursPalier);
  // Plafond en temps réel : le même mécanisme qu'à l'import (voir
  // plafonnerDateRevision) s'applique ici aussi, pour orange/rouge comme pour
  // vert — sans ça, une grosse session de révision peut faire retomber
  // beaucoup de cartes sur le même jour (demain, ou le palier suivant).
  const cfgMatiereReponse = matieresConfig[c.matiere];
  const dateControleReponse = (cfgMatiereReponse && cfgMatiereReponse.dateControle && cfgMatiereReponse.dateControle >= todayStr()) ? cfgMatiereReponse.dateControle : null;
  const prochaineRevision = rappelLeger ? c.prochaineRevision : plafonnerDateRevision(c.matiere, prochaineRevisionBrute, dateControleReponse, c.id);
  const derniereRevision = rappelLeger ? c.derniereRevision : todayStr();
  const prevDerniereModification = c.derniereModification || null;
  const derniereModification = rappelLeger ? c.derniereModification : new Date().toISOString();
  c.palier = palier;
  c.prochaineRevision = prochaineRevision;
  c.derniereRevision = derniereRevision;
  c.derniereModification = derniereModification;
  sessionReviewed++;
  const dtSeance = ppSeanceTick();
  sessionMoodCounts[niveau] = (sessionMoodCounts[niveau] || 0) + 1;
  const nowMastered = (palier || 0) >= MASTERED_PALIER;
  const becameMastered = nowMastered && !prevMastered;
  if(becameMastered) sessionMastered++;
  const wasNewSessionError = niveau !== 'vert' && !sessionErrors.some(e => e.id === c.id);
  if(wasNewSessionError) sessionErrors.push(c);
  // État de la série, du record et du marqueur de retard AVANT cette réponse : « Annuler » les remet tels quels.
  const prevSerie = {};
  ['cartes-streak', 'lissage-marqueur-retard', 'cartes-stats-extra'].forEach(k => { try{ prevSerie[k] = localStorage.getItem(k); }catch(e){ prevSerie[k] = null; } });
  bumpStreak();
  ppStatBump();
  if(!rappelLeger) saveLocalOverlay(c.id, { palier, prochaineRevision, derniereRevision, derniereModification, difficultes: c.difficultes || 0, facileConsecutif: c.facileConsecutif || 0, facilite: c.facilite });

  // Rappel du lendemain : carte vue pour la 1re fois, réussie du 1er coup, ~1 sur 3
  // au hasard (max 5/jour) => elle reviendra demain en rappel léger.
  let lendemainAjoute = false;
  if(niveau === 'vert' && !estRappel && !prevPalier && !prevDerniereRevision && prevDifficultes === 0
     && dateControleReponse !== todayStr()
     && prochaineRevision > addDays(todayStr(), 1)
     && Math.random() < RAPPELS_LENDEMAIN_PROBA){
    lendemainAjoute = ajouterRappelLendemain(c.id);
  }

  // Réinsère la carte plus loin dans la file du jour pour la revoir avant la
  // fin de la session, sans casser les cartes déjà en attente entre les deux.
  // reinsertedAt est mémorisé pour pouvoir défaire proprement (undo).
  let reinsertedAt = null;
  if(niveau === 'orange' || niveau === 'rouge'){
    // Compteur PAR NIVEAU (Difficile n'use pas le plafond de Pas su) et remis à zéro à chaque séance (ppReinsertionsRaz).
    if(!ppEstObjet(c.reinsertionsSession)) c.reinsertionsSession = { orange: 0, rouge: 0 };
    c.reinsertionsSession[niveau] = (c.reinsertionsSession[niveau] || 0) + 1;
    if(c.reinsertionsSession[niveau] <= MAX_REINSERTIONS[niveau]){
      const remainingAfter = queue.length - currentIndex - 1;
      const gap = computeReinsertGap(niveau, remainingAfter);
      reinsertedAt = Math.min(currentIndex + 1 + gap, queue.length);
      queue.splice(reinsertedAt, 0, c);
    }
  }

  // Sens vu pour cette carte (⇄) : gardé pour qu'un "Annuler" la remette dans
  // le MÊME sens (sinon le tirage serait refait et l'écran changerait).
  const sensVu = (sensAffiche.cle === 'etude:' + currentIndex + ':' + c.id) ? sensAffiche.inverse : false;
  lastAnswer = { cardId: c.id, index: currentIndex, dt: dtSeance, sensVu, prevPalier, prevProchaineRevision, prevDerniereRevision, prevDifficultes, prevFacileConsecutif, prevFacilite, prevDerniereModification, reinsertedAt, wasNewSessionError, becameMastered, niveau, estRappel, lendemainAjoute, prevSerie };
  recalcPlanning();
  saveLocalPlanning();
  planifierSyncDiffere();
  // Barre de teinte : comme le prototype, elle glisse vers sa nouvelle couleur à l'affichage de la carte suivante.
  ppMood.last = niveau;
  sortirCarte(niveau, opts, () => {
    currentIndex++;
    flipped = false;
    justAdvanced = true;
    renderStudy();
    renderStreak();
  });
}

function undoLastAnswer(){
  if(!lastAnswer) return;
  ecrReset(); // carte à écrire : elle revient « à écrire », champ vide, verrou levé
  if(lastAnswer.prevSerie){
    // Série du jour, record, total et marqueur de retard : exactement comme avant la réponse annulée.
    for(const k of Object.keys(lastAnswer.prevSerie)){
      try{ if(lastAnswer.prevSerie[k] === null) localStorage.removeItem(k); else localStorage.setItem(k, lastAnswer.prevSerie[k]); }catch(e){}
    }
  } else ppStatUndo();
  const c = queue[lastAnswer.index];
  if(c && c.id === lastAnswer.cardId){
    c.palier = lastAnswer.prevPalier;
    c.prochaineRevision = lastAnswer.prevProchaineRevision;
    c.derniereRevision = lastAnswer.prevDerniereRevision;
    c.difficultes = lastAnswer.prevDifficultes;
    c.facileConsecutif = lastAnswer.prevFacileConsecutif;
    if(!lastAnswer.estRappel || lastAnswer.niveau !== 'vert') c.facilite = lastAnswer.prevFacilite;
    // Restaure l'ancien horodatage technique (pas "maintenant") : un undo ne
    // doit pas se comporter comme une nouvelle modification pour la synchro,
    // sinon il pourrait à tort l'emporter sur une modif plus ancienne mais
    // réelle faite sur un autre appareil.
    c.derniereModification = lastAnswer.prevDerniereModification;
    // Défait aussi le compteur de réinsertions pour cette carte, sinon un
    // undo/refaire répété grillerait le plafond MAX_REINSERTIONS sans raison.
    if(ppEstObjet(c.reinsertionsSession) && lastAnswer.niveau && c.reinsertionsSession[lastAnswer.niveau] > 0) c.reinsertionsSession[lastAnswer.niveau]--;
    saveLocalOverlay(c.id, { palier: c.palier, prochaineRevision: c.prochaineRevision, derniereRevision: c.derniereRevision, derniereModification: c.derniereModification, difficultes: c.difficultes, facileConsecutif: c.facileConsecutif, facilite: c.facilite });
    // Ne retire de sessionErrors que si cette réponse est ce qui l'y avait ajoutée
    // (elle n'y figurait pas avant, cf. prevDifficultes) : sinon une carte déjà
    // en erreur plus tôt dans la session resterait à tort marquée "à revoir".
    if(lastAnswer.wasNewSessionError){
      const idx = sessionErrors.findIndex(e => e.id === c.id);
      if(idx !== -1) sessionErrors.splice(idx, 1);
    }
  }
  // Retire la copie réinsérée plus loin dans la file si la réponse annulée
  // était "Difficile" ou "Pas su", pour ne pas la faire apparaître deux fois.
  if(lastAnswer.reinsertedAt != null && queue[lastAnswer.reinsertedAt] && queue[lastAnswer.reinsertedAt].id === lastAnswer.cardId){
    queue.splice(lastAnswer.reinsertedAt, 1);
  }
  // Défait aussi les rappels : la carte redevient un rappel à faire, et le
  // rappel du lendemain éventuellement programmé par cette réponse est retiré.
  if(lastAnswer.estRappel){ marquerRappelFait(lastAnswer.cardId, false); rappelsSession.add(lastAnswer.cardId); }
  if(lastAnswer.lendemainAjoute) retirerRappelLendemain(lastAnswer.cardId);
  currentIndex = lastAnswer.index;
  // Remet la carte dans le sens où elle était affichée avant la réponse annulée.
  sensAffiche = { cle: 'etude:' + lastAnswer.index + ':' + lastAnswer.cardId, inverse: lastAnswer.sensVu === true };
  sessionReviewed = Math.max(0, sessionReviewed - 1);
  if(lastAnswer.dt) ppSeance.ms = Math.max(0, ppSeance.ms - lastAnswer.dt);
  if(lastAnswer.niveau) sessionMoodCounts[lastAnswer.niveau] = Math.max(0, (sessionMoodCounts[lastAnswer.niveau] || 0) - 1);
  if(lastAnswer.becameMastered) sessionMastered = Math.max(0, sessionMastered - 1);
  flipped = true;
  lastAnswer = null;
  recalcPlanning();
  saveLocalPlanning();
  planifierSyncDiffere();   // l'état annulé doit partir lui aussi (sinon l'autre appareil garde la réponse annulée)
  justAdvanced = true;
  ppMood.anim = 'in';
  renderStudy();
  renderStreak();
}

function startQuiz(cards){
  quizSet = cards.slice();
  quizIndex = 0; quizFlipped = false; quizErrors = []; quizActive = true;
  ecrReset();
  quizMoodCounts = { rouge:0, orange:0, vert:0 };
  ppMoodReset();
  document.getElementById('tab-study').style.display = 'none';
  document.getElementById('tab-quiz').style.display = 'block';
  const tb = document.getElementById('tabbar-root');
  if(tb) tb.classList.add('tabbar-hidden');
  document.body.classList.add('in-session');
  justAdvanced = true;
  isFirstCardOfSession = true;
  renderQuiz();
}
/* Quitte le quiz en cours (via le bouton retour du bandeau) et revient à
   l'accueil des révisions — équivalent à exitStudySession, côté quiz.
   Remet aussi le filtre matière à "toutes" : un quiz lancé sur une matière
   choisie ne doit pas laisser l'accueil filtré une fois qu'on en sort. */
function exitQuiz(){
  quizActive = false;
  matiereFilter = 'toutes';
  switchTab('study');
}
function startQuizFromHome(garderSuite){
  if(!garderSuite) quizSeen = (matiereFilter === 'toutes') ? getMatieresActives().slice() : [matiereFilter];
  const today = todayStr();
  let base = CARDS.slice();
  if(matiereFilter !== 'toutes'){
    base = base.filter(c => (c.matiere || 'Sans matière') === matiereFilter);
  }
  startQuiz(melangerParMatiere(base, 'quiz|' + matiereFilter));
}

let quizMoodCounts = { rouge:0, orange:0, vert:0 };
let quizSeen = [];
/* Matière suivante proposée à la fin d'un entraînement : la plus chargée parmi
   celles pas encore faites (au moins 2 cartes, comme pour lancer un entraînement). */
function quizMatiereSuivante(){
  const r = getMatieresActives()
    .filter(m => !quizSeen.includes(m))
    .map(m => ({ matiere: m, count: CARDS.filter(c => (c.matiere || 'Sans matière') === m).length }))
    .filter(x => x.count >= 2)
    .sort((a, b) => (b.count - a.count) || a.matiere.localeCompare(b.matiere, 'fr'))[0];
  return r || null;
}
function quizContinuer(matiere){
  quizSeen.push(matiere);
  matiereFilter = matiere;
  startQuizFromHome(true);
}

function renderQuiz(){
  const tq = document.getElementById('tab-quiz');
  if(tq) tq.innerHTML = '';
  if(quizIndex >= quizSet.length){
    const score = quizSet.length - quizErrors.length;
    const pct = Math.round((score / quizSet.length) * 100);
    const cls = pct >= 80 ? 'good' : pct >= 50 ? 'mid' : 'bad';
    const nx = quizMatiereSuivante();
    ppMood.anim = '';
    const nbE = quizErrors.length;
    ppSesShow(`<div class="pp-done pp-qdone">${nbE ? '' : ppConfetti()}<div class="pp-score ${cls}">${score}/${quizSet.length}</div>
  <p class="pp-small">Entraînement terminé · ne compte pas pour la maîtrise</p>
  ${nbE ? `<div class="pp-errs"><h5>À revoir</h5><div class="pp-errl">${quizErrors.map(e => `<div class="pp-ei"><b>${ppRichHtml(e.question)}</b><span>${ppRichHtml(e.reponse)}</span></div>`).join('')}</div></div>` : `<p class="pp-qok">Tout juste</p>`}
  <div class="pp-btns">${nx ? `<button class="pp-cta" onclick="quizContinuer('${escapeJsAttr(nx.matiere)}')">Continuer avec ${escapeHtml(nx.matiere)} (${nx.count} carte${nx.count>1?'s':''})</button>` : ''}
  <button class="pp-cta${nx ? ' pp-quiet' : ''}" onclick="exitQuiz()">Retour aux révisions</button></div></div>`);
    return;
  }
  const c = quizSet[quizIndex];
  const faces = facesCarte(c, sensPourAffichage(c, quizIndex, 'quiz'));
  const o = {
    c, faces, flipped: quizFlipped, counts: quizMoodCounts, undo: false, mp: '',
    ids: { card:'quiz-anki-card', body:'quiz-anki-card-body' },
    fnFlip: 'quizFlip()', fnAns: 'quizAnswer', fnBack: 'exitQuiz()'
  };
  /* Réponse à écrire (même composant que la révision) : aucun effet sur le planning ni sur la synchro, quizAnswer ne change pas. */
  const ecrOn = ecrActive(o), ecrAnim = ppMood.anim, ecrFoc = ecrOn ? ecrFocusCapture() : null;
  if(ecrOn) ecrEtat('quiz:' + quizIndex + ':' + c.id); else ecrReset();
  ppSesDraw(o);
  if(ecrOn){
    const root = ppSesRoot();
    root.classList.add('ecr'); root.classList.toggle('ecr-fl', !!quizFlipped);
    ecrHabiller(o, ecrAnim, ecrFoc);
  }
  ecrMesure();
  justAdvanced = false;
}

/* Retourne la carte de quiz : comme le prototype, l'écran est redessiné et seul
   le corps de la carte joue son petit fondu (flipIn). */
function quizFlip(){
  if(carteEnSortie) return;
  ecrBascule(quizFlipped);
  ppRetournerApresEnfoncement(() => {
    if(carteEnSortie) return;
    quizFlipped = !quizFlipped;
    ppMood.anim = 'flip';
    renderQuiz();
  });
}

function quizAnswer(niveau, opts){
  if(carteEnSortie) return;
  carteEnSortie = true;
  clearTimeout(carteEnSortieT);   // v153 (constat 31) : un seul filet à la fois, comme dans answer()
  carteEnSortieT = setTimeout(() => { carteEnSortie = false; }, 1500);
  haptique(niveau === 'vert' ? 12 : niveau === 'orange' ? [10,40,10] : [18,50,18]);
  const c = quizSet[quizIndex];
  if(niveau !== 'vert') quizErrors.push(c);
  // Mode "S'entraîner" : contrairement à answer() (révision normale), on ne
  // touche PAS à la vraie progression de la carte — ni palier, ni
  // prochaineRevision, ni derniereRevision, ni overlay, ni planning. C'est le
  // point central qui distingue ce mode de "Réviser"/"Réviser tout" : un
  // entraînement sert à se tester sans faire avancer ni reculer la maîtrise.
  quizMoodCounts[niveau] = (quizMoodCounts[niveau] || 0) + 1;
  ppMood.last = niveau;
  sortirCarte(niveau, opts, () => {
    quizIndex++;
    quizFlipped = false;
    justAdvanced = true;
    renderQuiz();
  });
}

let browseSearch = '';

function onBrowseSearchInput(val){
  browseSearch = val;
  const v = document.querySelector('#tab-browse .pp-view');
  if(!v){ renderBrowse(); return; }
  // On ne reconstruit que la liste sous la barre de recherche : le champ garde le focus
  // (et le clavier reste ouvert) et rien ne rejoue ses animations d'entrée.

/* v119 : « Partager à un pote » (menu ⋯ d'une matière dans Parcourir).
   On envoie UNIQUEMENT question / réponse / sens inversé : jamais la progression, les dates, la clé Gemini ni le code de synchro.
   Fichier en .txt (type text/plain) : c'est un des types que Chrome Android accepte de partager ; le JSON pur est souvent refusé.
   Le pote le récupère avec Ajouter → Importer (colle le texte ; le choix d'un fichier a été retiré en v129). */
/* v123 : « Partager » envoie les cartes au Worker (POST /partage) et affiche un code de 6 caractères ;
   le pote le tape dans Ajouter → Importer. Mêmes données que le fichier (jamais la progression, les dates, la clé Gemini
   ni le code de synchro). Les images partent telles quelles (déjà réduites à leur création : aucune perte de plus).
   Plan B si le Worker ne répond pas / n'est pas à jour / pas de connexion : l'ancien envoi par fichier .txt. */
const PARTAGE_ENVOI_MAX_MS = 60000;
const PARTAGE_LECTURE_MAX_MS = 30000;
let ppPartageEnCours = false;
function ppPartageDonnees(m){
  const cartes = CARDS.filter(c => (c.matiere || 'Sans matière') === m && (c.question || c.imageQuestion) && (c.reponse || c.imageReponse));
  if(!cartes.length) return null;
  const data = { format:'flashcard-partage', version:1, matiere:m, cartes: cartes.map(c => ({ question:c.question, reponse:c.reponse, inversible: c.inversible === true, ecrite: c.ecrite === true, ...(ppImgValide(c.imageQuestion) ? { imageQuestion:c.imageQuestion } : {}), ...(ppImgValide(c.imageReponse) ? { imageReponse:c.imageReponse } : {}) })) };
  return { data, json: JSON.stringify(data), n: cartes.length };
}
async function ppPartagerMatiere(m){
  if(ppPartageEnCours) return;
  const d = ppPartageDonnees(m);
  if(!d){ ppToast('Aucune carte à partager'); return; }
  if(!SYNC_WORKER_URL || navigator.onLine === false){ ppPartagerFichier(m, d); return; }
  ppPartageEnCours = true;
  ppSheet(`<div class="pp-grab"></div><h2>Partager</h2><p class="pp-hint">Envoi…</p>`);
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), PARTAGE_ENVOI_MAX_MS);
  let code = '', jours = 14;
  try{
    const res = await fetch(`${SYNC_WORKER_URL}/partage`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: d.json, signal: ctrl.signal });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if(!j || typeof j.code !== 'string' || !/^[A-HJKMNP-Z2-9]{6}$/.test(j.code)) throw new Error('réponse inattendue');
    code = j.code; if(+j.jours > 0) jours = +j.jours;
  }catch(e){ code = ''; }
  clearTimeout(t); ppPartageEnCours = false;
  const feuille = document.getElementById('pp-sheet');
  const ouverte = !!feuille && feuille.classList.contains('on');
  if(!code){ if(ouverte) ppSheetClose(); ppPartagerFichier(m, d); return; }
  if(!ouverte) return; // fenêtre fermée pendant l'envoi : rien à afficher
  ppPartageAfficher(m, d.n, code, jours);
}
function ppPartageAfficher(m, n, code, jours){
  const mA = escapeJsAttr(m);
  ppSheet(`<div class="pp-grab"></div><h2>Partager</h2><p class="pp-hint">${escapeHtml(m)} · ${n} carte${n > 1 ? 's' : ''} · valable ${jours} jours</p>
  <div class="pp-sharecode">${code.slice(0, 3)} ${code.slice(3)}</div>
  <div class="pp-duo"><button class="pp-sec" onclick="ppPartageCopier('${code}')">Copier</button><button class="pp-cta" onclick="ppPartageEnvoyer('${code}','${mA}')">Envoyer</button></div>`);
}
function ppPartageCopier(code){
  const ok = () => ppToast('Code copié');
  try{ navigator.clipboard.writeText(code).then(ok, () => ppToast(code)); }catch(e){ ppToast(code); }
}
function ppPartageEnvoyer(code, m){
  const texte = `Cartes « ${m} » : ouvre Memoria → Ajouter → Importer, code ${code}`;
  if(navigator.share){ navigator.share({ text:texte }).catch(() => {}); return; }
  ppPartageCopier(code);
}
function ppPartagerFichier(m, d){
  const json = d.json;
  const nom = 'Cartes ' + (String(m).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim() || 'matière') + '.txt';
  const n = d.n, titre = m + ' · ' + n + ' carte' + (n > 1 ? 's' : '');
  let fichier = null;
  try{ fichier = new File([json], nom, { type:'text/plain' }); }catch(e){}
  if(fichier && navigator.canShare && navigator.share && navigator.canShare({ files:[fichier] })){
    navigator.share({ files:[fichier], title:titre, text:titre + ' — à importer dans Memoria (Ajouter → Importer)' })
      .catch(err => { if(err && err.name !== 'AbortError'){ telechargerBlob(new Blob([json], { type:'text/plain' }), nom); ppToast('Fichier téléchargé : envoie-le à ton pote'); } });
    return;
  }
  telechargerBlob(new Blob([json], { type:'text/plain' }), nom);
  ppToast('Fichier téléchargé : envoie-le à ton pote');
}
function ppInvMatiere(m){
  const l = CARDS.filter(c => (c.matiere || 'Sans matière') === m && !c.ecrite);   // « Tout inverser » saute les cartes à écrire

}

/* ---- fiche d'une carte (prototype : cardEdit / cardSave / cardReset / cardAsk / cardDel) ---- */
let ppFi = null; // { id, m (matière choisie), l (matières proposées), iv (sens inversé) }

  ${pills}<label class="pp-l" for="pp-eq">Question</label>${ppChampImg('fi', 'q', `<textarea id="pp-eq" oninput="ppIvGris('fi');ppRvMaj('pp-eq')">${escapeHtml(qv)}</textarea>`)}${ppRvDiv('pp-eq-rv', qv)}<label class="pp-l" for="pp-ea">Réponse</label>${ppChampImg('fi', 'r', `<textarea id="pp-ea" oninput="ppRvMaj('pp-ea')">${escapeHtml(av)}</textarea>`)}${ppRvDiv('pp-ea-rv', av)}
  <div class="pp-set" style="margin-bottom:14px"><div class="pp-li${ivOff ? ' pp-off' : ''}"><i class="pp-ico">${PP_IC.swap}</i><span>Sens inversé<small>La carte est aussi posée dans l'autre sens</small></span><button class="pp-tg${ppFi.iv ? ' on' : ''}" aria-label="Sens inversé" onclick="ppFicheIv(this)"></button></div>
  <div class="pp-li${ecOk ? '' : ' pp-off'}"><i class="pp-ico">${PP_IC.edit}</i><span>Réponse à écrire<small>${ecLong ? 'Réponse longue : peu pratique à écrire' : 'Tu tapes ta réponse avant de la voir'}</small></span><button class="pp-tg${ppFi.ec ? ' on' : ''}" aria-label="Réponse à écrire" onclick="ppFicheEc(this)"></button></div>

/* Une carte « à écrire » dont la réponse n'est qu'une image ne peut pas l'être ; et ⇄ est refusé si la question est une image seule (on ne peut pas « écrire » une image). */

/* Recale prochaineRevision de chaque carte d'une matière (y compris les
   maîtrisées, dont le rappel d'entretien à 90 jours doit lui aussi se
   compresser si un contrôle approche) sur l'intervalle correspondant à son
   palier ACTUEL — sans toucher au palier lui-même, juste à la date.
   Nécessaire chaque fois que la date de contrôle change : les
   prochaineRevision déjà posées reflètent l'ancien ratio de compression (ou
   son absence) et doivent être ajustées au nouveau, sans quoi le planning
   resterait basé sur des dates obsolètes jusqu'à la prochaine révision de
   chaque carte. */
function reprogrammerCartesMatiere(matiere){
  const today = todayStr();
  const intervals = getIntervalsForMatiere(matiere);
  const cfg = matieresConfig[matiere];
  const dateControle = (cfg && cfg.dateControle && cfg.dateControle >= today) ? cfg.dateControle : null;
  const cartes = CARDS.filter(c => c.matiere === matiere);
  // Passe à true si une carte NEUVE termine dans la zone tampon (repli) : renvoyé
  // à onDateControleChange pour prévenir l'utilisateur.
  let auMoinsUnRepli = false;
  const patchesRepro = {};
  for(const c of cartes){
    // Carte jamais révisée : `intervals[palier]` représente le temps DEPUIS
    // la dernière révision, ce qui n'existe pas encore ici — la décaler
    // quand même la repousserait artificiellement à "aujourd'hui + 1 jour"
    // (ou plus) alors qu'elle est due dès aujourd'hui, prête à être vue pour
    // la première fois. Bug corrigé : avant, poser une date de contrôle sur
    // une matière neuve reportait le début des révisions au lendemain.
    //
    // Deuxième bug corrigé ici : si la carte avait déjà une prochaineRevision
    // dans le FUTUR (posée par l'étalement de l'import — voir
    // meilleurJourPourCarteNeuve/finaliserImport), l'ancien code la ramenait
    // quand même à "aujourd'hui" dès que ce n'était pas déjà <= today,
    // écrasant tout l'étalement d'un coup à chaque changement de date de
    // contrôle. On la GARDE désormais telle quelle si elle existe déjà ;
    // seule une carte sans aucune date encore posée reçoit "aujourd'hui".
    if(!c.derniereRevision){
      const cible = c.prochaineRevision || today;
      // Carte neuve : elle évite la zone tampon (les cartes déjà révisées,
      // plus bas, ne passent PAS ce paramètre).
      const prochaineRevision = plafonnerDateRevision(matiere, cible, dateControle, c.id, true);
      c.prochaineRevision = prochaineRevision;
      if(estEnRepliZoneTampon(prochaineRevision, dateControle)) auMoinsUnRepli = true;
      // Un simple décalage de date ne touche PAS derniereModification (comme lisserRetards) : sinon la synchro
      // prendrait l'état local, éventuellement périmé, pour plus récent et écraserait une révision faite ailleurs.
      patchesRepro[c.id] = { palier: c.palier, prochaineRevision, derniereRevision: c.derniereRevision };
      continue;
    }
    const palier = Math.min(c.palier || 0, intervals.length - 1);
    // Le recalage part toujours de la dernière révision réelle (pas de
    // clamp à today ici : la carte est presque toujours révisée dans le
    // passé, et c'est depuis cette date que l'intervalle du palier actuel
    // doit être compté). Si le nouveau calcul tombe dans le passé, la carte
    // est due dès aujourd'hui — géré par le clamp ci-dessous, pas par un
    // décalage artificiel de la base.
    const base = c.derniereRevision;
    // Même facilité que dans answer() : ajuste la durée du palier (jamais allongée si comprimé).
    let coefFacilite = facilitePour(c);
    if(intervals !== INTERVALS && coefFacilite > 1) coefFacilite = 1;
    const recalculee = addDays(base, Math.max(1, Math.round(intervals[palier] * coefFacilite)));
    // Une carte ratée/difficile (orange/rouge) est programmée au lendemain de sa
    // dernière révision : on la laisse à demain, on ne la recale pas sur le
    // calendrier normal de son palier.
    const cible = (c.prochaineRevision && (c.prochaineRevision < today || c.prochaineRevision <= addDays(base, 1)))
      ? c.prochaineRevision
      : (recalculee < today ? today : recalculee);
    // Plafond en temps réel : un changement de date de contrôle recalcule
    // TOUTES les cartes de la matière d'un coup, ce qui peut facilement en
    // faire retomber beaucoup sur le même jour (ex. beaucoup de cartes au
    // même palier) — sans ce plafond, cette rafale contournait totalement
    // celui de l'import.
    const prochaineRevision = plafonnerDateRevision(matiere, cible, dateControle, c.id);
    c.prochaineRevision = prochaineRevision;
    patchesRepro[c.id] = { palier: c.palier, prochaineRevision, derniereRevision: c.derniereRevision };
  }
  saveLocalOverlayLot(patchesRepro);   // une seule écriture pour toute la matière
  return auMoinsUnRepli;
}

function onDateControleChange(matiere, val){
  if(!matieresConfig[matiere]) matieresConfig[matiere] = {};
  matieresConfig[matiere].dateControle = val || null;

/* Planning "avant le contrôle" — aligné sur le système de répétition espacée :
   chaque carte apparaît le jour où elle est réellement due (prochaineRevision),
   pas un jour tiré au hasard. Si sa prochaine révision tombe après la date de
   contrôle, on la ramène au jour du contrôle : sinon elle ne serait jamais vue
   avant l'échéance qui compte vraiment. Une carte déjà en retard (due avant
   aujourd'hui) est ramenée à aujourd'hui. */
/* Rattrapage : les dates des cartes sont posées une fois (import, réponse), mais les
   intervalles se resserrent chaque jour quand le contrôle approche. Une carte posée trop
   tard (ex. samedi alors qu'il lui faut 4 jours avant un contrôle mercredi) finirait
   APRÈS le contrôle. On ne touche QUE ces dépassements réels : la carte est ramenée au
   dernier jour qui lui laisse le temps (avec 1 j de marge si un jour a de la place).
   Garde-fous : jamais repoussée (uniquement vers plus tôt) ; ignorée si même en
   commençant aujourd'hui elle ne tiendrait pas (c'est le statut « trop tard / dépasse »
   qui prévient, pas un replanning impossible) ; jamais ramenée à un jour ≤ sa dernière
   révision (une carte ratée aujourd'hui reste à demain, sinon elle reviendrait en boucle). */
function rattraperRetardsControle(){
  const today = todayStr();
  let modifie = false;
  // Comptages construits UNE fois (cartes non maîtrisées par jour, par matière et au total) et tenus à jour à chaque
  // déplacement : avant, chaque test d'un jour relisait toute la liste des cartes (coût quadratique, app figée au-delà de 2 000 cartes).
  const parJour = {}, parMatJour = {};
  for(const c of CARDS){
    if((c.palier || 0) >= MASTERED_PALIER || !c.prochaineRevision) continue;
    const m = c.matiere || 'Sans matière';
    parJour[c.prochaineRevision] = (parJour[c.prochaineRevision] || 0) + 1;
    if(!parMatJour[m]) parMatJour[m] = {};
    parMatJour[m][c.prochaineRevision] = (parMatJour[m][c.prochaineRevision] || 0) + 1;
  }
  const patches = {};
  for(const [matiere, cfg] of Object.entries(matieresConfig)){
    if(!cfg || !cfg.dateControle || cfg.dateControle < today || cfg.archive) continue;
    const D = cfg.dateControle, iv = getIntervalsForMatiere(matiere);
    const cartes = CARDS.filter(c => (c.matiere || 'Sans matière') === matiere && (c.palier || 0) < MASTERED_PALIER);
    if(!parMatJour[matiere]) parMatJour[matiere] = {};
    const nbMat = parMatJour[matiere];
    for(const c of cartes){
      if(!c.prochaineRevision) continue;
      const p = c.palier || 0;
      let reste = 0; for(let k = p + 1; k < MASTERED_PALIER; k++) reste += iv[k];
      const limite = addDays(D, -reste);                 // dernier jour pour que la maîtrise tienne avant (ou le jour de) D
      if(c.prochaineRevision <= limite) continue;         // pas de dépassement : on ne touche pas
      const plancher = (c.derniereRevision && c.derniereRevision >= today) ? addDays(c.derniereRevision, 1) : today;
      if(limite < plancher) continue;                     // impossible à rattraper : le statut prévient
      let cible = limite;
      for(let j = addDays(limite, -1) >= plancher ? addDays(limite, -1) : limite; j >= plancher; j = addDays(j, -1)){
        if((nbMat[j] || 0) < NOUVELLES_CARTES_MAX_PAR_JOUR && (parJour[j] || 0) < CHARGE_GLOBALE_MAX_PAR_JOUR){ cible = j; break; }
      }
      // tenue à jour des comptages : la carte quitte son ancien jour pour le nouveau
      parJour[c.prochaineRevision]--; nbMat[c.prochaineRevision]--;
      parJour[cible] = (parJour[cible] || 0) + 1; nbMat[cible] = (nbMat[cible] || 0) + 1;
      c.prochaineRevision = cible;
      // PAS de derniereModification ici : un simple décalage de date ne doit jamais l'emporter sur une révision
      // faite sur un autre appareil (même règle que lisserRetards). Chaque appareil recale ses propres dates.
      patches[c.id] = { palier: c.palier, prochaineRevision: cible, derniereRevision: c.derniereRevision };
      modifie = true;
    }
  }
  saveLocalOverlayLot(patches);
  return modifie;
}

function recalcPlanning(){
  clearIntervalsCache();
  rattraperRetardsControle();
  const today = todayStr();
  const matieresAvecDate = Object.entries(matieresConfig)
    .filter(([, cfg]) => cfg && cfg.dateControle && cfg.dateControle >= today && !cfg.archive);

  if(matieresAvecDate.length === 0){ planning = []; return; }

  const jourItems = {};
  const ajoute = (date, matiere, id) => {
    if(!jourItems[date]) jourItems[date] = {};
    if(!jourItems[date][matiere]) jourItems[date][matiere] = [];
    jourItems[date][matiere].push(id);
  };

  for(const [matiere, cfg] of matieresAvecDate){
    const dateControle = cfg.dateControle;
    const cartes = CARDS.filter(c => c.matiere === matiere && (c.palier || 0) < MASTERED_PALIER);
    if(cartes.length === 0) continue;

    // prochaineRevision est déjà posée avec les intervalles compressés
    // (cf. getIntervalsForMatiere, appliqué dans answer()/quizAnswer() au
    // moment de la révision). Ici on ne fait donc plus un clamp brutal sur
    // la date de contrôle : le planning reflète directement les dates
    // recalculées, réparties dans le temps disponible plutôt qu'empilées
    // sur le dernier jour.
    for(const c of cartes){
      let jour = c.prochaineRevision || today;
      if(jour < today) jour = today;
      if(jour > dateControle) jour = dateControle; // filet de sécurité si incohérence résiduelle
      ajoute(jour, matiere, c.id);
    }
  }

  planning = Object.keys(jourItems).sort().map(date => ({
    date,
    items: Object.keys(jourItems[date]).sort().map(matiere => ({
      matiere,
      cardIds: jourItems[date][matiere]
    }))
  }));
}

/* Vrai si la matière doit porter le badge "À risque". Pas de date de
   contrôle, date dépassée, contrôle trop lointain, matière archivée ou sans
   carte : jamais de badge. Comparaison de chaînes AAAA-MM-JJ, sûre car ce
   format se trie dans l'ordre chronologique. */
function estMatiereCritique(m, stat){
  const cfg = matieresConfig[m] || {};
  if(cfg.archive || !cfg.dateControle || !stat) return false;
  const today = todayStr();
  if(cfg.dateControle < today) return false;
  if(cfg.dateControle > addDays(today, BADGE_CRITIQUE_JOURS)) return false;
  return stat.tauxReussite < BADGE_CRITIQUE_MAITRISE;
}

/* ============================================================
   PORT DU PROTOTYPE v31 — ÉTAPE 4 : Planning (« À venir » + « Matières »)

const ppCap = t => t.charAt(0).toUpperCase() + t.slice(1);

function ppPlanCompute(){
  const today = todayStr();
  const controles = getDatesControleActives();
  const datesCtrl = Object.keys(controles).sort();
  let nbJours = 9;
  if(datesCtrl.length){
    const diff = ppEcart(today, datesCtrl[datesCtrl.length - 1]) + 1;
    nbJours = Math.max(7, Math.min(ppWide() ? 120 : 14, diff));  // grand écran : jusqu'au dernier contrôle (la semaine défile) ; téléphone : 14 j

function ppWeekHtml(){
  const D = ppPlanData, { jours, N, controles, mg, today, sel } = D;
  const cells = jours.map((j, i) => {
    const d = new Date(j.date + 'T12:00:00');

    const contenu = j.total > 0 ? ((j.reel === 0 ? '≈' : '') + j.total) : (ctrl ? PP_IC.flag : '');
    const cls = ['pp-d', auj ? 'pp-today' : '', (j.total ? '' : (ctrl ? '' : 'pp-n')), ctrl ? 'pp-end' : '', j.date === sel ? 'pp-sel' : ''].filter(Boolean).join(' ');
