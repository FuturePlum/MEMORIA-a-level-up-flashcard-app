<script>
/* v173 : données de départ d'une app exportée (Réglages → Sauvegarde → Exporter l'app à jour).
   Dans l'app d'origine ce bloc est vide. Dans un fichier exporté, « donnees » contient les valeurs brutes du stockage
   (série, statistiques, séances, matières vides, modèles de synthèse, réglages). Elles sont posées UNE seule fois par
   export, seulement pour les clés encore absentes, avant tout le reste (le thème et la langue sont lus juste après).
   La clé Gemini et le code de synchro n'en font jamais partie. */
const CLES_STOCKAGE_SEED = ['cartes-streak','cartes-stats-extra','cartes-seances','cartes-matieres-vides','cartes-matieres-vides-dates','cartes-matieres-supprimees','cartes-supprimees-tombstones','cartes-datecontrole-maj','synthese-modeles','rappel-heure-preferee','rappel-relance-active','fc-langue','fc-apparence'];
const SEED_STOCKAGE = { "id": "", "donnees": {} };
(function(){
  try{
    if(!SEED_STOCKAGE.id || localStorage.getItem('seed-stockage-id') === SEED_STOCKAGE.id) return;
    CLES_STOCKAGE_SEED.forEach(function(k){
      var v = SEED_STOCKAGE.donnees[k];
      if(typeof v === 'string' && localStorage.getItem(k) === null) localStorage.setItem(k, v);
    });
    localStorage.setItem('seed-stockage-id', SEED_STOCKAGE.id);
  }catch(e){}
})();
</script>
<script>
/* v179 : JOURNAL DE DIAGNOSTIC (Réglages > Aide > Journal de diagnostic). Sert à savoir si la page est vraiment rechargée quand on quitte
   puis qu'on revient, et par qui. Chaque chargement de page écrit une ligne « CHARGEMENT » (type de navigation, page « écartée » par Chrome,
   sessionStorage encore là ou non, temps depuis la dernière activité, instantané d'écran présent ou non, origine = android-app:// dans l'APK).
   Puis une ligne par visibilitychange / pagehide / pageshow / freeze / resume. 80 lignes au maximum, dans localStorage 'pp-journal'. Placé AVANT
   le script v174 : il doit lire les clés avant qu'elles soient réécrites. */
(function(){
  var K = 'pp-journal', MAX = 80;
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function hms(){ var d = new Date(); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function lire(){ try{ var a = JSON.parse(localStorage.getItem(K) || '[]'); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
  window.ppJournalLire = lire;
  window.ppJournalEffacer = function(){ try{ localStorage.removeItem(K); }catch(e){} };
  window.ppJournal = function(evt, detail){
    try{
      var a = lire();
      a.push(hms() + '  ' + evt + (detail ? '  ' + detail : ''));
      if(a.length > MAX) a = a.slice(a.length - MAX);
      localStorage.setItem(K, JSON.stringify(a));
    }catch(e){}
  };
  try{
    var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || null;
    var t = parseInt(localStorage.getItem('pp-derniere-activite') || '0', 10);
    var snap = 'aucun';
    try{
      var o = JSON.parse(localStorage.getItem('pp-etat-ecran') || 'null');
      if(o) snap = 'oui (âge ' + Math.round((Date.now() - o.t) / 1000) + ' s, onglet ' + o.o + ', séance ' + (o.m || 'non') + ')';
    }catch(e){ snap = 'illisible'; }
    var ss = 'indisponible'; try{ ss = sessionStorage.getItem('pp-deja-demarre') === '1' ? 'déjà là' : 'vide'; }catch(e){}
    var ecran = 'navigateur'; try{ if(window.matchMedia && matchMedia('(display-mode: standalone)').matches) ecran = 'standalone'; }catch(e){}
    window.ppJournal('CHARGEMENT', 'navigation=' + (nav ? nav.type : '?') + ' | page écartée par Chrome=' + (document.wasDiscarded ? 'OUI' : 'non') +
      ' | sessionStorage=' + ss + ' | dernière activité=' + (t ? 'il y a ' + Math.round((Date.now() - t) / 1000) + ' s' : 'jamais') +
      ' | instantané=' + snap + ' | visibilité=' + document.visibilityState + ' | origine=' + (document.referrer || '-') + ' | écran=' + ecran);
  }catch(e){}
  document.addEventListener('visibilitychange', function(){ window.ppJournal('visibilité', document.visibilityState); });
  window.addEventListener('pagehide', function(e){ window.ppJournal('pagehide', 'persisted=' + !!e.persisted); });
  window.addEventListener('pageshow', function(e){ window.ppJournal('pageshow', 'persisted=' + !!e.persisted); });
  document.addEventListener('freeze', function(){ window.ppJournal('freeze'); });
  document.addEventListener('resume', function(){ window.ppJournal('resume'); });
})();
</script>
<script>
/* v174 → v180 : le faux splash ne se rejoue pas quand on revient dans l'app. Constat (journal de diagnostic, v179) : toucher l'icône de l'app
   RELANCE la page (nouvelle page, sessionStorage vide) ; l'ancienne page reçoit alors « pagehide » juste avant (moins d'une seconde avant le
   chargement de la nouvelle). Quand l'utilisateur FERME vraiment l'app (balayage dans les applis récentes), « pagehide » arrive aussi, mais la
   page suivante ne se charge que plus tard (plusieurs secondes : le temps de rouvrir l'app). On note donc l'heure du dernier « pagehide »
   (localStorage 'pp-pagehide', effacée dès que la page redevient visible ou est lue par la page suivante) et on décide, AVANT le premier rendu :
   (1) même onglet rechargé (sessionStorage 'pp-deja-demarre') → pas de splash ;
   (2) « pagehide » il y a moins de 1,5 s → relance par l'icône → pas de splash (html.pp-reprise) ;
   (3) « pagehide » plus ancien → vraie fermeture puis réouverture → splash animé ;
   (4) aucun « pagehide » noté (Android a coupé la page en silence) → pas de splash si l'app était active il y a moins de 2 h, sinon splash.
   Le verdict est écrit dans le journal de diagnostic (ligne SPLASH). L'état de l'écran est remis dans tous les cas (script de reprise plus bas). */
(function(){
  /* v185 : trois cas, décidés AVANT le premier rendu.
     (1) page rechargée dans le même onglet (ex. changement de langue) : ni splash ni accueil, l'écran est remis ;
     (2) RELANCE PAR L'ICÔNE (app déjà ouverte en arrière-plan) : l'ancienne page reçoit « visible » (on note l'heure : 'pp-vu') puis « pagehide » et une
         nouvelle page se charge dans la même seconde. Le faux splash est rejoué et l'écran d'avant est remis ;
     (3) tout le reste (vraie fermeture puis réouverture, page coupée par Android) : ouverture normale = splash animé + accueil, rien n'est remis.
     Avant v185 le cas (3) était pris pour une reprise quand il n'y avait pas de « pagehide » noté : pas de splash et écran remis à tort. */
  /* v192 : hauteur de la boîte du faux splash. 100dvh dépasse l'écran visible d'environ 125 px (barres système) : le logo du faux splash était
     centré trop bas (≈ 55 px) par rapport au splash natif d'Android, qui est centré sur tout l'écran. On donne donc au faux splash et au voile la
     hauteur de l'écran (screen.height) quand l'app est installée ; sinon (onglet de navigateur) on garde 100dvh. */
  function hauteurEcran(){
    try{
      var inst = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      if(inst && window.screen && screen.height > 200) document.documentElement.style.setProperty('--bs-h', Math.round(screen.height) + 'px');
    }catch(e){}
  }
  hauteurEcran();
  window.addEventListener('resize', hauteurEcran);
  var K = 'pp-derniere-activite', D = 'pp-deja-demarre', PH = 'pp-pagehide', VU = 'pp-vu';
  var GAP_RELANCE = 1500, GAP_VU = 2000;
  function marquer(){ try{ localStorage.setItem(K, String(Date.now())); }catch(e){} }
  function oublierPh(){ try{ localStorage.removeItem(PH); }catch(e){} }
  var verdict = 'ouverture normale';
  window.__ppRestaurer = false;
  try{
    var now = Date.now();
    var ph = parseInt(localStorage.getItem(PH) || '0', 10);
    var vu = parseInt(localStorage.getItem(VU) || '0', 10);
    var reprise = false;
    if(sessionStorage.getItem(D) === '1'){ reprise = true; window.__ppRestaurer = true; verdict = 'même onglet rechargé : pas de splash, écran remis'; }
    else if(ph && now - ph >= 0 && now - ph < GAP_RELANCE){ window.__ppRestaurer = true; verdict = 'relance par l\u2019icône (pagehide il y a ' + (now - ph) + ' ms) : splash rejoué, écran remis'; }
    else if(vu && now - vu >= 0 && now - vu < GAP_VU){ window.__ppRestaurer = true; verdict = 'relance par l\u2019icône (retour visible il y a ' + (now - vu) + ' ms) : splash rejoué, écran remis'; }
    else { verdict = 'ouverture normale (pagehide ' + (ph ? 'il y a ' + Math.round((now - ph) / 1000) + ' s' : 'non noté') + ', retour visible ' + (vu ? 'il y a ' + Math.round((now - vu) / 1000) + ' s' : 'non noté') + ') : splash + accueil'; }
    oublierPh();
    if(reprise) document.documentElement.classList.add('pp-reprise');
    sessionStorage.setItem(D, '1');
  }catch(e){ verdict = 'erreur : ' + ((e && e.message) || e); }
  try{ window.ppJournal('SPLASH', verdict); }catch(e){}
  marquer();

  /* v185 : voile de retour. Quand on touche l'icône, Android montre d'abord l'ANCIENNE page (l'écran où on était), puis relance la page : on voyait
     donc l'écran de l'app, puis le splash. Dès que la page redevient visible on pose un voile uni (couleur du fond) ; si la page est relancée, il
     disparaît avec elle (le splash prend le relais) ; sinon (retour par les applis récentes, rien ne se relance) il s'efface au bout de 0,8 s. */
  /* v186 : le voile est posé dès le DÉPART (page cachée), pas seulement au retour. Au retour par l'icône, Android affiche l'ancienne page
     telle qu'elle était : si le voile y est déjà, la première image montrée est le voile (fond uni) et non plus l'écran d'avant. Au retour, s'il
     ne se passe rien (applis récentes, déverrouillage), il s'efface en 0,18 s après 0,8 s ; si la page est relancée, il disparaît avec elle. */
  var minuteurVoile = null;
  function poserVoile(){
    try{
      var v = document.getElementById('pp-voile');
      if(!v){
        v = document.createElement('div');
        v.id = 'pp-voile'; v.setAttribute('aria-hidden', 'true');
        var clair = document.documentElement.getAttribute('data-theme') === 'light';
        v.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:var(--bs-h,100%);z-index:2147483647;display:flex;align-items:center;justify-content:center;background:' + (clair ? '#f1f0fb' : '#0c0c12') + ';transition:opacity .18s ease-out;pointer-events:none';
        /* v190 : le voile reprend la pose de départ du faux splash (fond uni + logo 288 px centré, sans le mot « Memoria » qui n'arrive qu'à 0,1 s) :
           raccord sans à-coup quand le splash prend le relais. */
        v.innerHTML = '<div style="width:288px;height:288px"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;overflow:visible"><g transform="translate(-6 0.5)"><g transform="rotate(10 250 250) translate(14 -4)"><rect x="177" y="154" width="170" height="216" rx="34" fill="' + (clair ? '#1d1b3a' : '#9c9588') + '"/><rect x="165" y="142" width="170" height="216" rx="34" fill="' + (clair ? '#2f2d5c' : '#f5f0e6') + '"/></g><g transform="rotate(-8 250 250) translate(-6 2)"><rect x="177" y="154" width="170" height="216" rx="34" fill="#b8431d"/><rect x="165" y="142" width="170" height="216" rx="34" fill="#ff6b3d"/><path d="M204 253 L238 290 L306 210" fill="none" stroke="#f5f0e6" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg></div>';
        (document.body || document.documentElement).appendChild(v);
      }
      v.style.transition = 'none'; v.style.opacity = '1'; void v.offsetHeight; /* v189 : pose immédiate, sans fondu, et dessin forcé */
      clearTimeout(minuteurVoile); minuteurVoile = null;
      return v;
    }catch(e){ return null; }
  }
  function leverVoile(){
    var v = document.getElementById('pp-voile');
    if(!v) return;
    clearTimeout(minuteurVoile);
    minuteurVoile = setTimeout(function(){
      v.style.transition = 'opacity .4s ease-in-out'; v.style.opacity = '0'; /* v191 : fondu de sortie plus doux (0,4 s au lieu de 0,18 s) */
      setTimeout(function(){ if(v.parentNode && v.style.opacity === '0') v.parentNode.removeChild(v); }, 460);
    }, 800);
  }
  document.addEventListener('visibilitychange', function(){
    marquer();
    if(document.visibilityState === 'visible'){
      try{ localStorage.setItem(VU, String(Date.now())); }catch(e){}
      oublierPh();
      poserVoile(); leverVoile();
    }else{
      poserVoile();
    }
  });
  window.addEventListener('freeze', function(){ poserVoile(); });
  /* v189 TEST : pose plus précoce, dès que l'app perd le focus (avant le passage en arrière-plan) ; levé au retour du focus. */
  window.addEventListener('blur', function(){ poserVoile(); });
  window.addEventListener('focus', function(){ if(document.visibilityState === 'visible'){ poserVoile(); leverVoile(); } });
  document.addEventListener('pause', function(){ poserVoile(); });
  window.addEventListener('pageshow', function(e){ if(e.persisted) oublierPh(); });
  window.addEventListener('pagehide', function(){ marquer(); poserVoile(); try{ localStorage.setItem(PH, String(Date.now())); }catch(e){} });
})();
</script>
<script>
  /* Apparence (v132) : choix Sombre / Clair / Auto, propre à CET appareil (localStorage, jamais synchronisé).
     Appliqué ICI, avant le premier rendu, via data-theme sur <html> : pas de flash au démarrage. */
  (function(){
    var K = 'fc-apparence';
    function lire(){ try{ var v = localStorage.getItem(K); if(v === 'clair' || v === 'sombre' || v === 'auto') return v; }catch(e){} return 'sombre'; }
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
    function resolu(c){ return c === 'clair' ? 'light' : (c === 'auto' && mq && mq.matches) ? 'light' : 'dark'; }
    window.apparenceChoisie = lire;
    window.appliquerApparence = function(c){
      var t = resolu(c || lire());
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if(m) m.setAttribute('content', t === 'light' ? '#f1f0fb' : '#0c0c12');
    };
    window.choisirApparence = function(c){
      try{ localStorage.setItem(K, c); }catch(e){}
      window.appliquerApparence(c);
    };
    window.appliquerApparence();
    if(mq){
      var suit = function(){ if(lire() === 'auto') window.appliquerApparence('auto'); };
      if(mq.addEventListener) mq.addEventListener('change', suit); else if(mq.addListener) mq.addListener(suit);
    }
  })();
</script>

<style>
:root{
    --ink:#18160f;
    --paper:#fbf8f2;
    --card:#ffffff;
    --line:#e7ded0;
    --accent:#c76a45;
    --accent-ink:#ffffff;
    --accent-deep:#a6512f;
    --good:#1f8a5f;
    --good-soft:#e5f4ec;
    --bad:#e42e1f;
    --bad-soft:#fbe9e7;
    --muted:#8f8574;
    --bulle:#f2ead9;
    --bulle-ink:#18160f;
    --radius-lg:20px;
    --radius:14px;
    --radius-sm:9px;
    --font-serif: "Fraunces", Georgia, serif;
    --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --spring: cubic-bezier(.34,1.56,.64,1);
    --spring-soft: cubic-bezier(.22,1.12,.36,1);
  }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
      --ink:#f3ede0; --paper:#100e0a; --card:#1a1711; --line:#332d22; --muted:#a89b84;
      --accent:#d98363; --accent-deep:#c76a45;
      --good:#4fd699; --good-soft:#123024;
      --bad:#ff5240; --bad-soft:#3a1913;
    }}
:root[data-theme="dark"]{
    --ink:#f3ede0; --paper:#100e0a; --card:#1a1711; --line:#332d22; --muted:#a89b84;
    --accent:#d98363; --accent-deep:#c76a45;
    --good:#4fd699; --good-soft:#123024;
    --bad:#ff5240; --bad-soft:#3a1913;
  }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{
    scroll-behavior:smooth; overscroll-behavior-y:contain;
    height:100%;
  }
body{
    margin:0;
    background:
      linear-gradient(
        var(--paper),
        var(--paper) env(safe-area-inset-top),
        color-mix(in srgb, var(--paper) 85%, transparent) calc(env(safe-area-inset-top) + 60px),
        color-mix(in srgb, var(--paper) 55%, transparent) calc(env(safe-area-inset-top) + 140px),
        color-mix(in srgb, var(--paper) 25%, transparent) calc(env(safe-area-inset-top) + 220px),
        transparent calc(env(safe-area-inset-top) + 300px)
      ),
      radial-gradient(1100px 900px at 12% -20%, rgba(199,106,69,0.06), rgba(199,106,69,0.02) 50%, transparent 78%),
      radial-gradient(950px 780px at 100% -10%, rgba(199,106,69,0.04), rgba(199,106,69,0.012) 45%, transparent 75%),
      var(--paper);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--font-sans); line-height:1.45;
    height:100%; min-height:100vh; min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
    -webkit-user-select:none; user-select:none;
    /* Le scroll ne s'active que si le contenu dépasse réellement l'écran
       (ex. liste longue de cartes) ; sur un écran qui tient déjà en entier
       (page vide, peu de cartes), rien ne doit bouger au balayage. */
    overflow-y:auto;
    scrollbar-width:none; -ms-overflow-style:none;
  }
body::-webkit-scrollbar{ display:none; width:0; height:0; }
/* Voir renderStudy() : verrou simple, posé/retiré à des moments précis
     (changement d'onglet, début/fin de session) — jamais recalculé en boucle
     à chaque frame, pour ne risquer aucune interférence avec les clics. */
body.lock-home-scroll{ overflow:hidden; }
/* Zones de saisie : la sélection/copie doit rester possible, sinon
     impossible d'éditer, corriger ou copier son propre texte. */
input, textarea, [contenteditable="true"]{
    -webkit-user-select:text; user-select:text;
  }
.wrap{max-width:600px; margin:0 auto; padding:18px 16px calc(96px + env(safe-area-inset-bottom));}
/* ---- Animations globales ---- */
@keyframes popIn{
    from{opacity:0; transform:translateY(10px) scale(0.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
@keyframes riseIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
@keyframes softIn{
    from{opacity:0;}
    to{opacity:1;}
  }
@keyframes homeFadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
/* Faux splash (écran de transition affiché juste après le splash natif Android).
     Fond UNI #0c0c12 = fond de l'app (--paper) : le vrai splash natif ne peut avoir
     qu'une couleur unie, on reste donc sur la même. À l'image 0, le logo (carte orange
     penchée + coche, devant une carte crème) est la pose STATIQUE de l'icône, au même endroit (288px, centré) : il reste
     fixe 0,5 s pour un raccord invisible, puis l'animation part de cette pose : saut,
     enfoncement sur le "?", retour sur la coche qui se redessine (1,3 s au total).
     "Memoria" arrive à 0,5 s. Sortie : fondu doux (logo qui rétrécit un peu) de 1,2 s à 1,45 s ; l'animationend de
     #boot-splash retire alors l'élément du DOM (voir le script en fin de fichier). */
#boot-splash{
    position:fixed; top:0; left:0; z-index:9999;
    width:100vw; height:100vh; height:100dvh; height:var(--bs-h,100dvh);
    background:#0c0c12;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
    animation:bootSplashBg .25s cubic-bezier(.4,0,.2,1) 1.2s forwards;
  }
#boot-splash-icon{ position:relative; width:288px; height:288px; animation:bsOut .25s cubic-bezier(.4,0,.2,1) 1.2s forwards; }
#boot-splash-card{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
#boot-splash-card g, #boot-splash-card path{ transform-box:view-box; }
#bs-hop{ transform-origin:262px 384px; animation:bsHop 1.3s ease-in-out both; will-change:transform; }
#bs-of, #bs-yf{ transform-origin:250px 250px; }
#bs-of{ animation:bsOf 1.3s ease-in-out both; }
#bs-os{ animation:bsOs 1.3s step-end both; }
#bs-yf{ animation:bsYf 1.3s ease-in-out both; }
#bs-ys{ animation:bsYs 1.3s step-end both; }
#boot-splash-card #bs-check{ stroke-dasharray:175; transform-box:fill-box; transform-origin:center; animation:bsChk 1.3s ease-out both, bsPop 1.3s ease-out both; }
#boot-splash-word{
    position:absolute; left:0; right:0; top:calc(50% + 95px); text-align:center;
    font-family:var(--font-sans,"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif);
    font-size:30px; font-weight:800; letter-spacing:-.04em; color:#f5f0e6;
    animation:bsWord .3s cubic-bezier(.2,.8,.2,1) .1s both;
  }

/* v133 : le faux splash suit l'apparence (data-theme posé dans le <head> avant le premier rendu). Sombre = valeurs d'origine ; clair = fond crème
   (= --paper clair), texte encre, carte de derrière foncée (mêmes variables --lg-d / --lg-b que le logo de l'en-tête). */
:root[data-theme="light"] #boot-splash{ background:#f1f0fb; }
:root[data-theme="light"] #boot-splash-word{ color:#1d1b3a; }
/* v106 : le splash reste FIGÉ sur la pose statique de l'icône tant que la page n'a pas fini de se construire ; le script en fin de fichier
   pose .go une fois l'init terminée et une image dessinée, pour que l'animation (1,35 s) tourne sur un processeur libre au lieu de saccader. */
#boot-splash:not(.go), #boot-splash:not(.go) *{ animation-play-state:paused !important; }
/* v174 : retour dans l'app (pas un vrai démarrage) : pas de faux splash. */
html.pp-reprise #boot-splash{ display:none !important; }
/* v176 : au retour dans l'app, l'accueil ne rejoue pas son fondu d'entrée (sinon l'écran « clignote » : invisible puis affiché en fondu). */
html.pp-reprise .home-status, html.pp-reprise .home-cta, html.pp-reprise .home-choice-item,
html.pp-reprise .home-secondary-sep, html.pp-reprise .home-secondary{ opacity:1 !important; animation:none !important; }

/* Entrées directionnelles pour la carte suivante après une réponse
     (rouge/orange/vert) : la nouvelle carte entre du côté OPPOSÉ à celui par
     lequel l'ancienne vient de sortir, comme un vrai enchaînement de cartes
     plutôt qu'un jaillissement vertical sans rapport avec la sortie qui
     précède. Léger dépassement (overshoot) à 65% avant de se stabiliser :
     un simple from/to avec une seule courbe ralentit trop tard et "claque"
     à l'arrivée ; ce petit rebond amorti donne un arrêt doux et vivant. */
@keyframes cardSettleFromRight{
    0%{opacity:0; transform:translateX(160px) scale(0.9) rotate(6deg);}
    65%{opacity:1; transform:translateX(-6px) scale(1.008) rotate(-0.3deg);}
    100%{opacity:1; transform:translateX(0) scale(1) rotate(0deg);}
  }
@keyframes cardSettleFromLeft{
    0%{opacity:0; transform:translateX(-160px) scale(0.9) rotate(-6deg);}
    65%{opacity:1; transform:translateX(6px) scale(1.008) rotate(0.3deg);}
    100%{opacity:1; transform:translateX(0) scale(1) rotate(0deg);}
  }
@keyframes streakBump{

    35%{transform:scale(1.18);}
    60%{transform:scale(0.96);}
    100%{transform:scale(1);}
  }

    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(5px);}

  }

     .tab-settled, puis le remet quand elles sont finies). Sans ça, chaque re-rendu
     (frappe dans la recherche, clic sur ⇄, suppression, changement de date…)
     rejouait l'entrée de TOUS les blocs : on avait l'impression que la page se
     rafraîchissait. Les retours d'erreur (.import-msg) et les toasts gardent leur animation. */
.tab-settled .card-row, .tab-settled .add-choice-btn{ animation:none; }
/* ---- Bouton de synchro : il change lui-même d'état (repos -> synchro -> ✓ / échec) ---- */
.sync-btn{ display:flex; align-items:center; justify-content:center; gap:8px; min-height:46px;
    transition:transform 0.3s var(--spring), background-color 0.3s ease, color 0.3s ease; }
.sync-btn svg{ width:18px; height:18px; flex-shrink:0; }
.sync-btn .sync-label{ animation:softIn 0.22s ease-out; }
.sync-spin{ animation:syncSpin 0.8s linear infinite; transform-origin:center; }
@keyframes syncSpin{ to{ transform:rotate(360deg); } }
.sync-check{ stroke-dasharray:24; stroke-dashoffset:24; animation:checkDraw 0.4s 0.08s ease-out forwards; }
.sync-statut{ display:flex; align-items:center; gap:8px; margin-top:10px; font-size:0.78rem; color:var(--muted); line-height:1.4; }
.sync-dot{ width:8px; height:8px; border-radius:50%; background:var(--muted); opacity:0.45; flex-shrink:0;
    transition:background-color 0.3s ease, opacity 0.3s ease; }

.sync-dot.err{ background:var(--bad); opacity:1; }
.streak.bump{animation:streakBump 0.4s cubic-bezier(.34,1.56,.64,1);}
/* ---- Top bar ---- */
.topbar{

    padding:10px 4px 8px 10px;
  }
.streak{

    border-radius:100px; padding:7px 13px 7px 11px; font-weight:800; font-size:0.9rem;

.streak svg{width:16px; height:16px; stroke:var(--accent-deep); color:var(--accent-deep); flex-shrink:0;}
.streak.is-zero svg{stroke:var(--muted); color:var(--muted); opacity:0.7;}
.streak.is-zero{opacity:0.75;}
/* Bouton réglages dans la topbar : remplace le pill streak sur les écrans
     Ajouter / Parcourir / Réglages (voir renderTopbarRight en JS), où le
     streak est moins pertinent qu'un accès rapide aux réglages. Même hauteur
     et même fond que le pill streak pour que la topbar ne saute pas visuellement
     en changeant d'onglet, mais carré (pas de texte à côté de l'icône). */
.topbar-icon-btn{

    width:34px; height:34px; background:var(--bulle); color:var(--bulle-ink);

/* ---- Bottom tab bar ---- */

/* ---- Home hero ---- */
/* ============================================================
     ACCUEIL — refonte minimaliste.
     Principe : un seul niveau de décision. La zone haute est de la
     PURE INFO (jamais de fond plein, jamais d'ombre "pressable" —
     rien qui puisse se lire comme un bouton). Le seul bouton plein
     de tout l'écran est le CTA de révision. Tout le reste (matières,
     progression) vit dans une zone secondaire, visuellement plus
     sobre, sous une ligne de séparation, pour occuper l'espace sans
     jamais rivaliser avec l'action principale.
     Le tout est réparti verticalement (voir .home-screen) pour que
     l'écran ne soit pas tassé en haut sur les grands viewports.
     ============================================================ */
.home-screen{
    min-height:calc(100vh - 76px - 96px - env(safe-area-inset-bottom));
    min-height:calc(100dvh - 76px - 96px - env(safe-area-inset-bottom));
    display:flex; flex-direction:column; justify-content:center;
    padding:40px 0 10px;
  }
/* Sur un re-render déclenché par un changement de matière (pas le tout
     premier affichage de l'écran), on coupe les animations d'entrée
     individuelles de chaque bloc enfant — sinon elles rejouent leur "pop"
     depuis opacity 0 à chaque clic, ce qui donne l'impression que l'écran
     entier clignote. Le fondu global appliqué en JS (onMatiereFilterChange)
     suffit dans ce cas. */
.home-screen.no-replay-anim *{animation:none !important;}
/* Tant que le splash custom (#boot-splash) n'a pas été retiré du DOM,
     ces blocs restent invisibles au lieu de jouer leur fondu d'entrée
     caché derrière le splash. La classe "splash-done" est posée sur
     <body> par le JS de retrait du splash, juste avant qu'on retire
     celui-ci : le fade-in de la home devient alors le premier mouvement
     visible par l'utilisateur, au lieu de se terminer avant même que
     le splash ait commencé à disparaître. */
.home-status, .home-cta, .home-choice-item, .home-secondary-sep, .home-secondary{
    opacity:0;
  }
body.splash-done .home-status{
    animation:homeFadeIn 0.5s cubic-bezier(.25,.8,.4,1) both;
  }
body.splash-done .home-cta{
    animation:homeFadeIn 0.5s cubic-bezier(.25,.8,.4,1) 0.12s both;
  }
body.splash-done .home-choice-item{
    animation:homeFadeIn 0.5s cubic-bezier(.25,.8,.4,1) 0.12s both;
  }
body.splash-done .home-secondary-sep{
    animation:homeFadeIn 0.5s cubic-bezier(.25,.8,.4,1) 0.18s both;
  }
body.splash-done .home-secondary{
    animation:homeFadeIn 0.5s cubic-bezier(.25,.8,.4,1) 0.24s both;
  }
/* Re-render déclenché par un changement de matière : le splash est
     déjà loin (splash-done reste vrai en permanence après le tout
     premier affichage), donc ce n'est pas ça qui masque ces blocs sur
     un re-render normal. .no-replay-anim sert seulement à couper le pop
     individuel de chaque bloc pour ne garder que le fondu global géré
     en JS (onMatiereFilterChange) — donc on force ici l'opacité à 1
     pour annuler la règle "opacity:0 par défaut" ci-dessus. */
.home-screen.no-replay-anim .home-status, .home-screen.no-replay-anim .home-cta, .home-screen.no-replay-anim .home-choice-item, .home-screen.no-replay-anim .home-secondary-sep, .home-screen.no-replay-anim .home-secondary{
    opacity:1;
  }
/* ---- Zone info : juste le chiffre, rien qui ressemble à un bouton ---- */
.home-status{
    text-align:center; padding:8px 8px 4px; margin-bottom:36px;
  }
/* ---- Le seul bouton plein de l'écran ---- */
.home-cta{
    width:100%; margin:22px 0 0; padding:18px; border:none; border-radius:100px;
    background:linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%); color:#fff;
    font-family:var(--font-sans); font-size:1.05rem; font-weight:800; cursor:pointer;
    box-shadow:0 14px 28px -12px rgba(24,22,15,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
    transition:transform 0.3s var(--spring), box-shadow 0.2s;
  }
.home-cta:not(:disabled):hover{transform:translateY(-1px); box-shadow:0 18px 32px -12px rgba(24,22,15,0.45);}
.home-cta:disabled{opacity:0.3; box-shadow:none; cursor:not-allowed;}
/* Choix de matière, seulement si plusieurs matières ont des cartes dues :
     remplace le CTA unique par un court choix explicite, toujours sobre. */
.home-choice-item{
    width:100%; padding:14px 17px; border:none; border-radius:16px;
    background:linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%); color:#fff;
    font-family:var(--font-sans); font-size:0.94rem; font-weight:800; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between; gap:8px; text-align:left;
    box-shadow:0 12px 24px -12px rgba(24,22,15,0.38), inset 0 1px 0 rgba(255,255,255,0.25);
    transition:transform 0.3s var(--spring);
  }
/* ---- Séparateur entre action principale et zone secondaire ---- */
.home-secondary-sep{
    display:flex; align-items:center; gap:10px; margin:30px 0 14px;
    color:var(--muted); font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.07em;
  }
.home-secondary-sep::before, .home-secondary-sep::after{
    content:""; flex:1; height:1px; background:var(--line);
  }
/* ---- Zone secondaire : sobre, discrète, jamais des boutons pleins ---- */
.home-secondary{
    display:flex; flex-direction:column; gap:10px;
  }
/* Ligne discrète : icône + texte + chevron, fond quasi invisible.
     Volontairement plate — jamais de gradient, jamais d'ombre portée —
     pour rester nettement en retrait par rapport au CTA principal. */
.home-row{
    width:100%; padding:13px 16px; border:none; border-radius:100px;
    background:var(--card); color:var(--ink); cursor:pointer;
    font-family:var(--font-sans); font-size:0.86rem; font-weight:600;
    display:flex; align-items:center; gap:11px; text-align:left;
    transition:transform 0.26s var(--spring), background 0.15s;
  }
.home-row:disabled{opacity:0.35; cursor:not-allowed;}
/* ---- Progression : stats posées à même le fond, pas de carte-boîte ---- */
.home-progress{padding:2px 2px 0; cursor:pointer; transition:opacity 0.12s, transform 0.26s var(--spring);}
.home-progress-stats{display:flex; gap:0; margin-bottom:12px;}
.home-progress-stat{flex:1; display:flex; align-items:center; gap:8px; padding:0 8px;}
.home-progress-stat-icon{
    width:28px; height:28px; border-radius:9px; flex-shrink:0;

    background:var(--good-soft); color:var(--good);
  }
.home-progress-stat-icon.is-streak{background:rgba(199,106,69,0.12); color:var(--accent-deep);}
:root[data-theme="dark"] .home-progress-stat-icon.is-streak{background:rgba(217,131,99,0.15);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .home-progress-stat-icon.is-streak{background:rgba(217,131,99,0.15);}}
.home-progress-stat-icon svg{width:14px; height:14px; stroke:currentColor;}
.home-progress-stat-body{display:flex; flex-direction:column; line-height:1.15;}
.home-progress-stat-num{font-family:var(--font-serif); font-weight:700; font-size:1.15rem;}
.home-progress-stat-label{font-size:0.66rem; font-weight:600; color:var(--muted);}
.home-progress-divider{width:1px; background:var(--line); margin:2px 0;}
.home-progress-chart{display:flex; align-items:flex-end; justify-content:space-between; gap:6px; height:40px; padding:0 8px;}
.home-progress-bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end;}
.home-progress-bar-track{width:100%; max-width:18px; height:100%; display:flex; align-items:flex-end;}
.home-progress-bar{

.home-progress-bar.is-today.has-activity{background:var(--accent-deep);}
.home-progress-bar-day{font-size:0.6rem; font-weight:700; color:var(--muted); text-transform:uppercase;}
.home-progress-bar-day.is-today{color:var(--accent-deep);}
@keyframes barGrow{ from{ transform:scaleY(0); transform-origin:bottom; } to{ transform:scaleY(1); transform-origin:bottom; } }
/* Liste de choix de matière dans les modales "Tout réviser" / "Quiz" */
.home-matiere-due-list{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
.home-matiere-due-item{

.quiz-launch{
    background:var(--bulle); color:var(--bulle-ink); border:none;
    padding:10px 16px 10px 13px; display:inline-flex; align-items:center; gap:6px;
    border-radius:100px; font-size:0.8rem; font-weight:700; cursor:pointer; font-family:var(--font-sans);
    white-space:nowrap; box-shadow:0 3px 10px -5px rgba(24,22,15,0.25);
    transition:transform 0.28s var(--spring);
  }
.quiz-launch svg{width:14px; height:14px; stroke:currentColor; flex-shrink:0;}
.quiz-launch:not(:disabled):hover{transform:translateY(-1px);}
.quiz-launch:disabled{opacity:0.35; box-shadow:none;}
/* ---- Bandeau "cartes maîtrisées" sous la carte, stable pendant tout le quiz
     (contrairement au palier qui change à chaque réponse) ---- */
.mastery-banner-back{
    width:38px; height:38px; border-radius:12px; flex-shrink:0; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:var(--paper); color:var(--ink);
    transition:transform 0.26s var(--spring), background 0.15s;
  }
.mastery-banner-back svg{width:18px; height:18px; stroke:currentColor;}
/* ---- Barre "teinte de session" : pas une progression vers une fin (voir
     discussion), mais une seule barre pleine dont la couleur cumule toutes
     les réponses données (rouge/orange/vert), comme de la peinture qu'on
     mélange dans un même pot au fil de la session. Elle ne dit jamais
     "combien il reste" — juste "comment ça se passe jusqu'ici". Neutre
     (var(--line)) tant qu'aucune réponse n'a encore été donnée. */
.study-mood-bar{
    height:7px; border-radius:4px; margin-bottom:14px;
    background:var(--line);
    transition:background-color 0.5s cubic-bezier(.22,.9,.3,1);
    animation:riseIn 0.3s ease-out both;
    position:relative; overflow:hidden;
  }
/* Calque "goutte" : à chaque réponse, une teinte pure (non diluée) de la
     couleur qui vient d'être ajoutée apparaît au centre de la barre, s'étale
     rapidement sur toute sa largeur (comme une goutte de liquide versée qui
     se répand), puis s'estompe très lentement pendant que la carte suivante
     est affichée, pour révéler la teinte moyenne réelle en dessous (posée
     instantanément par sessionMoodColor, sans attendre ce fondu). Rejouée à
     chaque réponse via retrait/pose de la classe is-active (avec un reflow
     forcé, voir triggerMoodDrop en JS) plutôt que par une transition, pour
     pouvoir la relancer à l'identique carte après carte. */
/* Calque "goutte" : à chaque réponse, une touche discrète (dégradé doux, PAS
     un aplat plein) de la couleur qui vient d'être ajoutée apparaît au centre
     de la barre, s'étale doucement puis s'estompe très lentement pendant que
     la carte suivante est affichée — un simple frémissement, pas un bandeau
     de couleur qui recouvre puis disparaît d'un coup. La teinte moyenne
     réelle en dessous est posée instantanément par sessionMoodColor (JS),
     ce calque ne fait que la survoler brièvement. Rejouée à chaque réponse
     via retrait/pose de la classe is-active (reflow forcé, voir
     triggerMoodDrop en JS). */
.study-mood-bar-drop{
    position:absolute; inset:0; border-radius:inherit;
    opacity:0; pointer-events:none;
    background:radial-gradient(ellipse 55% 160% at 50% 50%, var(--drop-color, transparent) 0%, transparent 72%);
    transform:scale(0.4,1);
    transform-origin:center;
  }
.study-mood-bar-drop.is-active{
    animation:moodDrop 3.6s cubic-bezier(.33,1,.68,1) both;
  }
@keyframes moodDrop{
    0%{ opacity:0; transform:scale(0.4,1); }
    12%{ opacity:0.32; transform:scale(0.85,1); }
    30%{ opacity:0.24; transform:scale(1,1); }
    100%{ opacity:0; transform:scale(1.3,1); }
  }
/* ---- Card (structure type Anki : une carte pleine hauteur, boutons ancrés en bas) ---- */
.anki-card{
    flex:1; min-height:420px; display:flex; flex-direction:column;
    background:var(--card); border:1.5px solid var(--line); border-radius:26px;
    box-shadow:0 20px 40px -20px rgba(24,22,15,0.32), 0 2px 8px -4px rgba(24,22,15,0.12);
    overflow:hidden; position:relative;
  }
.anki-card::before{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity:0.03; mix-blend-mode:multiply;
  }
:root[data-theme="dark"] .anki-card::before{ mix-blend-mode:overlay; opacity:0.05; }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .anki-card::before{ mix-blend-mode:overlay; opacity:0.05; }}
.anki-card-body{ position:relative; z-index:1; }
.anki-card.card-settle{ animation:cardSettle 0.32s cubic-bezier(.22,.9,.3,1) both; }
.anki-card.card-settle-from-right{ animation:cardSettleFromRight 0.62s cubic-bezier(.16,1,.3,1) both; }
.anki-card.card-settle-from-left{ animation:cardSettleFromLeft 0.62s cubic-bezier(.16,1,.3,1) both; }
/* Glissement au doigt : la carte reçoit tous les gestes (le corps de la carte
     ne garde le défilement vertical natif que s'il déborde : voir .peut-defiler). */
.anki-card{ touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
/* Le corps de la carte a overflow-y:auto => c'est un conteneur de défilement, donc le navigateur
     ne remonte PAS jusqu'au touch-action:none de .anki-card pour un doigt posé dessus : il reprenait
     le geste après quelques pixels (pointercancel) et la carte revenait. On le fixe ici aussi. */
.anki-card-body{ touch-action:none; }
.anki-card-body.peut-defiler{ touch-action:pan-y; }
/* Pastille de réponse : même forme, mêmes icônes et mêmes couleurs que les 3 boutons.
     Vide (contour) tant qu'on n'a pas assez glissé, pleine une fois la réponse armée. */
.anki-card-body{
    flex:1; min-height:0; overflow-y:auto;
    display:flex; flex-direction:column; align-items:stretch; justify-content:center;
    padding:22px 26px; text-align:center; cursor:pointer;
    transition:background 0.2s;
  }
.show-answer-btn{
    width:100%; height:52px; border:none; border-radius:14px; cursor:pointer;
    background:var(--accent); color:#fff; font-family:var(--font-sans);
    font-size:0.95rem; font-weight:800; letter-spacing:-0.01em;
    transition:transform 0.3s var(--spring), filter 0.15s;
    animation:actionsIn 0.22s ease-out both;
  }
/* ---- Réponse : code couleur + icône seule ---- */
.study-actions{
    display:flex; gap:8px; width:100%;
  }
/* Ne joue le fondu d'entrée des boutons que sur le tout premier affichage
     de la session (classe posée par JS) : le rejouer à chaque carte, en
     même temps que l'animation de la carte elle-même, créait un empilement
     de deux animations décalées qui donnait l'impression de saccade. */
.study-actions.actions-first-in{
    animation:actionsIn 0.28s cubic-bezier(.22,.9,.3,1) 0.08s both;
  }
.study-actions button{
    flex:1; height:56px; padding:0; border-radius:14px; cursor:pointer;
    border:none; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    transition:transform 0.32s var(--spring), filter 0.14s, box-shadow 0.14s;
  }
.study-actions button svg{ width:22px; height:22px; stroke:#fff; stroke-width:2.5; opacity:0.95; transition:transform 0.3s var(--spring); }
/* ---- Annuler la dernière réponse ---- */
.undo-pill{
    display:inline-flex; align-items:center; gap:6px; background:none; border:none; cursor:pointer;
    color:var(--muted); font-size:0.78rem; font-weight:700; font-family:var(--font-sans);
    padding:4px 2px; margin:-4px 0 12px; transition:color 0.15s, transform 0.26s var(--spring);
    animation:riseIn 0.25s ease-out both;
  }
.undo-pill svg{width:14px; height:14px; stroke:currentColor;}
.undo-pill:hover{color:var(--accent-deep);}
/* ---- Quiz ---- */
/* Barre de progression du quiz : piste en creux, remplissage dégradé avec halo,
     reflet qui balaie la barre, et petit point lumineux au bout qui "respire". */
/* ---- Browse ---- */
.browse-search-clear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted);
    cursor:pointer; font-size:1.05rem; padding:4px 8px; line-height:1;
    transition:transform 0.26s var(--spring), color 0.15s;
  }
/* Colonne du ⇄ de matière : même décalage à droite que celui des cartes
     (bordure 1px + padding 14px) + un faux "×" invisible pour l'alignement exact. */
/* Le badge « x/y » se place à droite du ⇄, centré au-dessus de la colonne des ×.
     Le faux × transparent réserve la même largeur que sur les cartes, donc le ⇄
     reste pile aligné avec ceux des cartes. */
.card-row:nth-child(1){animation-delay:0.02s;}
.card-row:nth-child(2){animation-delay:0.05s;}
.card-row:nth-child(3){animation-delay:0.08s;}
.card-row:nth-child(4){animation-delay:0.11s;}
.card-row:nth-child(5){animation-delay:0.14s;}
.card-row:nth-child(n+6){animation-delay:0.16s;}
.card-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:13px 14px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:7px;
    font-size:0.86rem; box-shadow:0 3px 10px -8px rgba(24,22,15,0.2);
    transition:transform 0.32s var(--spring), box-shadow 0.2s, border-color 0.2s;
    cursor:pointer; animation:riseIn 0.3s ease-out both;
  }
.card-row:hover{border-color:var(--accent); box-shadow:0 6px 16px -8px rgba(24,22,15,0.3);}
.del{background:none; border:none; color:var(--muted); cursor:pointer; font-size:1.1rem; padding:2px 4px; flex-shrink:0; line-height:1; transition:color 0.15s, transform 0.28s var(--spring);}
.del:hover{color:var(--bad); transform:scale(1.15);}
/* Bouton "sens inversé" (⇄) : grisé par défaut, vert quand la carte est inversible. */
.inv-btn{background:none; border:none; color:var(--muted); cursor:pointer; padding:3px 4px; flex-shrink:0; line-height:1; display:inline-flex; align-items:center; justify-content:center; opacity:0.55; transition:color 0.15s, opacity 0.15s, transform 0.28s var(--spring);}
.inv-btn svg{width:17px; height:17px; stroke:currentColor;}
/* Version "pastille" (formulaire d'ajout et aperçu IA) : icône + court libellé. */
.inv-chip{display:inline-flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); color:var(--muted); border-radius:100px; padding:4px 11px 4px 9px; font-size:0.7rem; font-weight:700; text-transform:none; letter-spacing:0; cursor:pointer; font-family:var(--font-sans); white-space:nowrap; transition:color 0.15s, background 0.15s, border-color 0.15s, transform 0.35s cubic-bezier(.22,.9,.3,1);}
.inv-chip svg{width:14px; height:14px; stroke:currentColor; flex-shrink:0;}
/* ---- Add (prompt + import fusionnés) ---- */
.copy-btn{
    background:var(--ink); color:var(--paper); border:none; padding:15px 28px;
    border-radius:100px; font-size:0.9rem; cursor:pointer; font-family:var(--font-sans);
    font-weight:700; width:100%; transition:transform 0.3s var(--spring), background 0.2s;
  }
.import-btn{
    background:var(--accent); color:#fff; border:none; padding:15px; border-radius:100px;
    font-size:0.9rem; cursor:pointer; font-family:var(--font-sans); font-weight:700; width:100%;
    transition:transform 0.3s var(--spring), box-shadow 0.15s;
  }
.import-btn:disabled{opacity:0.4;}
.export-btn{
    background:var(--ink); color:var(--paper); border:none; padding:14px; border-radius:100px;
    font-size:0.88rem; cursor:pointer; font-family:var(--font-sans); font-weight:700; width:100%;
    position:relative; overflow:hidden; isolation:isolate;
    transition:transform 0.3s var(--spring);
  }
.export-btn::after{
    content:""; position:absolute; inset:0; z-index:-1; opacity:0;
    background-image:radial-gradient(circle, var(--accent) 0.55px, transparent 0.55px);
    background-size:5px 5px;
    -webkit-mask-image:radial-gradient(circle, #000 0%, transparent 71%);
    mask-image:radial-gradient(circle, #000 0%, transparent 71%);
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center; mask-position:center;
    -webkit-mask-size:0% 0%; mask-size:0% 0%;
    transition:opacity 0.2s ease-out;
  }
.export-btn:active::after, .export-btn.js-press::after{
    opacity:0.55;
    -webkit-mask-size:220% 220%; mask-size:220% 220%;
    transition:-webkit-mask-size 0.22s ease-out, opacity 0.15s ease-out;
    transition:mask-size 0.22s ease-out, opacity 0.15s ease-out;
  }
.export-btn svg{width:16px; height:16px; stroke:currentColor; flex-shrink:0;}
.import-msg{
    font-size:0.83rem; font-weight:600; padding:11px 13px; border-radius:var(--radius-sm); margin-bottom:12px; line-height:1.5;
    animation:popIn 0.3s cubic-bezier(.34,1.56,.64,1) both;
  }
.import-msg.ok{background:var(--good-soft); color:var(--good);}
.import-msg.err{background:var(--bad-soft); color:var(--bad); animation:shakeNo 0.4s ease-in-out both;}
/* Variante cliquable (ex. le message "Ajoute ta clé API dans Réglages") :
     un chevron à droite suffit à signaler que c'est tapable, sans avoir à
     ajouter une phrase du genre "appuie ici" — cursor:pointer n'a aucun effet
     sur mobile, d'où le chevron. */
.import-msg-link{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    cursor:pointer; transition:opacity 0.15s;
  }
.import-msg-link:active, .import-msg-link.js-press{opacity:0.65; transition:opacity 0.12s;}
.import-msg-link svg{width:16px; height:16px; stroke:currentColor; flex-shrink:0;}
/* ---- Cartes groupées de l'écran Ajouter ---- */
.manual-btn{
    width:100%; padding:14px; border:1.5px dashed var(--line); border-radius:14px;
    background:transparent; color:var(--ink); font-family:var(--font-sans);
    font-weight:700; font-size:0.9rem; cursor:pointer;
    transition:border-color 0.15s, color 0.15s, transform 0.26s var(--spring);
  }
.manual-btn:hover{border-color:var(--accent); color:var(--accent-deep);}
/* ---- Écran Ajouter : deux actions au même niveau (plus de badge/carte accentuée pour l'une seulement) ---- */
.add-choice-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;
    background:var(--card); border:1.5px solid var(--line); border-radius:18px;
    padding:18px 10px; cursor:pointer; font-family:var(--font-sans); color:var(--ink);
    box-shadow:0 4px 14px -10px rgba(24,22,15,0.15);
    transition:border-color 0.15s, transform 0.26s var(--spring), box-shadow 0.15s;
  }
.add-choice-btn:hover{border-color:var(--accent); transform:translateY(-1px);}
/* Une seule action ("Nouvelle carte") : disposition horizontale pleine largeur
     plutôt que la carte verticale prévue pour deux choix côte à côte. */
/* ---- Fiche de synthèse ---- */
.synth-rendu{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:16px 16px 6px; margin-bottom:12px; font-size:0.92rem; line-height:1.6; color:var(--ink);
    overflow-wrap:anywhere; min-width:0;
  }
.synth-rendu h1,.synth-rendu h2,.synth-rendu h3{font-family:var(--font-serif); line-height:1.2; margin:1.1em 0 0.4em;}
.synth-rendu h1{font-size:1.35rem;}
.synth-rendu h2{font-size:1.15rem; color:var(--accent-deep); margin-top:2.2em;}
.synth-rendu h3{font-size:1rem;}
.synth-rendu > :first-child{margin-top:0;}
.synth-rendu p{margin:0 0 0.8em;}
.synth-rendu ul,.synth-rendu ol{margin:0 0 0.8em; padding-left:1.4em;}
.synth-rendu li{margin:0.15em 0;}
.synth-rendu code{font-family:'SFMono-Regular', Menlo, monospace; font-size:0.85em; background:var(--paper); padding:1px 5px; border-radius:5px;}
.synth-rendu blockquote{margin:0 0 0.8em; padding:2px 0 2px 12px; border-left:3px solid var(--accent); color:var(--muted); font-style:italic;}
.synth-rendu hr{border:none; border-top:1px solid var(--line); margin:1em 0;}
.synth-table-wrap{overflow-x:auto; margin:0 0 0.9em; -webkit-overflow-scrolling:touch;}
.synth-rendu table{border-collapse:collapse; min-width:100%; width:max-content; max-width:none; font-size:0.85rem;}
.synth-rendu th,.synth-rendu td{border:1px solid var(--line); padding:6px 9px; text-align:left; vertical-align:top; overflow-wrap:normal; word-break:normal; min-width:6.5em;}
.synth-rendu th{background:var(--paper); font-weight:700;}
#synth-print{display:none;}
@media print{body.synth-impression > *:not(#synth-print){display:none !important;}
body.synth-impression #synth-print{display:block !important;}
body.synth-impression{background:#fff !important;}
body.synth-impression .synth-rendu{
      background:#fff !important; color:#000 !important; border:none !important; padding:0 !important; margin:0 !important;
      font-size:11pt; line-height:1.5; font-family:'Calibri','Segoe UI',Arial,sans-serif;
    }
body.synth-impression .synth-rendu h1{font-size:18pt; color:#000; page-break-after:avoid;}
body.synth-impression .synth-rendu h2{font-size:14pt; color:#a9502e; page-break-after:avoid;}
body.synth-impression .synth-rendu h3{font-size:12pt; color:#000; page-break-after:avoid;}
body.synth-impression .synth-table-wrap{overflow:visible;}
body.synth-impression .synth-fig{page-break-inside:avoid;}
body.synth-impression .synth-fig img{max-height:9cm;border-radius:0;}
body.synth-impression .synth-fig figcaption{color:#555;}
body.synth-impression .synth-rendu table{width:100%; page-break-inside:auto;}
body.synth-impression .synth-rendu tr{page-break-inside:avoid;}
body.synth-impression .synth-rendu th{background:#eee !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
@page{margin:18mm;}}
/* ---- Écran Réglages ---- */
/* ---- Page dédiée "nouvelle carte" (plein écran, pas une bottom-sheet) ---- */
.cc-back{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--card);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink);
    flex-shrink:0; box-shadow:0 3px 10px -6px rgba(24,22,15,0.3); transition:transform 0.28s var(--spring);
  }
.cc-back svg{width:17px; height:17px; stroke:currentColor;}
.cc-field{display:flex; flex-direction:column; gap:7px; position:relative;}
.cc-field textarea, .cc-field input{
    width:100%; background:var(--card); border:1.5px solid var(--line); color:var(--ink);
    padding:14px 15px; border-radius:16px; font-size:1rem; font-family:var(--font-sans);
    resize:none; transition:border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    box-shadow:0 3px 12px -9px rgba(24,22,15,0.2);
  }
.cc-field textarea:focus, .cc-field input:focus{
    outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft, rgba(199,106,69,0.16));
  }
.cc-field textarea{min-height:76px; line-height:1.5;}
/* ---- Champ Matière : sélecteur <-> saisie inline, sans ajouter de bloc ---- */
.cc-matiere-pill{
    margin-left:auto; display:inline-flex; align-items:center; gap:6px;
    background:var(--card); border:1px solid var(--line); color:var(--ink);
    border-radius:100px; padding:4px 11px 4px 9px; font-size:0.7rem; font-weight:700;
    text-transform:none; letter-spacing:0; cursor:pointer; font-family:var(--font-sans);
    box-shadow:0 3px 10px -6px rgba(24,22,15,0.25);
    transition:transform 0.35s cubic-bezier(.22,.9,.3,1), opacity 0.3s ease, background 0.15s;
    max-width:150px;
  }
.cc-matiere-pill span:last-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cc-matiere-slot{position:relative;}
.cc-matiere-slot .cc-select-wrap{
    transition:opacity 0.22s ease, transform 0.28s cubic-bezier(.22,.9,.3,1);
  }
/* select natif planqué derrière une pastille custom pour un look moins "sobre" */
.cc-select-wrap{position:relative;}
.cc-select-wrap select{
    position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; z-index:2;
  }
.cc-save{
    background:linear-gradient(150deg, var(--accent) 0%, var(--accent-deep) 100%); color:#fff; border:none;
    padding:11px 20px; border-radius:100px;
    font-size:0.88rem; cursor:pointer; font-family:var(--font-sans); font-weight:700;
    transition:transform 0.3s var(--spring), box-shadow 0.15s;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    box-shadow:0 8px 20px -10px rgba(199,106,69,0.55);
  }
.cc-save svg{width:15px; height:15px;}
/* ---- Transition douce entre deux cartes (au lieu de re-render brutal) ---- */
.cc-field.cc-field-cleared textarea,
  .cc-field.cc-field-cleared input{
    animation:ccFieldClear 0.32s cubic-bezier(.22,.9,.3,1);
  }
@keyframes ccFieldClear{
    0%{ background:var(--good-soft); border-color:var(--good); }
    100%{ background:var(--card); border-color:var(--line); }
  }
/* ---- Toast de validation (carte ajoutée) ---- */
.cc-toast{
    position:fixed; top:18px; left:50%; transform:translateX(-50%);
    background:var(--good); color:#fff; font-weight:700; font-size:0.88rem;
    padding:11px 18px; border-radius:100px; display:flex; align-items:center; gap:8px;
    box-shadow:0 10px 24px -8px rgba(24,22,15,0.4); z-index:60;
    animation:toastIn 0.35s cubic-bezier(.34,1.56,.64,1) both, toastOut 0.35s ease-in 1.5s forwards;
  }
.cc-toast svg{width:16px; height:16px; stroke:currentColor;}
.cc-toast .cc-check-circle{stroke-dasharray:24; stroke-dashoffset:24; animation:checkDraw 0.4s 0.15s ease-out forwards;}
.cc-toast.cc-toast-avert{
    border-radius:18px; max-width:88vw; text-align:left; align-items:flex-start;
    animation:toastIn 0.35s cubic-bezier(.34,1.56,.64,1) both, toastOut 0.35s ease-in 4.9s forwards;
  }
.cc-toast.cc-toast-avert svg{margin-top:2px; flex-shrink:0;}
.cc-toast-sub{display:block; font-weight:500; font-size:0.8rem; margin-top:3px; opacity:0.95;}
@keyframes toastIn{from{opacity:0; transform:translateX(-50%) translateY(-14px);} to{opacity:1; transform:translateX(-50%) translateY(0);}}
@keyframes toastOut{from{opacity:1;} to{opacity:0; transform:translateX(-50%) translateY(-14px);}}
/* ---- Filter pills (remplace le <select> natif pendant une session) ---- */
.filter-pills{
    display:flex; gap:6px; overflow-x:auto; margin-bottom:16px; padding-bottom:2px;
    scrollbar-width:none; -ms-overflow-style:none; position:relative;
  }
.filter-pills::-webkit-scrollbar{display:none;}
.filter-pill{
    flex-shrink:0; font-size:0.78rem; font-weight:700; color:var(--muted); background:var(--card);
    border:1.5px solid var(--line); padding:7px 14px; border-radius:100px; position:relative; z-index:1;
    cursor:pointer; font-family:var(--font-sans); white-space:nowrap;
    transition:transform 0.26s var(--spring), border-color 0.15s, color 0.15s;
  }
.filter-pill.active{color:var(--accent-deep); border-color:transparent;}
.filter-pills .pill-bubble{
    position:absolute; top:0; left:0; z-index:0; pointer-events:none;
    background:color-mix(in srgb, var(--pill-color, var(--accent)) 14%, transparent);
    border:1.5px solid var(--pill-color, var(--accent)); border-radius:100px;
    transition:transform 0.45s cubic-bezier(.34,1.56,.64,1), width 0.3s cubic-bezier(.34,1.56,.64,1);
  }
/* ---- Modal (edit card) ---- */
.modal-overlay{
    position:fixed; inset:0; background:rgba(20,17,10,0.5); display:flex; align-items:flex-end;
    justify-content:center; z-index:50; backdrop-filter:blur(2px);
  }
.modal-sheet{
    width:100%; max-width:600px; background:var(--paper); border-radius:20px 20px 0 0;
    padding:22px 18px 28px; max-height:85vh; overflow-y:auto;
    animation:sheetUp 0.34s var(--spring);
  }
.modal-title{font-family:var(--font-serif); font-weight:700; font-size:1.2rem; margin-bottom:16px;}
.modal-field{margin-bottom:14px;}
.modal-field label{display:block; font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); margin-bottom:6px;}
.modal-field textarea, .modal-field input, .modal-field select{
    width:100%; background:var(--card); border:1px solid var(--line); color:var(--ink);
    padding:11px 12px; border-radius:var(--radius-sm); font-size:0.9rem; font-family:var(--font-sans);
    resize:vertical; transition:border-color 0.15s, box-shadow 0.15s;
  }
.modal-field textarea:focus, .modal-field input:focus, .modal-field select:focus{
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft, rgba(199,106,69,0.14));
  }
.modal-actions{display:flex; gap:10px; margin-top:18px;}
.modal-actions button{
    flex:1; padding:13px; border-radius:var(--radius-sm); font-size:0.88rem; cursor:pointer;
    font-family:var(--font-sans); font-weight:700; border:none; transition:transform 0.26s var(--spring);
  }
.modal-save{background:var(--accent); color:#fff;}
.modal-cancel{background:var(--card); color:var(--ink); border:1px solid var(--line) !important;}
/* ---- Planning ---- */
.planning-matiere-icon-btn{
    background:none; border:none; color:var(--muted); cursor:pointer; padding:5px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; transition:color 0.15s, background 0.15s, transform 0.26s var(--spring);
  }
.planning-matiere-icon-btn svg{width:15px; height:15px; stroke:currentColor; transition:transform 0.2s var(--spring);}
.planning-matiere-icon-btn:hover{color:var(--accent-deep); background:var(--paper);}
.planning-matiere-icon-btn.danger:hover{color:var(--bad);}
/* ---- Widget "temps avant maîtrise" ---- */
.planning-date-chip{
    display:inline-flex; align-items:center; gap:4px; font-size:0.74rem; font-weight:600;
    color:var(--muted); background:var(--paper); border:1px solid var(--line); border-radius:100px;
    padding:4px 9px; flex-shrink:0; white-space:nowrap; cursor:pointer;
    transition:border-color 0.15s, color 0.15s, transform 0.26s var(--spring);
  }
.planning-date-chip svg{width:12px; height:12px; stroke:currentColor; flex-shrink:0;}
.planning-date-chip:hover{border-color:var(--accent); color:var(--accent-deep);}
/* --mc = couleur de la barre de marge (et du texte « marge N j ») : vert = large,
     ambre = juste (mêmes couleurs que .mastery-statut-warn), rouge = dépasse / trop tard. */
/* Case de taille FIXE : seule la couleur (par palier) indique la charge,
     pour qu'un jour très chargé n'écrase pas les autres. Le chiffre = total du jour. */
/* Barre de marge : sur la même grille que les cases (même colonnes, même défilement). */
.planning-details-summary{
    cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:space-between;
    margin:0; user-select:none; transition:opacity 0.15s;
  }
.planning-details-summary:active, .planning-details-summary.js-press{ opacity:0.6; transition:opacity 0.12s; }
.planning-details-summary::-webkit-details-marker{display:none;}
.planning-details-summary::after{
    content:"▸"; color:var(--muted); font-size:0.8rem; transition:transform 0.2s; margin-left:8px;
  }
/* ---- Grille "série" (modale ouverte via le pill flamme) ---- */
/* ---- Stats par matière (reprises dans Planning > Dates de contrôle) ---- */
/* ---- Carte matière dans Planning > Dates de contrôle : même corps que la
     carte Historique ci-dessus (nom + %, barre, répartition), avec en plus
     une puce de date et les petits boutons d'action en pied de carte. ---- */
.planning-matiere-clickable{cursor:pointer; transition:opacity 0.15s;}
.planning-matiere-clickable:active, .planning-matiere-clickable.js-press{opacity:0.6; transition:opacity 0.12s;}
/* ============================================================
     DESKTOP (≥900px) — couche d'adaptation visuelle uniquement.
     Aucune fonction de rendu JS n'est modifiée : le HTML produit par
     renderStudy()/renderBrowse()/renderPlanning()/etc. reste identique,
     seule sa disposition change au-dessus de ce point de bascule.
     Idée : la tabbar (en bas, flottante, sur mobile) devient une
     sidebar fixe à gauche ; le contenu (.wrap) prend le reste de la
     largeur et se recentre avec une largeur de lecture confortable.
     ============================================================ */
@media (min-width: 900px){/* Le contenu principal (.wrap) se centre tout seul dans toute la
       largeur de l'écran, sans tenir compte de la sidebar — donc pas de
       flex row ici, juste un centrage classique margin:auto. La sidebar
       est sortie du flux (position:fixed) et posée à part, en haut à
       gauche, sans influencer ce centrage. */
body{
      min-height:100vh; min-height:100dvh;
    }
/* Sidebar : même élément DOM que la tabbar mobile (#tabbar-root),
       sortie du flux et posée en haut à gauche au lieu d'une pilule
       flottante en bas. renderTabbar()/moveTabbarBubble() se basent sur
       les positions réelles (getBoundingClientRect), donc ce repositionnement
       ne casse pas la bulle active ni le JS. */
.tabbar{
      position:fixed;
      top:64px; left:24px; right:auto; bottom:auto;
      width:220px;
      height:auto;
      display:flex; justify-content:center;
      padding:0;
      pointer-events:auto;
    }
/* Sur mobile, .tabbar-hidden sert à masquer la barre pendant une
       session de révision ou une modale. Sur desktop la sidebar reste
       toujours visible : on neutralise ce masquage. */
.tabbar.tabbar-hidden{
      transform:none;
    }
.tabbar-inner{
      flex-direction:column; align-items:stretch;
      width:100%; max-width:none; height:auto;
      gap:4px; padding:12px;
      /* Le fond mobile est une pilule (border-radius:100px) pensée pour
         une barre flottante basse — en colonne ça donne une forme
         "stade" géante. On repasse à un rectangle arrondi classique de
         sidebar, dimensionné à son propre contenu (pas à 100vh). */
      border-radius:18px;
    }
.tabbar-item{
      /* Contrairement au mobile (flex:1, boutons étirés pour occuper
         toute la largeur de la barre), en colonne chaque bouton ne doit
         prendre que la hauteur de son contenu — sinon les boutons se
         partagent toute la hauteur du panneau et laissent un grand vide
         gris en dessous du dernier. */
      flex:0 0 auto;
      flex-direction:row; justify-content:flex-start; gap:11px;
      padding:12px 14px; border-radius:12px;
    }
/* Contenu principal : largeur de lecture confortable, centré tout
       seul dans toute la largeur de l'écran (indépendamment de la
       sidebar, qui est en position:fixed et hors du flux). */
.wrap{
      max-width:920px;
      margin:0 auto;
      padding:28px 36px 48px;
    }
/* Carte de révision (type Anki) : lisible sans s'étirer sur toute
       la largeur d'un grand écran. */
.anki-card{
      max-width:620px;
      margin-left:auto; margin-right:auto;
      width:100%;
    }
/* Sur mobile, .study-session-frame réserve délibérément
       "100vh - 190px" pour que la carte remplisse tout l'écran
       au-dessus de la tabbar fixée en bas (190px = topbar + tabbar
       mobile). Sur desktop, il n'y a plus de tabbar en bas et la
       fenêtre est généralement bien plus haute que 190px : garder ce
       calcul forçait la carte à s'étirer sur presque toute la hauteur
       de l'écran, ce qui ajoutait un grand vide en haut/en bas et
       obligeait à scroller. On repasse à une hauteur naturelle, basée
       sur le contenu réel (question/réponse + boutons), pas sur la
       hauteur de la fenêtre. */}
/* ============================================================
     THÈME « POP NUIT » (v44) — habillage uniquement.
     Posé en dernier pour l'emporter sur les styles d'origine : aucune
     logique, aucun id, aucune fonction n'a été renommé. Sombre en
     permanence (le prototype n'a pas de version claire).
     ============================================================ */
:root:root:root{
    --ink:#f5f0e6; --paper:#0c0c12; --card:#1a1a26; --line:#2a2a3a; --muted:#8d8aa3;
    --accent:#ff6b3d; --accent-deep:#b8431d; --accent-ink:#1a0d08;
    --good:#2ed8a3; --good-soft:#173a35; --bad:#ff4d7a; --bad-soft:#3a1a27;
    --bulle:#1a1a26; --bulle-ink:#f5f0e6;
    --green:#2ed8a3; --orange:#ff6b3d; --yellow:#ffd93d; --yellow-d:#a8891a; --orange-d:#b8431d; --amber:#ffb020;
    --panel:#1a1a26; --bg:#0c0c12; --cream:#f5f0e6; --pink:#ff4d7a; --blue:#6bc1ff; --purple:#b39bff;
    --font-serif:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
    --font-sans:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
    color-scheme:dark;
  }

/* ---- v132 : variables de thème (sombre = valeurs d'origine) + palette claire « crème » ---- */
:root:root:root{ --yellow-t:#ffd93d; --orange-t:#ff6b3d; --yellow-b:#ffd93d; --lg-d:#9c9588; --lg-b:#f5f0e6; --cs:dark; --tm:100%; --c-s1:#252533; --c-s2:#2b2b3b; --c-sheet:#141420; --c-edge:#08080d; --c-disbg:#26262f; --c-disink:#6d6a80; --c-dissh:#14141b; --c-ph:#6b6880; --c-dash:#4a4a60; --c-yicon:#3d3320; --c-ysa:#2a2613; --c-ysb:#27230f; --c-ysc:#2f2a14; --c-ysd:#2a2410; --c-yse:#1d1a0b; --c-ysh:#14120a; --c-aborder:#6b5416; --c-abg:#3a2f18; --c-pborder:#7a2a40; --c-pbg:#3a1a24; --c-pbg2:#3a1a27; --c-dayb:#7a3a2b; --c-osoft:#2a1a17; --c-gsoft:#173a35; --c-bsoft:#17293a; --c-bq:#211f2e; --c-press:#20202f; --c-press2:#1f1f2d; --c-rowgrad:#201c2c; --c-pgrad1:#271b1f; --c-pgrad2:#261b20; --c-ta:#12121b; --c-h1:#5a3a1c; --c-h2:#a8601f; --c-scroll:#3a3a4e; --c-toastsh:#a39a85; --c-mixd:#111; --ov:255,255,255; --yr:255,217,61; --cr:245,240,230; --bgr:12,12,18; }
:root:root:root[data-theme="light"]{
  /* v157 : « Pop jour » — papier blanc légèrement lavande, encre indigo, accents vifs (orange, jaune, violet, bleu, menthe, rose). */
  --ink:#1d1b3a; --paper:#f1f0fb; --card:#ffffff; --line:#dcd9f0; --muted:#66638a;
  --accent:#ff6b3d; --accent-deep:#c2410c; --accent-ink:#1a0d08;
  --good:#0f9d6e; --good-soft:#d3f5e6; --bad:#e8387a; --bad-soft:#ffe1ec;
  --bulle:#ffffff; --bulle-ink:#1d1b3a;
  --green:#0f9d6e; --orange:#ff6b3d; --yellow:#ffd93d; --yellow-d:#b88a00; --orange-d:#c2410c; --amber:#e08a00;
  --panel:#ffffff; --bg:#f1f0fb; --cream:#1d1b3a; --pink:#e8387a; --blue:#2f7cf0; --purple:#7a5af8;
  --yellow-t:#b45309; --orange-t:#d4451a; --yellow-b:#f0b400;
  --lg-d:#1d1b3a; --lg-b:#2f2d5c; --cs:light; color-scheme:light; --tm:50%;
  --c-s1:#ebe9fa;
  --c-s2:#e2dff6;
  --c-sheet:#ffffff;
  --c-edge:#b9b3e8;
  --c-disbg:#e6e4f3;
  --c-disink:#9794b8;
  --c-dissh:#d3d0ea;
  --c-ph:#9794b8;
  --c-dash:#bbb7e0;
  --c-yicon:#ffe9a0;
  --c-ysa:#fff3bf;
  --c-ysb:#fff1b5;
  --c-ysc:#ffeda0;
  --c-ysd:#fff0b0;
  --c-yse:#fff6cf;
  --c-ysh:#e8d278;
  --c-aborder:#f0c63c;
  --c-abg:#fff0c4;
  --c-pborder:#f2a0c0;
  --c-pbg:#ffe3ee;
  --c-pbg2:#ffdfeb;
  --c-dayb:#ffc9b3;
  --c-osoft:#ffe6db;
  --c-gsoft:#d3f5e6;
  --c-bsoft:#dbe9ff;
  --c-bq:#ebe8fb;
  --c-press:#e9e6fa;
  --c-press2:#e9e6fa;
  --c-rowgrad:#f7f5ff;
  --c-pgrad1:#ffe9df;
  --c-pgrad2:#ece6ff;
  --c-ta:#ffffff;
  --c-h1:#ffcf8f;
  --c-h2:#ff8a3d;
  --c-scroll:#c5c0e8;
  --c-toastsh:#14122b;
  --c-mixd:#3b3a5e;
  --ov:70,55,150;
  --yr:240,170,0;
  --cr:29,27,58;
  --bgr:241,240,251;
}
:root:root:root[data-theme="light"] #vie-ambiance{ mix-blend-mode:multiply }
:root:root:root[data-theme="light"] :where(.cc-toast,.pp-toast){ color:#f1f0fb }
:root:root:root[data-theme="light"] :where(#pp-zoom .pz-x,#pp-zoom .pz-tip){ color:#f5f0e6 }
html{ background:var(--bg); }
body{
    background:
      linear-gradient(var(--bg), rgba(var(--bgr),0) 130px),
      radial-gradient(circle at 90% 0%, rgba(255,107,61,.16), transparent 45%),
      radial-gradient(circle, rgba(var(--ov),.07) 1px, transparent 1.2px) 0 0/16px 16px,
      var(--bg) !important;
    background-attachment:fixed !important;
    font-size:15px;
  }
h1,h2,h3{ letter-spacing:-.03em; }
.modal-title{ font-family:var(--font-sans) !important; }
/* ---- Topbar ---- */
.topbar{ padding:6px 2px 8px 2px; margin-bottom:10px; }
.streak{ background:var(--panel); border:1.5px solid var(--line); box-shadow:none; padding:6px 11px; font-size:14px; }
.streak svg{ stroke:var(--yellow-t); color:var(--yellow-t); transform-origin:50% 90%; animation:popFlame 1.6s ease-in-out infinite; }
.streak.is-zero svg{ animation:none; stroke:var(--muted); color:var(--muted); }
@keyframes popFlame{ 0%,100%{ transform:scale(1) rotate(-3deg) } 50%{ transform:scale(1.14,1.2) rotate(3deg) } }
.topbar-icon-btn{ width:34px; height:34px; background:var(--panel); border:1.5px solid var(--line); box-shadow:none; color:var(--muted); }
/* ---- Barre du bas : boutons en relief, l'actif en jaune ---- */
.tabbar{ padding:0; }
.tabbar-inner{
    max-width:none; border-radius:0; background:var(--bg); border:0; border-top:1.5px solid var(--line);
    padding:12px 8px calc(8px + env(safe-area-inset-bottom)); box-shadow:none; gap:0;
  }
.tabbar-item{ height:52px; padding:0; margin:0 3px; border-radius:16px; gap:3px; color:var(--muted); }
.tabbar-item.active{ color:#1a1405; }
.wrap{ padding-bottom:calc(104px + env(safe-area-inset-bottom)); }
/* ---- Boutons principaux (.home-cta = « cta » du prototype) ---- */
.home-cta{
    width:100%; height:54px; border:0; border-radius:17px; background:var(--accent); color:var(--accent-ink);
    font-family:var(--font-sans); font-size:18px; font-weight:800; letter-spacing:-.02em;
    box-shadow:0 4px 0 var(--accent-deep); display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .3s var(--spring), box-shadow .25s; cursor:pointer;
  }
.home-cta:not(:disabled):hover{ filter:none; }
.home-cta:active, .home-cta.js-press{ transform:translateY(3px); box-shadow:0 1px 0 var(--accent-deep); transition-duration:.07s; }
.home-cta:disabled{ background:var(--c-disbg); color:var(--c-disink); box-shadow:0 4px 0 var(--c-dissh); opacity:1; cursor:default; }
/* ---- Accueil : grosse carte « héros » ---- */
.home-screen{ justify-content:flex-start; padding:4px 0 0; gap:14px; min-height:calc(100dvh - 196px - env(safe-area-inset-bottom)); }
.home-status{ display:flex; flex-direction:column; align-items:flex-start; text-align:left; padding:0; margin:0; }
.home-secondary-sep{ display:none; }
.home-secondary{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.home-secondary > .home-progress{ grid-column:1 / -1; }
.home-secondary > .home-row{ flex-direction:column; align-items:flex-start; gap:8px; padding:10px 12px; border-radius:15px; text-align:left; }
/* lignes « Réviser tout » / « S'entraîner » en deux tuiles */
.home-row{
    background:var(--panel); border:1.5px solid var(--line); border-radius:17px; box-shadow:none;
    padding:13px; gap:12px; font-family:var(--font-sans);
  }
.home-progress{ background:var(--panel); border:1.5px solid var(--line); border-radius:15px; box-shadow:none; }
.home-progress-stat-icon{ background:var(--c-yicon); color:var(--yellow-t); border-radius:8px; }
.home-progress-stat-icon.is-streak, :root[data-theme="dark"] .home-progress-stat-icon.is-streak{ background:var(--c-yicon); color:var(--yellow-t); }
.home-progress-stat-icon svg{ stroke:currentColor; }
.home-progress-stat-num{ color:var(--cream); font-weight:800; }
.home-progress-stat-label{ color:var(--muted); }
.home-progress-divider{ background:var(--line); }
.home-progress-bar{ background:var(--c-s2); border-radius:5px; }
.home-progress-bar.has-activity{ background:var(--amber); }
.home-progress-bar.is-today.has-activity{ background:var(--accent); }
.home-progress-bar-day{ color:var(--muted); }
.home-progress-bar-day.is-today{ color:var(--cream); font-weight:800; }
/* bandeau contrôle (planning-strip) = « ctl » jaune du prototype */
.planning-strip{
    background:var(--c-ysb); border:1.5px solid color-mix(in srgb, var(--yellow) 45%, transparent); border-radius:19px;
    box-shadow:0 4px 0 var(--c-ysh); color:var(--cream);
  }
.planning-strip-icon{ width:40px; height:40px; border-radius:13px; background:var(--yellow); color:#1a1405; box-shadow:0 3px 0 var(--yellow-d); }
.planning-strip-icon svg{ stroke:#1a1405; }
.planning-strip-text b{ color:var(--cream); }
.planning-strip-arrow{ color:var(--yellow-t); }
.planning-strip:active, .planning-strip.js-press{ transform:translateY(2px); box-shadow:none; }
/* ---- Session de révision : plein écran, carte « Pop » ---- */
body.in-session .topbar{ display:none; }
body.in-session .wrap{ padding-top:calc(env(safe-area-inset-top) + 14px); padding-bottom:calc(14px + env(safe-area-inset-bottom)); }
.study-mood-bar{ height:8px; border-radius:5px; background:var(--c-s1); margin-bottom:16px; }
.undo-pill{
    align-self:center; height:32px; padding:0 13px; margin:-2px 0 10px; border-radius:99px; background:var(--panel);
    border:1.5px solid var(--line); color:var(--muted); font-weight:700; font-size:12.5px;
  }
.undo-pill:hover{ color:var(--muted); }
.anki-card{
    background:var(--panel); border:2px solid var(--cream); border-radius:24px; box-shadow:9px 9px 0 var(--accent);
    min-height:380px; transition:border-color .2s;
  }
.anki-card::before{ display:none; }
.anki-card-body{ padding:0 18px; text-align:left; }
.show-answer-btn{
    height:54px; border-radius:16px; background:var(--accent); color:var(--accent-ink); font-size:17px; font-weight:800;
    box-shadow:0 4px 0 var(--accent-deep); transition:transform .3s var(--spring), box-shadow .25s;
  }
.show-answer-btn:active, .show-answer-btn.js-press{ transform:translateY(3px); box-shadow:0 1px 0 var(--accent-deep); filter:none; }
.study-actions{ gap:9px; }

/* v122 : visionneuse d'image (agrandir au toucher) + images dans les synthèses */

#pp-zoom .pz-img{display:block;max-width:calc(100% - 24px);max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));object-fit:contain;border-radius:24px;will-change:transform;touch-action:none;-webkit-user-drag:none;box-shadow:0 18px 60px rgba(0,0,0,.55);background:#fff;cursor:zoom-in}
#pp-zoom .pz-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:46px;height:46px;padding:0;border-radius:50%;border:1.5px solid var(--line);background:rgba(20,20,32,.85);color:var(--cream);display:grid;place-items:center;opacity:0;transition:opacity .25s,transform .15s;cursor:pointer}
#pp-zoom .pz-x:active{transform:scale(.92)}
#pp-zoom .pz-tip{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);max-width:92%;padding:8px 14px;border-radius:999px;background:rgba(20,20,32,.88);border:1.5px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:700;text-align:center;opacity:0;transition:opacity .35s;pointer-events:none}

.pp-imgpanel{margin:0 0 12px;padding:10px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel)}

.pp-imgbank{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pp-imgbank img{width:58px;height:58px;flex:none;border-radius:18px;object-fit:cover;border:2px solid transparent;cursor:pointer}

.pp-imgacts{display:flex;gap:8px;margin-top:8px}
.pp-imgbtn{min-height:36px;padding:0 13px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--cream);font-family:var(--font-sans);font-weight:700;font-size:12.5px;cursor:pointer}
.pp-card,.pp-card *{touch-action:none;-webkit-user-select:none;user-select:none}

.pp-at.pp-l{font-size:24px}

.pp-bar1{flex:1;height:8px;border-radius:5px;background:var(--c-s1);overflow:hidden;position:relative}
.pp-bar1 i{display:block;width:100%;height:100%;border-radius:5px;transition:background-color .5s cubic-bezier(.22,.9,.3,1)}
.pp-bar1 u{position:absolute;inset:0;border-radius:inherit;opacity:0;pointer-events:none;background:radial-gradient(ellipse 55% 160% at 50% 50%,var(--dc,transparent) 0%,transparent 72%);transform:scale(.4,1);text-decoration:none}
.pp-bar1 u.on{animation:ppmoodDrop 3.6s cubic-bezier(.33,1,.68,1) both}
@keyframes ppmoodDrop{0%{opacity:0;transform:scale(.4,1)}12%{opacity:.4;transform:scale(.85,1)}30%{opacity:.3;transform:scale(1,1)}100%{opacity:0;transform:scale(1.3,1)}}
.pp-mb{display:flex;align-items:center;gap:12px;flex:none;margin-top:6px;padding:9px 16px 9px 9px;background:var(--panel);border:2px solid var(--line);border-radius:22px;box-shadow:0 4px 0 var(--c-edge);animation:pppop .4s var(--pps) both}

.pp-info{display:flex;align-items:center;gap:8px;margin:-6px 0 12px;font-size:13px;font-weight:600;color:var(--muted)}
.pp-mp{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--yellow-t);background:var(--c-ysc);border-radius:7px;padding:3px 8px}
.pp-undo{align-self:center;display:flex;align-items:center;gap:6px;height:32px;padding:0 13px;margin:-2px 0 10px;border-radius:99px;background:var(--panel);border:1.5px solid var(--line);color:var(--muted);font-weight:700;font-size:12.5px;animation:pppop .35s var(--pps) both}
/* v130 : la pastille du geste est un carré arrondi (plus un rond) : fond très léger qui se remplit un peu quand on glisse plus loin (--f, posé par le JS), bordure pleine bien présente, icône dans la couleur pleine */
.pp-pastille{position:absolute;left:50%;top:12px;width:44px;height:44px;margin-left:-22px;border-radius:13px;display:grid;place-items:center;background:transparent;border:2.5px solid var(--pc);color:color-mix(in srgb,var(--pc) var(--tm),var(--ink));opacity:0;transform:scale(.4);transition:opacity .2s var(--pps),transform .3s var(--spring);pointer-events:none;z-index:3;box-sizing:border-box;overflow:hidden;isolation:isolate}
.pp-pastille::before{content:"";position:absolute;inset:0;background:var(--pc);opacity:var(--f,.12);transition:opacity .12s linear;z-index:-1}
.pp-pastille svg{width:22px;height:22px;stroke:currentColor;position:relative}
.pp-pastille.on{opacity:1;transform:scale(1)}
.pp-card.armed{border-color:var(--pc)}
.pp-done{margin:auto;text-align:center;width:100%;position:relative}
.pp-done h2{font-size:34px;margin-bottom:8px;animation:ppslam .5s var(--pps) both}
