/* Capture le HTML source du fichier tel que chargé, AVANT que le rendu
   ne touche le DOM — sert de base pour exportAll() sans dépendre d'un
   fetch réseau (qui échoue en file://). */
let SOURCE_HTML = null;
function captureSourceHtml(){
  SOURCE_HTML = document.documentElement.outerHTML;
}

/* v173 : remplace le littéral (tableau ou objet JSON) qui suit « const NOM = » en lisant le texte caractère par
   caractère, chaînes entre guillemets comprises. Avant, une regex non gourmande s'arrêtait au premier « ]; » ou « }; » :
   une carte contenant ce motif (code, formule) cassait le fichier exporté. */
function ppRemplacerBloc(html, nom, json){
  const amorce = 'const ' + nom + ' = ';
  const debut = html.indexOf(amorce);
  if(debut < 0) return null;
  const ouvre = debut + amorce.length, o = html[ouvre], f = o === '[' ? ']' : o === '{' ? '}' : null;
  if(!f) return null;
  let prof = 0, chaine = false, i = ouvre;
  for(; i < html.length; i++){
    const c = html[i];
    if(chaine){ if(c === '\\') i++; else if(c === '"') chaine = false; continue; }
    if(c === '"') chaine = true;
    else if(c === o) prof++;
    else if(c === f){ prof--; if(prof === 0) break; }
  }
  if(prof !== 0) return null;
  return html.slice(0, ouvre) + json + html.slice(i + 1);
}

/* Exporter l'app à jour : le fichier contient l'app + TOUT ce qui se voit dans l'app (cartes avec leurs paliers et
   dates, matières, dates de contrôle, archives, planning, série, statistiques, séances, modèles de synthèse, réglages).
   Les cartes, matières et planning remplacent les blocs de départ ; le reste part dans SEED_STOCKAGE (voir le <head>).
   Jamais dedans : clé Gemini et code de synchro (ce fichier peut être partagé). */
function exportAll(){
  if(!SOURCE_HTML){ alert('Impossible d\'exporter : source non capturée.'); return; }
  const json = v => JSON.stringify(v, null, 2).replace(/</g, '\\u003c');
  const donnees = {};
  CLES_STOCKAGE_SEED.forEach(k => { try{ const v = localStorage.getItem(k); if(v !== null) donnees[k] = v; }catch(e){} });
  let html = SOURCE_HTML;
  const blocs = [['SEED_CARDS', CARDS], ['MATIERES_CONFIG', matieresConfig], ['PLANNING', planning], ['SEED_STOCKAGE', { id: new Date().toISOString(), donnees }]];
  for(const [nom, valeur] of blocs){
    const suite = ppRemplacerBloc(html, nom, json(valeur));
    if(suite === null){ alert('Impossible d\'exporter : le fichier source n\'a pas la forme attendue (' + nom + ').'); return; }
    html = suite;
  }
  const blob = new Blob([html], { type: 'text/html' });
  telechargerBlob(blob, 'memoria.html');
}

/* Service worker séparé (./sw.js) : gère le cache basique et les
   notifications de rappel de révision (voir sw.js pour le détail). */
/* Enregistre le service worker et force la prise en compte immédiate
   d'une nouvelle version déployée : sans ça, un téléphone peut continuer
   à faire tourner l'ancien service worker (et donc l'ancien code) pendant
   longtemps même après un redéploiement, car le navigateur ne vérifie
   pas systématiquement s'il y a une mise à jour. */
function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('./sw.js').then((reg) => {
    // Vérifie s'il existe une version plus récente sur le serveur (le
    // navigateur ne le fait pas toujours spontanément) — mais on ne force
    // JAMAIS un rechargement automatique de la page suite à ça : en PWA
    // installée (mode standalone), un window.location.reload() déclenché
    // en plein milieu de l'usage a été identifié comme cause probable d'un
    // bug où l'app se figeait (plus aucun clic possible) quelques secondes
    // après l'ouverture. Le nouveau service worker prend simplement le
    // relais en douceur (skipWaiting + clients.claim côté sw.js) et sera
    // utilisé sans interruption dès la PROCHAINE ouverture normale de
    // l'app, jamais en la coupant en cours d'utilisation.
    reg.update().catch(() => {});
  }).catch(() => {});
}

/* ---------------- Rappel de révision (notifications locales) ----------------
   Principe : pas de serveur, tout se calcule et se déclenche depuis
   l'appareil. Deux mécanismes complémentaires :
   1. Periodic Background Sync (si le navigateur/l'installation le permet) :
      le navigateur réveille le service worker à intervalle régulier même
      app fermée. Peu fiable selon l'appareil/l'OS, mais gratuit quand ça
      marche.
   2. Vérification à chaque ouverture de l'app : si on n'a pas encore
      notifié aujourd'hui et qu'il y a des cartes dues, on notifie tout
      de suite (couvre le cas où on ouvre l'app dans la journée sans
      jamais l'avoir refermée avant).
   Rien de tout cela ne nécessite de serveur ni de clé API. */

const RAPPEL_HEURE_DEFAUT = '18:00';
const RAPPEL_RELANCE_DELAI_MS = 2 * 60 * 60 * 1000; // relance 2h après la 1ère notif

function compterCartesDuesAujourdhui(){
  // Même définition que le chiffre de l'accueil et que la session « Réviser » :
  // cartes dues (maîtrisées comprises) des matières non archivées. Avant, le rappel
  // écartait les maîtrisées et annonçait moins de cartes que l'accueil n'en affichait.
  const today = todayStr();
  const actives = getMatieresActives();
  return CARDS.filter(c => (c.prochaineRevision || today) <= today && actives.includes(c.matiere || 'Sans matière')).length;
}

function rappelHeurePreferee(){
  try{ return localStorage.getItem('rappel-heure-preferee') || RAPPEL_HEURE_DEFAUT; }catch(e){ return RAPPEL_HEURE_DEFAUT; }
}

/* true si l'heure locale actuelle a atteint l'heure choisie par l'utilisateur */
function heureRappelAtteinte(){
  const pref = rappelHeurePreferee();
  const m = /^(\d{2}):(\d{2})$/.exec(pref);
  if(!m) return true;
  const now = new Date();
  const seuil = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(m[1], 10), parseInt(m[2], 10), 0, 0);
  return now >= seuil;
}

async function demanderPermissionNotifications(){
  if(!('Notification' in window)) return false;
  // On ne fait plus confiance à la valeur mise en cache par le navigateur
  // pour 'granted' : si la permission a été retirée depuis les réglages
  // Android pendant que l'app restait ouverte, Notification.permission
  // peut rester bloqué sur l'ancienne valeur tant qu'on ne redemande pas
  // activement. requestPermission() force une vraie vérification auprès
  // du système à chaque appel.
  if(Notification.permission === 'denied') return false;
  const res = await Notification.requestPermission();
  return res === 'granted';
}

/* navigator.serviceWorker.ready ne se résout jamais si le service worker n'a pas pu
   s'enregistrer (navigation privée, hors-ligne au 1er lancement…) : on n'attend donc
   que quelques secondes, sinon le bouton du rappel restait figé sans rien dire. */
function serviceWorkerPret(delaiMs){
  return Promise.race([
    navigator.serviceWorker.ready,
    new Promise((_, rejet) => setTimeout(() => rejet(new Error('service worker indisponible')), delaiMs || 4000))
  ]);
}

async function activerRappelQuotidien(){
  const ok = await demanderPermissionNotifications();
  if(!ok) return false;
  try{ localStorage.setItem('rappel-notifs-actif', '1'); }catch(e){}
  // Tente d'enregistrer un Periodic Background Sync si disponible
  // (Chrome/Android, PWA installée depuis un moment déjà) : purement
  // additif, ignoré silencieusement si non supporté.
  try{
    const reg = await serviceWorkerPret();
    if('periodicSync' in reg){
      const status = await navigator.permissions.query({ name: 'periodic-background-sync' });
      if(status.state === 'granted'){
        await reg.periodicSync.register('revision-check', { minInterval: 20 * 60 * 60 * 1000 });
      }
    }
  }catch(e){}
  verifierEtNotifierSiNecessaire();
  return true;
}

/* Le bouton d'ouverture automatique des réglages de notification a été
   retiré : sur ce téléphone, les intents Android depuis une TWA n'ouvrent
   rien (limitation constructeur/version Android). Le message manuel
   ci-dessus (Réglages → Apps → Memoria → Notifications) reste le seul
   chemin fiable. */

function desactiverRappelQuotidien(){
  try{ localStorage.setItem('rappel-notifs-actif', '0'); }catch(e){}
}

function rappelEstActif(){
  /* v165 : iPhone / iPad / Safari Mac — pas de rappel en arrière-plan : le bloc « Rappels » est masqué dans Réglages et plus aucun rappel n'est envoyé (même un ancien réglage activé). */
  try{ if(ppEstApple()) return false; }catch(e){}
  try{ return localStorage.getItem('rappel-notifs-actif') === '1'; }catch(e){ return false; }
}

/* Logique du jour : à quelle étape en est-on pour aujourd'hui.
   'aucune'  -> pas encore notifié aujourd'hui
   'premiere'-> notif du jour déjà envoyée, relance pas encore due
   'relance' -> relance déjà envoyée aujourd'hui, plus rien à faire */
function etatRappelDuJour(today){
  let brut = null;
  try{ brut = localStorage.getItem('rappel-etat-jour'); }catch(e){ return null; }
  if(!brut) return null;
  try{
    const obj = JSON.parse(brut);
    if(obj && obj.jour === today) return obj;
  }catch(e){}
  return null;
}

function sauverEtatRappelDuJour(today, etape, tsPremiere){
  try{
    localStorage.setItem('rappel-etat-jour', JSON.stringify({ jour: today, etape, tsPremiere: tsPremiere || null }));
  }catch(e){}
}

async function envoyerNotifRappel(count, type){
  try{
    const reg = await serviceWorkerPret();
    if(!reg.active) return false;
    reg.active.postMessage({ type: type === 'relance' ? 'SHOW_REMINDER_RELANCE' : 'SHOW_REMINDER', count, lang: (typeof langueChoisie === 'function' ? langueChoisie() : 'fr') });
    return true;
  }catch(e){ return false; }
}

/* Vérifie l'état du jour et envoie, si besoin, la notification initiale
   (à partir de l'heure choisie) ou la relance (2h après, si toujours des
   cartes dues). Rien n'est envoyé s'il n'y a pas de carte due : on
   recalcule le compte à chaque appel, donc une session de révision entre
   temps annule la relance automatiquement. */
async function verifierEtNotifierSiNecessaire(){
  if(!rappelEstActif()) return;
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  if(!heureRappelAtteinte()) return;

  const today = todayStr();
  const count = compterCartesDuesAujourdhui();
  if(count <= 0) return; // déjà à jour : pas de notif, et une relance en attente n'a plus lieu d'être

  const etat = etatRappelDuJour(today);

  if(!etat){
    const ok = await envoyerNotifRappel(count, 'premiere');
    if(ok) sauverEtatRappelDuJour(today, 'premiere', Date.now());
    return;
  }

  if(etat.etape === 'premiere' && ppRelanceActive()){
    const dejaEcoule = Date.now() - (etat.tsPremiere || 0);
    if(dejaEcoule >= RAPPEL_RELANCE_DELAI_MS){
      const ok = await envoyerNotifRappel(count, 'relance');
      if(ok) sauverEtatRappelDuJour(today, 'relance', etat.tsPremiere);
    }
  }
  // etape === 'relance' : rien de plus à faire aujourd'hui
}

/* ---------------- Synchro cross-device (Cloudflare Worker + KV) ----------------
   Principe : pas de sync en temps réel. On récupère la dernière version au
   démarrage de l'app, et on envoie l'état actuel quand l'app passe en
   arrière-plan ou se ferme. Identifié par un "code perso" choisi par
   l'utilisateur, stocké en local et à saisir sur chaque appareil.
   Si SYNC_WORKER_URL n'est pas configurée, tout ce module reste inactif
   silencieusement (aucune erreur visible pour l'utilisateur). */

// À remplacer par l'URL réelle du Worker une fois déployé, ex :
// 'https://flashcard-sync.tonpseudo.workers.dev'
// Ancien Worker (lingering-grass-bafa) supprimé/recréé à un moment donné,
// l'URL codée en dur n'avait pas suivi — d'où "Failed to fetch" en
// permanence sur tous les appareils, alors que le nouveau Worker
// (flashcard-sync-kv) répondait correctement quand on le testait directement.
const SYNC_WORKER_URL = 'https://flashcard-sync-kv.cmpsloic.workers.dev';

let syncEtat = { enCours:false, derniereSynchro:null, derniereErreur:null, codeRefuse:false };

function syncCodePerso(){
  try{ return localStorage.getItem('sync-code-perso') || ''; }catch(e){ return ''; }
}
function syncSetCodePerso(code){
  return ppEcrire('sync-code-perso', code); // v153 (constat 46) : renvoie false si le stockage est plein
}

/* Règles du code perso. Il protège aussi la clé Gemini qui voyage avec la synchro :
   trop court ou trop simple = n'importe qui peut le deviner et lire tes données. */
const SYNC_CODE_LONGUEUR_MIN = 10;
const SYNC_CODE_LONGUEUR_MAX = 100; // même limite que le Worker (cleanCode)
const SYNC_CODE_CARACTERES = /^[A-Za-z0-9_-]+$/; // même règle que le Worker : tout autre caractère = HTTP 400
const SYNC_CODE_LONGUEUR_LIBRE = 16; // à partir de là, pas besoin de mélanger les types de caractères
const SYNC_CODE_MOTS_FAIBLES = ['password','motdepasse','azerty','qwerty','123456','654321','abcdef','flashcard','memoria','iloveyou','bonjour','soleil','admin','welcome','letmein','000000','111111','revision','football','doudou','chocolat'];

function verifierSoliditeCode(code){
  code = String(code || '');
  if(!SYNC_CODE_CARACTERES.test(code)){
    // Le Worker n'accepte que lettres sans accent, chiffres, - et _ : on le dit avant d'envoyer.
    const refuses = [...new Set(code.replace(/[A-Za-z0-9_-]/g, '').split(''))].map(c => c === ' ' ? 'espace' : c).slice(0, 6);
    return 'Caractères refusés' + (refuses.length ? ' (' + refuses.join(' ') + ')' : '') + ' : uniquement lettres sans accent, chiffres, tiret - et tiret bas _.';
  }
  if(code.length > SYNC_CODE_LONGUEUR_MAX) return `Trop long : ${SYNC_CODE_LONGUEUR_MAX} caractères maximum.`;
  if(code.length < SYNC_CODE_LONGUEUR_MIN) return `Trop court : ${SYNC_CODE_LONGUEUR_MIN} caractères minimum.`;
  const norm = code.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  if(SYNC_CODE_MOTS_FAIBLES.some(w => norm.includes(w))) return 'Trop facile à deviner (mot courant ou suite classique). Choisis-en un autre.';
  if(new Set(norm).size < 6) return 'Trop répétitif : utilise plus de caractères différents.';
  if(/^(.{1,4})\1+$/.test(norm)) return 'Trop répétitif : évite de répéter la même séquence.';
  // Suite de 5 caractères qui montent ou descendent d'un cran (abcde, 12345, 98765…)
  let montee = 1, descente = 1;
  for(let i = 1; i < norm.length; i++){
    const d = norm.charCodeAt(i) - norm.charCodeAt(i - 1);
    montee = d === 1 ? montee + 1 : 1;
    descente = d === -1 ? descente + 1 : 1;
    if(montee >= 5 || descente >= 5) return 'Évite les suites de lettres ou de chiffres (abcde, 12345…).';
  }
  if(code.length < SYNC_CODE_LONGUEUR_LIBRE){
    const types = [/[a-z]/, /[A-Z]/, /[0-9]/, /[_-]/].filter(re => re.test(code)).length;
    if(types < 3) return `Mélange au moins 3 types : minuscules, majuscules, chiffres, tiret - ou _ (ou ${SYNC_CODE_LONGUEUR_LIBRE} caractères et plus).`;
  }
  return null;
}

function syncActif(){
  const code = syncCodePerso();
  return !!(SYNC_WORKER_URL && code && !verifierSoliditeCode(code));
}

/* Économie d'écritures KV (plan gratuit Cloudflare : 1 000 écritures/jour) :
   - on n'envoie que si les données ont changé depuis le dernier envoi réussi ;
   - au moins 2 min entre deux envois normaux (v152 ; avant : 30 s), et 5 min une fois le « budget » du jour
     dépassé (voir plus bas) ; un envoi de rattrapage est programmé si une modif arrive entre-temps ;
   - { urgent:true } (app qui se ferme / passe en arrière-plan) ignore le délai
     mais respecte quand même le test « rien n'a changé » ;
   - { force:true } (bouton Enregistrer le code) envoie toujours. */
const SYNC_INTERVALLE_MIN = 120000;
/* v152 : « budget » de sécurité. Chaque envoi réussi est compté sur l'appareil, par jour UTC (le compteur Cloudflare
   repart à minuit UTC), dans la clé locale `sync-budget-jour` (ni exportée ni synchronisée). Au-delà de 40 envois dans la
   journée, les envois normaux sont espacés de 5 min au lieu de 2. Un usage normal n'y arrive jamais : seul un cas anormal
   (boucle, bug) est freiné. Jamais touchés : { force:true } (bouton Enregistrer) et { urgent:true } (fermeture, arrière-plan). */
const SYNC_BUDGET_JOUR = 40;
const SYNC_INTERVALLE_BUDGET = 300000;
function syncJourUtc(){ return new Date().toISOString().slice(0, 10); }
function syncBudgetLire(){
  try{
    const o = JSON.parse(localStorage.getItem('sync-budget-jour') || 'null');
    if(o && typeof o === 'object' && o.j === syncJourUtc() && Number.isFinite(o.n) && o.n >= 0) return o.n;
  }catch(e){}
  return 0;
}
function syncBudgetCompter(){
  try{ localStorage.setItem('sync-budget-jour', JSON.stringify({ j: syncJourUtc(), n: syncBudgetLire() + 1 })); }catch(e){}
}
function syncIntervalleActuel(){ return syncBudgetLire() >= SYNC_BUDGET_JOUR ? SYNC_INTERVALLE_BUDGET : SYNC_INTERVALLE_MIN; }
/* v131 : l'empreinte du dernier envoi réussi est gardée sur l'appareil (clé locale `sync-dernier-hash`, ni exportée ni
   synchronisée) : rouvrir l'app sans rien changer n'écrit plus rien. La date d'export (`exporteLe`) n'entre pas dans
   l'empreinte (sinon chaque nouveau jour déclencherait un envoi sans vraie modification). */
function syncLireHashPersiste(){ try{ return localStorage.getItem('sync-dernier-hash') || null; }catch(e){ return null; } }
let syncDernierHash = syncLireHashPersiste();
function syncPoserHash(h){
  syncDernierHash = h;
  try{ localStorage.setItem('sync-dernier-hash', h); }catch(e){}
}
function syncEmpreinte(texte){
  return syncCodePerso() + '|' + syncHashTexte(String(texte).replace(/"exporteLe":"[^"]*",?/, ''));
}
/* Après une récupération : si notre état est identique à celui du serveur, il n'y a rien à renvoyer. */
function syncMarquerSiIdentique(texteDistant){
  try{
    const local = JSON.stringify(construireDonneesProgression({ pourSync: true }));
    const e = syncEmpreinte(local);
    if(e === syncEmpreinte(texteDistant)) syncPoserHash(e);
  }catch(e){}
}

/* v131 : limite d'écritures du jour atteinte (le Worker répond HTTP 429 avec quota:'ecriture'). On arrête d'envoyer
   jusqu'à minuit UTC (le compteur Cloudflare repart à zéro à ce moment-là), on le dit dans Réglages et on le garde
   en mémoire (clé locale `sync-pause-jusqua`) pour ne pas réessayer à chaque ouverture. */
let syncPauseJusqua = 0; // minuit UTC concerné, en ms
try{ syncPauseJusqua = parseInt(localStorage.getItem('sync-pause-jusqua') || '0', 10) || 0; }catch(e){}
function syncPauseActive(){
  if(!syncPauseJusqua) return false;
  if(Date.now() >= syncPauseJusqua + 60000){
    syncPauseJusqua = 0;
    try{ localStorage.removeItem('sync-pause-jusqua'); }catch(e){}
    return false;
  }
  return true;
}
function syncHeureLocale(ts){
  const d = new Date(ts), m = d.getMinutes();
  return d.getHours() + ' h' + (m ? ' ' + String(m).padStart(2, '0') : '');
}
function syncMessagePause(){
  return 'Sauvegarde en pause : limite du jour atteinte, reprise vers ' + syncHeureLocale(syncPauseJusqua);
}
function syncMettreEnPause(){
  const n = new Date();
  const dejaEnPause = syncPauseActive();
  syncPauseJusqua = Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate() + 1, 0, 0, 0);
  try{ localStorage.setItem('sync-pause-jusqua', String(syncPauseJusqua)); }catch(e){}
  clearTimeout(syncTardifTimer);
  setTimeout(() => { envoyerVersSync(); }, Math.max(5000, syncPauseJusqua + 90000 - Date.now()));
  if(!dejaEnPause){
    try{ ppToast('Sauvegarde en pause jusqu\'à ' + syncHeureLocale(syncPauseJusqua)); }catch(e){}
  }
}
let syncDernierEnvoiTs = 0;
let syncEnvoiEnCours = false;
let syncEnCoursEmpreinte = null;
let syncTardifTimer = null;

/* Motif d'échec lisible : « Failed to fetch » ou « Unexpected token » ne parlent à personne. */
function syncMotifErreur(e){
  if(e && e.motif) return e.motif;
  const m = String((e && e.message) || '');
  if(e && e.name === 'AbortError') return 'délai dépassé : le serveur ne répond pas';
  if(/^HTTP \d+/.test(m)) return m;
  if(/fetch|network|load failed/i.test(m)) return 'pas de connexion';
  if(/JSON|token/i.test(m)) return 'réponse illisible du serveur';
  return m || 'erreur inconnue';
}

/* Réponse non-OK du Worker -> erreur lisible. Le Worker renvoie {error:"…"} en JSON :
   on affiche ce texte. Un 400 veut dire « code refusé » (caractère interdit, vide, trop long). */
async function syncErreurHttp(res){
  let texte = '', quota = '';
  try{
    const brut = (await res.text()).trim();
    try{ const j = JSON.parse(brut); if(j && typeof j.error === 'string') texte = j.error; if(j && typeof j.quota === 'string') quota = j.quota; }
    catch(_){ /* page HTML d'erreur Cloudflare, etc. : on ne l'affiche pas */ }
  }catch(_){}
  if(texte.length > 120) texte = texte.slice(0, 117) + '…';
  const err = new Error('HTTP ' + res.status);
  if(res.status === 429 && quota === 'ecriture'){
    err.quota = true;
    syncMettreEnPause();
    err.motif = syncMessagePause();
  }else if(res.status === 400){
    syncEtat.codeRefuse = true;
    err.motif = 'code refusé par le serveur (HTTP 400)' + (texte ? ' : ' + texte : '');
  }else{
    err.motif = 'HTTP ' + res.status + (texte ? ' : ' + texte : '');
  }
  return err;
}

function syncHashTexte(t){
  let h = 5381;
  for(let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0;
  return t.length + ':' + h;
}

async function envoyerVersSync(opts){
  if(!syncActif()) return;
  const force = !!(opts && opts.force);
  const urgent = !!(opts && opts.urgent);
  if(syncPauseActive()){
    // Limite du jour atteinte : aucune requête tant que le compteur n'est pas reparti (sauf message pour le bouton « Enregistrer »).
    if(force) syncEtat.derniereErreur = syncMessagePause();
    return;
  }
  let ctlEnvoi = null, minuterieEnvoi = null;
  try{
    let corps = JSON.stringify(construireDonneesProgression({ pourSync: true }));
    let empreinte = syncEmpreinte(corps);
    if(!force){
      if(empreinte === syncDernierHash) return;                        // rien de neuf
      if(syncEnvoiEnCours && empreinte === syncEnCoursEmpreinte) return; // déjà en route
      const attente = syncIntervalleActuel() - (Date.now() - syncDernierEnvoiTs);
      if((attente > 0 || syncEnvoiEnCours) && !urgent){
        clearTimeout(syncTardifTimer);
        syncTardifTimer = setTimeout(() => { envoyerVersSync(); }, Math.max(attente, 5000));
        return;
      }
    }
    clearTimeout(syncTardifTimer);
    syncEnvoiEnCours = true;
    syncEnCoursEmpreinte = empreinte;
    syncDernierEnvoiTs = Date.now();
    // Le Worker ÉCRASE le JSON à chaque envoi : sans relecture, un appareil resté sur un état ancien effacerait
    // une suppression ou une révision poussée entre-temps par l'autre. On relit donc d'abord (hors envoi urgent à la
    // fermeture, qui n'a pas le temps, et hors séance / quiz pour ne pas toucher aux cartes en cours de révision).
    if(!force && !urgent && !studySessionActive && !quizActive && !syncEtat.enCours){
      const avant = corps;
      const lu = await recupererDepuisSync();
      if(!lu) return;   // relecture impossible : on n'écrase pas à l'aveugle (l'erreur est affichée dans Réglages)
      let apres = JSON.stringify(construireDonneesProgression({ pourSync: true }));
      if(apres !== avant && !studySessionActive && !quizActive){
        try{ appliquerArchivageControlesPasses(0); lisserRetards(); render(); renderStreak(); renderSettings(); }catch(e){}
        apres = JSON.stringify(construireDonneesProgression({ pourSync: true }));
      }
      corps = apres;
      empreinte = syncEmpreinte(corps);
      syncEnCoursEmpreinte = empreinte;
      if(empreinte === syncDernierHash) return;   // l'état local est déjà celui du serveur
    }
    // keepalive : l'envoi survit à la fermeture de l'onglet, mais le navigateur le limite à ~64 Ko (en OCTETS, pas en
    // caractères : un texte accentué pèse plus). Au-delà, l'envoi part normalement et n'est plus garanti à la fermeture.
    let octets = corps.length;
    try{ octets = new TextEncoder().encode(corps).length; }catch(e){}
    ctlEnvoi = (typeof AbortController === 'function' && !urgent) ? new AbortController() : null;
    if(ctlEnvoi) minuterieEnvoi = setTimeout(() => { try{ ctlEnvoi.abort(); }catch(e){} }, SYNC_DELAI_MS);   // délai maximum : un envoi qui ne finit jamais ne bloque plus rien
    const res = await fetch(`${SYNC_WORKER_URL}/sync?code=${encodeURIComponent(syncCodePerso())}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: corps,
      keepalive: octets < 60000,
      ...(ctlEnvoi ? { signal: ctlEnvoi.signal } : {})
    });
    if(!res.ok) throw await syncErreurHttp(res);
    syncPoserHash(empreinte);
    syncBudgetCompter();   // v152 : un envoi réussi = une écriture KV de plus aujourd'hui
    syncEtat.derniereSynchro = new Date().toISOString();
    syncEtat.derniereErreur = null;
    syncEtat.codeRefuse = false;
    try{ localStorage.setItem('sync-derniere-synchro', syncEtat.derniereSynchro); }catch(e){}
  }catch(e){
    syncEtat.derniereErreur = (e && e.quota) ? syncMessagePause() : 'Envoi impossible (' + syncMotifErreur(e) + ')';
  }finally{
    if(minuterieEnvoi) clearTimeout(minuterieEnvoi);
    syncEnvoiEnCours = false;
  }
}

/* Envoi de sécurité (v131) : pendant une révision on n'envoie plus rien tant qu'on enchaîne les cartes. Le vrai
   envoi se fait quand on quitte (fin ou sortie de séance, changement d'onglet/de fenêtre, app en arrière-plan,
   fermeture : voir plus bas). Ce délai ne sert que si on s'arrête 2 minutes sans rien déclencher de tout ça
   (ex. on pose le téléphone sans quitter l'écran, puis on reprend sur PC). Avant v131 : 8 s. */
const SYNC_INACTIVITE_MS = 120000;
let syncDiffereTimer = null;
function planifierSyncDiffere(){
  if(!syncActif()) return;
  clearTimeout(syncDiffereTimer);
  syncDiffereTimer = setTimeout(() => { envoyerVersSync(); }, SYNC_INACTIVITE_MS);
}

/* Récupération au retour sur l'app (changement d'onglet / de fenêtre sur PC) :
   sans ça, un onglet laissé ouvert ne récupérait jamais rien. Ignorée pendant
   une session de révision, un quiz, une fenêtre ouverte ou une saisie, et
   limitée à une fois toutes les 30 s. */
const SYNC_DEMARRAGE_PAUSE_MS = 5 * 60 * 1000;   // v181 : pas de lecture au démarrage si une synchro a eu lieu il y a moins de 5 min
function syncLueRecemment(ms){
  try{
    const t = Date.parse(localStorage.getItem('sync-derniere-synchro') || '');
    return !!t && Date.now() - t >= 0 && Date.now() - t < ms;
  }catch(e){ return false; }
}
const SYNC_DELAI_MS = 25000;   // délai maximum d'une requête de synchro (envoi ou récupération)
let syncDernierRetourTs = 0;
async function recupererAuRetour(){
  if(!syncActif() || syncEtat.enCours) return;
  if(studySessionActive || quizActive) return;
  const modal = document.getElementById('modal-root');
  if(modal && modal.innerHTML.trim() !== '') return;
  const el = document.activeElement;
  if(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
  if(Date.now() - syncDernierRetourTs < 30000) return;
  syncDernierRetourTs = Date.now();
  await recupererDepuisSync();
  if(!syncEtat.derniereErreur && !studySessionActive && !quizActive){
    appliquerArchivageControlesPasses(0); // une date de contrôle reçue de l'autre appareil peut être passée
    lisserRetards(); // les cartes reçues de l'autre appareil peuvent être en retard
    renderSettings();
    render();
    renderStreak();
  }
}

/* Renvoie true si la récupération a abouti (y compris « rien encore stocké »), false si elle a échoué. */
async function recupererDepuisSync(){
  if(!syncActif()) return false;
  syncEtat.enCours = true;
  // Délai maximum (25 s) : avant, une requête qui ne répondait jamais laissait « enCours » à vrai et plus aucune
  // récupération n'était lancée avant un rechargement de la page.
  const ctl = (typeof AbortController === 'function') ? new AbortController() : null;
  const minuterie = ctl ? setTimeout(() => { try{ ctl.abort(); }catch(e){} }, SYNC_DELAI_MS) : null;
  try{
    const res = await fetch(`${SYNC_WORKER_URL}/sync?code=${encodeURIComponent(syncCodePerso())}`, {
      method: 'GET',
      ...(ctl ? { signal: ctl.signal } : {})
    });
    if(res.status === 404){
      // Rien encore stocké pour ce code : premier lancement, on enverra
      // notre propre état plus tard (à la sortie), rien à faire ici.
      syncEtat.derniereErreur = null;
      syncEtat.codeRefuse = false;
      return true;
    }
    if(!res.ok) throw await syncErreurHttp(res);
    const texteDistant = await res.text();
    const data = JSON.parse(texteDistant);
    fusionnerDepuisSync(data);
    syncMarquerSiIdentique(texteDistant);
    syncEtat.derniereSynchro = new Date().toISOString();
    syncEtat.derniereErreur = null;
    syncEtat.codeRefuse = false;
    try{ localStorage.setItem('sync-derniere-synchro', syncEtat.derniereSynchro); }catch(e){}
    return true;
  }catch(e){
    syncEtat.derniereErreur = 'Récupération impossible (' + syncMotifErreur(e) + ')';
    return false;
  }finally{
    if(minuterie) clearTimeout(minuterie);
    syncEtat.enCours = false;
  }
}

function syncDerniereSynchroTs(){
  let ts = syncEtat.derniereSynchro;
  if(!ts){
    try{ ts = localStorage.getItem('sync-derniere-synchro'); }catch(e){}
  }
  return ts || null;
}
function syncDerniereSynchroLabel(){
  const ts = syncDerniereSynchroTs();
  if(!ts) return 'Jamais synchronisé sur cet appareil';
  try{
    const d = new Date(ts);
    const heure = d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    const jour = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const auj = new Date(); const aujMin = new Date(auj.getFullYear(), auj.getMonth(), auj.getDate()).getTime();
    const ecart = Math.round((aujMin - jour) / 86400000);
    if(ecart === 0) return "Dernière synchro : aujourd'hui à " + heure;
    if(ecart === 1) return 'Dernière synchro : hier à ' + heure;
    return 'Dernière synchro : ' + d.toLocaleDateString('fr-FR') + ' à ' + heure;
  }catch(e){ return 'Dernière synchro : ' + ts; }
}

/* État du bouton : 'idle' | 'loading' | 'ok' | 'err'. Le bouton et la ligne de statut
   sont mis à jour SUR PLACE (majSyncUi), sans redessiner les Réglages : le champ garde
   le focus et les changements de couleur glissent au lieu de sauter. */
let syncBtnEtat = 'idle';
let syncBtnTimer = null;
let syncCodeErreur = null; // message quand le code saisi est refusé (trop faible)

function syncBtnContenu(etat){
  const svg = (inner, cls) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
  if(etat === 'loading') return `<svg class="sync-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.55"/></svg><span class="sync-label">Synchronisation…</span>`;
  if(etat === 'ok') return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="sync-check" d="M5 12.5l4.5 4.5L19 7"/></svg><span class="sync-label">Synchronisé</span>`;
  if(etat === 'err') return svg('<path d="M12 8v5M12 16.5v.01"/>') + `<span class="sync-label">Échec, réessayer</span>`;
  return `<span class="sync-label">Enregistrer ce code</span>`;
}

function syncErreurCodeHtml(){
  if(syncCodeErreur) return `<div class="import-msg err" style="margin:0 0 10px;">${escapeHtml(syncCodeErreur)}</div>`;
  const actuel = syncCodePerso();
  const probleme = actuel ? verifierSoliditeCode(actuel) : null;
  if(probleme) return `<div class="import-msg err" style="margin:0 0 10px;">Ton code actuel ne peut pas être utilisé. ${escapeHtml(probleme)} La synchro est en pause : choisis-en un nouveau, identique sur tous tes appareils.</div>`;
  if(syncEtat.codeRefuse) return `<div class="import-msg err" style="margin:0 0 10px;">Le serveur refuse ce code. Utilise uniquement des lettres sans accent, des chiffres, - et _, puis enregistre-le de nouveau.</div>`;
  return '';
}

function syncStatutInner(){
  const erreur = syncEtat.derniereErreur || (syncPauseActive() ? syncMessagePause() : '');
  const cls = erreur ? 'err' : (syncDerniereSynchroTs() ? 'ok' : '');
  const detail = erreur ? ' · ' + erreur : '';
  return `<span class="sync-dot ${cls}"></span><span>${escapeHtml(syncDerniereSynchroLabel() + detail)}</span>`;
}

function majSyncUi(){
  const b = document.getElementById('sync-btn');
  if(b){
    b.className = 'pp-sec sync-btn' + (syncBtnEtat !== 'idle' ? ' is-' + syncBtnEtat : '');
    b.disabled = syncBtnEtat === 'loading';
    b.innerHTML = syncBtnContenu(syncBtnEtat);
  }
  const st = document.getElementById('sync-statut');
  if(st) st.innerHTML = syncStatutInner();
  const er = document.getElementById('sync-code-erreur');
  if(er) er.innerHTML = syncErreurCodeHtml();
}

function validerCodePerso(){
  if(syncBtnEtat === 'loading') return;
  const input = document.getElementById('sync-code-input');
  const code = (input ? input.value : '').trim();
  clearTimeout(syncBtnTimer);
  syncCodeErreur = null;
  syncEtat.codeRefuse = false;
  if(code){
    const probleme = verifierSoliditeCode(code);
    if(probleme){
      // Refusé : on n'enregistre rien (l'ancien code, s'il y en a un, reste tel quel).
      syncCodeErreur = probleme;
      syncBtnEtat = 'idle';
      majSyncUi();
      return;
    }
  }
  if(!syncSetCodePerso(code)){
    syncCodeErreur = 'Stockage plein : le code n\u2019a pas pu être enregistré.';
    syncBtnEtat = 'idle';
    majSyncUi();
    return;
  }
  delete ppSetBrouillon['sync-code-input'];   // code enregistré : le champ doit désormais afficher la valeur stockée
  if(!code){ syncBtnEtat = 'idle'; majSyncUi(); return; }
  syncBtnEtat = 'loading';
  majSyncUi();
  const debut = Date.now();
  const fin = () => {
    // Au moins 0,5 s de « Synchronisation… » : sinon l'état flashe trop vite pour être vu.
    setTimeout(() => {
      syncBtnEtat = syncEtat.derniereErreur ? 'err' : 'ok';
      majSyncUi();
      render();
      renderStreak();
      syncBtnTimer = setTimeout(() => { syncBtnEtat = 'idle'; majSyncUi(); }, syncBtnEtat === 'ok' ? 2200 : 3200);
    }, Math.max(0, 500 - (Date.now() - debut)));
  };
  // On récupère d'abord, puis on envoie tout de suite l'état fusionné : un nouveau
  // code démarre ainsi avec des données déjà en ligne pour l'autre appareil.
  recupererDepuisSync()
    .then(() => { if(!syncEtat.derniereErreur) return envoyerVersSync({ force: true }); })
    .then(fin, fin);
}

/* ---------------- Raccourcis clavier (PC) ----------------
   Espace = retourner la carte (non rappelé à l'écran) · Entrée = vert (facile) · Maj = orange (difficile)
   · Suppr (ou Retour arrière) = rouge (pas su). Valables en révision ET en quiz.
   Ignorés : pendant la saisie dans un champ, quand une fenêtre est ouverte, avec
   Ctrl/Alt/Cmd, en touche maintenue, et pendant l'animation de la carte qui part
   (sinon un 2e appui répondrait deux fois à la même carte). */
let raccourciVerrouJusqu = 0;

/* ===== RÉPONSE À ÉCRIRE (étape 2) =====
   Une carte `ecrite` (c.ecrite === true) dont la face à écrire contient du texte se révise ainsi : un champ + « Valider »
   à la place de la réponse, puis, une fois la carte retournée, « Ta réponse » et « Réponse » l'une sous l'autre.
   La réponse tapée vit uniquement dans `ecr` (mémoire de session) : jamais dans la carte, jamais sauvegardée, jamais synchronisée.
   answer(), les paliers et le planning ne changent pas : seul l'avant-retournement est différent.
   Noms préfixés « ecr » (le prototype disait cible / valider / grandir / deplier / habiller) pour ne pas entrer en collision
   avec les variables locales de l'app (ex. `cible` dans gererRaccourcisClavier).
   Le quiz « S'entraîner » n'est pas encore branché (étape 3). */
function ecrVide(cle){ return { cle: cle || null, typed: '', locked: false, flipT: 0 }; }
function ecrEtat(cle){ if(ecr.cle !== cle) ecr = ecrVide(cle); return ecr; }
function ecrReset(){ ecr = ecrVide(null); }
/* La carte affichée est-elle « à écrire » pour ce tirage ? Face à écrire = face cachée telle qu'affichée (réponse, ou question si ⇄).
   Repli : face à écrire = image seule → carte normale pour ce tirage. */
function ecrActive(o){
  return !!(o && o.c && o.c.ecrite === true && o.faces && String(o.faces.arriere || '').trim() !== '');
}
function ecrAffichee(){ const r = document.getElementById('pp-ses'); return !!(r && r.classList.contains('ecr')); }
/* Clavier du téléphone : posé UNIQUEMENT quand une carte à écrire est affichée, sur téléphone (ecrMesure ci-dessous le pilote).
   body.kb + --kbh ; tout ce qui se replie le fait en .34 s avec --kbe (voir le CSS « RÉPONSE À ÉCRIRE »). */
function ecrClavier(ouvert, hauteurPx){
  const root = document.getElementById('pp-ses');
  const ok = !!(ouvert && root && root.classList.contains('ecr') && !ppWide());
  document.body.classList.toggle('kb', ok);
  /* très peu de place (paysage + clavier) : l'étiquette de la carte réponse se masque pour que le champ et « Valider » restent visibles */
  document.body.classList.toggle('kb-xs', ok && (window.visualViewport ? window.visualViewport.height : window.innerHeight) < 340);
  if(root) root.style.setProperty('--kbh', (ok ? (hauteurPx || 0) : 0) + 'px');
}
/* Hauteur du champ selon la place réellement libre dans la carte (min 72 px, max 220 px) : il grandit avec le texte jusque-là, puis défile en interne. */
function ecrChampMax(){
  const r = document.getElementById('pp-ses'), t = ecrChamp();
  if(!r || !t || ppWide()) return;
  const stage = r.querySelector('.pp-stage'), q = r.querySelector('.pp-card:not(.pp-rcard)'), rc = r.querySelector('.pp-rcard');
  if(!stage || !q || !rc) return;
  const libre = stage.clientHeight - 18 /* gap */ - 96 /* question : place minimale */ - (rc.offsetHeight - t.offsetHeight);
  r.style.setProperty('--ecr-max', Math.max(72, Math.min(220, Math.floor(libre))) + 'px');
}
/* Mesure du clavier : vient UNIQUEMENT du viewport (jamais de focus/blur : avec le geste « retour » d'Android le champ garde le focus alors que le clavier a disparu). */
const ecrKb = { ref: window.innerHeight, w: window.innerWidth, ouvert: false, dernier: false, raf: 0, tm: 0 };
function ecrMesure(){
  if(ecrKb.raf) return;
  ecrKb.raf = requestAnimationFrame(() => { ecrKb.raf = 0; ecrMesureVrai(); });
}
function ecrMesureVrai(){
  const vv = window.visualViewport;
  if(!ecrAffichee() || ppWide()){
    if(ecrKb.ouvert || document.body.classList.contains('kb')){ ecrKb.ouvert = false; ecrClavier(false, 0); }
    return;
  }
  const h = vv ? vv.height : window.innerHeight, top = vv ? vv.offsetTop : 0, ih = window.innerHeight;
  if(vv && vv.scale > 1.02) return;                                   /* pincement pour zoomer ≠ clavier */
  if(window.innerWidth !== ecrKb.w){ ecrKb.w = window.innerWidth; ecrKb.ref = Math.max(ih, h + top); }   /* rotation : nouvelle référence */
  else if(h + top >= ecrKb.ref - 2 || ih > ecrKb.ref) ecrKb.ref = Math.max(ecrKb.ref, ih, h + top);       /* clavier fermé : la plus grande hauteur vue */
  const kb = Math.max(0, ecrKb.ref - h - top);
  if(!ecrKb.ouvert && kb > 100) ecrKb.ouvert = true;                  /* hystérésis : ouvre > 100 px, ferme < 60 px */
  else if(ecrKb.ouvert && kb < 60) ecrKb.ouvert = false;
  /* si le viewport de mise en page a déjà rétréci, #pp-ses{position:fixed;bottom:0} suit tout seul : --kbh = 0 */
  const reste = Math.max(0, kb - Math.max(0, ecrKb.ref - ih));
  const change = ecrKb.dernier !== ecrKb.ouvert; ecrKb.dernier = ecrKb.ouvert;
  ecrClavier(ecrKb.ouvert, ecrKb.ouvert ? reste : 0);
  if(ecrKb.ouvert && top > 0) window.scrollTo(0, 0);                  /* contre le panoramique du navigateur */
  ecrChampMax();
  if(change){ clearTimeout(ecrKb.tm); ecrKb.tm = setTimeout(() => { ecrChampMax(); const t = ecrChamp(); if(t && ecr.typed) ecrGrandir(t); }, 380); }   /* la mise en page finit de bouger après .34 s : on remesure la place du champ */
}
(function(){
  const vv = window.visualViewport;
  if(vv){ vv.addEventListener('resize', ecrMesure); vv.addEventListener('scroll', ecrMesure); }
  window.addEventListener('resize', ecrMesure);
  window.addEventListener('orientationchange', () => setTimeout(ecrMesure, 250));
})();
/* Le champ avait-il le focus juste avant le redessin ? (renderStudy est appelé par la synchro, minuit, le retour d'arrière-plan…) */
function ecrFocusCapture(){
  const a = document.activeElement;
  if(a && a.classList && a.classList.contains('pp-ecr-ta')) return { a: a.selectionStart, b: a.selectionEnd };
  return null;
}
function ecrChamp(){ return [...document.querySelectorAll('#pp-ses .pp-ecr-ta')].find(t => t.offsetParent) || null; }
function ecrValider(){
  const cx = raccourciContexte();
  if(!cx || cx.flipped || carteEnSortie || !ecrAffichee()) return;
  const t = ecrChamp(); if(t) ecr.typed = t.value;
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();   /* le clavier se ferme : l'écran se réadapte (visualViewport) */
  haptique(10);
  cx.flip();
}
/* Verrou d'1 s (décision 8), commun à la révision et au quiz : appelé AVANT de retourner. */
function ecrBascule(flippedNow){
  if(ecrAffichee() && !ppFlipEnCours){
    if(!flippedNow) ecr.flipT = Date.now();                       // question → réponse : l'élève a 1 s pour revenir et corriger
    else if(Date.now() - ecr.flipT > 1000) ecr.locked = true;      // retour à la question après plus d'1 s : texte verrouillé
  }
}
function ecrGrandir(t){
  ecr.typed = t.value;
  document.querySelectorAll('#pp-ses .pp-ecr-ta').forEach(x => { if(x !== t) x.value = ecr.typed; });
  if(!ppWide()){ ecrChampMax(); t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
}
/* « Ta réponse » : toucher = tout afficher / replier */
function ecrDeplier(el){
  el.classList.toggle('open');
  document.querySelectorAll('#pp-ses .pp-rb').forEach(r => r.dispatchEvent(new Event('scroll')));
}
/* petit fondu en bas tant qu'il reste du texte à faire défiler */
function ecrSuivreScroll(rb){
  const upd = () => rb.classList.toggle('ov', rb.scrollHeight - rb.scrollTop - rb.clientHeight > 4);
  rb.addEventListener('scroll', upd, { passive:true });
  if(window.ResizeObserver) new ResizeObserver(upd).observe(rb);
  upd();
}
/* la « carte réponse » (téléphone) : même format que la carte question */
function ecrCarteRep(titre, corps, pied, anim){
  return '<div class="pp-card pp-rcard' + (anim === 'in' ? ' pp-in' : '') + '"><div class="pp-ch"><span class="pp-sticker" style="animation:none">' + titre + '</span></div><div class="pp-rb">' + corps + '</div><div class="pp-foot">' + pied + '</div></div>';
}
/* Appelée juste après ppSesDraw pour une carte à écrire : habille l'écran. anim = ppMood.anim lu AVANT ppSesDraw ; foc = focus du champ avant le redessin. */
function ecrHabiller(o, anim, foc){
  const r = document.getElementById('pp-ses'), wide = ppWide();
  const q = r.querySelector('.pp-card'), qb = q.querySelector('.pp-body'), qf = q.querySelector('.pp-foot');
  if(!o.flipped){
    qb.removeAttribute('onclick'); qb.style.cursor = 'default';
    let corps, pied;
    if(ecr.locked){
      const nom = ecr.typed.trim() ? '<span data-notr>' + escapeHtml(ecr.typed.trim()) + '</span>' : '<i>Pas de réponse</i>';
      corps = '<div class="pp-ecl">Ta réponse · verrouillée</div><div class="pp-ecrbox pp-lock"><div class="pp-lk">' + nom + '</div></div>';
      pied = '<button class="pp-show" onclick="' + o.fnFlip + '">Afficher la réponse</button>' + (wide ? '<div class="pp-ecw-h"><kbd>Espace</kbd> pour afficher la réponse</div>' : '');
      qb.setAttribute('onclick', o.fnFlip); qb.style.cursor = 'pointer';
    } else {
      const ta = '<textarea class="pp-ecr-ta" rows="1" placeholder="Ta réponse…" aria-label="Ta réponse" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="sentences" enterkeyhint="enter" oninput="ecrGrandir(this)"></textarea>';
      /* « Valider » est déjà traduit « Confirm » dans le dictionnaire (réglage Gemini) : sur la carte, on dit « Check » en anglais */
      const ok = '<span data-notr>' + ((window.langueChoisie && window.langueChoisie() === 'en') ? 'Check' : 'Valider') + '</span>';
      corps = '<div class="pp-ecrbox">' + ta + '</div>';
      pied = '<button class="pp-show pp-ecr-ok" onclick="ecrValider()">' + ok + '</button>';
    }
    if(wide){
      const s = r.querySelector('.pp-rslot');
      if(!ecr.locked) s.removeAttribute('onclick');
      s.classList.add('pp-ecrslot'); s.classList.remove('hid');
      s.innerHTML = '<div class="pp-ch"><span class="pp-sticker" style="animation:none">Ta réponse</span></div><div class="pp-rb">' + corps + '</div><div class="pp-foot">' + pied + '</div>';
      if(anim === 'in') s.style.animation = 'ppcardIn .45s var(--pps) both';
    } else {
      if(qf) qf.remove();
      q.insertAdjacentHTML('afterend', ecrCarteRep('Ta réponse', corps, pied, anim));
      const rc = q.nextElementSibling;
      if(anim === 'flip'){ rc.classList.add('pp-sink'); requestAnimationFrame(() => requestAnimationFrame(() => rc.classList.remove('pp-sink'))); }
    }
    r.querySelectorAll('.pp-rb').forEach(ecrSuivreScroll);
    r.querySelectorAll('.pp-ecr-ta').forEach(t => { t.value = ecr.typed; });
    const t = ecrChamp();
    if(t){
      if(ecr.typed) ecrGrandir(t);
      if(anim === 'in') setTimeout(() => { if(t.isConnected && !ecr.locked) t.focus({ preventScroll:true }); }, 480);
      else if(!anim && foc){ t.focus({ preventScroll:true }); try{ t.setSelectionRange(foc.a, foc.b); }catch(e){} }
    }
    ecrChampMax();
  } else {
    const mine = ecr.typed.trim() ? '<span data-notr>' + escapeHtml(ecr.typed.trim()) + '</span>' : '<i>Pas de réponse</i>';
    const bonne = o.faces.arriere || '';
    const cmp = '<div class="pp-c2w A"><div class="pp-c2 mine" onclick="ecrDeplier(this)"><small>Ta réponse</small><p>' + mine + '</p></div><div class="pp-c2 good"><small>' + escapeHtml(o.faces.libArriere) + '</small><p class="' + (bonne.length > 90 ? 'l' : '') + '">' + ppRichHtml(bonne) + '</p></div></div>';
    if(wide){
      r.querySelectorAll('.pp-ra .pp-at').forEach(p => { p.outerHTML = cmp; });
      r.querySelectorAll('.pp-ra').forEach(x => x.removeAttribute('onclick'));   /* carte à écrire : le clic sur le panneau de droite ne retourne rien (il sert à lire / replier) */
    } else {
      const notes = qf ? qf.innerHTML : '';
      if(qf) qf.remove();
      qb.querySelectorAll('.pp-rule,.pp-at,.pp-aimg').forEach(e => e.remove());
      const sk = q.querySelector('.pp-sk-p'); if(sk) sk.textContent = o.faces.libAvant;
      const img = o.faces.imgArriere ? '<img class="pp-aimg" src="' + o.faces.imgArriere + '" alt="" draggable="false">' : '';
      q.insertAdjacentHTML('afterend', ecrCarteRep(o.faces.libArriere, cmp + img, notes, ''));
      const rc = q.nextElementSibling;
      if(anim === 'flip'){ rc.classList.add('pp-sink'); requestAnimationFrame(() => requestAnimationFrame(() => rc.classList.remove('pp-sink'))); }
      ecrSuivreScroll(rc.querySelector('.pp-rb'));
    }
  }
}
/* Espace sur une carte à écrire (non verrouillée, avant retournement) : met le focus dans le champ au lieu de retourner. */
function ecrEspace(ctx){
  if(ctx.flipped || ecr.locked || !ecrAffichee()) return false;
  const t = ecrChamp(); if(!t) return false;
  t.focus({ preventScroll:true });
  return true;
}

function raccourciContexte(){
  if(quizActive && document.getElementById('quiz-anki-card-body')){
    return { flipped: quizFlipped, flip: quizFlip, answer: quizAnswer };
  }
  if(activeTab === 'study' && document.getElementById('anki-card-body')){
    return { flipped, flip: flipCard, answer: answer };
  }
  return null;
}

function gererRaccourcisClavier(e){
  if(ppZ) return;
  if(e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
  const cible = e.target;
  const tag = cible && cible.tagName ? cible.tagName.toLowerCase() : '';
  if(tag === 'input' || tag === 'textarea' || tag === 'select' || (cible && cible.isContentEditable)) return;
  const modal = document.getElementById('modal-root');
  if(modal && modal.innerHTML.trim() !== '') return;
  if(Date.now() < raccourciVerrouJusqu) return;
  const ctx = raccourciContexte();
  if(!ctx) return;

  let niveau = null;
  if(e.key === ' ' || e.code === 'Space'){
    e.preventDefault(); // sinon la page défile
    if(ecrEspace(ctx)) return; // carte à écrire (avant retournement) : Espace met le focus dans le champ
    ctx.flip();
    return;
  }
  if(!ctx.flipped) return; // les 3 réponses n'existent qu'une fois la carte retournée
  if(e.key === 'Enter') niveau = 'vert';
  else if(e.key === 'Shift') niveau = 'orange';
  else if(e.key === 'Delete' || e.key === 'Backspace') niveau = 'rouge';
  if(!niveau) return;
  e.preventDefault();
  raccourciVerrouJusqu = Date.now() + 800; // > pastille (200 ms) + balayage de la carte (500 ms)
  ctx.answer(niveau);
}

   PORT DU PROTOTYPE v31 — ÉTAPE 6 : Réglages (feuille du bas), Statistiques
   (page) et Synthèse (page). HTML / classes (pp-) / durées copiés du

PP_IC.key = ppSvg('<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/>',18);
const ppIc16 = s => String(s).replace(/width="\d+"/, 'width="16"').replace(/height="\d+"/, 'height="16"');

/* ---- compteurs propres aux statistiques (record de série, révisions au total) ---- */
function ppStatExtra(){
  try{
    const o = JSON.parse(localStorage.getItem('cartes-stats-extra') || 'null');
    if(o && typeof o === 'object') return { record: Math.max(0, Math.floor(+o.record) || 0), total: Math.max(0, Math.floor(+o.total) || 0) };
  }catch(err){}
  return { record: 0, total: 0 };
}
function ppStatSave(o){ ppEcrire('cartes-stats-extra', JSON.stringify(o)); }
function ppStatBump(){
  const o = ppStatExtra();
  o.total++; o.record = Math.max(o.record, getStreakData().count);
  ppStatSave(o);
}
function ppStatUndo(){
  const o = ppStatExtra();
  o.total = Math.max(0, o.total - 1);
  ppStatSave(o);
}

/* ---- v160 : bilan de fin de séance + objectif du jour (données locales à l'appareil, jamais synchronisées) ----
   `cartes-seances` = liste des 60 dernières séances { d: jour, ms: temps actif, n: cartes, v: « Facile », m: nouvelles maîtrisées, e: 1 si « Revoir les erreurs » }.
   Temps actif : à chaque réponse on ajoute le temps écoulé depuis la précédente, plafonné à 2 min (app laissée ouverte = pas comptée). */
const PP_SEANCES_KEY = 'cartes-seances';
function ppSeancesNettoyer(a){
  if(!Array.isArray(a)) return [];
  return a.filter(x => x && typeof x === 'object' && typeof x.d === 'string' && Number.isFinite(+x.n) && +x.n > 0)
    .map(x => ({ d:x.d, ms:Math.max(0, +x.ms || 0), n:Math.floor(+x.n), v:Math.max(0, Math.floor(+x.v) || 0), m:Math.max(0, Math.floor(+x.m) || 0), e:x.e ? 1 : 0 })).slice(-60);
}
function ppSeancesLire(){
  try{ return ppSeancesNettoyer(JSON.parse(localStorage.getItem(PP_SEANCES_KEY) || '[]')); }
  catch(err){ return []; }
}
function ppSeanceRaz(){ ppSeance = { ms: 0, last: Date.now(), saved: false, bilan: null }; }
function ppSeanceTick(){
  const t = Date.now();
  const dt = Math.max(0, Math.min(t - (ppSeance.last || t), 120000));
  ppSeance.ms += dt; ppSeance.last = t;
  return dt;
}
/* Enregistre la séance (une seule fois) et renvoie son bilan, ou null s'il n'y a eu aucune réponse. */
function ppSeanceFin(){
  const s = ppSeance;
  if(s.saved) return s.bilan;
  if(sessionReviewed <= 0) return null;
  s.saved = true;
  const liste = ppSeancesLire();
  const prev = studyMode === 'errors' ? null : ([...liste].reverse().find(x => !x.e && x.n >= 5) || null);
  const e = { d: todayStr(), ms: Math.round(s.ms), n: sessionReviewed, v: sessionMoodCounts.vert || 0, m: sessionMastered, e: studyMode === 'errors' ? 1 : 0 };
  liste.push(e);
  ppEcrire(PP_SEANCES_KEY, JSON.stringify(liste.slice(-60)));
  s.bilan = { e, prev, aujourdhui: liste.filter(x => x.d === e.d).reduce((a, x) => a + x.n, 0) };
  return s.bilan;
}
function ppDuree(ms){
  const s = Math.round(ms / 1000);
  if(s < 60) return s + ' s';
  const m = Math.round(s / 60);
  return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + ppP2(m % 60);
}
/* Écran « Terminé » : 3 repères (temps, réussite avec l'écart à la séance précédente, maîtrisées) + barre d'objectif seulement si un objectif est réglé. */
function ppBilanHtml(){
  const b = ppSeanceFin();
  if(!b) return '';
  const e = b.e, taux = Math.round(100 * e.v / Math.max(1, e.n));
  let evo = '';
  if(b.prev && e.n >= 5){
    const d = taux - Math.round(100 * b.prev.v / b.prev.n);
    evo = d > 0 ? `<em>+${d} pts</em>` : (d < 0 ? `<em class="dn">−${-d} pts</em>` : `<em class="dn">=</em>`);
  }
  const mas = CARDS.filter(c => (c.palier || 0) >= MASTERED_PALIER).length;
  return `<div class="pp-bil"><div><b>${ppDuree(e.ms)}</b><span>temps</span></div><div><b>${taux} %</b><span>réussite</span>${evo}</div><div><b>${mas}</b><span>maîtrisée${mas > 1 ? 's' : ''}</span>${e.m > 0 ? `<em>+${e.m}</em>` : ''}</div></div>`;
}

function ppPageShow(html, id, still){
  const root = document.getElementById('modal-root');
  if(!root) return null;
  const ancien = root.querySelector('.pp-sb');
  const y = ancien ? ancien.scrollTop : 0;
  root.innerHTML = `<div class="pp-page" id="${id}">${html}</div>`;
  const nouveau = root.querySelector('.pp-sb');
  if(nouveau && still) nouveau.scrollTop = y;
  if(id === 'pp-stats-page') ppPageSwipe(root.querySelector('.pp-page'), closeStreakModal);
  else if(id === 'synth-overlay') ppPageSwipe(root.querySelector('.pp-page'), tryFermerSynthese); /* v127 : même geste, avec la confirmation « Fermer la synthèse ? » */
  return root;
}
/* Statistiques : glisser vers le bas pour fermer (même geste que les fenêtres du bas).
   Démarre seulement si la liste est tout en haut ; `translate` se cumule avec le centrage du grand écran. */
function ppPageSwipe(pg, fermer){
  if(!pg) return;
  fermer = fermer || closeStreakModal;
  const sb = pg.querySelector('.pp-sb');
  let y0 = 0, dy = 0, on = false, mv = false;
  pg.addEventListener('touchstart', t => {
    if(pg.classList.contains('pp-pgout') || t.target.closest('input,textarea,select')){ on = false; return; }
    on = !(sb && sb.scrollTop > 0); mv = false; dy = 0; y0 = t.touches[0].clientY;
  }, { passive:true });
  pg.addEventListener('touchmove', t => {
    if(!on) return;
    dy = t.touches[0].clientY - y0;
    if(!mv && sb && sb.scrollTop > 0){ on = false; return; }
    if(dy <= 0){ if(mv) pg.style.translate = ''; return; }
    mv = true; pg.style.animation = 'none';
    pg.style.translate = '0 ' + dy + 'px'; pg.style.opacity = Math.max(.2, 1 - dy / 600);
    t.preventDefault();
  }, { passive:false });
  const end = () => {
    if(!on || !mv){ on = false; return; }
    on = false; mv = false;
    if(dy > 110){
      fermer();
      /* fermée (ou en train de l'être) : rien à remettre ; sinon (confirmation demandée, génération en cours) la page revient en place */
      if(!pg.isConnected || pg.classList.contains('pp-pgout')) return;
    }
    pg.style.transition = 'translate .3s var(--ease-press), opacity .2s';
    pg.style.translate = ''; pg.style.opacity = '';
    setTimeout(() => { pg.style.transition = ''; }, 320);
  };
  pg.addEventListener('touchend', end); pg.addEventListener('touchcancel', end);
  /* v126 : souris / pavé tactile (Chromebook) */
  ppSouris(pg, sb, d => {
    if(pg.classList.contains('pp-pgout')) return;
    dy = d; on = true; mv = true; pg.style.animation = 'none';
    pg.style.translate = '0 ' + d + 'px'; pg.style.opacity = Math.max(.2, 1 - d / 600);
  }, end);
}

/* v127 : les petites fenêtres « Renommer », « Supprimer la matière », « Par quelle matière… », « Revoir quoi ? », « Matière déjà existante ? »
   (.modal-overlay > .modal-sheet, posées dans #modal-root) se ferment aussi en glissant vers le bas, comme toutes les autres fenêtres du bas.
   Fermer = cliquer sur le fond : chaque fenêtre a déjà son propre `onclick` de fermeture (annulation propre). */
(function(){
  const racine = document.getElementById('modal-root');
  if(!racine || !window.MutationObserver) return;
  const brancher = () => {
    racine.querySelectorAll(':scope > .modal-overlay').forEach(ov => {
      if(ov._glisse) return; ov._glisse = true;
      const feuille = ov.querySelector('.modal-sheet'); if(!feuille) return;
      const voile = { style:{ set opacity(x){ ov.style.background = x === '' ? '' : 'rgba(5,5,10,' + (0.7 * x) + ')'; } } };
      ppSwipeFeuille(feuille, voile, () => ov.click());
    });
  };
  new MutationObserver(brancher).observe(racine, { childList:true });
  brancher();
})();

function ppUrlSiteWeb(){
  try{
    const l = window.location;
    if((l.protocol === 'https:' || l.protocol === 'http:') && l.hostname !== 'localhost' && l.hostname !== '127.0.0.1') return l.origin;
  }catch(e){}
  return '';
}

function ppSynModSave(ren){
  const s = syntheseEtat; if(!s) return;
  const champ = document.getElementById('pp-mn');
  const nom = ((champ && champ.value) || '').trim().replace(/[<>"]/g, '');
  if(!nom){ if(champ) champ.focus(); return; }
  const liste = chargerModelesSynthese();
  if(ren){
    if(nom === s.modeleChoisi){ ppSheetClose(); return; }
    if(liste.some(m => m.nom.toLowerCase() === nom.toLowerCase() && m.nom !== s.modeleChoisi)){ ppToast('Ce nom existe déjà'); return; }
    sauverModelesSynthese(liste.map(m => m.nom === s.modeleChoisi ? { ...m, nom, modifieLe: new Date().toISOString() } : m));
    s.modeleChoisi = nom; s.msg = null;
  } else {
    const existant = liste.find(m => m.nom.toLowerCase() === nom.toLowerCase());
    if(existant && !confirm(`Un modèle « ${existant.nom} » existe déjà. Le remplacer ?`)) return;
    const autres = liste.filter(m => m.nom.toLowerCase() !== nom.toLowerCase());
    autres.push({ nom, texte: (s.consignes || '').trim(), modifieLe: new Date().toISOString() });
    sauverModelesSynthese(autres);
    s.modeleChoisi = nom; s.msg = null;
  }
  ppSheetClose();
  renderSynthese();
  ppToast(ren ? 'Modèle renommé' : 'Modèle enregistré');
}

function ppSynModDel(){
  const s = syntheseEtat; if(!s || !s.modeleChoisi) return;

  ppToast('Modèle supprimé');
}

// Retire l'écran de transition custom du DOM une fois son animation de
// sortie terminée, pour ne laisser aucun overlay invisible intercepter
// les clics. Filet de sécurité au cas où l'event ne se déclenche pas
// (onglet en arrière-plan, etc.) : on force le retrait après 1.2s max.
(function(){
  var splash = document.getElementById('boot-splash');
  var done = false;
  function reveal(){
    if(done) return;
    done = true;
    document.body.classList.add('splash-done');
    if(splash && splash.parentNode) splash.parentNode.removeChild(splash);
  }
  if(!splash){ reveal(); return; }
  if(document.documentElement.classList.contains('pp-reprise')){ reveal(); return; } // v174 : retour dans l'app, pas de splash
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    reveal();
    return;
  }
  splash.addEventListener('animationend', function(e){
    if(e.target === splash) reveal();
  });
  // v106 : la timeline du splash (~1.35 s) ne démarre qu'une fois la page construite
  // (init() est déjà passé) et une image dessinée : sur un Chromebook modeste, lancer
  // l'animation PENDANT le chargement la faisait saccader. Filets de sécurité : démarrage
  // forcé après 1.5 s si le navigateur ne rend pas d'image (onglet en arrière-plan), et
  // retrait forcé 2 s après le démarrage si animationend ne se déclenche pas.
  var started = false;
  function start(){
    if(started) return;
    started = true;
    splash.classList.add('go');
    setTimeout(reveal, 2000);
  }
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ setTimeout(start, 50); }); });
  setTimeout(start, 1500);
})();
</script>

<script>
/* ============================================================
   COUCHE « VIE » (v74) — JS : ambiance, clin d'œil du bouton principal.
   Tout se coupe avec document.body.classList.add('sans-vie') ou prefers-reduced-motion.
   ============================================================ */
(function(){
  var reduit = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduit) return;
  /* 1. ambiance : onde lumineuse sur la grille de points du fond */
  var amb = document.createElement('div');
  amb.id = 'vie-ambiance'; amb.setAttribute('aria-hidden','true');
  var cv = document.createElement('canvas');
  amb.appendChild(cv);
  document.body.insertBefore(amb, document.body.firstChild);
  /* « Onde » : des anneaux de lumière partent du coin haut-droit (là où est la lueur orange du fond) et éclairent
     les points de la grille (16 px, même grille que le fond, ancrée en haut à gauche). v80 : UNE seule source, mais
     la portée va jusqu'au coin le plus éloigné (bas-gauche) : les anneaux traversent tout l'écran et s'éteignent
     tout au bout de leur course, au lieu de mourir à mi-chemin. */
  var g = cv.getContext('2d'), W = 0, H = 0, DPR = 1, last = 0, t0 = performance.now(), grand = false;
  function tailleOnde(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    // même seuil que le bloc CSS « CHROMEBOOK / ORDINATEUR » (v82)
    grand = !!(window.matchMedia && window.matchMedia('(min-width:900px) and (min-height:480px)').matches);
  }
  tailleOnde();
  window.addEventListener('resize', tailleOnde);
  function ondeFrame(now){
    requestAnimationFrame(ondeFrame);
    if(document.hidden || document.body.classList.contains('sans-vie') || !document.body.classList.contains('splash-done')) return; // v106 : rien à dessiner derrière le splash
    if(now - last < 33) return; // ~30 images/s suffisent, et ça ménage la batterie
    last = now;
    var t = (now - t0) / 1000, S = 16, ox = grand ? W - 40 : W * .9;
    var R = Math.sqrt(Math.max(ox, W - ox) * Math.max(ox, W - ox) + H * H) * 1.05; // jusqu'au coin le plus éloigné
    /* v82 — grand écran (Chromebook) : sur un écran large l'onde traversait tout l'écran et devenait trop visible
       (sur téléphone il y a peu d'espace vide, c'était discret). Elle reste donc près du coin haut-droit (portée
       plafonnée), plus transparente et avec des points plus petits. Le téléphone ne change pas. */
    var alpha = .6, r0 = 1.2, r1 = 1.2, xmin = 0, ymax = H + S, RF = R, plancher = 0;
    /* v169 : sur grand écran l'onde était coupée à ~520 px du coin haut-droit : tout le reste de l'écran restait vide.
       Près du coin elle ne change presque pas (un peu plus marquée) ; au-delà, un « plancher » discret la prolonge
       jusqu'au coin le plus éloigné en s'estompant doucement. Pour la rendre plus / moins présente au loin :
       changer `plancher` (0 = comme avant, .5 = bien visible) ; pour tout l'ensemble : `alpha`. */
    if(grand){
      R = Math.min(R, 520); alpha = .40; r0 = 1; r1 = .9; plancher = .5;
    }
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);
    var cp = document.documentElement.getAttribute('data-theme') === 'light' ? 'rgba(222,84,34,' : 'rgba(255,150,105,';
    var x0 = S / 2 + Math.floor(xmin / S) * S; // reste calé sur la grille du fond (16 px, points au centre des cases)
    for(var y = S / 2; y < ymax; y += S){
      for(var x = x0; x < W + S; x += S){
        var dx = x - ox, dist = Math.sqrt(dx * dx + y * y);
        var sn = Math.sin(dist / 52 - t * .66);
        if(sn <= 0) continue;
        var u = dist / R;
        var f = 1 - .85 * Math.pow(u, 1.6);
        if(plancher) f = Math.max(f, plancher * (1 - .5 * Math.min(1, dist / RF)));
        var lit = Math.pow(sn, 1.4) * f;
        if(lit < .04) continue;
        g.fillStyle = cp + (lit * alpha).toFixed(2) + ')';
        g.beginPath(); g.arc(x, y, r0 + lit * r1, 0, 6.2832); g.fill();
      }
    }
  }
  requestAnimationFrame(ondeFrame);

  /* 2. suivi du dernier toucher (sert au clin d'œil du bouton principal) — plus d'anneau au toucher */
  var dernierToucher = Date.now();
  document.addEventListener('pointerdown', function(){ dernierToucher = Date.now(); }, { passive:true });
  document.addEventListener('keydown', function(){ dernierToucher = Date.now(); }, { passive:true });
  document.addEventListener('scroll', function(){ dernierToucher = Date.now(); }, { passive:true, capture:true });

  /* 3. clin d'œil : si personne ne touche l'écran depuis 7 s, le bouton principal s'enfonce tout seul
     (accueil : « Réviser » ; révision : « Afficher la réponse »), au plus une fois toutes les 9 s. */
  var dernierClin = 0;
  setInterval(function(){
    if(document.hidden || document.body.classList.contains('sans-vie')) return;
    var now = Date.now();
    if(now - dernierToucher < 7000 || now - dernierClin < 9000) return;
    if(document.querySelector('.pp-sheet.on,.modal-overlay.show,#synth-overlay.show')) return;
    if(!document.body.classList.contains('pp-ses-on')) return; // accueil : bouton calme, pas de clin d'œil
    var b = document.querySelector('#pp-ses .pp-show:not([disabled])');
    if(!b || !b.offsetParent || b.classList.contains('js-press')) return;
    dernierClin = now;
    b.classList.add('vie-nudge');
    var fin = function(){ b.classList.remove('vie-nudge'); };
    b.addEventListener('animationend', fin, { once:true });
    setTimeout(fin, 800);
  }, 1000);
})();
</script>
<script>
/* Grand écran — défilements sans barre visible :
   « Matières et contrôles » (.cb-ml) : .can-down = il reste des lignes plus bas (fondu de bas de liste) ;
   « Cette semaine » (.cb-wk) : .can-left / .can-right = il reste des jours hors champ ; la molette (verticale) fait défiler en largeur. */
(function(){
  let raf = 0;
  function maj(){
    raf = 0;
    document.querySelectorAll('.cb-ml').forEach(l => l.classList.toggle('can-down', l.scrollTop + l.clientHeight < l.scrollHeight - 4));
    document.querySelectorAll('.cb-wk').forEach(w => {
      w.classList.toggle('can-left', w.scrollLeft > 4);
      w.classList.toggle('can-right', w.scrollLeft + w.clientWidth < w.scrollWidth - 4);
    });
  }
  function plan(){ if(!raf) raf = requestAnimationFrame(maj); }
  document.addEventListener('scroll', e => { const c = e.target && e.target.classList; if(c && (c.contains('cb-ml') || c.contains('cb-wk'))) plan(); }, true);
  document.addEventListener('wheel', e => {
    const w = e.target && e.target.closest && e.target.closest('.cb-wk');
    if(!w || w.scrollWidth <= w.clientWidth || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    e.preventDefault();
    w.scrollLeft += e.deltaY;
  }, { passive:false });
  window.addEventListener('resize', plan);
  try{ new MutationObserver(plan).observe(document.body, { childList:true, subtree:true }); }catch(e){}
  plan();
})();
</script>

<script>
/* v144 : aucun champ ne doit déclencher la barre « mots de passe / cartes / adresses » du téléphone.
   On marque TOUS les champs texte (présents et futurs) : pas de remplissage automatique, pas de gestionnaire de mots de passe.
   Les champs de fichier, cases et champs cachés ne sont pas concernés. */
(function(){
  var SKIP={file:1,hidden:1,checkbox:1,radio:1,button:1,submit:1,range:1,color:1};
  var n=0;
  function marque(el){
    try{
      var t=el.tagName;
      if(t==='INPUT'){ var ty=(el.getAttribute('type')||'text').toLowerCase(); if(SKIP[ty]) return;
        if(ty==='password'){ el.setAttribute('type','text'); el.classList.add('pp-masque'); } }
      else if(t!=='TEXTAREA') return;
      if(el.dataset.fcNoAf) return; el.dataset.fcNoAf='1';
      el.setAttribute('autocomplete','off');
      el.setAttribute('data-lpignore','true'); el.setAttribute('data-1p-ignore','true'); el.setAttribute('data-bwignore','true'); el.setAttribute('data-form-type','other');
      el.setAttribute('aria-autocomplete','none');
      el.setAttribute('name','fc-champ-'+(++n));
    }catch(e){}
  }
  function scan(r){
    if(!r||r.nodeType!==1) return;
    if(r.matches&&r.matches('input,textarea')) marque(r);
    var l=r.querySelectorAll?r.querySelectorAll('input,textarea'):[]; for(var k=0;k<l.length;k++) marque(l[k]);
  }
  function init(){
    scan(document.body);
    try{ new MutationObserver(function(ms){ ms.forEach(function(m){ [].forEach.call(m.addedNodes,scan); }); }).observe(document.body,{childList:true,subtree:true}); }catch(e){}
  }
  if(document.body) init(); else document.addEventListener('DOMContentLoaded',init);
})();
</script>

      +'<div class="fi-stp" data-i="s3"><span class="fi-n">3</span><input class="fi-key" data-i="ky" placeholder="'+T.ph+'" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"><button class="fi-ghost fi-bt" data-i="pst" style="width:auto;height:50px">'+T.paste+'</button></div></div></section>'
    +'<section class="fi-sl"><div class="fi-cf" data-i="cf"></div><span class="fi-stk fi-rv">'+T.rdy+'</span><h1 class="fi-rv">'+T.h5+'</h1><p class="fi-sub fi-rv">'+T.s5+'</p></section>'
    +'</div>'
    +'<div class="fi-foot" data-i="ft"><button class="fi-cta fi-bt" data-i="nx"></button><button class="fi-ghost fi-bt" data-i="hm" style="display:none">'+T.home+'</button></div>'
    +'</main>';
  }

  function ui(){
    var pills=q('[data-i=pl]').children, k;
    for(k=0;k<pills.length;k++) pills[k].className = k===i?'fi-on':k<i?'fi-ok':'';
    q('[data-i=bk]').classList.toggle('fi-hide', i===0);
    q('[data-i=sk]').classList.toggle('fi-hide', i===N-1);
    q('[data-i=ft]').classList.toggle('fi-hide', i===4 && !ia);
    var lbl=[T.lets,T.next,T.next,T.next,T.cont,T.add];
    nx.textContent = (i===4 && ia) ? (keyOk?T.cont:T.contNo) : lbl[i];
    var hm=q('[data-i=hm]'); hm.style.display = i===N-1?'flex':'none'; hm.classList.remove('fi-hide');
    nx.disabled=false;
  }
  function go(n){
    if(n<0||n>=N) return;
    sl.forEach(function(s,k){
      s.classList.remove('fi-on','fi-L','fi-R'); s.classList.add(k===n?'fi-on':k<n?'fi-L':'fi-R');
      if(k===n) [].forEach.call(s.querySelectorAll('.fi-rv'),function(r,j){ r.style.setProperty('--k',j); });
    });
    i=n; ui();
    if(n===3) setTimeout(function(){ if(!closing) sync(1); },700);
    if(n===5) boom();
    vib(8);
  }
  function fermer(versAjouter){
    if(closing) return; closing=true;
    markSeen();
    document.removeEventListener('keydown',onKey,true);
    root.style.transition='opacity .25s'; root.style.opacity='0'; root.style.pointerEvents='none';
    setTimeout(function(){ if(root.parentNode) root.parentNode.removeChild(root); },280);
    if(versAjouter){ try{ switchTab('add'); }catch(e){} }
  }
  function sauverCle(){
    if(!keyOk) return;
    var v=q('[data-i=ky]').value.trim().replace(/^["']|["']$/g,'');
    if(ppEcrire('gemini_api_key', v)) ppEcrire('gemini_api_key_maj', new Date().toISOString()); // v153 (constat 46) : prévient si le stockage est plein
  }
  function suivant(){
    if(i===N-1){ fermer(true); return; }
    if(i===4 && ia) sauverCle();
    go(i+1);
  }
  function precedent(){
    if(i===4 && ia){ ia=0; q('[data-i=ia]').classList.remove('fi-b'); ui(); }
    else go(i-1);
  }

  /* maîtrise */
  function lv(d,muet){
    var lad=q('[data-i=lad]'); p=Math.max(0,Math.min(4,p+d));
    [].forEach.call(lad.children,function(c,k){
      if(c.tagName==='I'){ var z=k/2; c.className = z<=p ? 'fi-f'+(z===p?' fi-t':'') : ''; }
      else c.className = k/2<=p ? 'fi-f' : '';
    });
    q('[data-i=rj]').innerHTML = p===4 ? T.noNeed : T.backIn+'<b style="color:var(--ink)">'+J[p]+T.d+'</b>';
    q('[data-i=rb]').innerHTML = p===4 ? '<span class="fi-badge">'+T.mastered+' \u2713</span>' : '';
    if(!muet) vib(p===4?[10,40,10]:10);
  }
  /* planning */
  function wk(n){
    var w=q('[data-i=wk]'); w.innerHTML='';
    for(var k=0;k<n;k++){
      (function(k){
        var e=document.createElement('i'); e.className = k===n-1?'fi-j':k>=n-3?'fi-z':''; e.style.setProperty('--h','6px'); w.appendChild(e);
        var h = k===n-1?118:k>=n-3?34:44+Math.abs(Math.sin(k*1.7))*58;
        setTimeout(function(){ e.style.setProperty('--h',h+'px'); },60+k*40);
      })(k);
    }
  }
  /* synchro */
  function sync(d){
    var f=q('[data-i=fl]'); f.className=''; void f.offsetWidth; f.className='fi-go'+(d?'':' fi-r');
    var t=d?q('[data-i=dl]'):q('[data-i=dp]'), c=d?q('[data-i=c2]'):q('[data-i=c1]');
    setTimeout(function(){
      t.classList.add('fi-hit'); c.textContent='\u2713'; vib(12);
      setTimeout(function(){ t.classList.remove('fi-hit'); c.textContent=''; },900);
    },950);
  }
  /* fin : confettis */
  function boom(){
    var c=q('[data-i=cf]'); c.innerHTML='';
    var col=['var(--orange)','var(--yellow)','var(--green)','var(--pink)'];
    for(var k=0;k<26;k++){
      var e=document.createElement('i'), a=Math.random()*6.28, d=90+Math.random()*130;
      e.style.cssText='--c:'+col[k%4]+';--x:'+Math.cos(a)*d+'px;--y:'+(Math.sin(a)*d-40)+'px;--r:'+(Math.random()*540-270)+'deg;--dl:'+(k*8)+'ms';
      c.appendChild(e);
    }
  }

  function ouvrir(){
    if(document.getElementById('fci')) return;
    T = S[(typeof langueChoisie==='function' && langueChoisie()==='en')?'en':'fr'];
    closing=false; i=0; ia=0; keyOk=false; p=0;
    root=document.createElement('div'); root.id='fci'; root.setAttribute('data-notr',''); root.setAttribute('role','dialog'); root.setAttribute('aria-modal','true'); root.setAttribute('aria-label','Memoria');
    root.innerHTML=html();
    document.body.appendChild(root);
    sl=qa('.fi-sl'); nx=q('[data-i=nx]');
    var pl=q('[data-i=pl]'); pl.innerHTML=new Array(N+1).join('<i></i>');
    var lad=q('[data-i=lad]'); lad.innerHTML=J.map(function(_,k){ return (k?'<u></u>':'')+'<i>'+(k+1)+'</i>'; }).join('');
    /* bouton qui s'enfonce (appui minimum 120 ms) */
    root.addEventListener('pointerdown',function(e){
      var b=e.target.closest&&e.target.closest('.fi-bt'); if(!b) return;
      b.classList.add('fi-p'); var t=Date.now();
      var u=function(){ setTimeout(function(){ b.classList.remove('fi-p'); },Math.max(0,120-(Date.now()-t))); removeEventListener('pointerup',u); removeEventListener('pointercancel',u); };
      addEventListener('pointerup',u); addEventListener('pointercancel',u);
    });
    nx.onclick=suivant;
    q('[data-i=hm]').onclick=function(){ fermer(false); };
    q('[data-i=bk]').onclick=precedent;
    q('[data-i=sk]').onclick=function(){ go(N-1); };
    qa('.fi-ans button').forEach(function(b){ b.onclick=function(){ lv(+b.getAttribute('data-v')); }; });
    qa('[data-i=ch] button').forEach(function(b){ b.onclick=function(){ qa('[data-i=ch] button').forEach(function(x){ x.classList.toggle('fi-on',x===b); }); wk(+b.getAttribute('data-n')); vib(8); }; });
    q('[data-i=dp]').onclick=function(){ sync(1); }; q('[data-i=dl]').onclick=function(){ sync(0); };
    q('[data-i=yes]').onclick=function(){ ia=1; q('[data-i=ia]').classList.add('fi-b'); ui(); };
    q('[data-i=no]').onclick=function(){ go(5); };
    q('[data-i=go1]').onclick=function(){ try{ window.open('https://aistudio.google.com/apikey','_blank','noopener'); }catch(e){} q('[data-i=s1]').classList.replace('fi-op','fi-ok'); q('[data-i=s2]').classList.add('fi-op'); };
    var ky=q('[data-i=ky]');
    ky.oninput=function(){ keyOk = ky.value.trim().length>=20; q('[data-i=s3]').classList.toggle('fi-ok',keyOk); q('[data-i=s2]').classList.toggle('fi-ok',keyOk); q('[data-i=s2]').classList.toggle('fi-op',!keyOk && q('[data-i=s1]').classList.contains('fi-ok')); ui(); };
    q('[data-i=pst]').onclick=function(){
      var done=function(t){ ky.value=(t||'').trim(); ky.oninput(); };
      try{ navigator.clipboard.readText().then(done,function(){ ky.focus(); }); }catch(e){ ky.focus(); }
    };
    /* clavier (capturé : les raccourcis de l'app, ex. Espace, ne doivent pas partir derrière l'intro) */
    onKey=function(e){
      if(e.target&&e.target.tagName==='INPUT'){ if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); if(keyOk) suivant(); } return; }
      e.stopPropagation();
      if(e.key==='ArrowRight'||e.key==='Enter'){ e.preventDefault(); if(!(i===4&&!ia)) nx.click(); }
      else if(e.key==='ArrowLeft'){ e.preventDefault(); q('[data-i=bk]').click(); }
      else if(e.key==='Escape'){ e.preventDefault(); q('[data-i=sk]').click(); }
    };
    document.addEventListener('keydown',onKey,true);
    /* glissement */
    var sx=null, st=q('[data-i=st]');
    st.addEventListener('pointerdown',function(e){ if(!(e.target.closest&&e.target.closest('button,input'))) sx=e.clientX; });
    st.addEventListener('pointerup',function(e){
      if(sx===null) return; var d=e.clientX-sx; sx=null;
      if(d<-45 && !(i===4&&!ia)) nx.click(); else if(d>45) q('[data-i=bk]').click();
    });
    wk(5); lv(0,true); q('[data-i=rj]').textContent=T.tryit;
    sl.forEach(function(s,k){ s.classList.add(k?'fi-R':'fi-on'); });
    [].forEach.call(sl[0].querySelectorAll('.fi-rv'),function(r,j){ r.style.setProperty('--k',j); });
    ui();
  }
  window.fcIntroOuvrir=ouvrir;
  function auto(){
    var force=false, vu=false;
    try{ force=/[?&]intro(=1|&|$)/.test(location.search); vu=!!localStorage.getItem(SEEN); }catch(e){}
    if(force){ ouvrir(); return; }
    if(vu) return;
    if(dejaUtilisateur()){ markSeen(); return; }
    ouvrir();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',auto); else auto();
})();
